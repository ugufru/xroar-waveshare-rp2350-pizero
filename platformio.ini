; xroar-waveshare-rp2350-pizero PlatformIO configuration
; XRoar (Tandy CoCo emulator) for the Waveshare RP2350-PiZero (mini video port, DVI via libdvi).
;
; >>> READ docs/BUILD.md FIRST <<<: it documents every build env, the full
;     video/audio build-flag matrix, how to flash + read the serial monitor, and
;     two non-obvious toolchain gotchas (PICO_NO_HARDWARE; the env-var build
;     cache trap). Keep that file in sync when you add/change a build flag.
;
; Envs (define a real env per configuration: do NOT pass one-off -D flags via
; the PLATFORMIO_BUILD_FLAGS env var; SCons does not reliably invalidate cached
; objects for it, so you silently flash a stale build. See docs/BUILD.md):
;   pizero_stream_60  THE PRODUCT (default): true 640x480p60, data-island audio, USB.
;   pizero_stream     fallback at the older ~52 Hz timing, for a display that
;                     rejects 60 Hz, until 60 Hz is proven widely (PIZERO-99).
;   the rest          one-off diagnostics, each tied to an open issue; below.
; PIZERO-150 retired the silent double-buffered builds (pizero, pizero_60hz)
; and the finished pizero_audio / pizero_bench.
;
;   pio run -t upload   &&   pio device monitor

[platformio]
default_envs = pizero_stream_60

; Shared by every firmware env below; not buildable on its own. It is the old
; silent 'pizero' env's settings (PIZERO-150): without AV_DATA_ISLAND this
; would be a double-buffered picture with no audio.
[pizero_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
; Dedicated RP2350B board (48 GPIO, 16 MB flash): the DVI TMDS pins are
; GPIO 32-39, which only exist on the B variant. PIZERO-04.
board = waveshare_rp2350_pizero
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0

; PIZERO-02b spike: sys clock at 240 MHz so Pico-PIO-USB (which requires
; CPU == 120 or 240 MHz) can coexist with DVI. main.cpp picks a custom
; 640x480 timing with a 24 MHz pixel clock -> ~57.14 Hz refresh
; (off-spec vs 60 Hz, monitor-tolerated via EDID).
board_build.f_cpu = 240000000L

build_flags =
    -DARDUINO_ARCH_RP2040
    -O2
    ; libdvi drives TMDS on GPIO 32-39, so PIO needs the >31 GPIO window.
    -DPICO_PIO_USE_GPIO_BASE=1
    ; libdvi 320x240->640x480: 2 TMDS symbols/word + vertical line-doubling.
    -DDVI_VERTICAL_REPEAT=2
    -DDVI_SYMBOLS_PER_WORD=2
    ; VDG render via coco_machine_render_frame() (not xroar per-scanline).
    -DSUPPRESS_RENDER_SCANLINE
    ; PIZERO-11: swap earlephilhower's stock USB stack for Adafruit TinyUSB
    ; (host mode + Pico-PIO-USB bit-banging on GPIO 28/29). PIO-USB itself
    ; runs on PIO 1 (libdvi owns PIO 0); see main.cpp.
    -DUSE_TINYUSB
    -DCFG_TUH_RPI_PIO_USB=1
    ; PIZERO-54: two hubs, because a multi-port USB-C hub is often two hub
    ; chips chained; 8 HID interfaces (a Keychron K2 uses 3, a pad up to 2).
    ; These only take effect because scripts/patch_tinyusb.py guards the
    ; library's own defines, which were overriding them (HID was 12, not 4).
    -DCFG_TUH_HUB=2
    -DCFG_TUH_HID=8
    -DCFG_TUH_HID_EPIN_BUFSIZE=64
    -DCFG_TUH_HID_EPOUT_BUFSIZE=64

; earlephilhower appends -Os after our flags; strip it so the hot paths get -O2.
build_unflags = -Os

extra_scripts =
    pre:scripts/patch_tinyusb.py
    pre:scripts/fw_version.py          ; PIZERO-156: src/fw_version.h for the INFO page

; PIZERO-09: full XRoar integration: emulator + boot/blit + SD.
build_src_filter =
    +<main.cpp>
    +<coco_boot.cpp>
    +<disk_overlay.cpp>     ; PIZERO-81/114 F12 disk drives overlay
    +<text_editor.cpp>      ; PIZERO-146 on-screen settings editor
    +<soak_log.cpp>         ; PIZERO-201 telemetry to the SD card for soaks
    +<wd_post.cpp>          ; PIZERO-227 watchdog post-mortem
    +<hw_config.c>
    +<usb_hotplug_diag.c>   ; PIZERO-11b USB hot-replug diagnostics shim
    +<usb_audio.cpp>        ; PIZERO-255 USB headphone DAC (only with USB_AUDIO)

; Deep dependency resolution (libdvi, xroar_core <-> coco_machine <-> psram_stub).
lib_ldf_mode = deep+

; microSD over SPI (PiZero pins in src/hw_config.c). Same lib as the AMOLED port.
; Adafruit TinyUSB (host) + Pico-PIO-USB for PIZERO-11. Pico-PIO-USB declares
; rp2040-only framework compat but works on rp2350: disable strict matching.
lib_deps =
    carlk3/no-OS-FatFS-SD-SDIO-SPI-RPi-Pico@^3.5.1
    adafruit/Adafruit TinyUSB Library
    ; Pico-PIO-USB is vendored in lib/pico_pio_usb (PIZERO-255: isochronous OUT)

lib_compat_mode = off

monitor_speed = 115200

; pizero_stream: streaming data-island audio (AV_DATA_ISLAND switches to a single
; framebuffer to make room for the audio islands; AV_STREAM_AUDIO is the
; PIZERO-38 per-line delivery that fixed the warble) on the older ~52 Hz
; timing. Kept as the fallback for displays that reject 60 Hz (PIZERO-99).
[env:pizero_stream]
extends = pizero_base
build_flags =
    ${pizero_base.build_flags}
    -DAV_DATA_ISLAND
    -DAV_STREAM_AUDIO
    ; PIZERO-255: sound out of a USB headphone DAC found at boot (usb_audio);
    ; an audio device's configuration descriptor can pass TinyUSB's 256 bytes
    -DUSB_AUDIO
    -DCFG_TUH_ENUMERATION_BUFSIZE=512

; pizero_stream_60: THE PRODUCT (PIZERO-45). True 640x480p60 (252 MHz sysclk ->
; 25.2 MHz pixel, 800x525 = 60.0 Hz) with streaming data-island audio and USB host.
; The 800-total line is split 8/92/60/640 (PIZERO-233, AV_HDMI_WIDE_BP) so the 60px back
; porch fits one streaming island with HDMI's 12px control period before video; cadence is 800 samples/frame (48000/60); ACR CTS=25200.
[env:pizero_stream_60]
extends = env:pizero_stream
build_flags =
    ${env:pizero_stream.build_flags}
    -DAV_60HZ
    ; CoCo 3 features this board can afford (PIZERO-111 decision). Both are
    ; TRANSPARENT when unused, which is why they are default rather than
    ; gated: the palette table powers on holding the stock VDG colours and
    ; only changes if a guest writes $FFB0-$FFBF, and the timer stays stopped
    ; until a guest programs $FF90-$FF95. Both blocks are unused on a CoCo 2,
    ; the decode claims no CoCo 2 address (asserted by the host tests), and
    ; the measured frame budget is identical with them on: 76.2%.
    -DGIME_TIMER
    -DGIME_PALETTE
    ; PIZERO-232: HDMI audio delivery that the main monitor plays cleanly
    ; (it garbled the old one): audio on the vblank lines too, so no ~1.4 ms
    ; gap a frame, and the info/ACR island on every 8th vblank line; a
    ; trailing guard band on vblank islands; only full 4-sample packets.
    -DAV_VBLANK_AUDIO
    -DAV_HDMI_STRICT_FRAMING
    -DAV_AUDIO_FULL_PACKETS
    ; PIZERO-233: 8/92/60 blanking, a 14px control period before video.
    -DAV_HDMI_WIDE_BP
    ; PIZERO-135: one firmware, either machine. machine = coco2 | coco3 in
    ; settings.txt (or a game's own file) picks it, and a switch restarts
    ; the board. The CoCo 3 is 128 KB (PIZERO-133); its RAM and ROM cycles
    ; skip the GIME through the core's page table (PIZERO-213,
    ; COCO_FASTBUS_PAGES, which -DCOCO3 implies). Both machines draw into a
    ; 640x240 framebuffer of one-byte colours that core 1 looks up in a
    ; palette (PIZERO-134: VIDEO_640, the renderer's TCC1014_PORT_FULL), so
    ; the CoCo 3's 640-wide modes and 80 columns show whole.
    -DCOCO3
    -DVIDEO_640
    -DTCC1014_PORT_FULL

; pizero_coco3: the name the CoCo 3 build had before PIZERO-135 made the
; product either machine; kept so older notes and scripts still build.
[env:pizero_coco3]
extends = env:pizero_stream_60

; pizero_cpu179: PIZERO-130. The product build running twice the 6809 cycles
; per frame, the CPU load of a CoCo 3 at 1.79 MHz, as the baseline for the
; PIZERO-131 speed work. Everything runs twice as fast, so measure, don't play.
[env:pizero_cpu179]
extends = env:pizero_stream_60
build_flags =
    ${env:pizero_stream_60.build_flags}
    -DCPU_SPEED_MUL=2

; pizero_cpuprof: PIZERO-209. The product build with the M33 cycle counter
; timing the 6809's bus path, and counting cycles, dummy cycles and
; instructions: a [prof] line a second splits clocks per cycle into bus and
; core. pizero_cpuprof_hook also splits the hook into its sections.
; pizero_usbdump: PIZERO-255 spike. The product build that prints every USB
; device's configuration descriptor as it mounts ([usbdesc] lines: interfaces,
; endpoints with their sync types, UAC1/UAC2 audio formats and rates, and the
; raw bytes), for reading what a USB headphone DAC offers. Diagnostic only.
[env:pizero_usbdump]
extends = env:pizero_stream_60
build_flags =
    ${env:pizero_stream_60.build_flags}
    -DUSB_DESC_DUMP
    -DCFG_TUH_ENUMERATION_BUFSIZE=512
; For TinyUSB's own host log on the USB serial port as well (every hub port
; and enumeration step), add -DCFG_TUSB_DEBUG=2 -DCFG_TUD_LOG_LEVEL=3
; -DCFG_TUSB_DEBUG_PRINTF=tusb_dbg_printf -DSERIAL_TUSB_DEBUG=Serial.

; pizero_usbtone: PIZERO-255. The product build plus the USB audio driver
; streaming a 440 Hz test tone to the first USB Audio Class DAC found at boot
; (16-bit stereo 48 kHz, isochronous OUT through the vendored Pico-PIO-USB).
; [uac] lines report the setup and the packets sent. Diagnostic only.
[env:pizero_usbtone]
extends = env:pizero_stream_60
build_flags =
    ${env:pizero_stream_60.build_flags}
    -DUSB_AUDIO_TONE

[env:pizero_cpuprof]
extends = env:pizero_stream_60
build_flags =
    ${env:pizero_stream_60.build_flags}
    -DCPU_PROF=1

[env:pizero_cpuprof_hook]
extends = env:pizero_stream_60
build_flags =
    ${env:pizero_stream_60.build_flags}
    -DCPU_PROF=2

; pizero_coco3_prof: PIZERO-220. pizero_coco3 with the PIZERO-209 profiler,
; to split the CoCo 3's clocks per emulated cycle into bus and core.
; PIZERO-322: the profiler's timing inlined into the 6809 core (which runs
; from RAM) adds about 14 KB, which left the CoCo 3 no heap to start in
; (85.5%, silent). This build gives it back: F12 lists 32 entries, and
; cartridges are 8 KB at most (Disk BASIC fits).
[env:pizero_coco3_prof]
extends = env:pizero_coco3
build_flags =
    ${env:pizero_coco3.build_flags}
    -DCPU_PROF=1
    -DDSK_CAT_MAX=32
    -DCOCO_CART_MAX=8192

; pizero_fdctrace: PIZERO-190/191. The product build that prints every $FF40
; latch change and FDC command ([fdc] latch/cmd ... pc=), the 6809 PC once a
; second, GIME/SAM writes, the boot track as DOS reads it ([t34]) and the jumps
; leading back into REL when a NitrOS-9 boot loops ([pctrace]), for finding
; where a disk OS stops. Diagnostic only.
[env:pizero_fdctrace]
extends = env:pizero_stream_60
build_flags =
    ${env:pizero_stream_60.build_flags}
    -DFDC_TRACE=1

; pizero_fdctrace_uart: PIZERO-191. pizero_fdctrace with the trace on UART0
; (Serial1, GPIO 0/1) instead of USB, for the cocozero emulator
; (~/github/cocozero-emulator), which prints UART0 and not USB serial.
[env:pizero_fdctrace_uart]
extends = env:pizero_fdctrace
build_flags =
    ${env:pizero_fdctrace.build_flags}
    -DFDC_TRACE_UART=1
    -DFDC_TRACE_PORT=Serial1

; pizero_padprobe: PIZERO-13/164. The product build that prints a gamepad's
; report descriptor at mount and each report as it changes ([pad] i<n> ...),
; for measuring a new pad identity or its unmapped buttons with a
; one-control-at-a-time sweep. Diagnostic only.
[env:pizero_padprobe]
extends = env:pizero_stream_60
build_flags =
    ${env:pizero_stream_60.build_flags}
    -DPAD_PROBE=1

; pizero_videobench: PIZERO-175. The product build that, once the display is
; up, times one scanline's TMDS encode (libdvi's software encoders, today's 320
; doubled vs 640 distinct pixels, and the RP2350's SIO hardware encoder) and
; prints a [bench] line every 5 s. Measures whether a 640-wide picture fits.
; Diagnostic.
[env:pizero_videobench]
extends = env:pizero_stream_60
build_flags =
    ${env:pizero_stream_60.build_flags}
    -DVIDEO_BENCH
    ; The fullres and palette loops and tables do not fit in scratch X/Y
    ; beside the core stacks, so this build puts them in main SRAM.
    -DTMDS_FULLRES_IN_SRAM=1

; pizero_usbdebug: PIZERO-54: the product build with TinyUSB's own host-side
; log (enumeration, hub, control transfers) sent to the USB serial console.
; The device side stays silent (CFG_TUD_LOG_LEVEL above CFG_TUSB_DEBUG), or it
; would log its own serial output. Diagnostic only: the logging costs time.
[env:pizero_usbdebug]
extends = env:pizero_stream_60
build_flags =
    ${env:pizero_stream_60.build_flags}
    -DCFG_TUSB_DEBUG=2
    -DCFG_TUD_LOG_LEVEL=3
    -DCFG_TUSB_DEBUG_PRINTF=tusb_debug_printf
    -DSERIAL_TUSB_DEBUG=Serial

; pizero_wavmeas: measure the audio SOURCE: no video output (so only the WAV-dump drains
; the ring), boots clean BASIC, autotypes a sustained SOUND 159, streams a base64
; WAV out USB-CDC. Decode + analyze on the host to get the exact source frequency
; and waveform (isolates emulation/resampler from video-link delivery). Diagnostic only.
; FB_SINGLE (PIZERO-131): one framebuffer like every other build, since it shows no picture.
[env:pizero_wavmeas]
extends = pizero_base
build_flags =
    ${pizero_base.build_flags}
    -DAUDIO_WAV_DUMP
    -DFB_SINGLE

; pizero_chord: PIZERO-223. The product build, but the HDMI sound is a C major
; chord made on core 1 (4 s of sines, 4 s of squares, 1 s of silence, over
; and over) instead of the CoCo's, to tell the link from the TV by ear.
[env:pizero_chord]
extends = env:pizero_stream_60
build_flags =
    ${env:pizero_stream_60.build_flags}
    -DAV_AUDIO_SYNTH
    -DAV_AUDIO_SYNTH_CHORD

; pizero_vic1: PIZERO-234. The product, but the AVI InfoFrame names the video
; format as CEA 640x480p60 (VIC 1) instead of unknown (VIC 0), for a monitor
; that buzzes on our audio while it plays a Mac's cleanly.
[env:pizero_vic1]
extends = env:pizero_stream_60
build_flags =
    ${env:pizero_stream_60.build_flags}
    -DAV_AVI_VIC=1

; pizero_aif: PIZERO-234. pizero_vic1, plus the Audio InfoFrame's sample rate
; and size left as 'refer to stream' (CEA-861 for L-PCM), and the info/ACR
; island on every 3rd vblank line (~840 ACR a second, near a normal source's
; ~1,000) instead of every 8th (360).
[env:pizero_aif]
extends = env:pizero_vic1
build_flags =
    ${env:pizero_vic1.build_flags}
    -DAV_AIF_REFER_STREAM
    -DAV_VBLANK_INFO_EVERY=3

; pizero_drive8: PIZERO-234. pizero_aif with the TMDS pads at 8 mA and fast
; slew instead of libdvi's 2 mA slew-limited default, for a receiver that
; appears to lose our audio packets (and shows the PIZERO-120 band).
[env:pizero_drive8]
extends = env:pizero_aif
build_flags =
    ${env:pizero_aif.build_flags}
    -DDVI_PAD_DRIVE=2
    -DDVI_PAD_SLEWFAST=1

; pizero_slew2: PIZERO-234. pizero_aif with fast slew at libdvi's 2 mA, to
; separate slew from drive after 8 mA + fast slew made the audio quieter.
[env:pizero_slew2]
extends = env:pizero_aif
build_flags =
    ${env:pizero_aif.build_flags}
    -DDVI_PAD_SLEWFAST=1

; pizero_wavmeas_boot: PIZERO-223. pizero_wavmeas, but the machine boots as
; usual (the card's autorun runs) and the 20 s recording starts when Ctrl-W
; (0x17) arrives on USB serial, so a program's own music can be captured.
[env:pizero_wavmeas_boot]
extends = env:pizero_wavmeas
build_flags =
    ${env:pizero_wavmeas.build_flags}
    -DAUDIO_WAV_DUMP_BOOT

; pizero_wdtest: PIZERO-33 watchdog self-test: deliberately wedges core 0 ~10s
; after boot. Expect an auto-reboot ~3s later whose banner reports the board was
; "stuck in 'emulate'". Validates auto-recovery + the phase-trace end-to-end.
[env:pizero_wdtest]
extends = env:pizero_stream
build_flags =
    ${env:pizero_stream.build_flags}
    -DWATCHDOG_SELFTEST

; native: PIZERO-109: host unit tests. Runs on the development machine, no
; board, no Arduino. Only logic that has been extracted into header-only,
; hardware-free form is testable here (today: lib/coco_machine/src/vdg_pack.h);
; extract further modules as tests need them rather than up front.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
; The xroar_core include dirs are for test_mc6809_lockstep (PIZERO-129),
; which compiles the 6809 core itself on the host; nothing else needs them.
build_flags = -std=c++17 -Wall -Ilib/xroar_core/include -Ilib/xroar_core/portalib -Ilib/xroar_core/src
; The board libraries need Arduino/Pico headers and cannot build on the host.
; Tests include the extracted headers by relative path instead.
lib_ignore = coco_machine, libdvi, xroar_core, psram_stub

