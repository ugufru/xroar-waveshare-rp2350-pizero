<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>The four machines in the CoCo Zero firmware</title>
  <desc>The CoCo Zero (a 128 KB CoCo 3, the default) and the CoCo 2+ have the extras: sound cartridges built in, the MIDI Pak, keyboard auto-repeat and every sound at once. The stock CoCo 2 and CoCo 3 have none of them.</desc>
