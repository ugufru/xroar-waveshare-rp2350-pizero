  <text x="135" y="174" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#3a4250">machine = cocozero</text>
  <rect x="73" y="188" width="124" height="24" rx="12" fill="#1f5fa8"/>
  <text x="135" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">CoCo 3 · 128 KB</text>
  <rect x="166" y="101" width="64" height="20" rx="10" fill="#2f7d4a"/>
  <text x="198" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">the default</text>
