  <path d="M494,100 L494,94 L926,94 L926,100" stroke="#6b7685" stroke-width="1.5" fill="none"/>
  <rect x="600" y="82" width="220" height="22" fill="#f6f7f9"/>
  <text x="710" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7685">Stock, as Tandy shipped them</text>
