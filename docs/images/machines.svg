  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d2430">Four machines, one firmware</text>
  <text x="480" y="70" text-anchor="middle" fill="#55606e">Pick one in settings.txt, or give a game its own</text>
  <path d="M34,100 L34,94 L466,94 L466,100" stroke="#2f7d4a" stroke-width="1.5" fill="none"/>
  <rect x="140" y="82" width="220" height="22" fill="#f6f7f9"/>
