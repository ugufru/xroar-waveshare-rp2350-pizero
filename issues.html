euse that format and loader; the BIOS editor idea is replaced by the on-screen text editor (PIZERO-146).]\n\n[2026-09-27 CORRECTION to the note above: the user dropped palette files for now. The user-global default palette is set by per-color overrides in /coco/settings.txt (color_green = #RRGGBB etc., PIZERO-145); there is no .pal format yet. Per-title palettes, if they come back, need a format decided then.]\n\n[2026-09-28 DONE at ~80%, at the user's call. Delivered: the writable 16-entry palette register file at $FFB0-$FFBF (PIZERO-85, confirmed on hardware), the gime_palette on/off setting, and a user default palette through per-color overrides in /coco/settings.txt (color_green = #RRGGBB etc., PIZERO-145), edited on screen (PIZERO-146). DROPPED by the user: a palette editor and .pal palette files (they would need palette editors to be any good). NOT DONE: per-title palettes; file it only if it is wanted again, with a format decided then.]", "type": "feature", "status": "done", "priority": "high", "created": "2026-07-19", "updated": "2026-09-28", "tags": ["ui", "palette", "vdg", "gime", "config", "per-title", "6847"], "theme": "experience"}, {"id": "PIZERO-56", "summary": "Higher-fidelity NTSC artifact rendering (beyond the 2-bits->4-colors LUT)", "description": "FUTURE / fidelity enhancement. The current artifact path is a deliberate performance SHORTCUT, not composite decoding: render_rg6_frame (coco_machine.cpp:958) and its twin in vendored mc6847.c:52 map RG6/PMODE4 pixel PAIRS to one of four fixed palette entries (00->BLACK, 01->artifactA, 10->artifactB, 11->WHITE; A/B swapped by CSS + the compile-time phase flag). This nails the canonical 4-colour PMODE4 look that most artifact games rely on, but a real NTSC composite chain is an analog signal through finite chroma/luma bandwidth and produces things a context-free 2->4 LUT cannot: (1) MORE THAN 4 HUES -- specific multi-pixel patterns land at intermediate phase/amplitude and yield extra colours (greens/purples/half-luma shades demos + some games coax out); ours only ever emits black/A/B/white. (2) POSITION+NEIGHBOUR-DEPENDENT colour -- real hue depends on running phase and adjacent luma; ours decodes each pair in isolation, identically everywhere. (3) FRINGING / colour bleed / dot crawl at mono<->colour edges -- absent (hard-edged palette indices). (4) COVERAGE -- only RG6/GM7 artifacts; render_graphics_frame (other CG/RG modes) does straight fg/bg with NO artifacting, and the high-res 2-colour modes that also artifact on real hw are clean here. (5) fixed idealized PAL_BLUE/PAL_ORANGE swatches vs a real set's tint/temperature/power-on-phase drift (see PIZERO-43). WHY deferred: XRoar upstream HAS a phase-accurate composite renderer but this port dropped it; true composite sim is a per-pixel multi-tap filter -- expensive, and core-0 has only ~31% headroom at 1x (PIZERO-48). OPTIONS to close the gap, cheap->dear: (a) WIDER PATTERN LUT keyed on 3-4 pixels of context (precomputed) to fake the common extra hues without a real filter -- likely the best effort/quality tradeoff, still a table lookup in the hot blit; (b) extend artifacting to the other high-res mono modes; (c) a proper composite/NTSC decode pass (luma/chroma separation + bandpass) for full-gamut fidelity -- measure against the frame budget, likely needs core-1 headroom or a lower internal res. Pairs naturally with PIZERO-55 (both are 'what RGB does a given VDG pattern become'); a wider LUT could feed the same programmable-palette machinery. PRE-WORK: capture reference photos/captures of real-hardware artifacting for the target games to validate against. Not scheduled; log only. Cross-link docs/ROADMAP.md, PIZERO-43, PIZERO-55.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit if a title is found that looks visibly wrong under the current artifact LUT. No such title is known.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-07-19", "updated": "2026-09-16", "tags": ["vdg", "ntsc", "artifact", "rendering", "fidelity", "future", "6847"], "theme": "devices"}, {"id": "PIZERO-57", "summary": "Loadable/customizable VDG font from SD (.FNT + BIOS loader + per-title profiles)", "description": "Let the MC6847 alpha font be replaced from the SD card instead of being fixed at build time. Current font = const font_6847t1[1536] (128 glyphs x 12 rows, 8px wide, one byte/row MSB-first) in lib/xroar_core/src/mc6847/font-6847t1.c, placed in a .time_critical RAM section; the active renderer reads it at coco_machine.cpp:948. KEY: font loading is CLEANLY DECOUPLED from the PIZERO-55 palette work -- g_alpha_lut is indexed by the glyph ROW BYTE (0-255), not by character, so it bakes in COLORS not glyphs; a palette change rebuilds that LUT but a FONT change touches nothing but the font bytes. No LUT rebuild on font swap. PART 1 -- SWAPPABLE FONT + API: replace the direct font_6847t1[...] reference with an indirection g_font (default = the const ROM font); coco_load_font() fills a 1536-byte RAM buffer (keep it in .time_critical fast RAM so the hot render loop is unaffected -- 1.5KB is trivial on 520KB) and repoints g_font. ONLY render_alpha_frame (coco_machine.cpp:948) needs the change -- mc6847.c:427's per-scanline path is dead at runtime on this port. Keep the const font_6847t1 as the factory MASTER for reset-to-ROM (just repoint back). PART 2 -- FILE FORMAT: raw 8x12 bitmap, one byte/row MSB-first (same layout as the array); full 1536 bytes (128 glyphs) or just the 64-glyph alpha slot (768 bytes, the $40-$7F range). Small header (magic + version + width + height + glyph-count) so the loader VALIDATES: the renderer hard-assumes 8x12, so a font that isn't 8x12 must be REJECTED, not rendered garbled. Extension .FNT. PART 3 -- BIOS LOADER (depends on PIZERO-53 overlay): browse .FNT files on SD, load into the buffer, LIVE-PREVIEW (the menu itself redraws in the new font = instant feedback via the shared render_alpha_frame path), reset-to-ROM. PART 4 -- PER-TITLE SIDECAR: bind a font to a specific image, GAME.DSK -> GAME.FNT, mirroring PIZERO-55's .pal design exactly; FALLBACK ORDER per-title <name>.fnt -> user-global custom font -> factory ROM. So a game can carry BOTH its palette (.pal) and its font (.fnt). SAVE keyed to the currently-loaded image path (launcher tracks it). CONSTRAINT (state up front): alpha mode masks the screen code ch&0x3F|0x40, so it only ever indexes 64 GLYPHS ($40-$7F: @,A-Z,punct,0-9). A custom font REDEFINES those 64 (restyle/international-ish/game-matched look) but cannot ADD a 65th (no free lowercase) without changing the decode addressing -- note as a possible later extension, tie-in with the launcher lowercase discussion. EDGE CASES mirror PIZERO-55: AUTORUN/outside-launcher media has no path -> user-global font only. Persist the user-global font choice (PIZERO-53 persistence). Gate behind a build flag. Depends on PIZERO-53 (overlay + SD + persistence); sibling to PIZERO-55 (palette). Cross-link docs/ROADMAP.md. Verify on hw: load a .FNT, BASIC text redraws in the new glyphs; reset-to-ROM restores; a game's GAME.FNT auto-applies on load and a different game keeps its own.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-07-19", "updated": "2026-07-19", "tags": ["ui", "font", "vdg", "6847", "sd", "config", "per-title"], "theme": "experience"}, {"id": "PIZERO-58", "summary": "Bench: measure synth voice budget on real silicon (N dummy voices vs [run] telemetry)", "description": "PRE-WORK for PIZERO-17 (custom wavetable/sampled synth): validate the back-of-envelope cycles/voice + voice-count estimate on real RP2350 hardware BEFORE committing an engine architecture. Estimate to confirm: ~1100 cyc/sample total synth budget at ~3.5 ms/frame (of the ~5.3 ms core-0 headroom), giving ~4-5 Blofeld-grade voices (250 cyc/sample) up to ~10 simple voices (100 cyc/sample). METHOD: a flag-gated bench build (-DSYNTH_BENCH) that runs N dummy synth voices each frame in the core-0 audio path (audio_emit), generating into the SPSC ring (or a discard sink), and watches the existing [run] fps/cpu/render/blit serial telemetry (PIZERO-15). Sweep N upward until core-0 frame time approaches 16.67 ms / fps drops below 60, to find the real ceiling. VARIABLES to characterize: (1) per-voice complexity tiers -- (a) wavetable + linear interp + ADSR, (b) + resonant SVF filter + 2D wave morph, (c) full Blofeld-grade (morph + multimode filter + 2 env + 2 LFO); report cyc/sample for each. (2) FLOAT (M33 FPU) vs Q15 fixed-point (DSP MACs) inner loop -- measure both, pick the winner. (3) wavetable source: XIP-from-FLASH per-sample read vs SRAM-cached active-frame -- QUANTIFY the XIP cache-miss jitter that motivates the SRAM active-frame mirror, and the PCM pitched-playback (non-unity-rate flash walk) worst case. (4) RAM cost headroom -- SRAM is already ~89-94% used (PIZERO-18 audio + double-buffer video); report how much a realistic voice/wavetable-cache footprint adds and whether it fits. OUTPUT: a short docs note (or PIZERO-17 comment) with measured cyc/sample per tier, the safe max voice count at the 3-4 ms/frame budget, the float-vs-Q15 decision, and the flash/SRAM wavetable-access verdict -- these set PIZERO-17's configurable voice cap and memory model. Gate behind the bench flag; no product-env impact. Verify on hw: telemetry logs N, cyc/sample, and frame time; identify the N where fps first drops.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit only alongside PIZERO-17; the measurement has no meaning without the synth.]", "type": "task", "status": "deferred", "priority": "low", "created": "2026-07-19", "updated": "2026-09-16", "tags": ["audio", "synth", "performance", "measurement", "pre-work", "bench"], "theme": "devices"}, {"id": "PIZERO-59", "summary": "Internal MIDI bus/router + CoCo bit-banger serial MIDI transport (firmware becomes Lyra's external UART box)", "description": "The CoCo-facing half of the MIDI subsystem. CORRECTED TRANSPORT (per user 2026-07-19): apps like Lyra do NOT use a cartridge ACIA -- they use the CoCo's built-in BIT-BANGER serial port (software-timed async serial toggled on a PIA1 line) feeding a CUSTOM EXTERNAL UART BOX (powered by +5V from the joystick port) that converts to MIDI DIN. EMULATION INSIGHT: the firmware simply BECOMES that external box -- tap the emulated bit-banger line, decode the async serial in firmware, forward as MIDI. No cartridge, no physical box, no joystick +5V needed (none of it is physical anymore) -> this is the zero-extra-hardware path. REUSES the cycle-accurate PIA-tap infrastructure from the audio work (PIZERO-18 already samples PIA1 PORT A at emulation-tick resolution; the DAC tap is the template). TRANSPORT: (1) OUT (CoCo->MIDI) -- tap the RS-232 serial-out bit (CoCo bit-banger, believed PIA1 PA1 / $FF20 bit 1, CONFIRM via PIZERO-61), watch its transitions over emulated cycles, software-UART-decode async frames at Lyra's baud into MIDI bytes, push to the router. (2) IN (MIDI->CoCo) -- synthesize the async serial waveform on the serial-in line (believed PIA1 PB0 / $FF22 bit 0, CONFIRM via PIZERO-61) with cycle-accurate bit timing so Lyra's software-UART-receive reads incoming MIDI. ROUTER: an internal software MIDI bus carrying parsed events (handle running status, SysEx, MIDI clock); ANY source -> ANY sink, configurable. SOURCES: the bit-banger transport (guest), external endpoints (PIZERO-60). SINKS: the synth (PIZERO-17), external endpoints (PIZERO-60), the bit-banger IN (back to guest). So Lyra can play the internal synth AND drive real gear simultaneously; a DAW/controller can drive the synth OR feed Lyra. COCO2 UNTOUCHED: the serial tap/inject only runs when MIDI is ENABLED (config toggle); no bus/tap cost otherwise; router runs only on traffic; buffers are a few hundred bytes. Build-flag gated, off in the product env. NOTE (real-hardware only): Lyra's box occupied the joystick port for +5V, so a purist using REAL Lyra hardware would conflict with the PIZERO-50 joystick hat -- irrelevant to the all-emulated path (joystick port stays free). DEPENDS ON: PIZERO-61 (Lyra serial params: PIA bits, baud, framing, whether Lyra bit-bangs 31250 directly or the box reclocks) to set the decoder; PIZERO-17 for the synth sink (but testable EARLY by routing to a PIZERO-60 USB-MIDI endpoint before the synth exists). Cross-link docs/ROADMAP.md, docs/hdmi-audio-notes.md (shared PIA-tap technique), PIZERO-60. Verify on hw: run Lyra, notes reach the internal synth / USB-MIDI out at correct pitch+timing; external MIDI in reaches Lyra; plain CoCo2 boot unaffected with MIDI off.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit as a set with PIZERO-60/61 if MIDI becomes a goal rather than an idea.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-07-19", "updated": "2026-09-16", "tags": ["audio", "midi", "serial", "bit-banger", "device", "lyra", "future"], "theme": "devices"}, {"id": "PIZERO-60", "summary": "External MIDI I/O endpoints (USB-MIDI device + host; optional DIN-5)", "description": "The outside-world half of the MIDI subsystem: physical/virtual endpoints that plug into the PIZERO-59 router. Three endpoints, only one needs added hardware. (1) USB-MIDI DEVICE via NATIVE USB -- NO EXTRA HARDWARE. This board's native RP2350 USB is already a DEVICE (it runs the CDC serial console + WAV dump). Add a MIDI interface to the existing TinyUSB/Adafruit_TinyUSB COMPOSITE descriptor (CDC + MIDI) so the board appears to a PC/DAW as a class-compliant MIDI port over the cable that's ALREADY plugged in. This is the marquee 'external integration without additional hardware' path: Lyra -> PIZERO-59 router -> USB-MIDI -> DAW/hardware synth, and back. Use Adafruit_USBD_MIDI; verify it composes with the existing CDC (do not break the serial console/telemetry). (2) USB-MIDI HOST via PIO-USB -- NO EXTRA HARDWARE beyond the class-compliant controller itself. Enumerate a USB-MIDI keyboard/controller on the PIO host port (GPIO28/29); pairs with the hub (PIZERO-54) so a keyboard + a MIDI controller coexist. Needs TinyUSB MIDI-host class support on the Pico-PIO-USB stack (verify availability; may need a report/class handler like the HID path). (3) DIN-5 SERIAL MIDI -- THE ONLY option needing hardware: a UART on a free GPIO + standard MIDI circuit (optocoupler 6N138 input / current-loop output, DIN jacks). Optional, for vintage gear. All three are build-flag gated and cost nothing when inactive (USB polling only when an endpoint is present) -> CoCo2 path untouched. DEPENDS ON: PIZERO-59 (router). Composes with PIZERO-54 (hub) for the host path. Cross-link docs/ROADMAP.md, docs/BUILD.md (new flags). Verify on hw: (1) board enumerates as a USB-MIDI device on a PC and passes notes both ways while CDC still works; (2) a USB-MIDI controller on the host port drives the synth; (3) [if built] DIN in/out with real gear.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit as a set with PIZERO-59/61.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-07-19", "updated": "2026-09-16", "tags": ["audio", "midi", "usb", "usb-midi", "din", "device", "future"], "theme": "devices"}, {"id": "PIZERO-61", "summary": "Pre-work: reverse-engineer Lyra's bit-banged serial MIDI driver (params for PIZERO-59)", "description": "PRE-WORK / RESEARCH that GATES PIZERO-59's serial transport. User-confirmed mechanism (2026-07-19): Lyra drives the CoCo's built-in BIT-BANGER RS-232 serial port into a CUSTOM EXTERNAL UART BOX powered by +5V from the joystick port, which converts to MIDI DIN. To make the firmware faithfully BECOME that box, nail the exact parameters the emulated transport must match: (1) which PIA line carries serial OUT and which carries serial IN (believed PIA1 PA1 / $FF20 bit 1 out, PIA1 PB0 / $FF22 bit 0 in -- CONFIRM, do not guess); (2) the BAUD rate Lyra bit-bangs at, and the frame format (start/data/stop bits, parity); (3) CRITICAL: does Lyra bit-bang at MIDI rate (31250) DIRECTLY -- so the box just level-shifts and our firmware forwards bytes 1:1 -- or does it send at some other CoCo-friendly rate that the box's UART RECLOCKS to 31250 (so our firmware must decode at rate X and re-emit as MIDI)? This determines the decoder clock. (4) any handshake/flow-control lines the box used; (5) whether Lyra relies on interrupt or tight-loop bit timing (affects how cycle-accurate our tap must be -- likely very, like the audio DAC tap). METHOD: use the analyze-rom and trace-calls skills on Lyra's binary/driver to find the bit-bang routine and extract the timing constants + PIA addresses; cross-check against XRoar's serial handling and published CoCo bit-banger docs. Also document the external box's behavior for the record (and for anyone building real hardware, incl. the joystick-port +5V tap that conflicts with the PIZERO-50 joystick hat on real hardware only). OUTPUT: a short transport spec (PIA bits + baud + framing + reclock-or-not) that PIZERO-59 implements against. Cross-link PIZERO-59, PIZERO-60.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit as a set with PIZERO-59/60; this is pre-work for a deferred issue.]", "type": "task", "status": "deferred", "priority": "low", "created": "2026-07-19", "updated": "2026-09-16", "tags": ["midi", "serial", "bit-banger", "lyra", "research", "pre-work", "reverse-engineering"], "theme": "devices"}, {"id": "PIZERO-62", "summary": "GIME-compatible programmable timer + minimal interrupt registers (partial GIME; runs SOME unmodified CoCo3 timer software)", "description": "Add a CoCo3/GIME-COMPATIBLE programmable interrupt timer so SOME unmodified CoCo3 software runs on this CoCo2 base -- without full GIME and without compromising CoCo2 (user goal 2026-07-19: a compatible LAYOUT, not our own ad-hoc device). CURRENT MODEL (recap): 6809 IRQ <- PIA0 (HS/FS sync, coco_machine.cpp:481), FIRQ <- PIA1 (CART line, :482); rates are FIXED. The scheduled-countdown needed for a timer ALREADY EXISTS as cart_toggle_remaining (:806-811) -- a cycles-to-next-pulse counter; the timer generalizes it to a register-loaded interval (no per-cycle hot-loop cost, fires only when it fires). IMPLEMENT (authentic GIME register layout, all in the $FF90-$FF95 block -- UNUSED on a CoCo2 so decoding is safe): (1) TIMER reload $FF94 (MSB, bits 11-8) / $FF95 (LSB) = 12-bit down-counter; on underflow raise the interrupt + auto-reload. (2) CLOCK SOURCE via INIT1 $FF91 TINS bit: fast 3.579545 MHz (~279 ns, = 4x the 0.895 MHz 6809 clock -> interval_cycles = reload*... convert) vs horizontal 15.734 kHz (~63.5 us); both convert cheaply to 6809-cycle intervals for the scheduler. (3) MINIMAL INTERRUPT CONTROLLER: $FF92 (IRQ enable) / $FF93 (FIRQ enable) with at least the TIMER source bit; read-to-clear status; route the timer to IRQ or FIRQ per the enable regs (OR into the existing MC6809_IRQ_SET/FIRQ_SET). Decode INIT0 $FF90 / INIT1 $FF91 as needed. (4) RELOAD QUIRK: match GIME period behavior (period = reload + 1 on the 1986 GIME, + 2 on the 1987 -- CONFIRM exact; matters for pitch-accurate music); pick a rev or make it a build option -- research item. COMPATIBILITY BOUNDARY (the honest 'some'): RUNS CoCo3 programs that (a) stay in CoCo2/VDG-compatible video, (b) install their OWN IRQ/FIRQ handler (we boot CoCo2 Extended Color BASIC, whose interrupt handler is PIA-based NOT GIME-aware, so ROM-handler-dependent GIME interrupt use won't work), (c) don't need the MMU / 512K / GIME hi-res modes, (d) don't hard-gate on full-GIME detection. SWEET SPOT = interrupt-driven MUSIC / timing / demo routines that just want a fast programmable tick. WON'T RUN: anything using GIME hi-res video, the MMU, 512K RAM, or the Super ECB ROM handlers. TIES to the music work: this is the guest-side programmable tick for a MIDI clock / sequencer / synth-envelope updates (PIZERO-17 synth, PIZERO-59 MIDI). HOST COST is proportional to fire rate; add a sanity FLOOR on the interval so a pathologically fast timer can't blow the ~5.3 ms core-0 headroom (PIZERO-48). Build-flag GATED; zero cost to a plain CoCo2 boot when off (only joins the IRQ/FIRQ OR when enabled). ALTERNATIVES: (B) our own non-GIME address block for the timer = simpler but runs ZERO existing CoCo3 software -> REJECTED in favor of the compatible layout per the goal; (C) FULL GIME (MMU, hi-res video, all interrupt sources, 512K) = OUT OF SCOPE, large lift and directly breaks CoCo2 purity. PRE-WORK: pick 2-3 candidate CoCo3 timer/music programs (VDG-mode, own-handler) to validate against; confirm the reload-quirk rev to emulate. VERIFY on hw: a candidate CoCo3 music/timer program runs unmodified at correct tempo; plain CoCo2 boot byte-identical with the timer disabled. Cross-link docs/ROADMAP.md, PIZERO-17, PIZERO-59.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit if a target title needs the GIME timer, or if CoCo 3 support becomes a goal.]\n\n[2026-09-17 UN-DEFERRED and raised low -> high. It was parked in the PIZERO-107 triage on the grounds that nobody had asked for it; the PIZERO-111 decision asks for it directly. The revisit trigger recorded at the time was 'if a target title needs the GIME timer, or if CoCo 3 support becomes a goal', and the second has now happened in the affordable-features form: the GIME register layout at $FF90-$FF95 is free on a CoCo 2, and the scheduled countdown it needs already exists. This is one of the two features chosen precisely because it does NOT need the faster 6809 that full CoCo 3 would.]\n\n[2026-09-17 IMPLEMENTED, flag-gated, not yet on hardware (the board is mid-soak).\nlib/coco_machine/src/gime_timer.h holds the register behaviour and interval arithmetic, header-only and machine-free so it is testable on the host; coco_machine.cpp owns the instance and the wiring. New env pizero_gime = the product build plus -DGIME_TIMER.\nSCHEDULING: rides XRoar's existing event queue rather than a new counter, so an idle timer costs nothing (the memory fast path already skips the queue when nothing is due, and a stopped timer is not queued at all). Both clock sources divide the 14,318,180 Hz event clock exactly: fast 3.579545 MHz = 4 ticks per count, horizontal 15.734 kHz = 910.\nROUTING: the timer ORs into the same IRQ/FIRQ lines as the PIAs, per the enable registers; status is read-to-clear and an unacknowledged status holds its line, as on real hardware.\nSAFETY: GIME_MIN_INTERVAL_TICKS clamps a pathologically small reload (16 CPU cycles minimum) and counts how often it had to, so a guest running differently from real hardware is visible rather than silently eating the ~4 ms of headroom.\nCOST WHEN OFF IS ZERO, measured: the default build is byte-identical at 371,660 bytes; the GIME build adds 348.\nTESTED: 15 host tests (pio test -e native), covering both clock sources, the 12-bit reload and its two register halves, reload 0 stopping the timer, the clamp, IRQ/FIRQ routing and independence, read-to-clear, the decode boundary (the CoCo 2's own PIA/SAM/cart addresses are explicitly NOT claimed), and that unimplemented source bits survive a read-modify-write. 44 tests total now pass.\nSTILL OPEN, both from the original ticket: (1) GIME_PERIOD_BIAS is a build option defaulting to 2 because the 1986-vs-1987 reload quirk is still unconfirmed by us, and it sets the tempo of any music written against it; (2) hardware validation against 2-3 real CoCo 3 timer/music programs that keep VDG video and install their own handler, plus a check that a plain CoCo 2 boot is unchanged with the flag off.]\n\n[2026-09-18 TWO CORRECTIONS, found while writing a library proposal for the ~/github/coco Forth project, whose coco-guides/coco3-intro.md is a better authority on GIME quirks than anything we had here.\n(1) THE RELOAD QUIRK WAS RECORDED BACKWARDS in this ticket and in the header. The guide states a count of 1 behaves as 3 on the 1986 part and as 2 on the 1987, i.e. roughly +2 on the 1986 and +1 on the 1987. We had the revisions swapped. The default GIME_PERIOD_BIAS of 2 therefore emulates the 1986 part, which is now what the code says.\n(2) A ZERO RELOAD IS NOT 'STOPPED' ON REAL HARDWARE: it re-asserts the interrupt immediately, which is the root of the documented 'Arkanoid sound bug'. We treat zero as stopped on purpose, because a timer firing every tick would wedge the emulator, but the old comment claimed hardware behaved that way. Now recorded as a deliberate deviation so nobody 'fixes' it into a hang, and so a guest that depends on the real behaviour fails in an explainable way.\nNeither changes the tests (15 still pass) or the build; both change what a reader believes.]\n\n[2026-09-18 NOW IN THE DEFAULT BUILD, and the separate pizero_gime env is gone. Keeping a second build was the wrong call: it meant a board could silently lose the feature on an ordinary reflash, which is exactly what happened today mid-test. The justification for gating was that these were unproven on hardware; the palette is now proven, both blocks are unused on a CoCo 2, the decode claims no CoCo 2 address (asserted by host tests), and both are transparent until a guest writes to them: the palette holds the stock VDG colours, the timer stays stopped. Frame budget measured identical at 76.2%, RAM +484 bytes.]\n\n[2026-09-28 CONFIRMED ON HARDWARE (user: 'i tested the GIME timer and it works').] Closed at ~80%. Left open and filed as PIZERO-170: which GIME revision's reload quirk to emulate (GIME_PERIOD_BIAS 2 = the 1986 part, the default), which sets the exact tempo of timer-driven music. The zero-reload deviation (treated as stopped, not an immediate re-assert) stays deliberate, as recorded above.", "type": "feature", "status": "done", "priority": "high", "created": "2026-07-19", "updated": "2026-09-28", "tags": ["emulation", "interrupt", "timer", "gime", "coco3", "firq", "future"], "theme": "devices"}, {"id": "PIZERO-63", "summary": "Adopt baseline contribution policy (CONTRIBUTING.md)", "description": "This repo has no CONTRIBUTING.md, so it has no stated contribution policy readable by a newcomer (human or agent). The working conventions that DO exist live in CLAUDE.md, which is agent-facing and not where a human contributor would look. Stamp the canonical baseline policy (issue-driven workflow, docs-as-source-of-truth, verify-don't-invent, bounded autonomy for automated contributors, tested-and-maintainer-confirmed before done) as CONTRIBUTING.md at the repo root, with <PROJECT> = this XRoar RP2350-PiZero port and <TRACKER> = issues.jsonl. Keep it generic: project facts (pinout, build flags, RP2350B gotchas) stay in README.md/docs/ and CLAUDE.md and must NOT be duplicated into CONTRIBUTING.md -- the two are complementary, CONTRIBUTING.md states the process and points at the docs for the facts. The stamped copy is this project's to edit and overrides the upstream baseline; project-specific rules go here, never back upstream. Leave this issue open until the user reviews and rubber-stamps the wording. [2026-08-05 DONE -- user reviewed and rubber-stamped the wording. Shipped in f435927: CONTRIBUTING.md added; no-branches rule made an explicit checkable invariant (git branch must print only main) in both CONTRIBUTING.md and CLAUDE.md, with worktrees/branch-per-agent/safety-branch loopholes closed and archive/<topic> tags as the route for dead history. Enforced on the repo: stray pizero30-live-audio-wip branch tagged archive/pizero30-option-a and deleted; repo now single-branch.]", "type": "chore", "status": "done", "priority": "low", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["docs", "process", "contributing", "policy"], "theme": "platform"}, {"id": "PIZERO-64", "summary": "SD write foundation: writable file layer, flush/sync policy + write-latency measurement", "description": "FOUNDATION for all SD write work (blocks PIZERO-65/66/67/69). VERIFIED CURRENT STATE: the port is entirely read-only in OUR code -- every f_open is FA_READ (coco_boot.cpp:100 ROM, :276 autorun.txt, :324 DSK attach, :379 LOADM .bin) and there are ZERO occurrences of f_write/f_sync/f_unlink/f_mkdir in src/ or lib/. Nothing below us blocks writing: the carlk3 no-OS-FatFS stack is configured write-capable (FF_FS_READONLY=0, FF_USE_MKFS=1, FF_FS_EXFAT=1, FF_USE_LFN=3) with disk_write()/sd_write_blocks() implemented in sd_card_spi.c and get_fattime() supplied by the lib's my_rtc.c. So this is purely additive firmware work. IMPLEMENT: (1) a small writable-file helper layer next to the existing coco_boot read helpers -- open-for-write/create, write, sync, close, atomic-replace (write to .TMP then f_rename over the target) so an interrupted write never truncates a good file; (2) an explicit FLUSH/SYNC POLICY -- decide and document when f_sync is called (per sector? per DECB command completion? on an idle timer? on BIOS exit?), since FatFs buffers FAT+dir updates and a power cut between the data write and the FAT update corrupts the image; (3) MEASURE REAL WRITE LATENCY -- instrument single-sector (256B), full-block (512B) and multi-block writes, plus the f_sync cost, and record worst-case against the 16.67 ms frame budget. This measurement is the whole input to PIZERO-65: per PIZERO-48 core 0 has only ~31% slack at 1x, and SD block-erase stalls are known to run tens-to-hundreds of ms, so a synchronous write on the emulation thread is expected to break audio/video. ALSO NOTE: hw_config.c wires no card-detect/write-protect pin (grep: no cd_gpio/use_card_detect), so a card pulled mid-write is currently unguarded -- decide whether to wire CD (GPIO22 per the vendor demo) or accept the risk and document it. get_fattime() with no RTC will stamp a fixed epoch, so written files get bogus dates -- acceptable, but note it in docs. ACCEPTANCE: a firmware-written test file appears on the card with correct contents after a clean power cycle, and the measured worst-case write+sync latency is written into this ticket and docs/ (it decides PIZERO-65's design).", "type": "feature", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["sd", "fatfs", "write", "foundation", "latency", "blocker"], "theme": "storage"}, {"id": "PIZERO-65", "summary": "Deferred sector write-back: keep SD writes off the emulation hot path", "description": "The hard part of the SD-write workstream, deliberately kept SEPARATE from PIZERO-66 so the timing risk can't be buried inside the feature ticket (user decision 2026-08-05). PROBLEM: a synchronous f_write inside the FDC Write Sector handler will blow the frame budget. Per PIZERO-48 the pacing model leaves core 0 only ~31% slack at 1x (~9.4 ms used of the 16.67 ms/frame), while an SD write can stall tens-to-hundreds of ms on block erase -- one guest SAVE would starve the core-1 audio ring (underrun/warble, the class of bug PIZERO-35/38/39 just fixed) and drop video frames. So the emulated FDC must ACK a write quickly and the physical write must happen elsewhere. IMPLEMENT: a write-back queue between the FDC and the SD -- guest Write Sector copies the 256 B into a queued dirty-sector entry, sets FDC status complete, and returns immediately; a drainer performs the real f_write/f_sync outside the emulation hot path. DESIGN DECISIONS to settle with measurements from PIZERO-64: (a) WHERE the drainer runs -- core 0 in the idle slack after the frame's emulation completes (simplest, bounded by measured slack) vs core 1 (already owns libdvi scanout + the audio ring; adding SD SPI there risks the video path) vs draining only during guest idle. Default recommendation: core 0, post-frame, with a per-frame byte budget so one drain never exceeds the remaining slack. (b) QUEUE DEPTH and what happens when it's full -- DECB writes a whole granule in a burst, so size for that; on overflow either stall the guest (honest, brief) or return an FDC error. (c) COALESCING adjacent dirty sectors into one multi-block write. (d) SD SPI BUS OWNERSHIP -- the existing read path (coco_boot_disk_read_sector, called synchronously from the FDC) shares the bus with the drainer, so a read must not interleave mid-write; also a read of a still-queued dirty sector must see the QUEUED data, not the stale on-card bytes. (e) DURABILITY WINDOW -- a queued-but-unwritten sector is lost on power cut; bound it (flush within N frames) and force a full flush on BIOS entry/exit and before any reset. ACCEPTANCE on HW: a guest SAVE of a sizeable program completes with NO audible audio glitch and NO dropped frames (watch the [run] telemetry: core-0 frame time stays < 16.76 ms throughout), the data is correct after power-cycle, and the queue never overflows silently -- overflow is logged. Depends on PIZERO-64 (its latency numbers are this ticket's design input). Blocks PIZERO-66.", "type": "feature", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["sd", "write", "timing", "performance", "audio", "core-affinity", "risk"], "theme": "storage"}, {"id": "PIZERO-66", "summary": "FDC Write Sector -> guest SAVE/SAVEM to .DSK on SD", "description": "The headline feature: let a program running on the emulated CoCo write to its disk image. KEY INSIGHT (verified): SAVE and SAVEM are NOT XRoar-side commands -- they are Disk BASIC (DECB) commands implemented in 6809 code in the disk11.rom cart running INSIDE the guest. DECB does its own directory and granule/FAT allocation in software; all it needs from the hardware is a working Write Sector. So this one change unlocks SAVE, SAVEM, KILL, COPY, RENAME and BACKUP largely for free. CURRENT STUB: lib/coco_machine/src/coco_machine.cpp:252-257 handles WD279x Type II Write Sector (command top nibble 0xA/0xB) by setting fdc_status = 0x40 -- bit 6 = WRITE PROTECT -- and completing cleanly. That is an honest 'this disk is write-protected' answer, not a crash, and it is exactly the hook point. Correspondingly coco_machine_install_disk_reader() (coco_machine.cpp:307) installs only a READER (coco_disk_read_sector_fn), and coco_boot_disk_read_sector (coco_boot.cpp:336) has no write counterpart. IMPLEMENT: (1) mirror the reader API -- coco_disk_write_sector_fn + coco_machine_install_disk_writer(), and coco_boot_disk_write_sector(drive,track,sector,const uint8_t[256]) in coco_boot.cpp; (2) replace the 0x40 stub with a real Type II write: assert DRQ, accept 256 bytes written to $FF4B into fdc_buf (the inverse of the existing fdc_io_read drain at :270-282), then hand the full sector to the writer callback and fire INTRQ/NMI the same way the read path does at completion; (3) reopen the attached image writable -- coco_boot_attach_dsk currently opens FA_READ only (coco_boot.cpp:324) and holds it in g_dsk_file, so it needs FA_READ|FA_WRITE with a graceful fallback to read-only (i.e. keep returning 0x40, a genuine write-protect answer) when the file can't be opened writable or the card is absent; (4) route the actual write through the PIZERO-65 write-back queue, NOT a direct synchronous f_write; (5) honour the existing geometry guards (track<=34, sector 1-18, drive 0 only -- see :341-348) and return proper FDC error status rather than silently dropping out-of-range writes. ACCEPTANCE on HW: in Disk BASIC, SAVE of a BASIC program then NEW then LOAD round-trips it; SAVEM of a machine-language block round-trips via LOADM; DIR shows the new file with a plausible size; the change survives a power cycle and the .DSK is still mountable in desktop xroar with the saved file intact. Depends on PIZERO-64 and PIZERO-65. [RE-SCOPED 2026-08-05: floppy support is now PERIPHERAL support, not the route to writable storage -- see PIZERO-79 and the PIZERO-70..74 filesystem layer, which is the supported way to create and edit files. This ticket survives as legacy polish for running/writing old .DSK images and is no longer on the critical path; demoted high -> low.]\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit after the storage direction settles (PIZERO-70/71/72). Floppy write may be moot under the VFS.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-08-05", "updated": "2026-09-16", "tags": ["fdc", "wd279x", "disk", "decb", "save", "savem", "write", "emulation"], "theme": "storage"}, {"id": "PIZERO-67", "summary": "Firmware-side SD persistence API (config + .pal/.fnt sidecars) -- undeclared dependency of PIZERO-53/55/57", "description": "Distinct from guest-side disk writes (PIZERO-66): this is the FIRMWARE writing its own files to the card -- the BIOS config blob and the per-title sidecars. ROADMAP GAP found 2026-08-05: PIZERO-53 (BIOS overlay: 'firmware-only settings', persistence), PIZERO-55 (palette editor -- 'save flow: save for this title writes the sidecar keyed to the currently-loaded image path', per-title .PAL) and PIZERO-57 (loadable VDG font -- per-title .FNT sidecars, 'save keyed to the currently-loaded image path') ALL assume the firmware can write to SD, and NONE of them declares that dependency -- while the port is in fact read-only (see PIZERO-64). This ticket makes the capability explicit and shared so the three UX tickets don't each grow their own half-baked writer. IMPLEMENT: (1) a small typed settings store -- read/modify/write a firmware config file (e.g. /coco/config.txt or a versioned binary blob) with a schema version field and forward-compatible defaults, so an older firmware meeting a newer file degrades instead of corrupting; (2) sidecar write/read helpers keyed to the currently-loaded image path (GAME.DSK -> GAME.PAL / GAME.FNT), matching the per-title -> user-global -> factory fallback chain those tickets already specify; (3) atomic replace (write .TMP + f_rename, from PIZERO-64) so an interrupted save never leaves a truncated palette/font/config that bricks the next boot -- the fallback chain must also treat a malformed sidecar as absent; (4) explicit flush on BIOS exit. NOTE this path is much easier than PIZERO-66 on timing: BIOS saves happen while the overlay is up and the user is interacting, not inside the emulation hot loop, so a synchronous write+sync is acceptable here (a brief hitch during a menu save is fine) -- it does NOT need the PIZERO-65 queue. Depends on PIZERO-64 only. Should land before or alongside PIZERO-53 so the overlay has somewhere to persist to; unblocks the save half of PIZERO-55 and PIZERO-57.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["sd", "write", "persistence", "config", "bios", "palette", "font", "dependency"], "theme": "storage"}, {"id": "PIZERO-68", "summary": "DECB disk maintenance: DSKINI/format, multi-drive, write-protect toggle, proper FDC error status", "description": "Completes the guest-side disk story once PIZERO-66 can write single sectors. Turns 'SAVE works' into 'the disk subsystem behaves like a disk subsystem'. IMPLEMENT: (1) DSKINI (format) -- DECB's formatter issues WD279x Type III Write Track, currently a blanket stub (coco_machine.cpp:259-262 sets fdc_status=0x10 RNF for all Type III). Either implement enough Write Track to satisfy DECB, or (simpler and probably better) intercept format and synthesise a fresh 161280-byte JVC image with an initialised DECB directory/granule map -- which also gives the BIOS a 'create new blank disk' action. (2) MULTI-DRIVE -- coco_boot_disk_read_sector hard-rejects drive != 0 (coco_boot.cpp:340) though the FDC already decodes the one-hot drive select from the $FF40 latch into fdc_drive (:295-297); extend to an array of attached images so drive 0/1 both mount (needed for COPY and BACKUP between two disks, and for a data disk alongside a game). (3) GEOMETRY beyond 35x18x1 -- the read path hardcodes 35 tracks / 18 sectors / single-sided (:318, :341); accept 40/80-track and double-sided images by deriving geometry from file size at attach time. (4) WRITE-PROTECT as a real, user-visible state -- a BIOS per-drive WP toggle (and automatic WP when the file can't be opened writable), reported through the existing 0x40 status bit; protects a pristine game image from an accidental SAVE. (5) HONEST ERROR STATUS -- map disk-full, I/O failure, card-absent and out-of-range onto the right WD279x status bits (RNF 0x10, write fault, write protect 0x40) so DECB prints a sensible error instead of hanging or silently succeeding; a queue overflow from PIZERO-65 also needs a status mapping here. ACCEPTANCE on HW: DSKINI produces a disk that DIR reports empty and that accepts a SAVE; BACKUP/COPY between drive 0 and 1 works; WP-toggling a disk makes SAVE fail with a write-protect error and leaves the image byte-identical; filling a disk yields a clean DECB error, not a hang. Depends on PIZERO-66. [RE-SCOPED 2026-08-05: legacy peripheral polish only -- DECB's format/granule/multi-drive model is explicitly not the future storage model. See PIZERO-79; demoted medium -> low.]\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit only if floppy stays a first-class device, which PIZERO-79 argues against.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-08-05", "updated": "2026-09-16", "tags": ["fdc", "disk", "decb", "format", "dskini", "multi-drive", "write-protect", "errors"], "theme": "storage"}, {"id": "PIZERO-69", "summary": "Emulator save-states: wire XRoar's serialise.c fs_* stubs to FatFs (freeze/restore whole machine)", "description": "Whole-machine snapshot to SD -- freeze the emulated CoCo mid-game and restore it later. Independent of the disk-write chain (PIZERO-66/68): different mechanism, different feature. FOUND 2026-08-05: the infrastructure is ALREADY VENDORED AND COMPILED IN -- lib/xroar_core/src/serialise.c is 846 lines of real XRoar snapshot machinery (and part.c/part.h provide the part-tree walk it serialises over). What blocks it is purely the I/O primitives: lib/xroar_core/src/xroar_stubs.c:21-45 no-ops EVERY fs_* function it depends on, under the explicit comment 'serialise.c references these for save-state I/O; we don't implement save-state on the Pico, so every stub is a no-op'. That is ~18 one-line functions (fs_write_uint8/16/16_le/31, fs_read_uint8/16/16_le/31, fs_write_vuint32/vint32, fs_read_vuint32/vint32, fs_sizeof_vuint32/vint32, fs_file_size, fs_truncate, fs_file_crc32, fs_file_crc32_block) all currently returning -1/0. IMPLEMENT: (1) a FILE* -> FatFs FIL bridge -- lib/xroar_core/src/fs.h is written against stdio (FILE*, off_t, ftruncate semantics), so either provide a tiny shim type or adapt fs.h; note fs_truncate must leave the file position at the new EOF per its documented contract, and fs_file_crc32 must record and restore position; (2) implement the fs_* primitives over that bridge; (3) decide WHAT is in a snapshot for this port -- serialise.c walks the part tree, so confirm the parts we actually instantiate (RAM, mc6809, mc6883 SAM, both mc6821 PIAs, mc6847 VDG) round-trip, and decide how the NON-xroar firmware state is handled: the attached DSK path, any PIZERO-65 dirty-sector queue (MUST be flushed before snapshotting, else the restored state disagrees with the image on the card), the audio ring, and the VDG palette/font if PIZERO-55/57 have landed; (4) version the snapshot format and reject mismatches rather than restoring garbage; (5) surface save/load slots in the BIOS overlay (PIZERO-53). SIZE CHECK before committing to this: 64 KB RAM + CPU/PIA/SAM/VDG state is a ~64-70 KB file -- trivial for the card, but the serialisation buffer must not blow the SRAM budget (README notes SRAM is ~89-94% full), so stream straight to FatFs rather than building an image in RAM. ACCEPTANCE on HW: freeze a running game, power-cycle, restore, and it resumes correctly with sound and video intact. Depends on PIZERO-64; snapshot-vs-disk consistency depends on PIZERO-65 if that has landed; BIOS slots depend on PIZERO-53.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit once SD write exists (PIZERO-64) and there is a reason to freeze a whole machine.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-08-05", "updated": "2026-09-16", "tags": ["save-state", "snapshot", "serialise", "xroar-core", "sd", "write", "future"], "theme": "storage"}, {"id": "PIZERO-70", "summary": "Storage backend abstraction: one device interface, SD/FatFs as the first backend", "description": "Layer 0 of the DECB-replacement stack (user direction 2026-08-05: floppies and their data structures are obsolete; we already have a fast hierarchical filesystem with long names, and pretending it is a floppy wastes it). Define ONE backend interface that the VFS (PIZERO-71) sits on, so storage can be SD, RAM, USB mass storage, DriveWire or a FujiNet-class network device without the guest or the command surface changing. SCOPE: the interface itself (mount/unmount, identify/capabilities, read/write/flush, error model) plus SD/FatFs as backend #1 by wrapping the existing coco_boot read helpers and the PIZERO-64 write layer. Capabilities must be queryable, not assumed -- read-only vs writable, seekable, max path/name length, whether hierarchy is supported -- because DriveWire and RAM disk differ sharply from FatFs. Keep it a C interface with no 6809 knowledge. Depends on PIZERO-64 for the write path. Blocks PIZERO-71.", "type": "feature", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["storage", "vfs", "abstraction", "sd", "foundation"], "theme": "storage"}, {"id": "PIZERO-71", "summary": "VFS core: hierarchy, long filenames, create/write/edit/delete/rename, directory enumeration", "description": "Layer 1: the filesystem semantics the guest actually gets, replacing DECB's flat 8.3-uppercase 68-granule model. PRIMARY FOCUS per user direction is the WRITE side -- creating, extending and editing newly generated files is the point of the exercise, not just loading. SCOPE: path handling (hierarchical, long names -- FatFs is already built with FF_USE_LFN 3), open/close/read/write/seek/truncate, create/delete/rename/mkdir, directory enumeration, and file attributes/size/timestamps (note: no RTC, so get_fattime stamps a fixed epoch -- see PIZERO-64). Defines the canonical error codes that the hypercall ABI (PIZERO-72) surfaces to the guest. Runs entirely in C over the PIZERO-70 backend interface; no 6809 code here. Depends on PIZERO-70. Blocks PIZERO-72.", "type": "feature", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["vfs", "filesystem", "write", "foundation"], "theme": "storage"}, {"id": "PIZERO-72", "summary": "Guest hypercall ABI: versioned command-block protocol for filesystem access (the contract)", "description": "Layer 2 and the CRUX of the whole design: the stable contract between guest code and the firmware filesystem. Everything else can be rewritten; this cannot, because BASIC (PIZERO-74), Bare Naked Forth and any future guest software all bind to it. Get it right before building on it. SCOPE: claim an unused I/O address range (the $FF90-$FF93 area is contested by PIZERO-62's GIME timer -- pick deliberately and document), define a command block laid out in guest RAM (opcode, handle, long-path pointer, buffer pointer, length, result/errno), and the doorbell/completion signalling. MUST BE VERSIONED from day one -- a capability/version query opcode so guest code can detect what it is talking to and degrade instead of corrupting. MUST HANDLE LATENCY: an SD write can stall tens-to-hundreds of ms while core 0 has only ~31% slack per frame (PIZERO-48), so the ABI needs either explicit async (submit, poll status, complete) or a documented blocking contract with the PIZERO-65 write-back queue behind it -- decide this HERE, since retrofitting async into a synchronous ABI breaks every client. Uses the same bus-interception technique as PIZERO-55's palette registers. Document the ABI in docs/ as a first-class spec, not a code comment. Depends on PIZERO-71 (semantics) and PIZERO-65 (latency strategy). Blocks PIZERO-73/74.", "type": "feature", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["abi", "hypercall", "vfs", "guest", "forth", "critical"], "theme": "storage"}, {"id": "PIZERO-73", "summary": "Replacement cart ROM: thin 6809 shim over the hypercall + 6809 assembler in the build", "description": "Layer 3a: the guest-side code that replaces disk11.rom in the $C000 cart slot. DESIGN RULE: keep it THIN. All filesystem logic lives in C on the RP2350 behind the PIZERO-72 hypercall; the ROM is a shim that marshals arguments and hooks BASIC. This is what makes the backend abstraction possible and keeps us out of a full DOS-in-assembly project. SCOPE: an 8 KB cart image, the BASIC hook points needed by PIZERO-74, and the marshalling glue. NEW BUILD DEPENDENCY: this needs a 6809 assembler (lwasm or asm6809) wired into the PlatformIO build, with the assembled ROM embedded in flash -- document it in docs/BUILD.md, which is the source of truth for the build. Note the port already loads carts by name (coco_boot_load_cart_named, coco_boot.h:49) so the mounting path exists. Depends on PIZERO-72.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["rom", "6809", "cart", "toolchain", "decb-replacement"], "theme": "storage"}, {"id": "PIZERO-74", "summary": "New guest command surface: filesystem commands replacing DECB's", "description": "Layer 3b: what the user actually types. Replaces DECB's command set with commands built for a hierarchical long-filename filesystem instead of a 35-track floppy -- explicitly NOT DECB-compatible (user direction: provide the abilities without the arcane DECB context and its limitations). SCOPE: load/save of programs and binaries, directory listing with hierarchy, change/make/remove directory, delete/rename/copy, and sequential file I/O for guest programs (the equivalent of OPEN/CLOSE/PRINT#/INPUT# but over real paths). Decide and document the naming: reusing DECB keywords with new semantics is friendlier but silently changes behaviour for old software, while new keywords are honest but unfamiliar -- pick one and record the rationale. Error messages should surface the PIZERO-71 error codes usefully rather than DECB's numbered errors. Depends on PIZERO-72 and PIZERO-73. Bare Naked Forth binds to PIZERO-72 directly and does not need this ticket.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["basic", "commands", "ux", "decb-replacement", "guest"], "theme": "storage"}, {"id": "PIZERO-75", "summary": "RAM disk backend (fast VFS test target, no card required)", "description": "A backend with no hardware and no latency, useful out of proportion to its size: it lets the VFS (PIZERO-71), hypercall (PIZERO-72) and command surface (PIZERO-74) be developed and tested without an SD card inserted and without the write-latency problem confounding results -- and it is a real user feature (scratch space, fast intermediate files). SCOPE: a small backend over an SRAM allocation, sized against the tight budget (README: SRAM ~89-94% full, PSRAM unpopulated), so expect tens of KB, not megabytes; size configurable, contents volatile, capabilities reported honestly via the PIZERO-70 interface. Depends on PIZERO-70.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["storage", "backend", "ramdisk", "testing"], "theme": "storage"}, {"id": "PIZERO-76", "summary": "DriveWire / serial storage backend", "description": "Backend over a simple serial transport -- host-provided storage with no local media, and the on-ramp to FujiNet-class networked storage (PIZERO-77), which the user flags as a major focus. SCOPE: the transport plus enough of the protocol to serve the PIZERO-70 backend interface. NOTE the framing question up front: DriveWire is natively a virtual-FLOPPY protocol (sector reads/writes against disk images on the host), which sits oddly under a hierarchy-and-long-names VFS -- so decide whether we speak stock DriveWire (compatible with existing host servers, but constrained to its sector model) or a file-level protocol over the same wire (better fit, needs our own host tool). Record the decision and rationale. Serial plumbing overlaps the bit-banger tap technique from PIZERO-59; check whether the transport can be shared. Depends on PIZERO-70.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["storage", "backend", "drivewire", "serial", "network"], "theme": "storage"}, {"id": "PIZERO-77", "summary": "FujiNet-class networked storage over TCP/IP hardware", "description": "Networked storage and services in the FujiNet mould, with appropriate TCP/IP-capable hardware attached -- flagged by the user as a major focus, ticketed now to hold the shape rather than to start. SCOPE (to be narrowed): which hardware provides the network stack (the RP2350 has no radio; an ESP32-class companion or a wired module on a spare header is the likely route -- this is a hardware decision, so it needs the schematic and a free-pin audit before design), then a backend over it serving the PIZERO-70 interface, and which FujiNet-style services beyond file access are in scope. Deliberately shallow until PIZERO-70/71/72 are real and the hardware path is chosen. Depends on PIZERO-70 and PIZERO-76's transport work.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit when a networking hardware decision is actually made; it is the blocker, not the software.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-08-05", "updated": "2026-09-16", "tags": ["storage", "backend", "fujinet", "network", "tcpip", "future"], "theme": "storage"}, {"id": "PIZERO-78", "summary": "USB mass-storage backend", "description": "Backend for a USB drive on the PIO-USB host port. SCOPE: USB MSC class support plus a PIZERO-70 backend over it. CONSTRAINTS to check first: PIO-USB already costs real core budget and the host stack currently runs one device on the root port, so using a drive alongside the keyboard needs the hub work (PIZERO-54); MSC bulk transfers plus DVI scanout plus emulation on the same chip is a genuine throughput question, so measure before designing. Lower priority than the SD and RAM backends since SD already serves the primary use case. Depends on PIZERO-70 and PIZERO-54.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit once the backend abstraction (PIZERO-70) exists and a second backend is wanted.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-08-05", "updated": "2026-09-16", "tags": ["storage", "backend", "usb", "msc", "future"], "theme": "storage"}, {"id": "PIZERO-79", "summary": "Demote floppy support to a peripheral: DECB/.DSK as optional legacy device", "description": "Formalises the reframing (user direction 2026-08-05): floppy emulation stops being the storage model and becomes ordinary peripheral support, for people who want to run old images. The new filesystem layer (PIZERO-70..74) is the DEFAULT; DECB and the emulated WD279x become an opt-in device. SCOPE: (1) boot policy -- the replacement cart ROM (PIZERO-73) loads by default instead of disk11.rom, with DECB + a .DSK selectable per-title via autorun.txt and the BIOS overlay (PIZERO-53); the two models must not both claim the cart slot, so make the choice explicit and documented. (2) COEXISTENCE: the existing direct-load path (autorun.txt direct_name -> coco_boot_parse_loadm, main.cpp:1084) and the .DSK path (:1097) are already mutually exclusive at boot -- fold both into one coherent 'what am I booting' decision alongside the new default. (3) Re-scope the legacy tickets: guest SAVE/SAVEM to .DSK (PIZERO-66) and DECB disk maintenance (PIZERO-68) are now nice-to-have peripheral polish, not the path to writable storage -- that is PIZERO-71's job. (4) Documentation: README/ROADMAP must say plainly that floppy compatibility is peripheral support and the new VFS is the supported way to create and edit files, so the intent is not re-litigated later. Depends on PIZERO-73 for the default cart; touches PIZERO-53.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["decb", "floppy", "legacy", "peripheral", "policy", "boot"], "theme": "storage"}, {"id": "PIZERO-80", "summary": "Evaluate 4-bit PIO SDIO vs 1-bit SPI for SD (throughput + the only non-blocking transfer API we have)", "description": "Evaluate switching the SD backend from 1-bit SPI to 4-bit PIO SDIO. Two independent payoffs: raw throughput, and -- the reason this is ticketed separately -- it is the ONLY path in our stack with a non-blocking, start/poll transfer API.\n\nFINDINGS (verified in the installed lib, 2026-08-05, carlk3 no-OS-FatFS-SD-SDIO-SPI-RPi-Pico 3.5.1): (1) NOTHING in the PlatformIO/Arduino ecosystem offers an async FILESYSTEM. Every FatFs entry point in ff15/source/ff.h is a synchronous FRESULT f_xxx() (f_forward takes a callback but is a read-side pull helper, not asynchrony). SdFat (installed as an Adafruit SPIFlash dep) is likewise synchronous. So no library choice removes PIZERO-65. (2) The carlk3 driver DOES use DMA (sd_driver/SPI/my_spi.c, sd_driver/dma_interrupts.c, sd_driver/SDIO/rp2040_sdio.c) but then SPIN-WAITS on it -- my_spi.c:198 'while (dma_channel_is_busy(rx) || dma_channel_is_busy(tx)) tight_loop_contents();' and rp2040_sdio.c:250 -- so DMA buys throughput, not free CPU; from core 0 it is fully blocking. (3) A vestigial async hook exists but is DEAD: sd_callback_t / azplatform_set_sd_callback (sd_driver/SDIO/ZuluSCSI_platform.h:75-76), inherited from ZuluSCSI, is declared and never defined or called anywhere in the library -- do not build on it. (4) THE ASYNC-SHAPED API IS IN THE SDIO BACKEND: rp2040_sdio.h:101-111 exposes rp2040_sdio_tx_start()/tx_poll() and rx_start()/rx_poll(), backed by a real state machine (sdio_transfer_state_t SDIO_IDLE/RX/TX/TX_WAIT_IDLE, wr_status in rp2040_sdio.h:39-87). That is submit-then-poll -- driveable from a per-frame drainer without ever blocking. (5) WE ARE NOT ON IT: src/hw_config.c configures SD_IF_SPI on spi1 at 12.5 MHz (SCK 30 / MOSI 31 / MISO 40 / CS 43), matching the Waveshare demo -- i.e. the blocking 1-bit path.\n\nCRITICAL CAVEAT that bounds the whole payoff: the dominant write latency is NOT transfer time, it is the card's internal program/erase, during which the card holds the line busy (can be 100 ms+). SDIO and DMA shorten the transfer; NEITHER shortens the erase. So SDIO cannot remove the need for PIZERO-65's queue -- at best it lets the drainer poll instead of spin, and moves bulk loads (ROM/DSK/wavetable reads) meaningfully faster. Do not let this ticket be mistaken for a fix for the write-stall problem.\n\nSCOPE: (1) HARDWARE FEASIBILITY FIRST, before any code -- does this board's microSD socket even expose DAT1-DAT3? The vendor demo uses SPI (.ref/demo/RP2350-PiZero/Arduino/03-MicroSD/, C/03-MicroSD/), which is weak evidence the extra lines may not be wired; check docs/RP2350-PiZero-schematic.pdf. If they are not brought out, close this ticket -- that is a valid and cheap outcome. (2) PIN + PIO BUDGET AUDIT: SDIO needs CLK/CMD/DAT0-3 on suitable pins, and it is itself PIO-based, so it contends with libdvi (which already uses PIO with pio_set_gpio_base(pio,16) because TMDS is on GPIO 32-39) and Pico-PIO-USB (HOST_PIN_DP=28). Confirm free PIO state machines and instruction space, not just free GPIOs. (3) Verify carlk3's SDIO path actually supports RP2350 (the files are named rp2040_sdio.*) and works at our 252 MHz sys clock -- PIO timing is clock-derived, so this is a real risk, and the same clock-conflict class as the documented HSTX/DVI constraint. (4) MEASURE against the PIZERO-64 SPI baseline: sequential read throughput, single- and multi-block write, and worst-case write+sync stall. (5) Only if all the above pass, wire the start/poll API into the PIZERO-65 drainer so it polls rather than blocks, and consider keeping SPI as a build-flag fallback.\n\nDECISION RULE (set now so this doesn't drift): if PIZERO-64 measures worst-case write+sync in the low tens of ms, SPI is adequate indefinitely and this ticket stays deferred. Pursue SDIO only if the measurements are bad, or if a later feature (PIZERO-17 synth wavetable streaming from flash/SD, large PIZERO-71 VFS files) needs the read bandwidth. Depends on PIZERO-64 for the baseline numbers; informs PIZERO-65 and PIZERO-70 (the backend interface should not assume a blocking transport).\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit if SD throughput is measured as a real bottleneck; today it is a guess.]", "type": "decision", "status": "deferred", "priority": "low", "created": "2026-08-05", "updated": "2026-09-16", "tags": ["sd", "sdio", "spi", "performance", "async", "pio", "hardware", "research", "deferred"], "theme": "storage"}, {"id": "PIZERO-81", "summary": "An on-screen way to choose what to run, that looks and feels like the CoCo itself", "description": "Adopt the simple disk-image switching launcher from the AMOLED port (~/github/coco-rp2350-waveshare-touch-amoled-18), driven by the KEYBOARD instead of touch gestures. USER SPEC (2026-08-05): F12 activates, LEFT/RIGHT select, ENTER launches, ESC cancels and returns to the running app. Rendered with the 6847 path so it matches the emulator's look and feel. SETTLED BEHAVIOUR: (a) ENTER COLD-BOOTS the machine, same as the other implementations -- not a live floppy hot-swap; (b) the emulator is PAUSED while the overlay is up; (c) all three entry types are supported (DSK, BIN, CART), matching the port's three existing boot paths (autorun.txt disk_name / direct_name / cart_name).\n\nWHAT WE ALREADY HAVE (verified 2026-08-05, so this is smaller than it looks): coco_boot_blit_vdg_pizero_src(const uint8_t *src, uint16_t *fb) ALREADY EXISTS at coco_boot.h:76 -- the source-pointer blit that PIZERO-53 assumed would need a render_alpha_frame refactor. It does not; an overlay is just a VDG-format scratch buffer handed to that function. font_6847t1 is already exposed (coco_machine.cpp:873). F12 is HID usage 0x45 and is UNMAPPED in hid_table_init (main.cpp:311-334, table memset to 0xFF), so it is free to claim.\n\nWHAT MUST BE PORTED: coco_boot_enumerate() + struct coco_entry (this port only has coco_boot_find_default_dsk, coco_boot.h:26); the card renderer coco_boot_card_clear/card_text/card_buffer (AMOLED coco_boot.cpp:278-310) -- note it does NOT reuse render_alpha_frame, it is a small separate renderer drawing real font_6847t1 glyphs at 8x12 into a VDG-format buffer, which is the same look with less coupling; and coco_machine_reset(), which AMOLED has (its coco_machine.h:39) and THIS PORT DOES NOT.\n\nKEY-CAPTURE CARE: unlike F12, the other three keys are live CoCo keys and must be intercepted ONLY while the overlay is open, never swallowed otherwise -- ENTER is 0x28 -> K_ENTER, LEFT/RIGHT are 0x50/0x4F -> K_LEFT/K_RIGHT, and ESC is 0x29 which this port maps to K_BREAK (main.cpp:322).\n\nSub-sliced as PIZERO-81a..81d; each is independently testable. Last-launched persistence is PIZERO-82 (needs SD write). This is the disk-switching slice only -- firmware settings (SAM-speed cap, joystick source, audio env) remain PIZERO-53, which becomes the superset built on this.\n\n[2026-09-17 DESIGN DIRECTION, set with the user after reading the Fruit Jam implementation (its whole overlay is ~350 lines of UI in src/coco/coco_main.cpp, plus ~450 lines of disk plumbing). The overlay is to be treated as ANOTHER 6847 SURFACE, not a menu drawn over the emulator: a VDG-format card that goes through the existing blit path, so it inherits the machine's own look, palette and artifact behaviour. It should read as built-in, and above all feel responsive. Fruit Jam bypasses the VDG entirely and pokes RGB565 into its scanout rows; we deliberately do not. The four slices stand, but see the per-slice notes.]\n\n[2026-09-17 Summary rewritten to say what it delivers. Previous summary: \"F12 disk-image switcher: keyboard-driven launcher with 6847 look (port of the AMOLED picker)\"]\n\n[2026-09-28 DONE: every slice is closed (81a catalogue, 81b drawing, 81c keys and pause, 81d launching), plus four drives (114), BIN/CART lists (136), the text editor for settings.txt and autorun.txt (146/147) and the F9-F12 keys (153). Remaining related work lives in its own issues: 82 (remember the last launch), 117, 138 (cassettes), 142 (banked carts, untested for lack of a cart).]", "type": "feature", "status": "done", "priority": "high", "created": "2026-08-05", "updated": "2026-09-28", "tags": ["launcher", "ui", "vdg", "keyboard", "sd", "f12", "parent"], "theme": "experience"}, {"id": "PIZERO-81a", "summary": "Pick a disk image on screen: read the card's catalogue (launcher 1 of 4)", "description": "Slice 1 of PIZERO-81. Port coco_boot_enumerate() and struct coco_entry from the AMOLED port (~/github/coco-rp2350-waveshare-touch-amoled-18 src/coco_boot.h:40-45, and the scan in coco_boot.cpp) so the firmware can produce a catalogue of launchable SD content. This port currently has only coco_boot_find_default_dsk (coco_boot.h:26), which finds one .dsk and stops. SCOPE: scan the SD for all three entry types -- COCO_ENTRY_DSK / _BIN / _CART -- across the directories this port already searches (coco_boot_resolve handles /coco/dsk, /coco/bin, /coco/rom, /coco), returning a bounded array of {name[24], type}. Sort stably (alphabetical) so LEFT/RIGHT ordering is predictable across boots. Decide and document the entry cap and what happens past it (log it, do not silently truncate). NO UI in this slice: prove it over serial by dumping the catalogue, the same way AMOLED shipped its Ctrl-B LIST_KEY before any on-screen UI existed. ACCEPTANCE: serial dump lists every DSK/BIN/ROM on a real card, correctly typed, in stable order.\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"Launcher slice 1: SD catalogue enumeration (DSK/BIN/CART), serial-verifiable\"]\n\n[2026-09-17 DESIGN DIRECTION, set with the user after reading the Fruit Jam implementation (its whole overlay is ~350 lines of UI in src/coco/coco_main.cpp, plus ~450 lines of disk plumbing). Scope confirmed wider than Fruit Jam's: DSK, BIN and CART, where Fruit Jam lists .dsk only. Reusable from there: scan_dsk_dir() (FatFs only, plus its dotfile/AppleDouble skip and insertion sort) and its over-long-filename rejection, which was a real corruption bug there (FRUITJAM-103). No PSRAM here, so there is no image cache and every mount is a live SD read; Fruit Jam preloads up to 6 MB at boot and mounts by pointer assignment. Measure the mount cost.]\n\n[2026-09-26 MILESTONE SCOPE: this slice ships .dsk ONLY, from /coco/dsk then /coco, case-insensitive sort, dotfiles and directories skipped, cap 128, rescanned on every overlay open. Pure logic in src/dsk_catalog.h with a native test (like src/text_card.h). BIN and CART entries are filed separately when this closes. Build order for the milestone: 81a, 114, 81c, 81b.]\n\n[2026-09-26 BUILT, not yet on hardware. src/dsk_catalog.h holds the rules (dsk_cat_is_image/add/sort/path/find_path; DSK_CAT_MAX 128, names under 64 bytes, longer ones counted in skipped_long rather than truncated, /coco/dsk wins a duplicate, macOS ._ files skipped); 7 host tests in test/test_dsk_catalog. src/coco_boot.cpp coco_boot_rescan_dsk() walks /coco/dsk then /coco (also skipping hidden and system files) and coco_boot_dsk_catalog() exposes it. setup() prints '[dsk] N image(s)' and one '[dsk]   0:/coco/...' line per image before the autorun block. RAM 71.1% to 72.7% (+8.3 KB, the 128-entry table). CHECK ON HARDWARE: the [dsk] lines match the card.]\n\n[2026-09-27 DONE: confirmed on hardware by the user (\"it's all good\") with the F12 overlay listing the card's images. Delivered .dsk only; BIN and CART entries are filed as PIZERO-136.]", "type": "task", "status": "done", "priority": "high", "created": "2026-08-05", "updated": "2026-09-27", "tags": ["launcher", "sd", "enumerate", "slice"], "theme": "experience"}, {"id": "PIZERO-81b", "summary": "Draw the overlay as a real 6847 screen, so it looks like part of the machine (launcher 2 of 4)", "description": "Slice 2 of PIZERO-81. Port the 6847-look overlay renderer so the launcher matches the emulator's appearance. Port coco_boot_card_clear(paper) / coco_boot_card_text(col,row,text,ink,paper) / coco_boot_card_buffer() from AMOLED coco_boot.cpp:278-310 plus the COCO_CARD_COLS/ROWS (32x16) defines. It draws real font_6847t1 glyphs at 8x12 per cell into a scratch buffer in VDG format, with the ASCII->font-index mapping the T1 character ROM needs (uppercase-fold, screen code + 0x40, unrenderable -> space). It deliberately does NOT reuse render_alpha_frame -- same font ROM, same look, far less coupling, and it means PIZERO-53's planned refactor is unnecessary. PORTING DETAIL TO CHECK: AMOLED's card buffer is 4bpp nibble-packed to match ITS VDG framebuffer; confirm the exact source format coco_boot_blit_vdg_pizero_src(const uint8_t*, uint16_t*) expects here (coco_boot.h:76, implementation coco_boot.cpp:496) and match it -- this is the one place the port is likely to differ. Watch the SRAM cost of the scratch buffer (README: SRAM ~89-94% full). NO INPUT in this slice: prove it by blitting a static card over the running emulator. ACCEPTANCE on HW: a legible CoCo-looking text card appears over the frame, correct colours, no tearing or corruption of the emulator image.\n\n[2026-09-17 DESIGN DIRECTION, set with the user after reading the Fruit Jam implementation (its whole overlay is ~350 lines of UI in src/coco/coco_main.cpp, plus ~450 lines of disk plumbing). TWO CONSTRAINTS Fruit Jam did not have. (1) This port is DOUBLE-BUFFERED (g_fb[2], src/main.cpp:194). Fruit Jam is single-buffered, which is why its overlay lives inside the 256x192 active area and is erased for free by the next blit. Here the overlay must be rendered into BOTH buffers, or the front buffer pinned while it is up; getting this wrong gives alternating-frame flicker. (2) Draw through coco_boot_blit_vdg_pizero_src (coco_boot.h:76) from a VDG-format scratch card, NOT by writing RGB565 into scanout rows. Font is font_6847t1, which needs the (ch & 0x3F) | 0x40 fold (coco_machine.cpp:964).]\n\n[2026-09-17 Summary rewritten to say what it delivers. Previous summary: \"Launcher slice 2: 6847-look overlay renderer (card buffer + font_6847t1)\"]\n\n[2026-09-17 CORRECTION to the design note above: the PRODUCT build is single-buffered, not double-buffered. pizero_stream_60 extends pizero_stream extends pizero_audio, which defines HDMI_DATA_ISLAND, and under that flag src/main.cpp:1215 blits into one buffer with g_front already pointing at it; the g_fb[2] back-buffer path at :1218 is the non-data-island build only. So the Fruit Jam arrangement does transfer directly after all: an overlay drawn inside the active area is erased by the next blit, with no flicker risk and no need to render twice. The double-buffer warning applies only if a future build turns data islands off.]\n\n[2026-09-26 MILESTONE SCOPE, after the Fruit Jam overlay (~/github/xroar-adafruit-rp2350-fruit-jam src/coco/coco_main.cpp:1092-1175): title row, 14 list rows with a 4-column drive map then up to 27 characters of name, a status row that shows a key legend by default (FRUITJAM-95: hiding it made the controls undiscoverable) and messages such as GAMES.DSK IN DRIVE 1 / DRIVE 1 EMPTY / CANNOT OPEN. Uses the existing g_card grid and coco_boot_card_present (src/coco_boot.cpp:541-579), adding a per-cell inverse attribute for the selection bar. Redraw only when something changed.]\n\n[2026-09-26 BUILT, not yet on hardware. coco_boot_card_invert_row() sets bit 7 of each cell (free, since card_code yields $20-$5F) and coco_boot_card_present draws those cells paper-on-ink, as the 6847 does inverse. Layout in src/disk_overlay.cpp: row 0 title bar inverse; rows 1-14 a 4-character drive map ('0'-'3' where mounted, '-' where not) then the name without .DSK (dsk_cat_display_name, up to 27 chars); selected row inverse; row 15 the legend '0-3 DRIVE  ARROWS MOVE  ESC EXIT', or a message after a key (NAME IN DRIVE n / DRIVE n EMPTY / CANNOT OPEN NAME), or on open a skipped-names notice. Empty catalogue shows where to put .dsk files. All fixed strings are checked by a host test for width and printable characters. main.cpp present_card() is now shared by boot_page and the overlay. Redraws only when something changed.]\n\n[2026-09-27 DONE: confirmed on hardware by the user: the overlay draws as a 6847 text screen over the paused machine, with the inverse selection bar, drive map and status row.]", "type": "task", "status": "done", "priority": "high", "created": "2026-08-05", "updated": "2026-09-27", "tags": ["launcher", "vdg", "render", "font", "slice"], "theme": "experience"}, {"id": "PIZERO-81c", "summary": "F12 opens it instantly, keys never leak into BASIC, sound keeps playing (launcher 3 of 4)", "description": "Slice 3 of PIZERO-81. The overlay state machine and its key capture -- the interaction layer, still with no launching (ESC-only exit). SCOPE: (1) claim F12 (HID usage 0x45, currently unmapped in hid_table_init, main.cpp:311-334) as the activate key; it must never reach the CoCo. (2) While the overlay is OPEN, intercept LEFT/RIGHT (HID 0x50/0x4F) to move the selection, ENTER (0x28) to confirm and ESC (0x29) to cancel -- and CRITICALLY, pass all four through untouched when the overlay is CLOSED, since they are live CoCo keys (ESC is mapped to K_BREAK at main.cpp:322). A regression here silently breaks normal typing, so test both states. (3) PAUSE EMULATION while the overlay is up (user decision): stop advancing coco_machine_run_cycles, and decide what the audio path does -- the ring will drain and the core-1 consumer will underrun, so either feed silence or stop the stream cleanly rather than let it warble (this is the PIZERO-35/38/39 failure class; do not reintroduce it). Keep the DVI scanout running throughout. (4) Held-key repeat for LEFT/RIGHT, and sane edge behaviour at the ends of the list (clamp or wrap -- pick one and document). (5) Draw the selection using the PIZERO-81b renderer, with the on-screen hint text updated for keys rather than AMOLED's 'SWIPE = BROWSE / TAP = RUN'. ACCEPTANCE on HW: F12 opens over a running program, LEFT/RIGHT scroll the selection, audio does not warble while paused, ESC returns and the program resumes cleanly with keyboard input still working normally. Depends on PIZERO-81a and PIZERO-81b.\n\n[2026-09-17 DESIGN DIRECTION, set with the user after reading the Fruit Jam implementation (its whole overlay is ~350 lines of UI in src/coco/coco_main.cpp, plus ~450 lines of disk plumbing). AUDIO MUST NOT STOP WHILE THE OVERLAY IS UP. Fruit Jam halts the 6809 and feeds its I2S ring the last sample as DC, which is silence and is fine there. Here the HDMI audio is a streaming data-island path with the sink locked to it, and the stated goals are continuous sound and no sync drops: pausing the machine must keep the stream and its clock regeneration alive, feeding digital silence rather than stopping. Cheap now, painful to retrofit. Copy from Fruit Jam: the ESC-versus-BREAK handling (ESC cancels but never opens, since ESC is CoCo BREAK) and the separate edge detector for overlay keys, so nothing leaks into BASIC. Add Home/End/PgUp/PgDn paging, which Fruit Jam has and the original spec here lacked. Responsiveness is an acceptance criterion, not a nicety: keypress to redraw within one frame, dirty-flag redraw only.]\n\n[2026-09-17 Summary rewritten to say what it delivers. Previous summary: \"Launcher slice 3: F12 overlay state machine, key capture, pause emulation\"]\n\n[2026-09-25 The BOOT button will be a second way to open the overlay, alongside F12 (PIZERO-128). Route both through one 'open overlay' entry point rather than special-casing F12 in the HID path.]\n\n[2026-09-26 MILESTONE SCOPE: keys while open are Up/Down (wrap), PgUp/PgDn/Home/End (clamp, 14-row page), 0/1/2/3 toggle the highlighted disk in that drive (PIZERO-114), F12 or ESC close; everything else swallowed. Held Up/Down repeat (about 400 ms delay, 80 ms rate). Logic in a pure header with a native test proving no key leaks in either state; on close, copy the live report into g_hid_prev_codes so a held ESC is not a BREAK (FRUITJAM-68). While open: skip pump_keyboard, run_cycles, render and blit; keep USB, watchdog, pacing; core 1's stream_next_sample ramps to digital silence via a paused flag, and the ring and priming reset on resume. The earlier LEFT/RIGHT plus ENTER-to-launch spec belongs to 81d.]\n\n[2026-09-26 BUILT, not yet on hardware. src/overlay_keys.h holds the key rules (13 host tests in test/test_overlay_keys, including: closed passes everything but F12, ESC never opens, open swallows every key, the ESC that closes is not a BREAK, F12 held through close does not reopen, wrap/clamp, drive keys, empty list, repeat timing). src/disk_overlay.cpp runs it; main.cpp hid_keyboard_apply gives every report to disk_overlay_key() first (only while g_machine_running), resyncs g_hid_prev_codes and shift on close, and loop() skips pump_keyboard/run_cycles/render/blit while open, calling disk_overlay_frame() instead. AUDIO: stream_next_sample on core 1 honours g_audio_paused: it stops reading the ring (left intact, so the servo sees no jump) and fades the output to zero over 256 samples (~5 ms), fading back in on resume. disk_overlay_open() is the single entry point for PIZERO-128's BOOT button. The [run] line shows cpu/render/blit near 0 while paused, by design.]\n\n[2026-09-27 DONE: confirmed on hardware by the user. Serial capture during the test: while open fps stayed 60, cpu=0us, the audio ring held still at fill 3881 with under=0/s and under_total unchanged; after close emulation resumed at once with fill steady and no underruns. The ring was left intact and the output faded, as designed.]", "type": "task", "status": "done", "priority": "high", "created": "2026-08-05", "updated": "2026-09-27", "tags": ["launcher", "keyboard", "hid", "pause", "audio", "slice"], "theme": "experience"}, {"id": "PIZERO-81d", "summary": "Choosing something actually starts it (launcher 4 of 4)", "description": "Slice 4 of PIZERO-81, and the one that makes it useful: ENTER cold-boots the selected entr
