Left over from PIZERO-101. The roof grille went from 3.0 mm slots to 1.0 mm slots on a 3.33 mm pitch (rev 5), which is what lets five rows fit between the grooves. Geometrically both buttons are well covered: rows 2 and 5 land within 0.07 mm of BOOT and RUN, with 1.18 mm of each 1.5 mm plunger under open slot (the model echoes this, _check_button in hardware/case/pizero_case.scad). But a 1 mm slot prints nearer 0.8 mm, and the 1.5 mm plunger diameter is itself inferred, not measured. Nobody has tried to press either button through a printed lid.\n\nDO: with the case assembled, press RUN and BOOT through the grille with a paperclip or similar. If they cannot be reached, options in order of preference: widen just the two rows over the buttons; raise vent_w for the whole grille; or re-enable buttons_open for two 3 mm holes.\n\nCOMPLETION CONDITION: user confirms both buttons can be pressed through the assembled case, or the grille is changed until they can.\n\n[2026-09-25 DONE: the user can press both RUN and BOOT through the assembled TOP v12 lid with a very thin screwdriver. That meets the completion condition; the grille is unchanged. Note for the docs: the tool that fits is a very thin screwdriver, not necessarily a paperclip.]", "type": "task", "status": "done", "priority": "low", "created": "2026-09-16", "updated": "2026-09-25", "tags": ["hardware", "case", "3d-print", "openscad"], "theme": "kit"}, {"id": "PIZERO-105", "summary": "Engrave a per-part version inside each case STL so a printed part maps to a revision", "description": "Printed parts accumulate and become indistinguishable: several revisions of the lid look alike in the hand. Each part now carries its own version string, engraved on a face that is inside the assembled case, so it is readable before assembly and hidden after.\n\nWHERE: base, on the floor between the two banks of floor vents (x 32.5, y 15, the 6 mm gap). Lid, on the roof underside, centred on the two USB ports (x 46.35) at y 2.2, in front of the groove loop; mirrored in the model so it reads correctly when looking up at the inside.\n\nHOW: ver_base / ver_top / ver_top_header in hardware/case/pizero_case.scad, engraved ver_d (0.5 mm) deep at ver_size (3.0 mm), font Liberation Sans Bold. Bump the number when that part's geometry changes and note what changed in hardware/case/README.md. ver_show = false drops the text.\n\nSTARTING POINT: BASE v9 / TOP v9 (PIZERO-101 rev 8 plus the PIZERO-103 microSD rev 2), TOP-HDR v1 (the PIZERO-102 draft).\n\nDONE WHEN: printed and the version is legible on both parts, confirmed by the user.\n\n[2026-09-16 IMPLEMENTED, awaiting a print. Engraving verified in renders from unambiguous top views: base reads BASE v9 bottom-to-top in the vent gap; lid reads TOP v9 when held cavity-up. Note for anyone editing ver_lid_cut: the lid text needs mirror([0,1,0]), a VERTICAL pre-flip, because the roof-down print orientation is a 180 degree rotation about x. mirror([1,0,0]) was tried first and is wrong. Judge this only from a camera whose up-vector is unambiguous: a straight-down OpenSCAD gimbal view can render as a bottom view and reverses the apparent handedness.]\n\n[2026-09-25 DONE: the user confirms the engraving is legible on the TOP v12 print (\"engraving is good\"); the snapped TOP v11 lid in the PIZERO-124 photo also reads clearly.]", "type": "feature", "status": "done", "priority": "low", "created": "2026-09-16", "updated": "2026-09-25", "tags": ["hardware", "case", "3d-print", "openscad"], "theme": "kit"}, {"id": "PIZERO-106", "summary": "issues.html: 225 tag pills bury the results, so lead with the most-used tags", "description": "Reported by the user: \"there are way too many tags filtered that i can't see any results\". The tracker has 225 unique tags across 104 issues, 134 of them used exactly once, and the page rendered a pill for every one. The filtering itself was never broken (a headless render confirms all 104 cards are present, and tag filters are OR-ed, inactive when none is selected); the pill row was simply taller than the viewport, so the results sat below the fold.\n\nFIX in tools/issues_html.py: order tags by frequency, show the top TAG_PILL_LIMIT (20) with their counts, and keep the long tail behind a '+N more' toggle. Status and type rows are unaffected.\n\nDONE WHEN: the page opens with results visible without scrolling past the filters, confirmed by the user. The same fix is worth carrying back to the skill's own copy of the generator at ~/.claude/skills/issues/scripts/issues_html.py, which is outside this repo.\n\n[2026-09-16 FIXED in tools/issues_html.py: TAG_PILL_LIMIT = 20, tags ordered by frequency with counts, long tail behind a '+N more' toggle (.morebtn, its own click handler so the pill handler is unaffected). Awaiting the user's confirmation in a browser.]\n\n[2026-09-16 Carried back to the skill's own copy at ~/.claude/skills/issues/scripts/issues_html.py (backup alongside it as .bak-20260916), which was otherwise identical to this project's copy, so every project that uses the skill gets the fix. Verified it still builds from the skill copy.]", "type": "bug", "status": "open", "priority": "medium", "created": "2026-09-16", "updated": "2026-09-16", "tags": ["tooling", "issues", "docs"], "theme": "platform"}, {"id": "PIZERO-107", "summary": "Backlog triage: group every issue under one of seven themes and park the idea-stage work", "description": "The tracker had grown to 106 issues, 69 of them live, with no structure: 225 free-form tags, summaries written for the implementer rather than the owner, and no statement of what 'done enough' means. At a glance it was impossible to tell a two-hour fix from a multi-month programme, so verification work competed with new features and lost.\n\nMOVE 1 (this issue): every issue carries exactly one theme field from a fixed vocabulary, and issues.html filters and labels by it. Themes: trust (does it work, provably), kit (handing it to other people), input, experience (how the machine feels to use), storage (the VFS/hypercall replatform), devices (new video/audio hardware the CoCo never had), platform (the core port and its plumbing).\n\nMOVE 2 (this issue): idea-stage low-priority issues move to status deferred, each with an explicit revisit trigger, so the live list states intent honestly. Deferring is reversible and loses nothing: the ticket and its reasoning stay.\n\nSTILL TO DECIDE (moves 3 and 4, deliberately not done here): a vetting milestone with a declared finish line, a ranked roadmap.jsonl, and rewriting the summaries of the issues that stay visible in terms of what the user gets. Free-form tags are left alone for now; theme is the new axis.\n\n[2026-09-17 DONE. Moves 1 and 2 shipped in 2f946eb: all 107 issues themed, 17 idea-stage issues deferred with revisit triggers, issues.html filtering by theme. Move 4 done in part here: the eleven issues that stay visible on the roadmap were rewritten to say what they deliver, with the previous wording preserved in each description. Move 3 (a declared vetting milestone) is now expressed as the ranked roadmap.jsonl rather than a separate ticket.]", "type": "chore", "status": "done", "priority": "medium", "created": "2026-09-16", "updated": "2026-09-17", "tags": ["tooling", "issues", "process"], "theme": "platform"}, {"id": "PIZERO-108", "summary": "Soak harness and a permanent measurement archive, so runs can be compared build to build", "description": "The [run] telemetry line already carries everything the reliability goals need (fps, per-phase cpu/render/blit/audio times, USB line state and report counts, freeze count and the phase it froze in, audio ring fill/skips/underruns), but nothing captures it. Measurements live in issue comments and die there.\n\nDO: (1) scripts/soak.py reads the serial port, timestamps every [run] line, survives board reboots, and writes raw CSV plus a summary; kill any previous reader first, two readers on one port produce a fake fault. (2) It computes the rates the goals are stated in: fps windows outside 59.9-60.1, audio underruns and skips per hour, freeze count and last phase, USB disconnect events. (3) docs/measurements/*.jsonl keeps one record per run: date, git hash, PlatformIO env, metric, value, plus a README describing the schema. Benchmarks may be deleted later; their numbers must not be.\n\nWHY FIRST: PIZERO-98 cannot start without it, and every performance argument after this one wants a baseline to compare against.\n\nCOMPLETION CONDITION: a 30-minute trial run produces a record in docs/measurements and a readable summary.\n\n[2026-09-17 BUILT: scripts/soak.py (record | analyse | ports) and docs/measurements/ with a README describing the schema. Record mode is the Fruit Jam logger's shape (timestamps, self-reconnecting, silence notices) plus a --hours stop and a git-state header. Analyse mode is separate on purpose, so a log can be re-read later by a better analyser, and it groups metrics by reliability goal rather than by source line. Cumulative board counters (freezes, skips, under, rfail) reset on reboot; the analyser sums increments across resets and counts banners as reboots_seen. VERIFIED against a synthetic 2.5 h log with a mid-run freeze and a reboot: duration, window count, bad windows, underruns summed across the reset (4+3=7), skips, freezes and reboots all came back exactly as constructed. NOT yet verified against a real board: no hardware attached this session. Remaining before this closes: one real 30-minute trial run, which is also the first archive record.]\n\n[2026-09-17 FIRST REAL RUN, 3 minutes against the board on /dev/cu.usbmodem101. The harness worked end to end: it logged, survived the board rebooting under it, parsed, summarised and archived. It also earned its keep immediately by capturing the freeze PIZERO-33 has waited three months for. One weakness found in the metrics themselves, filed as PIZERO-118: the audio underrun counter climbs continuously at idle, so it cannot currently distinguish silence from a dropout, which is what goal 2 needs it to do.]\n\n[2026-09-17 DONE. scripts/soak.py (record | analyse | ports) and docs/measurements/ with its schema README are in use and have proven themselves four times over: they caught the PIZERO-33 freeze in a 3-minute shakedown, exposed the audio shortfall behind PIZERO-118/119, measured the render fix before and after, and are now logging the 25-hour soak. Two analyser bugs were found and fixed by using it: cumulative counters must be summed across reboots, and a counter already non-zero when logging starts is a baseline rather than an event. Nothing outstanding.]\n\n[2026-09-18 A THIRD ANALYSER BUG, and the most serious: freeze attribution. Real freezes were being reported as predating the log. The rule now is structural rather than arithmetic: a watchdog message describes the session that just died, so only the FIRST banner in a log can describe one that began before we attached; every later message is ours, and the first is flagged ambiguous rather than guessed at. The metric also stopped doing arithmetic on the board's freeze counter, which resets on reboot and can carry across a power cycle: one watchdog message is one freeze, and the counter delta is kept only as a cross-check. Lesson worth keeping: this harness has now found three of its own bugs by disagreeing with the log, and each one was found by reading the raw lines rather than trusting the summary.]\n\n[2026-09-18 FOURTH HARNESS FIX: host-side gaps. A sleeping laptop loses telemetry the board still emitted, so rates must be per hour OBSERVED, not per hour of wall clock, and a freeze inside a gap leaves no message to count. The analyser now subtracts gaps from the span, reports both figures, and prints the board's freeze counter whenever it disagrees with the number of messages, which is the signal that something happened while we were not looking.]", "type": "task", "status": "done", "priority": "high", "created": "2026-09-17", "updated": "2026-09-18", "tags": ["testing", "measurement"], "theme": "trust"}, {"id": "PIZERO-109", "summary": "Unit tests on the laptop for the logic we wrote, so a bad edit fails in seconds", "description": "XRoar's own core is trusted as-is; what needs tests is the glue this port added. No tests exist today and there is no native build.\n\nDO: a PlatformIO [env:native] with Unity, running on the development machine, no board. First targets, chosen because they are pure functions with checkable outputs: (1) HDMI packet builders, ACR N/CTS pairs, AVI and audio InfoFrames, BCH parity and TERC4 encoding, against golden vectors from the spec; (2) the cross-core audio ring's fill/skip/underrun accounting, including wrap and overflow; (3) HID usage to CoCo matrix mapping, which PIZERO-49 is about to extend; (4) VDG address arithmetic, including the SAM display base case that is PIZERO-100 (that bug is four lines of test).\n\nCOST, STATED HONESTLY: this logic currently lives inside src/main.cpp (68 KB) and coco_machine.cpp. Testing it means extracting it. Extract only what a test touches, one module at a time; do not start with a refactor.\n\nCOMPLETION CONDITION: `pio test -e native` runs green in CI-less local use, with at least the four targets above covered.\n\n[2026-09-17 FIRST SLICE DONE: [env:native] with Unity, 12 tests, `pio test -e native` green in 4 s on the laptop with no board.\nExtracted lib/coco_machine/src/vdg_pack.h (header-only, no Arduino/Pico) and pointed coco_machine.cpp at it, so the tests exercise the code the firmware runs rather than a copy. Firmware still builds, RAM 70.9%.\nCovered: pack8 nibble order (getting it backwards mirrors every glyph); SG4 across all 128 characters x 12 sub-rows against the original put2 reference; RG6 mono, RG6 artifact in both PIZERO-43 phases, and the colour-clock-spans-two-pixels rule; alpha in both colourings and the T1 glyph fold; and the SAM display base.\nThe reference implementations in the test file ARE the per-pixel versions PIZERO-119 replaced, kept on purpose so the fast tables are always checked against something readable.\nPIZERO-100 is now pinned by a test: test_display_base_legacy_loses_address_zero asserts the CURRENT wrong behaviour, so whoever fixes it gets a failing test pointing at the fix, and vdg_display_base(sam_f, written) next to it is the intended version.\nREMAINING on this ticket: the HDMI packet builders (dvi_data_island.c already has a DVI_DI_HOST_TEST path, so it should be cheap), the audio ring accounting, and HID-to-matrix mapping. lib_ignore keeps the board libraries out of the native build; extract further modules as tests need them.]\n\n[2026-09-17 SECOND SLICE: 17 more tests for the HDMI data-island builders, 29 in total, still about a second on the laptop. dvi_data_island.c compiles straight into the test through its own DVI_DI_HOST_TEST path, so this is the firmware's encoder rather than a re-implementation. Covered: ACR field layout with the CTS=25176/N=6144 pair PIZERO-32 turns on, and that a 20-bit value keeps its top nibble; both InfoFrames' type/version/length plus the spec's sum-to-zero checksum rule, including the PB7 spill into the second subpacket; GCP mute bits; audio sample packet header, the 192-frame IEC block-start bit, little-endian sample bytes and frame-count clamping; BCH parity zero case, sensitivity to every header bit, and determinism; TERC4 symbols distinct and within 10 bits, pair packing, and the guard band not colliding with a data symbol.\nOne test failed on the first run and the bug was MINE, in the test's expected values, not the encoder's: 0xFDCBA >> 16 is 0x0F, not 0x0D. Worth recording because it is the ordinary case for a new suite, and the encoder came out clean.\nREMAINING: the audio ring accounting and HID-to-matrix mapping, both of which need extraction work first.]", "type": "task", "status": "in-progress", "priority": "high", "created": "2026-09-17", "updated": "2026-09-17", "tags": ["testing", "measurement"], "theme": "trust"}, {"id": "PIZERO-110", "summary": "A self-test build the board runs on demand, printing PASS or FAIL for each check", "description": "Unit tests on the laptop cannot see timing, DMA, or hardware. The goals that matter most (60 Hz uptime, continuous audio, no sync drops, no crash) are properties of the running board.\n\nDO: [env:pizero_selftest], a firmware build that runs a fixed sequence and prints machine-readable results over CDC, driven by a host script so it can be repeated per build: ROM load from SD; SD read-back integrity; DVI lock and measured fps over a window; audio ring health after N frames (no underruns once primed); watchdog fires and recovers; USB enumerate, and replug if a device is present. Each check prints PASS or FAIL with the measured number, never just PASS.\n\nDEPENDS ON PIZERO-108 for the measurement record format, so self-test results land in the same archive.\n\nCOMPLETION CONDITION: one command flashes, runs and reports, and its output is archived like a soak run.", "type": "task", "status": "open", "priority": "medium", "created": "2026-09-17", "updated": "2026-09-17", "tags": ["testing", "measurement"], "theme": "trust"}, {"id": "PIZERO-111", "summary": "Decide which CoCo 3 graphics modes this chip can actually drive, before promising any", "description": "CoCo 3 support is a stated goal, but the honest answer to 'can it?' is mode by mode, and nobody has done the arithmetic. The 6809 and the MMU are not the question; RAM and scanout bandwidth are.\n\nDO: for each GIME mode, work out the framebuffer bytes at 512 KB guest RAM, the per-frame blit cost into the 320x240 RGB565 buffer this port scans out, and whether libdvi at 252 MHz can carry it at 60 Hz. Compare against the measured core-0 budget from PIZERO-88. Say plainly which modes are reachable, which are reachable only at reduced refresh or colour depth, and which are not reachable at all.\n\nEXPECTATION TO TEST, NOT ASSUME: the 320-wide 16-colour modes look reachable and 640-wide 16-colour looks like the wall. That is instinct, and instinct is what this ticket exists to replace.\n\nCOMPLETION CONDITION: a table in docs/ of GIME mode against verdict and the numbers behind it, and a decision on whether CoCo 3 becomes a programme or stays an aspiration. Depends on PIZERO-88.\n\n[2026-09-17 ANALYSIS DONE: docs/coco3-feasibility.md, with the numbers behind every verdict.\nTHE EXPECTATION IN THIS TICKET WAS WRONG, which is what it was for. Video is not the binding constraint; the 6809 is. A CoCo 3 runs at 1.79 MHz, double what we emulate today at a measured 10.4 ms per frame, so emulation alone would need ~20.8 ms of a 16.67 ms frame: about 80% of real speed before the GIME's MMU, timer and interrupts cost anything. docs/cpu-speed.md reached the same number from the SAM high-speed side.\nRAM: 520 KB on-chip and the PSRAM pad is UNPOPULATED (README.md), so 512 KB CoCo 3 is not reachable on this board at any speed: it needs +448 KB and even deleting the whole framebuffer frees ~150 KB. 128 KB fits today with ~23 KB spare.\nVIDEO: 320-wide GIME modes drop straight into our 320-wide framebuffer; 640-wide modes cannot use a framebuffer at all (640x240 RGB565 is 307,200 bytes) and need per-line generation into libdvi's scanline queue, which is libdvi's own supported path and would incidentally free 153,600 bytes. Per-mode table in the doc. Conversion cost for every mode lands in 0.3-3.0 ms, inside the ~4 ms headroom, so video is affordable once the scanout changes.\nRECOMMENDATION: stays an aspiration, scoped 128 KB ONLY if ever taken up, and the first step is a 6809 dispatch experiment proved with the soak harness at an emulated 1.79 MHz. If that fails, no GIME work is worth starting.\nREMAINING for this ticket: the user's decision on programme vs aspiration.]\n\n[2026-09-17 DECIDED by the user: ASPIRATION, not a programme. Full CoCo 3 is not attempted; instead the port adopts GIME-compatible FEATURES it can afford on the CoCo 2 base, taking the register layouts from the real machine so unmodified software has a chance of working. First two chosen: palette customisation (PIZERO-55 for the classic 6847 modes, PIZERO-85 for the CoCo 3-style register file) and the programmable timer (PIZERO-62, un-deferred by this decision). Both were already costed as cheap here: the palette is a const-to-writable change on a LUT the blit already reads per pixel, and the timer generalises a countdown that already exists (cart_toggle_remaining). Neither needs the 6809 to get faster, which is what ruled the full machine out.]", "type": "decision", "status": "done", "priority": "medium", "created": "2026-09-17", "updated": "2026-09-17", "tags": ["coco3", "video"], "theme": "coco3"}, {"id": "PIZERO-113", "summary": "Prove a card survives power loss mid-write, before anything writes to it", "description": "Goal 5 is no data loss. Today nothing writes to the card, so the goal is vacuously met and completely untested. The moment PIZERO-64/65 land, it stops being vacuous.\n\nDO, alongside the write path rather than after it: a write-integrity corpus (write known files, checksum them back across remount and reboot) and a power-cut test (pull power during a write, repeatedly, and verify the filesystem and the untouched files survive). Record failures per hundred cuts in the PIZERO-108 archive.\n\nWHY IT IS FILED NOW: writing the test with the write path is cheap, and retrofitting it after a corruption report is not. This ticket is the acceptance gate for PIZERO-64 and PIZERO-65, not an afterthought.\n\nCOMPLETION CONDITION: the corpus passes, and a hundred power cuts during writes leave no corrupted filesystem.", "type": "task", "status": "open", "priority": "high", "created": "2026-09-17", "updated": "2026-09-17", "tags": ["sd", "write", "testing"], "theme": "storage"}, {"id": "PIZERO-114", "summary": "Assign four drives from the overlay, the way a real disk system works", "description": "Taken from the Fruit Jam implementation, which does this well and which the PiZero launcher tickets do not cover at all. Its picker shows four columns, one per drive, and keys 0-3 toggle the highlighted image into or out of that drive; it opens with the cursor on whatever disk sits in the drive DSKREG last addressed, and its status line reads NAME IN DRIVE d / DRIVE d EMPTY / LOAD FAILED.\n\nWHY IT MATTERS HERE: this board is presented as a computer rather than a console, so multi-drive work (copying between disks, a system disk plus a work disk) is exactly the use case. PIZERO-81 as written is a single-selection launcher.\n\nNEEDS: a runtime mount/eject API per drive. Fruit Jam has coco_machine_mount_dsk_drive(drive, ...) and coco_machine_fdc_drive() (coco_machine.h:122,126); this port mounts once via coco_boot_attach_dsk() with a sector-read callback and cannot swap at runtime. That API is the substance of this ticket.\n\nCOMPLETION CONDITION: four drives can be filled and emptied from the overlay, the machine sees the changes, and the screen opens on the drive last used.\n\n[2026-09-26 PART OF THE CURRENT MILESTONE: four drives from the F12 overlay. Keys 0-3 toggle the highlighted .dsk in that drive (hot swap, no reset; see PIZERO-115). Disk data stays on the SD card read a sector at a time (no PSRAM here; Fruit Jam's whole-image loads dropped HDMI, FRUITJAM-97). One read-only FIL per drive; coco_boot_disk_read_sector serves drives 0-3 and an empty drive reports NOT READY; the FDC already decodes drives 0-3 from $FF40 (coco_machine.cpp:369-372). autorun.txt @DISK and the default disk still go to drive 0. The overlay opens on the drive last selected. Writes stay write-protected (PIZERO-66).]\n\n[2026-09-26 LOWER HALF BUILT (no UI yet): src/coco_boot.cpp keeps one read-only FIL per drive; coco_boot_mount_drive(d, path), coco_boot_eject_drive(d), coco_boot_drive_path(d). coco_boot_attach_dsk() now mounts drive 0, so autorun behaves as before. coco_boot_disk_read_sector serves drives 0-3 and returns COCO_DISK_NOT_READY for an empty drive, which the FDC turns into WD279x status 0x80 (other errors stay 0x10). The reader is now installed whenever the Disk BASIC cart loads, not only when a disk was found, so drives filled later work. coco_machine_fdc_drive() reports the drive last selected at $FF40. RAM 73.1%. The overlay keys (0-3) come with PIZERO-81c.]\n\n[2026-09-26 UI BUILT, not yet on hardware: keys 0-3 in the F12 overlay mount the highlighted image in that drive, or eject it if that drive already holds it; the list shows which drives hold each disk. The overlay opens with the cursor on the disk in the drive DECB last selected. RAM for the whole milestone: product build 71.1% to 73.1% (+10.5 KB, mostly the 128-entry catalogue); the double-buffered fallback env 'pizero' is now at 99.4% static RAM, so its headroom is thin. CHECK ON HARDWARE: F12 over running BASIC, 1 mounts, DIR 1 lists it, 1 again ejects and DIR 1 reports an error, ESC closes without a BREAK, audio silent while open and clean after, no picture drop.]\n\n[2026-09-27 DONE: confirmed on hardware by the user: keys 0-3 in the F12 overlay put the highlighted disk in that drive and take it out again. Writes remain read-only (PIZERO-66).]", "type": "feature", "status": "done", "priority": "medium", "created": "2026-09-17", "updated": "2026-09-27", "tags": ["launcher", "ui", "overlay"], "theme": "experience"}, {"id": "PIZERO-115", "summary": "Decide what ENTER does: cold boot the selection, or swap the disk under a running machine", "description": "The two ports disagree, and Fruit Jam is inconsistent with itself (FRUITJAM-67): its button path mounts and cold-boots, its keyboard path hot-swaps under a running DOS. PIZERO-81d currently says cold-boot only.\n\nTHE TRADE: cold boot is predictable and always correct, but it throws away whatever is in memory, which is wrong when someone is mid-session and just wants the next disk of a two-disk program. Hot-swap is what a real drive does and is what makes the four-drive work in PIZERO-114 meaningful, but a swap under a DOS that has cached directory sectors can corrupt the guest's idea of the disk.\n\nPROPOSAL TO TEST: ENTER swaps (a real drive door), SHIFT+ENTER or a second key cold-boots, and the status line says plainly which happened. Only adopt this if a swap mid-session is demonstrably safe with DECB.\n\nCOMPLETION CONDITION: one documented behaviour, consistent between every input path, with the reasoning recorded here.\n\n[2026-09-26 PARTLY DECIDED: for DRIVE ASSIGNMENT (keys 0-3 in the overlay, PIZERO-114) the answer is hot swap with no reset, as Fruit Jam's keyboard path does. This board has no buttons, so FRUITJAM-67's two-paths-disagree problem cannot arise. The LAUNCH question (what ENTER does, PIZERO-81d) stays open here.]\n\n[2026-09-27 DECIDED by the user, and IMPLEMENTED with PIZERO-81d: the overlay has three lists switched with Left/Right (disks, programs, cartridges). In every list ESC goes back to the running session untouched. DISKS: keys 0-3 hot-swap drives (no reset); ENTER cold-boots with the highlighted disk in drive 0 and runs its first program. PROGRAMS: ENTER cold-boots and loads and runs the .bin directly. CARTRIDGES: ENTER installs the cart and cold-boots into it (the cart FIRQ jumps to $C000). So: hot swap for drive assignment, cold boot for launching, one behaviour per key in every list.]", "type": "decision", "status": "done", "priority": "medium", "created": "2026-09-17", "updated": "2026-09-27", "tags": ["launcher", "ui", "overlay"], "theme": "experience"}, {"id": "PIZERO-116", "summary": "RUN button cold-starts straight to the BASIC prompt, skipping AUTORUN", "description": "USER DECISION 2026-09-25: pressing RUN is a cold start that skips AUTORUN and lands at the BASIC prompt. Predictable every time, and a way out if an AUTORUN title misbehaves. Power-on and every other kind of restart keep running AUTORUN as now.\n\nHOW THE BUTTON WORKS (docs/RP2350-PiZero-schematic.pdf): RUN is Key2 on the RP2350's RUN pin, a hardware reset. Firmware never sees the press; it only sees that the chip restarted. So the whole feature is a decision at boot: read the reset reason and, if it was the RUN pin, take the no-AUTORUN path.\n\nWHERE: the boot strategy is at src/main.cpp:1168-1206. coco_boot_load_autorun() reads /coco/autorun.txt; without it, the code already falls back to Disk BASIC (disk11.rom) with the default disk attached (coco_boot_find_default_dsk) and no autotype. A RUN press should take exactly that fallback, as if autorun.txt were absent. The AUDIO_WAV_DUMP build already skips autorun at line 1171, which shows the shape.\n\nRESET REASON: RP2350 POWMAN CHIP_RESET has HAD_RUN_LOW (POWMAN_CHIP_RESET_HAD_RUN_LOW_BITS, 0x00040000, pico-sdk hardware/regs/powman.h:675). Check on hardware how it behaves across the other restarts this firmware sees, and that each of them still autoruns: cold power-on, the PIZERO-33 watchdog freeze recovery, the PIZERO-51 deliberate USB-replug watchdog reboot (scratch[4] sentinel, main.cpp:850-855), a picotool/UF2 flash (see the PIZERO-98 note on flashes rebooting through the watchdog), and BOOT+RUN into BOOTSEL. Also check whether the bits are sticky across a later non-RUN reset, and clear them if so.\n\nDISCOVERABLE: print on serial and on the boot screen that AUTORUN was skipped because of RUN, so it is not folklore. Update AUTORUN.md and docs/kit.md (RUN is reached through the case vents with a thin wire, PIZERO-126).\n\nDROPPED from the 2026-09-17 version of this issue, by the user: RUN as a WARM restart restoring the last state, with a double-tap within ~2 s for cold. That depended on PIZERO-82 (SD write) and on a press counter in watchdog scratch. A single, always-cold behaviour replaces it. A long hold was already ruled out because the chip is in reset while RUN is held.\n\nSPLIT OUT: the BOOT-button half of this issue is now PIZERO-128.\n\nDONE WHEN: on hardware, a RUN press with an AUTORUN title on the card lands at the BASIC prompt with no title loaded, while power-on still runs AUTORUN, and the restarts listed above each behave as before.\n\n[2026-09-25 IMPLEMENTED, not yet on hardware.\nsrc/main.cpp setup(): reads powman_hw->chip_reset first thing, sets g_run_button_reset from POWMAN_CHIP_RESET_HAD_RUN_LOW_BITS, and prints '[boot] chip_reset=0x........' on EVERY boot (with '(RUN button)' when set), so the hardware check of the other restart kinds is just reading that line.\nAutorun block: if g_run_button_reset and autorun.txt loaded, it prints '[autorun] skipped: RUN button reset (PIZERO-116)', shows an AUTORUN SKIPPED boot page for 2.5 s, then clears have_autorun so the existing no-autorun fallback runs (Disk BASIC, default disk, no autotype). With no autorun.txt on the card nothing is skipped, so no page and no delay.\nMessage text in src/boot_messages.h (MSG_RUNSKIP_*), added to all the layout and printable-character checks in test/test_text_card; 84/84 host tests pass. pizero_stream_60 builds (RAM 71.1%); the new strings are confirmed in firmware.elf.\nDocs: AUTORUN.md section E (the anti-kiosk interrupt it asked for) and the boot decision tree; docs/kit.md button paragraph.\nTO TEST ON HARDWARE, card WITH an autorun.txt: power on (should autorun, chip_reset without RUN); press RUN (AUTORUN SKIPPED page, then the BASIC prompt); power cycle again (autorun). Also note the chip_reset value after a flash and after a USB-replug reboot, and that BOOT+RUN still enters BOOTSEL.]\n\n[2026-09-27 DONE: confirmed on hardware by the user: pressing RUN lands at the BASIC prompt. The serial check of the restart cause across other restart kinds (flash, USB-replug reboot, power-on) was not captured, so it is filed as PIZERO-137 rather than holding this open.]", "type": "feature", "status": "done", "priority": "medium", "created": "2026-09-17", "updated": "2026-09-27", "tags": ["launcher", "ui", "overlay"], "theme": "experience"}, {"id": "PIZERO-117", "summary": "After mounting a disk, offer to run what is on it", "description": "Fruit Jam does this and it removes the last piece of ceremony: after a mount and cold boot it reads the RSDOS directory, finds the first runnable program, waits for the OK prompt and autotypes RUN\"NAME\" or LOADM (dsk_first_program(), autotype_task() in its coco_main.cpp).\n\nTHE REFINEMENT WORTH MAKING: Fruit Jam only does this on its button path, so the behaviour depends on how you got there. Here it should be a property of the selection, shown on screen before it happens (the overlay can name the program it found), and skippable. Nothing should type into a BASIC session without the user having seen what it was going to type.\n\nDEPENDS ON PIZERO-81d for the cold-boot path. COMPLETION CONDITION: selecting a disk that has an obvious program runs it without the user typing anything, and the overlay says what it is about to run.", "type": "feature", "status": "open", "priority": "low", "created": "2026-09-17", "updated": "2026-09-17", "tags": ["launcher", "ui", "overlay"], "theme": "experience"}, {"id": "PIZERO-118", "theme": "trust", "type": "bug", "status": "done", "priority": "high", "summary": "The audio ring runs empty all the time, so nothing can tell silence from a dropout", "description": "Found by the first PIZERO-108 harness run, 2026-09-17, on the default pizero_stream_60 build with a disk autorunning. Every [aud] line in three minutes read ring fill=0 or 1, and the underrun counter climbed steadily by roughly 400 to 500 per second, through 77,934 underruns across the run. The audio phase time was 0 to 2 us throughout.\n\nTWO SEPARATE PROBLEMS, AND BOTH MATTER.\n\n(1) THE METRIC IS USELESS AS IT STANDS. Goal 2 is continuous sound, and the number meant to prove it counts the same whether the machine is silent or the audio has genuinely broken. Any soak result for goal 2 is currently unreadable, including the 25-hour run in PIZERO-98.\n\n(2) THE BEHAVIOUR ITSELF NEEDS EXPLAINING. The expected design after PIZERO-41 is an event-driven integrate-and-dump resampler keyed to PIA writes, so a machine making no sound produces no events and the ring legitimately drains, with the consumer repeating the last sample as DC. If that is what is happening, the fix is in the accounting, not the audio. But a permanently empty ring also describes a consumer starved of a stream it is supposed to receive, and the HDMI sink is locked to that stream: it cannot be assumed benign without checking.\n\nDO: determine which it is, on hardware, with something audible playing (the PIZERO-18 ascending-tone test is the obvious source). If the ring fills and underruns stop while sound plays, this is accounting: count underruns only while the source is producing, or feed silence continuously and keep the counter meaning what it says. If the ring stays empty while sound plays, it is a real defect in the streaming audio path.\n\nCOMPLETION CONDITION: an [aud] reading that distinguishes 'nothing to play' from 'failed to deliver', and a soak record whose goal-2 number can be read at face value. Blocks the audio half of PIZERO-98.\n\n[2026-09-17 DIAGNOSED, and the first reading of it was wrong. The producer is NOT event-gated: audio_integrate() runs from the per-memory-access path and emits a sample every 1/48000 s of emulated time regardless of whether the machine is making sound (coco_machine.cpp:732). So an empty ring never meant 'nothing to play'. Measured from the trial log: underruns run a median of 321/s against a 48 kHz stream, which is a 0.67% DELIVERY SHORTFALL, sustained, with fill pinned at 0-1. The consumer reads one sample per call from the per-line IRQ (main.cpp:610) and holds the last sample when the ring is dry, so roughly 320 times a second the stream carries a repeat instead of a sample. That is a real defect, not an accounting artefact, and it is a plausible contributor to the buzz in PIZERO-41.\n\nMETRIC FIXED: coco_machine now counts samples produced and how many were audible (coco_machine_audio_counters), and the [aud] line reports RATES: fill, prod/s, want/s, under/s, short=%, tone/s, plus the cumulative totals. A silent machine now shows prod == want with short=0.0%; a broken stream shows the shortfall directly. scripts/soak.py reads both shapes and says explicitly when a log predates this change and therefore cannot answer goal 2.\n\nREMAINING, and the reason this stays open: the underlying rate mismatch. The source produces ~47,680 samples/s where the consumer asks for 48,000. Prime suspect is the same one as PIZERO-32: the consumer is paced by the real pixel clock while the producer is paced by emulated CoCo time, and the two do not agree. Next step is to read prod/s on hardware with the new build and see whether it is steady (a fixed clock ratio, fixable by deriving the sample rate from the pixel clock) or ragged (a scheduling problem).]\n\n[2026-09-17 ROOT CAUSE FOUND, and it is not in the audio path. Measured on hardware with the new telemetry (docs/measurements/logs/2026-09-17-1742-pizero_stream_60.log, 61 windows):\n  frame work    16,821 us median against a 16,667 us period = 100.9% of budget\n  producer      47,534 samples/s median against 48,000 = 99.03%, i.e. emulated time runs 0.97% slow\n  correlation   -0.64 between frame work and samples produced\nThose two deficits are the same deficit. Audio is paced by emulated cycles (audio_integrate runs off the memory-access path), so when a frame does not fit in 16.67 ms the machine runs slow and about 1% of samples are never made. The ring primes to ~3,900, drains to empty in ~25 s, and from then on the consumer holds the last sample 250-650 times a second.\n\nSO THE AUDIO ACCOUNTING IS NOW CORRECT AND THE AUDIO PATH IS NOT AT FAULT. Fixing this is either (a) get frame work under 16.67 ms, which is PIZERO-88's territory, or (b) decouple delivery from emulated time so a slow frame borrows from a buffer instead of starving the stream. Filed as PIZERO-119.\n\nThis ticket now needs only the tone counter confirmed on hardware: the first version counted absolute level and so read tone == prod exactly, because the DAC rests far from zero. It now counts sample-to-sample change instead. Built but NOT yet flashed.]\n\n[2026-09-17 VERIFIED ON HARDWARE after flashing (docs/measurements/logs/2026-09-17-1757-pizero_stream_60.log). The line now reads what it should on a silent machine: prod=47,534-47,723/s, want=48,000/s, short=0.4-0.9%, tone=0/s, and the analyser reports 'audible in 0/61 windows'. Silence and shortfall are now separately legible, which is what this ticket asked for. CAVEAT, stated rather than glossed: only the tone=0 case is proven. Nothing on the board was making a sound during the run (no keyboard attached to type a SOUND command), so the tone>0 path is still unverified. The obvious check is the PIZERO-18 ascending-tone program once a keyboard is attached, or any disk title with audio.]\n\n[2026-09-17 DONE. The [aud] line reports rates (fill, prod/s, want/s, under/s, short=%, tone/s) and a silent machine is now distinguishable from a short stream, which is what this asked for. The shortfall it exposed turned out to be PIZERO-119 (the frame not fitting) and is fixed: 0.9% -> 0.0%. The tone>0 path is still unproven, since nothing has made a sound during a measured run; that check rides along with the audible test in PIZERO-41 rather than holding this open.]", "created": "2026-09-17", "updated": "2026-09-17", "tags": ["audio", "hdmi", "measurement", "telemetry"]}, {"id": "PIZERO-119", "theme": "trust", "type": "bug", "status": "done", "priority": "high", "summary": "The machine runs about 1% slow, because a frame does not fit in 16.67 ms", "description": "Measured 2026-09-17 on the default pizero_stream_60 build, idle at an autorun disk with no keyboard attached (docs/measurements/logs/2026-09-17-1742-pizero_stream_60.log, archived in docs/measurements/2026-09.jsonl).\n\n  cpu 10,383 us + render 4,862 us + blit 1,580 us = 16,821 us of work per frame\n  frame period at 60 Hz                            = 16,667 us\n  emulated time therefore advances at 99.03% of real time\n\nEVIDENCE IT IS REAL, not an artefact of overlapping timers: the audio producer, which is paced by emulated cycles, delivers 47,534 samples/s where the stream asks for 48,000, and frame work correlates -0.64 with samples produced across 61 windows. Two independent measurements of the same 1%.\n\nWHAT IT COSTS: the HDMI audio ring drains to empty about 25 s after boot and stays there, so the stream carries a repeated sample 250-650 times a second for as long as the machine runs (PIZERO-118). A CoCo running 1% slow is also 1% flat in pitch and 1% slow in every timing loop a program depends on.\n\nTWO WAYS OUT, and they are not exclusive:\n(a) SPEND LESS PER FRAME. render at 4.86 ms is the obvious target: it regenerates the whole VDG buffer every frame regardless of what changed. blit is 1.58 ms. Either could plausibly find the 154 us needed, and more.\n(b) STOP COUPLING DELIVERY TO EMULATED TIME. Give the ring enough depth and a rate adaptation so a frame that runs long borrows from the buffer rather than starving the consumer. This hides jitter but cannot hide a sustained deficit, so it is a complement to (a), not a substitute.\n\nDO NOT close this by lowering the audio sample rate to match the deficit: that fixes the symptom the telemetry reports and leaves the machine running slow.\n\nCOMPLETION CONDITION: frame work median under 16,667 us with a keyboard attached, and prod/s within 0.1% of want/s across a soak run. Relates to PIZERO-88 (the budget), PIZERO-118 (how it was found), PIZERO-40 (pool depth).\n\n[2026-09-17 FIXED, measured on hardware. The hot path was NOT a graphics mode: it was SG4 semigraphics, which lives inside render_alpha_frame, so the mode bits read 'alpha' and the cost hid behind the text path. An SG4 screen did 8 put2 read-modify-writes per cell, 49,152 a frame. It now indexes a 32-entry table (colour x two block bits) for one packed 32-bit store per cell.\n  render      4,883 us -> 478 us\n  frame total 16,589 us (99.5% of the period) -> 12,902 us (77.4%)\n  audio       prod 47,5xx/s, short 0.9% -> prod 48,005/s, short 0.0%, ring stable at ~4,060\nVerified byte-identical to the put2 version across all 1,536 cases (128 SG4 characters x 12 sub-rows) with .ref/sg4check.cpp. Log: docs/measurements/logs/2026-09-17-1942-pizero_stream_60-sg4lut.log.\n\nREMAINING before this closes: (1) the same measurement with a keyboard attached, since USB cost is still not in any of these numbers; (2) a real graphics mode (RG6/PMODE) measured, as those paths were LUT'd in the same work but never exercised; (3) user confirmation on hardware.]\n\n[2026-09-17 WITH A KEYBOARD, cold-booted so it enumerates (usb=1): frame 12,504 us median = 75.0% of the period, p99 13,443 us, cpu 10,475 us, render ~470 us, blit ~1,550 us. USB and keyboard cost about 350 us. Audio steady: prod 48,010/s, short 0.0%, ring holding ~4,130. Log: docs/measurements/logs/2026-09-17-1944-pizero_stream_60-keyboard.log. Note the keyboard had to be present at boot: attaching it later leaves usb=0 and rpts=0, which is PIZERO-11b.]\n\n[2026-09-17 RG6 ARTIFACT PATH EXERCISED at last, via a BASIC loop parked in PMODE 4 (10 PMODE 4,1:SCREEN 1,1:PCLS / 20 GOTO 20). Telemetry reads mode=gm7c, so this is the artifact LUT, not the mono one. render 211 us, frame total ~12.9 us thousand (77% of the period), audio prod 48,009/s short 0.0%, ring stable at ~4,550, keyboard attached (usb=1, rpts=284). Log: docs/measurements/logs/2026-09-17-1948-pizero_stream_60-pmode4.log. All three render paths are now measured on hardware and none of them threatens the budget: SG4 478 us, RG6 artifact 211 us, alpha text ~430 us. Nothing remains on this ticket except the user's word to close it.]\n\n[2026-09-17 CLOSED by the user after hardware measurement. Delivered: the SG4 and RG6 render paths converted from per-pixel put2 read-modify-writes to packed 32-bit stores from small tables, verified byte-identical across 2,304 cases, and the graphics row packer no longer re-packs a row for each display line it repeats. Frame work went from 16,589 us (99.5% of the period) to 12,504 us (75.0%) with a keyboard attached, and the audio delivery shortfall from 0.9% to 0.0%. NOT done, deliberately: nothing was attempted on the cpu phase itself (10.5 ms, the XRoar core, which we trust as-is), and no dirty-region tracking was added because the budget no longer needs it.]", "created": "2026-09-17", "updated": "2026-09-17", "tags": ["performance", "budget", "audio", "timing"]}, {"id": "PIZERO-120", "theme": "trust", "type": "bug", "status": "in-progress", "priority": "high", "summary": "A vertical band of fuzz down the centre of the picture on one LCD monitor", "description": "User report 2026-09-17: a band of fuzz runs down the centre of the screen on one LCD HDMI monitor. The rest of the picture is correct. The same monitor is clean when driven by a MacBook Pro, so it is not a monitor defect.\n\nRULED OUT BY EXPERIMENT, not by reasoning:\n- Audio data islands. dvi_setup_active_audio_line() places every island inside the horizontal BACK PORCH, before the video preamble and guard band, so it never touches active pixels. Confirmed by flashing pizero_60hz (no audio, no data islands): band still present.\n- The narrowed 60 Hz blanking (8/96/56). pizero_60hz uses HDMI_60HZ_TEST, i.e. standard 16/96/48 blanking: band still present.\n- Buffer tearing. pizero_60hz is double-buffered, and the band appears on a STATIC green BASIC screen where the blit writes identical pixels every frame.\n- A seam in the encoder. _dvi_prepare_scanline_16bpp encodes each channel of a line in ONE call (dvi.cpp:129), so there is no mid-line chunk boundary to explain a centred band.\n\nREMAINING SUSPECTS: libdvi's TMDS encoding (its fast table does not track running disparity the way a full encoder does, and a flat colour field is the most repetitive symbol pattern a sink can be given), board-level signal integrity, or this scaler's response to a 320x240-doubled 640x480 source.\n\nNEXT TEST: the stock vendor demo (env waveshare_demo, Waveshare's own libdvi example). If the band appears there too, nothing in this port causes it and the question becomes libdvi or the board. If it does not, the difference is in our scanout path.\n\nWHY IT MATTERS: kits are meant to go to other people's screens (docs/kit.md), so a flat-field artefact on an ordinary LCD is a shipping blocker, not a curiosity. Related: PIZERO-99 (timing on other sinks).\n\n[2026-09-17 KEY OBSERVATION from the user: the band is visible only when the picture is in COLOUR. Black and white content does not show it.\n\nWHY THAT MATTERS: it moves the suspicion from timing to signal levels. Pure black and white are the cheapest patterns a TMDS link carries; mid-range colours produce many more transitions per line. Combined with the band being fixed in position and present on a STATIC screen, the shape of the fault is 'marginal signal, revealed where the panel is most sensitive' rather than anything frame- or content-timed.\n\nSUPPORTING GUESS, not yet tested: many LCD panels drive the screen as two halves with separate source drivers, and a seam at dead centre is where a marginal input shows first. That would explain why this monitor shows it and others do not, without the monitor being faulty (it is clean from a MacBook, which has a full TMDS encoder and a different cable).\n\nNEXT TESTS, cheapest first, none needing a reflash: (1) a different and ideally shorter HDMI cable; (2) a different input port on the same monitor; (3) the same board on other screens (PIZERO-99).\nTHEN, if those do not settle it: libdvi's encoder does not track TMDS running disparity the way a full encoder does, and its 16bpp path maps each RGB565 value through a fixed table (lib/libdvi/tmds_table_fullres.h). A colour-only artefact is consistent with particular table entries being poorly balanced. Testing that means changing a palette entry and seeing whether the band changes with it, which needs the board free.]\n\n[2026-09-17 CABLE RULED OUT by the user, who reads it as a data or monitor issue. Source read, and the mechanism is now understood well enough to stop guessing.\n\nWHAT OUR ENCODER DOES: the product path is tmds_encode_data_channel_16bpp (lib/libdvi/tmds_encode.cpp:67), the pixel-doubling scheme. Its table turns each 6-bit channel value into a PAIR of symbols whose net DC balance is zero (lib/libdvi/tmds_table.h header). Two things follow.\n(1) Running disparity cannot accumulate along a line, so a band partway across CANNOT be DC drift. That rules out the theory this ticket was heading toward.\n(2) The pair is a symbol and its near-complement, so a FLAT COLOUR FIELD alternates symbols every pixel for the whole line: the highest transition density the link can be asked to carry. Black and white map to benign low-transition symbols, which is exactly the reported pattern of when the band appears.\n\nCONCLUSION: our data is spec-legal but is the worst case for a receiver's equalisation, and this monitor appears to fail on it in one region (a panel's two driver halves meeting at centre is the usual reason a fault sits there). It is a real interaction, not a defect in the port, and a second screen showing no band would settle it.\n\nOPTION IF IT EVER MATTERS: libdvi's full-resolution encoder does true per-pixel running disparity and does not force alternation, but its own comment calls it 'barely possible, utterly impractical' on CPU cost, and we have ~4 ms of frame headroom, not 4 ms to burn on this. Do not attempt it for one monitor.\n\nPRIORITY DROPPED high -> medium: one monitor, understood mechanism, no evidence yet that any other sink is affected. Re-raise immediately if PIZERO-99 finds a second screen with it.]\n\n[2026-09-18 REPRODUCED ON A SECOND BOARD, same monitor, freshly flashed with the current product build. That rules out the one thing that would have made this a non-issue: a marginal individual unit, a bad joint, one chip's drive strength. It follows the DESIGN, so every unit we hand out will do this on a monitor like that one. PRIORITY BACK TO HIGH (it was dropped to medium on 2026-09-17 when it looked like one board plus one fussy screen).\n\nWHAT IS NOW ESTABLISHED, all by experiment: not the cable, not the audio islands, not the narrowed blanking, not tearing, not an encoder seam, not a single unit. What remains is our symbol stream meeting this panel: the pixel-doubling encoder emits each pixel as a symbol and its near-complement, so a flat COLOUR field alternates symbols every pixel, the densest transition pattern the link can carry, while black and white land on benign symbols. The band is where that panel is least tolerant.\n\nNEXT EXPERIMENT, now cheap because there are two boards and one is free: flash pizero_gime on the spare and POKE individual palette entries ($FFB0-$FFBF) to walk a colour through the RGB565 space while watching the band. If the fuzz tracks specific colour VALUES, it is the symbol pattern and we can pick friendlier palette entries as a mitigation; if it only tracks 'not black or white', it is broader and the honest answer is a compatibility note. Either way it is the first test that can distinguish them, and it needs no new code.\nSTILL WANTED: PIZERO-99, other screens, to bound how many sinks are affected.]", "created": "2026-09-17", "updated": "2026-09-18", "tags": ["hdmi", "video", "libdvi", "compat"]}, {"id": "PIZERO-121", "theme": "trust", "type": "bug", "status": "in-progress", "priority": "medium", "summary": "Audio now runs 0.02% FAST, so the ring overflows and drops ~9 samples a second", "description": "Found 4.9 hours into the PIZERO-98 soak, on the post-PIZERO-119 build. The old 0.9% SHORTFALL is gone; the error changed sign.\n\n  producer   48,010 samples/s median against 48,000 asked for = 100.021%\n  ring fill  pinned at ~7,850 of 8,192, i.e. nearly full rather than the intended half\n  skips      156,528 in 4.9 h, about 8.7 a second, steady\n  underruns  0 after the boot transient\n\nA 'skip' is the READER catching up after the producer laps it (coco_machine_audio_read, the avail > AUDIO_RING_SAMPLES branch): samples that were made and then thrown away. At 48 kHz, 8.7/s is 0.018% of the stream discarded in bursts rather than smoothly, so it is not silence but it is not clean either, and it is the most likely remaining contributor to anything audible in PIZERO-41.\n\nWHY IT CHANGED SIGN: emulated time is now paced correctly (the frame fits, PIZERO-119), so the producer runs at the CoCo's true rate. The consumer is paced by the real pixel clock. The two clocks are independent and 0.02% apart, so one of them must give: before the fix the emulator was slow and starved the stream, now it is fractionally fast and overruns it.\n\nTHE FIX IS RATE MATCHING, NOT A BIGGER RING: a fixed offset of 0.02% fills any buffer eventually. Options, cheapest first: (a) a slow servo that nudges the resampler's tick budget by a few parts per million to hold the ring near half full, which is what a real audio clock recovery does and needs no new plumbing; (b) drop or duplicate ONE sample when the ring drifts past a threshold, spread out rather than in bursts, which is cheap and inaudible at this rate; (c) derive the sample rate from the pixel clock so the two cannot disagree, which is the correct fix and the largest change.\n\nCOMPLETION CONDITION: ring fill holds near half over a multi-hour run, skips per hour in single digits or zero, underruns still zero. Related: PIZERO-41 (audible quality), PIZERO-32 (the sink's clock assumption), PIZERO-40 (pool depth).\n\n[2026-09-18 IMPLEMENTED as option (a), the servo, not yet on hardware (board mid-soak).\nlib/coco_machine/src/audio_servo.h holds the control law, header-only and machine-free so the LOOP can be simulated on the host rather than watched for hours. coco_machine calls it once per frame, only after the reader has primed, and the producer's accumulator now uses the servo's rate instead of the constant. The telemetry reports it as srv=, so a drifting clock is visible as a rate rather than inferred from skips after the fact.\nWHY PROPORTIONAL-ONLY IS ENOUGH: ring fill is the INTEGRAL of the rate error, so proportional control on fill is integral control on rate. That gives zero steady-state rate error with no integral term and nothing to wind up. The ring settles at a constant OFFSET from centre, and that offset is the correction: K x the mismatch, 32 x ~10 = ~320 samples, 4% of the ring.\nTUNING: K=32 (about 32 s to settle) and a clamp of +/-64 samples/s, which is 0.13% or 0.023 of a semitone, inaudible. The clamp exists so a bug elsewhere cannot detune the machine; a test asserts it stays under 0.2%.\nTESTED BY SIMULATING THE LOOP over six hours of model time at the measured +0.021%: never within 256 samples of either wall, settles above centre (the sign matters: holding the producer slower REQUIRES a ring above centre), mirror-image behaviour for the opposite sign, recovers from both a full ring (the state the soak is in now, ~7,850) and an empty one, and does not hunt. Also pinned: a 0.9% mismatch, the old PIZERO-119 defect, saturates the clamp and drains the ring rather than pretending to cope, because that is a different bug and should look like one. 84 tests now pass.\nTwo of the simulation tests failed first time and both were MY sign errors in the expectations, not the servo's.\nVERIFY ON HARDWARE: after the soak, watch fill hold near 4,400 and skips stop climbing. The next soak is the real test.]\n\n[2026-09-28 FIRST HARDWARE EVIDENCE for the servo, from a 31 s Space Assault capture after a cartridge cold boot: ring fill rose steadily 3,063 -> 3,916 while the servo rate eased 48,031 -> 48,005 samples/s toward its set-point, prod tracking it (48,036 -> 48,011), under=0/s and skips=0 throughout. That is the behaviour the host simulation predicted (settle above centre, no hunting). Still wanted: a multi-hour run showing fill holding near the set-point and skips staying flat.]", "created": "2026-09-18", "updated": "2026-09-28", "tags": ["audio", "hdmi", "timing", "measurement"]}, {"id": "PIZERO-122", "theme": "kit", "type": "task", "status": "done", "priority": "medium", "summary": "Lower the lid 2 mm: the header measures 8.34 mm, not the 11.5 mm a 2.54 header is quoted at", "description": "head_room was 12.0, chosen from the generic figure that a 2.54 mm male header stands about 11.5 mm proud of the board. The header on this board measures 8.34 mm proud, so 10.0 clears it by 1.66 mm.\n\nDONE: head_room 12.0 to 10.0 in pizero_case.scad. The lid is 11.80 mm tall instead of 13.80 and the closed case 18.6 mm instead of 20.6. Re-rendered top.stl, plate.stl, top_header.stl and coupon.stl, each measured from the mesh to confirm.\n\nNOTHING ELSE MOVES: the base is untouched at 69.80 x 34.80 x 6.80, so the screws are still M2.5 x 12 mm with 5.2 mm of thread engagement, and the boss at 10 mm against a 7 mm pilot still leaves 1.8 mm before bottoming out. The PIZERO-103 microSD opening, which was the real obstruction the first lid fouled on, is unchanged.\n\nVERSIONS (PIZERO-105): TOP v9 to v10 and TOP-HDR v1 to v2, since their geometry changed. BASE stays v9, and base.stl was deliberately left as committed: re-rendering it reordered all 24,566 facets with byte-identical geometry (same 10,844 triangles, same bounding box, equal to four decimals when sorted), which would have been a 49,000-line diff for no change.\n\nDOCS: the comment on head_room and the case README now record the 8.34 mm measurement, because the old '~11.5 mm' note is exactly what would send the next person back to 12.0. Not yet printed.", "created": "2026-09-18", "updated": "2026-09-18", "tags": ["case", "mechanical", "stl"]}, {"id": "PIZERO-123", "theme": "kit", "type": "task", "status": "done", "priority": "medium", "summary": "One shared top edge for all plug pockets and the microSD relief; base unchanged", "description": "The microSD finger relief (PIZERO-103 rev 2) was 18 x 5.0 mm, centred on the card, so its top edge sat well below the front plug pockets. The front pockets did not agree with each other either: HDMI finished 5.30 mm above the split, the two USB-C pockets 5.45. Every opening should share one top edge.\n\nDONE IN THE MODEL: pocket_top_z is the highest top any pocket needs (5.45, the USB-C pockets). All three plug pockets and the microSD relief now end there. The HDMI pocket's top rises 0.15 mm, which only adds plug clearance; the relief's top rises from 3.15 to 5.45, making it 18 x 7.3 mm. Only tops move, never bottoms, so the BASE IS UNCHANGED (still v9; a fresh render matches the committed base geometry exactly). Measured on the new lid mesh: all four tops at 5.45.\n\nHISTORY: 0f8f50c made the relief 7.6 mm centred on the card, which moved the base and did not line the tops up; not what was asked. c7684c6 lined the relief up with HDMI only; the ask was all of them. This commit is the one that matches the request.\n\nVERSIONS: TOP v11, TOP-HDR v3, BASE v9.\n\nVERIFY ON HARDWARE: print the lid, check all tops line up and that a latched card is easier to grip.\n\n[2026-09-25 DONE: confirmed on the TOP v12 print, which carries this change: \"i printed the new top and it worked perfectly.\"]", "created": "2026-09-25", "updated": "2026-09-25", "tags": ["case", "mechanical", "stl"]}, {"id": "PIZERO-124", "theme": "kit", "type": "bug", "status": "done", "priority": "high", "summary": "Lid screw bosses snap off at the tip: web them into the corners, open the pilot to 2.2 mm", "description": "User report 2026-09-25 with a photo of a TOP v11 lid: two of the four screw bosses snapped off near the tip, each as a clean ring along a layer line.\n\nWHY: each boss was a free-standing 6 mm column, 10 mm long, with a 2.1 mm pilot leaving ~1.95 mm of wall, and only 0.9 mm clear of both corner walls, so the walls gave it no support. The lid prints roof-down, so every layer line runs across the boss, and any side load (prying the lid, the board shifting as screws go in) peels layers apart. The tight self-tapping pilot also wedges the wall outward.\n\nFIX (options 1 and 3 of those proposed): (1) boss_web fills the corner between each boss and its two walls, from boss_web_gap (1.0 mm) above the PCB up to the roof, so the boss is part of the corner rather than a column in it. (3) pilot_d 2.1 to 2.2. Lid only; the base is unchanged (v9).\n\nNOT DONE, possible follow-ups if this is not enough: a flared root where the boss meets the roof, and 4+ walls in the slicer.\n\nVERSIONS: TOP v12, TOP-HDR v4, BASE v9.\n\nVERIFY ON HARDWARE: print the lid, drive all four screws, remove and refit the lid a few times; no boss should crack.\n\n[2026-09-25 DONE: TOP v12 printed and confirmed by the user: \"i printed the new top and it worked perfectly.\" The boss webs and 2.2 mm pilot hold; the flared root and slicer-wall follow-ups are not needed.]", "created": "2026-09-25", "updated": "2026-09-25", "tags": ["case", "mechanical", "stl"]}, {"id": "PIZERO-125", "theme": "kit", "type": "task", "status": "in-progress", "priority": "medium", "summary": "Case retrospective: a record of the 3D design to date and its failures", "description": "Requested 2026-09-25 after the PIZERO-124 boss failure. hardware/case/RETROSPECTIVE.md covers PIZERO-94 through PIZERO-124: timeline, what worked, six failures with lessons (misdiagnosed first-lid obstruction, trusting drawings and generic figures, features designed without print orientation, the snapped bosses with the user's photo, PIZERO-123 taking three commits, known base defects waiting for a reprint), the open case issues, and the working rules that came out of it. Photo committed as hardware/case/photos/lid-v11-bosses-snapped.jpg and indexed in the case README.\n\nDONE WHEN: the user has read it and is happy with it as the record.", "created": "2026-09-25", "updated": "2026-09-25", "tags": ["case", "docs"]}, {"id": "PIZERO-126", "theme": "kit", "type": "feature", "status": "done", "priority": "medium", "summary": "Hidden guide funnels under the RUN and BOOT slots, so a thin tool finds the button by feel", "description": "User request 2026-09-25: guides under the top vents that lead a pin or thin screwdriver onto RUN and BOOT, easy to find and use but not obvious from outside. PIZERO-104 confirmed the buttons can be pressed through the 1 mm slots with a very thin screwdriver; this makes it easy rather than just possible.\n\nDESIGN: under each of the two roof slots over a button (rows 2 and 5), a funnel hangs from the roof underside: an 8 mm mouth along the slot (btn_guide_len), 2 mm wide, narrowing to a 2 mm hole (btn_guide_hole) just above the button, 1 mm walls. Slide the tool along the slot until it drops in, push, and the funnel steers it onto the plunger. The roof and grille are unchanged, so nothing shows from outside.\n\nMEASURED: the user measured the button top 7.0 mm below the outside of the roof (btn_top_meas [M]), so 4.8 mm above the PCB top. The funnel stops 0.5 mm (btn_guide_clr) above that: 4.7 mm tall, clear of the button with the lid on. Outer width 4 mm leaves 0.83 mm to the neighbouring slots, so they stay open.\n\nVERIFIED ON THE MESH: base re-renders identical to BASE v10; lid bbox unchanged, +144.6 mm3; a vertical ray through each slot onto its button is clear, and a ray 3.2 mm along the slot meets the funnel wall 1.25 mm below the roof. Walls lean about 32 degrees from vertical, printable roof-down without supports.\n\nVERSIONS: TOP v13, TOP-HDR v5, BASE v10 unchanged.\n\nDONE WHEN: printed, and the user finds and presses both buttons easily through the assembled case, and the funnels do not press either button with the lid closed.\n\n[2026-09-25 DONE: TOP v13 printed and confirmed by the user: RUN and BOOT are accessible through the guides with a thin wire (a Christmas ornament hook), and the engraved version is correct. Not separately confirmed that neither funnel holds a button with the lid closed; a held RUN would keep the board in reset, which would show at once. docs/kit.md now names the thin wire as the tool.]", "created": "2026-09-25", "updated": "2026-09-25", "tags": ["case", "mechanical", "stl"]}, {"id": "PIZERO-127", "theme": "kit", "type": "bug", "status": "done", "priority": "medium", "summary": "Countersunk screw heads stand proud enough on BASE v10 to scrape a desk", "description": "User report 2026-09-25 on the BASE v10 print: the 90 degree countersinks (PIZERO-96) screw together much more nicely, but in the last few turns the heads are not inset far enough and scrape the desk surface. Every earlier base recessed them, but was very tight.\n\nWHY: v10 seats a 4.7 mm DIN 965 head nominally only 0.15 mm below the underside, and first-layer squish narrows the countersink mouth on the bed face, so in practice the head ends at or just above the surface. The old 72.5 degree cone was 1.5 mm deep and tight, most likely letting the head bite its way in.\n\nFIX: screw_head_recess = 0.5, a straight recess at the face as wide as the cone mouth (5.0 mm), with the same 90 degree cone moved 0.5 mm deeper. The seat angle that made v10 nicer is unchanged. Measured on the rendered mesh: recess to 0.51 mm, cone to 1.60 mm, a 4.7 mm head now sits 0.66 mm in (was 0.15). Base bbox unchanged. The screw reaches 0.5 mm further into the lid: 5.9 mm engaged, 1.1 mm to spare against the 7 mm pilot.\n\nVERSIONS: BASE v11. Lid untouched.\n\nDONE WHEN: a BASE v11 is printed and the heads sit below the surface without scraping, with the seat still as smooth as v10.\n\n[2026-09-25 DONE: BASE v11 printed and confirmed by the user: the screw heads are recessed, and the engraved version is correct.]", "created": "2026-09-25", "updated": "2026-09-25", "tags": ["case", "mechanical", "stl"]}, {"id": "PIZERO-128", "theme": "kit", "type": "feature", "status": "deferred", "priority": "medium", "summary": "BOOT button opens the disk selection overlay, like F12", "description": "USER DECISION 2026-09-25: once the firmware is running, pressing BOOT opens the disk selection overlay, the same as F12 (PIZERO-81c). The case has no other buttons, so this gives a machine without a keyboard attached a way in. Split out of PIZERO-116.\n\nHOW THE BUTTON WORKS (docs/RP2350-PiZero-schematic.pdf): BOOT is Key1, pulling QSPI_SS_N (the flash chip select, net USB_BOOT, via 1K) low. Held at reset it enters the USB bootloader; that recovery path is in the boot ROM and nothing here can break it. At runtime it can be read with the standard BOOTSEL trick: float the QSPI_SS pin, sample it, restore it. While floated, NOTHING may fetch from flash (XIP) on either core.\n\nTHE RISK, and why this starts with a spike: arduino-pico's BOOTSEL macro makes that safe by idling the other core, but core 1 here drives libdvi scanout and HDMI audio islands. Idling it would glitch the picture and could drop audio sync. The libdvi IRQ and data-island encode are RAM-resident (.time_critical, PIZERO-37), but whether core 1's WHOLE path avoids flash for a few microseconds is not established. Candidate approach: sample from RAM-resident code on core 0 with its interrupts off, at a low rate (every ~50 ms is plenty for a button), and prove core 1 never touches flash in that window, or do the sample from core 1 itself between scanlines.\n\nSTEP 1, SPIKE: sample BOOT at a low rate in the product build (pizero_stream_60) and report presses on serial. Run it long enough to show no video dropouts, no audio underruns and no sync loss (the PIZERO-98 soak telemetry measures exactly these). If it cannot be made safe, record why here and close this; F12 stays the only way in.\n\nSTEP 2: once PIZERO-81c exists, a debounced BOOT press does whatever F12 does. Pressing it while the overlay is open is a candidate for closing it (like ESC); decide when implementing.\n\nDEPENDS ON: PIZERO-81c for step 2. Step 1 can run any time.\n\nDONE WHEN: on hardware, BOOT opens the overlay with no visible or audible glitch, and BOOT+RUN still enters the bootloader for flashing.\n\n[2026-09-27 DEFERRED by the user: with only one usable button there is not enough to do after it; F12 covers the overlay. Kept on file if a keyboard-less path is ever needed.]", "created": "2026-09-25", "updated": "2026-09-27", "tags": ["overlay", "input", "hardware"]}, {"id": "PIZERO-129", "theme": "platform", "type": "task", "status": "open", "priority": "high", "summary": "Prove an optimised 6809 core behaves identically to the pristine one", "description": "Stage 1 of the CoCo 3 plan, and a precondition for PIZERO-131. Nothing anywhere (this repo or upstream ~/github/xroar) tests 6809 correctness, and PIZERO-131 is about to optimise a core we have treated as trusted and untouched. Build the safety net first.\n\nDO: freeze today's vendored core (lib/xroar_core/src/mc6809/mc6809.c, mc6809_common.c, lib/xroar_core/src/mc680x/mc680x_ops.c and headers) under test/ as the reference. New native suite test/test_mc6809_lockstep/ runs reference and working cores side by side against the same flat 64 KB memory model, recording every bus access (address, read/write, data, NVMA flag) and the registers at every instruction boundary; the first divergence fails with the instruction and cycle. Inputs: (a) seeded random instruction streams covering opcode pages 1 to 3, every indexed and indirect mode, and IRQ/FIRQ/NMI/SYNC/CWAI; (b) optionally a real ROM boot for N million cycles when COCO_ROM_DIR is set, skipped otherwise (the repo ships no ROMs). Follow the [env:native] conventions (platformio.ini: headers by relative path, no Arduino).\n\nDONE WHEN: the suite runs in pio test -e native, passes against an unmodified core, and demonstrably catches a deliberately injected one-cycle or one-flag change.\n\nPlan and reasoning: docs/coco3-plan.md; feasibility numbers: docs/coco3-feasibility.md (PIZERO-111).", "created": "2026-09-26", "updated": "2026-09-26", "tags": ["cpu", "coco3", "test"]}, {"id": "PIZERO-130", "theme": "platform", "type": "task", "status": "open", "priority": "high", "summary": "Measure the CoCo 2 machine running at 1.79 MHz", "description": "Stage 2 of the CoCo 3 plan. A CoCo 3 runs its 6809 at 1.79 MHz, twice the CoCo 2. Running our CoCo 2 machine at twice its cycles per frame reproduces exactly that CPU load, before any GIME cost, so the speed work in PIZERO-131 has a real target and baseline.\n\nDO: new env pizero_cpu179 in platformio.ini extending pizero_stream_60, with a build flag that doubles CYCLES_PER_FRAME (src/main.cpp, 14915 to 29830 at 60 Hz). A real env, never PLATFORMIO_BUILD_FLAGS (docs/BUILD.md: it links stale objects). Record cpu= at 1x and 2x with scripts/soak.py record then analyse --kind bench into docs/measurements/. Teach soak.py analyse to print the frame-budget percentage (sum of phases / 16,667 us), which the issues currently work out by hand. Note in docs/BUILD.md.\n\nEXPECTED from docs/coco3-feasibility.md: about 20.8 ms of emulation per frame at 2x, 125% of a frame; today's measured cost is about 180 host clocks per emulated bus cycle.\n\nDONE WHEN: both baselines are archived with the git hash and the frame-budget % prints.\n\nPlan and reasoning: docs/coco3-plan.md; feasibility numbers: docs/coco3-feasibility.md (PIZERO-111).", "created": "2026-09-26", "updated": "2026-09-26", "tags": ["cpu", "coco3", "measurement"]}, {"id": "PIZERO-131", "theme": "platform", "type": "feature", "status": "open", "priority": "high", "summary": "6809 emulation about 1.7x faster, so a 1.79 MHz machine fits in a frame", "description": "Stage 3 of the CoCo 3 plan: the experiment the whole CoCo 3 effort hangs on. Target about 105 host clocks per emulated bus cycle (from about 180), so 29,830 cycles a frame fit in about 12.5 ms. Also gives the CoCo 2 product build more headroom.\n\nHOT SPOTS FOUND (2026-09-26 research): every bus cycle including dummy NVMA cycles (NVMA_CYCLE = peek_byte(cpu, 0xffff), mc6809_common.c:96, up to 5 per indexed EA) is an out-of-line call into coco_mem_cycle (coco_machine.cpp:427-599), in another translation unit so never inlined; per access it repeats a two-stage decode, total_mem_cycles++, an event-head check, audio_integrate(16), an IRQ dirty check and cycles_remaining -= 16, and the CPU stores 3 interrupt latches (mc6809_common.c:60-93); op_sub, op_sub16, op_add16 and word_immediate from mc680x_ops.c landed in FLASH behind veneers from the RAM-resident mc6809_run.\n\nORDER, cheapest and safest first, stop when the pizero_cpu179 build fits: (1) ALU helpers to RAM (HOT_FUNC in lib/xroar_core/src/hot.h, or inline); (2) NVMA cycles advance time without decode or ROM read; (3) inline page-table fast path for RAM/ROM, only I/O and SAM writes via coco_mem_cycle; (4) batched bookkeeping: cached next-event tick, audio integrated in spans (host test for identical samples), one cycle check per instruction; (5) only if still short: table or computed-goto dispatch, or one translation unit.\n\nEVERY STEP: PIZERO-129 lockstep passes, all native tests pass, pizero_cpu179 measured and logged, product build soak unchanged.\n\nGATE: full speed, go to PIZERO-133; about 80% or better, go with the PIZERO-135 audio policy; well short, stop and record why in docs/coco3-feasibility.md.\n\nDEPENDS ON: PIZERO-129, PIZERO-130.\n\nPlan and reasoning: docs/coco3-plan.md; feasibility numbers: docs/coco3-feasibility.md (PIZERO-111).", "created": "2026-09-26", "updated": "2026-09-26", "tags": ["cpu", "coco3", "performance"]}, {"id": "PIZERO-132", "theme": "platform", "type": "bug", "status": "open", "priority": "medium", "summary": "SAM double speed (POKE 65495) is never applied: every access costs 16 ticks", "description": "Found 2026-09-26 while researching PIZERO-131. coco_machine_run_cycles budgets cycles*16 ticks and the fast path in coco_mem_cycle hardcodes ncycles = 16 (lib/coco_machine/src/coco_machine.cpp:455, 481), so a guest that sets the SAM rate bits for double or address-dependent speed runs at normal speed. docs/cpu-speed.md says fast cycles cost 8 ticks; that is wrong for this code and its line references are stale.\n\nCAUTION: fixing it lets a guest demand up to twice the CPU work per frame and overrun (docs/cpu-speed.md estimates about 18.8 ms), which is what PIZERO-48's cap exists for. Fix together with that decision, not alone, and correct docs/cpu-speed.md at the same time.\n\nDONE WHEN: POKE 65495,0 measurably speeds up a BASIC loop on hardware (or is deliberately capped per PIZERO-48 and documented), and cpu-speed.md matches the code.", "created": "2026-09-26", "updated": "2026-09-26", "tags": ["cpu", "sam", "bug"]}, {"id": "PIZERO-133", "theme": "platform", "type": "feature", "status": "open", "priority": "medium", "summary": "Boot a 128 KB CoCo 3 to the BASIC prompt", "description": "Stage 4 of the CoCo 3 plan. ONLY after the PIZERO-131 gate, and with PIZERO-135 decided.\n\nDO: vendor tcc1014.[ch] (the GIME, 1612 lines at the pin) and font-gime.[ch] from upstream ~/github/xroar at the pinned a2d31903 into lib/xroar_core; update PROVENANCE.md and the library.json srcFilter; add a vo.h stub (its other deps: part, events, serialise, delegate are already vendored). Do NOT vendor coco3.c (1532 lines of desktop glue); write a CoCo 3 mode in lib/coco_machine instead: flat static 128 KB RAM, the GIME as the bus (tcc1014_mem_cycle, with the PIZERO-131 fast path), the existing PIAs, keyboard, DAC and FDC/disk path. 1.79 MHz is 8 instead of 16 ticks per access (tcc1014.c:832). A render_line sink takes every other of the GIME's 6-bit colour samples through a 64-entry RGB565 table from coco_pal_gime_to_rgb565() (coco_palette.h, matches upstream intensities) into the 320x240 framebuffer. In this mode the GIME owns palette, timer and interrupts; lib/coco_machine/src/gime_timer.h (which differs from upstream: zero reload, restart triggers, INIT0 gating, 910 vs 912 ticks per line) stays only for the CoCo 2 hybrid. coco3.rom (32 KB) loads from the card, with a boot page when missing (src/boot_messages.h style).\n\nFIRST MILESTONE: 32 and 40 column text, 320 and 256 wide graphics. 640-wide modes are PIZERO-134. RAM: about 23 KB spare with the framebuffer kept.\n\nDONE WHEN: on hardware coco3.rom boots to the CoCo 3 BASIC prompt, WIDTH 40 works, a palette POKE recolours, a GIME timer program runs, HSCREEN 320-wide modes draw; speed reported from [run].\n\nDEPENDS ON: PIZERO-131 (gate), PIZERO-135.\n\nPlan and reasoning: docs/coco3-plan.md; feasibility numbers: docs/coco3-feasibility.md (PIZERO-111).\n\n[2026-09-28 note from PIZERO-164] Two-button joysticks: the CoCo 3 reads the second fire button of each stick on PIA0 PA2 (right) and PA3 (left) (upstream coco3.c:1361, joystick_read_buttons() & 15). In CoCo 3 mode, add a 'fire2' pad action that drives those bits; it must not exist in CoCo 2 mode, where PA2/PA3 are keyboard rows.", "created": "2026-09-26", "updated": "2026-09-28", "tags": ["coco3", "gime", "video"]}, {"id": "PIZERO-134", "theme": "platform", "type": "feature", "status": "open", "priority": "low", "summary": "640-wide GIME modes and 80-column text", "description": "Follow-on to PIZERO-133. The 640-wide GIME modes (including WIDTH 80 text) cannot use our 320x240 framebuffer: halving them makes 80-column text unreadable, and a 640x240 RGB565 buffer (307,200 bytes) does not fit. The route is per-scanline generation into libdvi's scanline queue (dvi_scanbuf_main_16bpp): two 1,280-byte line buffers instead of the framebuffer, which also frees 153,600 bytes. A real change to the scanout architecture, affecting the CoCo 2 path, the boot pages and the overlay too.\n\nDONE WHEN: WIDTH 80 is readable on hardware and the CoCo 2 path still runs unchanged.\n\nDEPENDS ON: PIZERO-133.\n\nPlan and reasoning: docs/coco3-plan.md; feasibility numbers: docs/coco3-feasibility.md (PIZERO-111).", "created": "2026-09-26", "updated": "2026-09-26", "tags": ["coco3", "gime", "video", "libdvi"]}, {"id": "PIZERO-135", "theme": "platform", "type": "decision", "status": "open", "priority": "medium", "summary": "CoCo 3: how the mode is chosen, and what audio does below real time", "description": "Two decisions to settle with the user before PIZERO-133 is built.\n\n1. MODE SELECTION: automatically when coco3.rom is on the card, by an autorun.txt directive, or a separate firmware build? Consider that a card may hold both CoCo 2 and CoCo 3 ROMs, and the F12 overlay (PIZERO-81) is a natural place for a choice later.\n\n2. BELOW REAL TIME: if PIZERO-131 lands at about 80%, emulated time runs slow, so the DAC makes fewer samples than HDMI plays. The audio servo (lib/coco_machine/src/audio_servo.h) corrects only +/-0.13% by design, nowhere near 20%. Options: resample to fit (music plays about 20% low and slow, but continuous) or keep pitch and accept gaps.\n\nCOMPLETION: both answers recorded here with the reasoning, and reflected in docs/coco3-plan.md.\n\nPlan and reasoning: docs/coco3-plan.md; feasibility numbers: docs/coco3-feasibility.md (PIZERO-111).", "created": "2026-09-26", "updated": "2026-09-26", "tags": ["coco3", "decision", "audio"]}, {"id": "PIZERO-136", "theme": "kit", "type": "feature", "status": "done", "priority": "medium", "summary": "BIN and CART files in the F12 overlay list", "description": "Remainder of PIZERO-81a, which shipped the overlay catalogue with .dsk images only. PIZERO-81 always meant all three entry types the port can boot (autorun.txt @DISK, @DIRECT .bin, @CART .rom/.ccc). A BIN or CART entry cannot go in a drive, so it only makes sense together with a way to START an entry (PIZERO-81d) and the ENTER decision (PIZERO-115).\n\nDO: extend src/dsk_catalog.h (rules and host tests in test/test_dsk_catalog) with an entry type, scanning /coco/bin and /coco/roms as coco_boot_resolve does; show the type in the list; drive keys 0-3 apply to DSK only.\n\nDEPENDS ON: PIZ
