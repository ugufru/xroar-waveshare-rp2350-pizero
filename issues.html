md/docs/ and CLAUDE.md and must NOT be duplicated into CONTRIBUTING.md -- the two are complementary, CONTRIBUTING.md states the process and points at the docs for the facts. The stamped copy is this project's to edit and overrides the upstream baseline; project-specific rules go here, never back upstream. Leave this issue open until the user reviews and rubber-stamps the wording. [2026-08-05 DONE -- user reviewed and rubber-stamped the wording. Shipped in f435927: CONTRIBUTING.md added; no-branches rule made an explicit checkable invariant (git branch must print only main) in both CONTRIBUTING.md and CLAUDE.md, with worktrees/branch-per-agent/safety-branch loopholes closed and archive/<topic> tags as the route for dead history. Enforced on the repo: stray pizero30-live-audio-wip branch tagged archive/pizero30-option-a and deleted; repo now single-branch.]", "type": "chore", "status": "done", "priority": "low", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["docs", "process", "contributing", "policy"], "theme": "platform"}, {"id": "PIZERO-64", "summary": "SD write foundation: writable file layer, flush/sync policy + write-latency measurement", "description": "FOUNDATION for all SD write work (blocks PIZERO-65/66/67/69). VERIFIED CURRENT STATE: the port is entirely read-only in OUR code -- every f_open is FA_READ (coco_boot.cpp:100 ROM, :276 autorun.txt, :324 DSK attach, :379 LOADM .bin) and there are ZERO occurrences of f_write/f_sync/f_unlink/f_mkdir in src/ or lib/. Nothing below us blocks writing: the carlk3 no-OS-FatFS stack is configured write-capable (FF_FS_READONLY=0, FF_USE_MKFS=1, FF_FS_EXFAT=1, FF_USE_LFN=3) with disk_write()/sd_write_blocks() implemented in sd_card_spi.c and get_fattime() supplied by the lib's my_rtc.c. So this is purely additive firmware work. IMPLEMENT: (1) a small writable-file helper layer next to the existing coco_boot read helpers -- open-for-write/create, write, sync, close, atomic-replace (write to .TMP then f_rename over the target) so an interrupted write never truncates a good file; (2) an explicit FLUSH/SYNC POLICY -- decide and document when f_sync is called (per sector? per DECB command completion? on an idle timer? on BIOS exit?), since FatFs buffers FAT+dir updates and a power cut between the data write and the FAT update corrupts the image; (3) MEASURE REAL WRITE LATENCY -- instrument single-sector (256B), full-block (512B) and multi-block writes, plus the f_sync cost, and record worst-case against the 16.67 ms frame budget. This measurement is the whole input to PIZERO-65: per PIZERO-48 core 0 has only ~31% slack at 1x, and SD block-erase stalls are known to run tens-to-hundreds of ms, so a synchronous write on the emulation thread is expected to break audio/video. ALSO NOTE: hw_config.c wires no card-detect/write-protect pin (grep: no cd_gpio/use_card_detect), so a card pulled mid-write is currently unguarded -- decide whether to wire CD (GPIO22 per the vendor demo) or accept the risk and document it. get_fattime() with no RTC will stamp a fixed epoch, so written files get bogus dates -- acceptable, but note it in docs. ACCEPTANCE: a firmware-written test file appears on the card with correct contents after a clean power cycle, and the measured worst-case write+sync latency is written into this ticket and docs/ (it decides PIZERO-65's design).", "type": "feature", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["sd", "fatfs", "write", "foundation", "latency", "blocker"], "theme": "storage"}, {"id": "PIZERO-65", "summary": "Deferred sector write-back: keep SD writes off the emulation hot path", "description": "The hard part of the SD-write workstream, deliberately kept SEPARATE from PIZERO-66 so the timing risk can't be buried inside the feature ticket (user decision 2026-08-05). PROBLEM: a synchronous f_write inside the FDC Write Sector handler will blow the frame budget. Per PIZERO-48 the pacing model leaves core 0 only ~31% slack at 1x (~9.4 ms used of the 16.67 ms/frame), while an SD write can stall tens-to-hundreds of ms on block erase -- one guest SAVE would starve the core-1 audio ring (underrun/warble, the class of bug PIZERO-35/38/39 just fixed) and drop video frames. So the emulated FDC must ACK a write quickly and the physical write must happen elsewhere. IMPLEMENT: a write-back queue between the FDC and the SD -- guest Write Sector copies the 256 B into a queued dirty-sector entry, sets FDC status complete, and returns immediately; a drainer performs the real f_write/f_sync outside the emulation hot path. DESIGN DECISIONS to settle with measurements from PIZERO-64: (a) WHERE the drainer runs -- core 0 in the idle slack after the frame's emulation completes (simplest, bounded by measured slack) vs core 1 (already owns libdvi scanout + the audio ring; adding SD SPI there risks the video path) vs draining only during guest idle. Default recommendation: core 0, post-frame, with a per-frame byte budget so one drain never exceeds the remaining slack. (b) QUEUE DEPTH and what happens when it's full -- DECB writes a whole granule in a burst, so size for that; on overflow either stall the guest (honest, brief) or return an FDC error. (c) COALESCING adjacent dirty sectors into one multi-block write. (d) SD SPI BUS OWNERSHIP -- the existing read path (coco_boot_disk_read_sector, called synchronously from the FDC) shares the bus with the drainer, so a read must not interleave mid-write; also a read of a still-queued dirty sector must see the QUEUED data, not the stale on-card bytes. (e) DURABILITY WINDOW -- a queued-but-unwritten sector is lost on power cut; bound it (flush within N frames) and force a full flush on BIOS entry/exit and before any reset. ACCEPTANCE on HW: a guest SAVE of a sizeable program completes with NO audible audio glitch and NO dropped frames (watch the [run] telemetry: core-0 frame time stays < 16.76 ms throughout), the data is correct after power-cycle, and the queue never overflows silently -- overflow is logged. Depends on PIZERO-64 (its latency numbers are this ticket's design input). Blocks PIZERO-66.", "type": "feature", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["sd", "write", "timing", "performance", "audio", "core-affinity", "risk"], "theme": "storage"}, {"id": "PIZERO-66", "summary": "FDC Write Sector -> guest SAVE/SAVEM to .DSK on SD", "description": "The headline feature: let a program running on the emulated CoCo write to its disk image. KEY INSIGHT (verified): SAVE and SAVEM are NOT XRoar-side commands -- they are Disk BASIC (DECB) commands implemented in 6809 code in the disk11.rom cart running INSIDE the guest. DECB does its own directory and granule/FAT allocation in software; all it needs from the hardware is a working Write Sector. So this one change unlocks SAVE, SAVEM, KILL, COPY, RENAME and BACKUP largely for free. CURRENT STUB: lib/coco_machine/src/coco_machine.cpp:252-257 handles WD279x Type II Write Sector (command top nibble 0xA/0xB) by setting fdc_status = 0x40 -- bit 6 = WRITE PROTECT -- and completing cleanly. That is an honest 'this disk is write-protected' answer, not a crash, and it is exactly the hook point. Correspondingly coco_machine_install_disk_reader() (coco_machine.cpp:307) installs only a READER (coco_disk_read_sector_fn), and coco_boot_disk_read_sector (coco_boot.cpp:336) has no write counterpart. IMPLEMENT: (1) mirror the reader API -- coco_disk_write_sector_fn + coco_machine_install_disk_writer(), and coco_boot_disk_write_sector(drive,track,sector,const uint8_t[256]) in coco_boot.cpp; (2) replace the 0x40 stub with a real Type II write: assert DRQ, accept 256 bytes written to $FF4B into fdc_buf (the inverse of the existing fdc_io_read drain at :270-282), then hand the full sector to the writer callback and fire INTRQ/NMI the same way the read path does at completion; (3) reopen the attached image writable -- coco_boot_attach_dsk currently opens FA_READ only (coco_boot.cpp:324) and holds it in g_dsk_file, so it needs FA_READ|FA_WRITE with a graceful fallback to read-only (i.e. keep returning 0x40, a genuine write-protect answer) when the file can't be opened writable or the card is absent; (4) route the actual write through the PIZERO-65 write-back queue, NOT a direct synchronous f_write; (5) honour the existing geometry guards (track<=34, sector 1-18, drive 0 only -- see :341-348) and return proper FDC error status rather than silently dropping out-of-range writes. ACCEPTANCE on HW: in Disk BASIC, SAVE of a BASIC program then NEW then LOAD round-trips it; SAVEM of a machine-language block round-trips via LOADM; DIR shows the new file with a plausible size; the change survives a power cycle and the .DSK is still mountable in desktop xroar with the saved file intact. Depends on PIZERO-64 and PIZERO-65. [RE-SCOPED 2026-08-05: floppy support is now PERIPHERAL support, not the route to writable storage -- see PIZERO-79 and the PIZERO-70..74 filesystem layer, which is the supported way to create and edit files. This ticket survives as legacy polish for running/writing old .DSK images and is no longer on the critical path; demoted high -> low.]\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit after the storage direction settles (PIZERO-70/71/72). Floppy write may be moot under the VFS.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-08-05", "updated": "2026-09-16", "tags": ["fdc", "wd279x", "disk", "decb", "save", "savem", "write", "emulation"], "theme": "storage"}, {"id": "PIZERO-67", "summary": "Firmware-side SD persistence API (config + .pal/.fnt sidecars) -- undeclared dependency of PIZERO-53/55/57", "description": "Distinct from guest-side disk writes (PIZERO-66): this is the FIRMWARE writing its own files to the card -- the BIOS config blob and the per-title sidecars. ROADMAP GAP found 2026-08-05: PIZERO-53 (BIOS overlay: 'firmware-only settings', persistence), PIZERO-55 (palette editor -- 'save flow: save for this title writes the sidecar keyed to the currently-loaded image path', per-title .PAL) and PIZERO-57 (loadable VDG font -- per-title .FNT sidecars, 'save keyed to the currently-loaded image path') ALL assume the firmware can write to SD, and NONE of them declares that dependency -- while the port is in fact read-only (see PIZERO-64). This ticket makes the capability explicit and shared so the three UX tickets don't each grow their own half-baked writer. IMPLEMENT: (1) a small typed settings store -- read/modify/write a firmware config file (e.g. /coco/config.txt or a versioned binary blob) with a schema version field and forward-compatible defaults, so an older firmware meeting a newer file degrades instead of corrupting; (2) sidecar write/read helpers keyed to the currently-loaded image path (GAME.DSK -> GAME.PAL / GAME.FNT), matching the per-title -> user-global -> factory fallback chain those tickets already specify; (3) atomic replace (write .TMP + f_rename, from PIZERO-64) so an interrupted save never leaves a truncated palette/font/config that bricks the next boot -- the fallback chain must also treat a malformed sidecar as absent; (4) explicit flush on BIOS exit. NOTE this path is much easier than PIZERO-66 on timing: BIOS saves happen while the overlay is up and the user is interacting, not inside the emulation hot loop, so a synchronous write+sync is acceptable here (a brief hitch during a menu save is fine) -- it does NOT need the PIZERO-65 queue. Depends on PIZERO-64 only. Should land before or alongside PIZERO-53 so the overlay has somewhere to persist to; unblocks the save half of PIZERO-55 and PIZERO-57.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["sd", "write", "persistence", "config", "bios", "palette", "font", "dependency"], "theme": "storage"}, {"id": "PIZERO-68", "summary": "DECB disk maintenance: DSKINI/format, multi-drive, write-protect toggle, proper FDC error status", "description": "Completes the guest-side disk story once PIZERO-66 can write single sectors. Turns 'SAVE works' into 'the disk subsystem behaves like a disk subsystem'. IMPLEMENT: (1) DSKINI (format) -- DECB's formatter issues WD279x Type III Write Track, currently a blanket stub (coco_machine.cpp:259-262 sets fdc_status=0x10 RNF for all Type III). Either implement enough Write Track to satisfy DECB, or (simpler and probably better) intercept format and synthesise a fresh 161280-byte JVC image with an initialised DECB directory/granule map -- which also gives the BIOS a 'create new blank disk' action. (2) MULTI-DRIVE -- coco_boot_disk_read_sector hard-rejects drive != 0 (coco_boot.cpp:340) though the FDC already decodes the one-hot drive select from the $FF40 latch into fdc_drive (:295-297); extend to an array of attached images so drive 0/1 both mount (needed for COPY and BACKUP between two disks, and for a data disk alongside a game). (3) GEOMETRY beyond 35x18x1 -- the read path hardcodes 35 tracks / 18 sectors / single-sided (:318, :341); accept 40/80-track and double-sided images by deriving geometry from file size at attach time. (4) WRITE-PROTECT as a real, user-visible state -- a BIOS per-drive WP toggle (and automatic WP when the file can't be opened writable), reported through the existing 0x40 status bit; protects a pristine game image from an accidental SAVE. (5) HONEST ERROR STATUS -- map disk-full, I/O failure, card-absent and out-of-range onto the right WD279x status bits (RNF 0x10, write fault, write protect 0x40) so DECB prints a sensible error instead of hanging or silently succeeding; a queue overflow from PIZERO-65 also needs a status mapping here. ACCEPTANCE on HW: DSKINI produces a disk that DIR reports empty and that accepts a SAVE; BACKUP/COPY between drive 0 and 1 works; WP-toggling a disk makes SAVE fail with a write-protect error and leaves the image byte-identical; filling a disk yields a clean DECB error, not a hang. Depends on PIZERO-66. [RE-SCOPED 2026-08-05: legacy peripheral polish only -- DECB's format/granule/multi-drive model is explicitly not the future storage model. See PIZERO-79; demoted medium -> low.]\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit only if floppy stays a first-class device, which PIZERO-79 argues against.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-08-05", "updated": "2026-09-16", "tags": ["fdc", "disk", "decb", "format", "dskini", "multi-drive", "write-protect", "errors"], "theme": "storage"}, {"id": "PIZERO-69", "summary": "Emulator save-states: wire XRoar's serialise.c fs_* stubs to FatFs (freeze/restore whole machine)", "description": "Whole-machine snapshot to SD -- freeze the emulated CoCo mid-game and restore it later. Independent of the disk-write chain (PIZERO-66/68): different mechanism, different feature. FOUND 2026-08-05: the infrastructure is ALREADY VENDORED AND COMPILED IN -- lib/xroar_core/src/serialise.c is 846 lines of real XRoar snapshot machinery (and part.c/part.h provide the part-tree walk it serialises over). What blocks it is purely the I/O primitives: lib/xroar_core/src/xroar_stubs.c:21-45 no-ops EVERY fs_* function it depends on, under the explicit comment 'serialise.c references these for save-state I/O; we don't implement save-state on the Pico, so every stub is a no-op'. That is ~18 one-line functions (fs_write_uint8/16/16_le/31, fs_read_uint8/16/16_le/31, fs_write_vuint32/vint32, fs_read_vuint32/vint32, fs_sizeof_vuint32/vint32, fs_file_size, fs_truncate, fs_file_crc32, fs_file_crc32_block) all currently returning -1/0. IMPLEMENT: (1) a FILE* -> FatFs FIL bridge -- lib/xroar_core/src/fs.h is written against stdio (FILE*, off_t, ftruncate semantics), so either provide a tiny shim type or adapt fs.h; note fs_truncate must leave the file position at the new EOF per its documented contract, and fs_file_crc32 must record and restore position; (2) implement the fs_* primitives over that bridge; (3) decide WHAT is in a snapshot for this port -- serialise.c walks the part tree, so confirm the parts we actually instantiate (RAM, mc6809, mc6883 SAM, both mc6821 PIAs, mc6847 VDG) round-trip, and decide how the NON-xroar firmware state is handled: the attached DSK path, any PIZERO-65 dirty-sector queue (MUST be flushed before snapshotting, else the restored state disagrees with the image on the card), the audio ring, and the VDG palette/font if PIZERO-55/57 have landed; (4) version the snapshot format and reject mismatches rather than restoring garbage; (5) surface save/load slots in the BIOS overlay (PIZERO-53). SIZE CHECK before committing to this: 64 KB RAM + CPU/PIA/SAM/VDG state is a ~64-70 KB file -- trivial for the card, but the serialisation buffer must not blow the SRAM budget (README notes SRAM is ~89-94% full), so stream straight to FatFs rather than building an image in RAM. ACCEPTANCE on HW: freeze a running game, power-cycle, restore, and it resumes correctly with sound and video intact. Depends on PIZERO-64; snapshot-vs-disk consistency depends on PIZERO-65 if that has landed; BIOS slots depend on PIZERO-53.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit once SD write exists (PIZERO-64) and there is a reason to freeze a whole machine.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-08-05", "updated": "2026-09-16", "tags": ["save-state", "snapshot", "serialise", "xroar-core", "sd", "write", "future"], "theme": "storage"}, {"id": "PIZERO-70", "summary": "Storage backend abstraction: one device interface, SD/FatFs as the first backend", "description": "Layer 0 of the DECB-replacement stack (user direction 2026-08-05: floppies and their data structures are obsolete; we already have a fast hierarchical filesystem with long names, and pretending it is a floppy wastes it). Define ONE backend interface that the VFS (PIZERO-71) sits on, so storage can be SD, RAM, USB mass storage, DriveWire or a FujiNet-class network device without the guest or the command surface changing. SCOPE: the interface itself (mount/unmount, identify/capabilities, read/write/flush, error model) plus SD/FatFs as backend #1 by wrapping the existing coco_boot read helpers and the PIZERO-64 write layer. Capabilities must be queryable, not assumed -- read-only vs writable, seekable, max path/name length, whether hierarchy is supported -- because DriveWire and RAM disk differ sharply from FatFs. Keep it a C interface with no 6809 knowledge. Depends on PIZERO-64 for the write path. Blocks PIZERO-71.", "type": "feature", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["storage", "vfs", "abstraction", "sd", "foundation"], "theme": "storage"}, {"id": "PIZERO-71", "summary": "VFS core: hierarchy, long filenames, create/write/edit/delete/rename, directory enumeration", "description": "Layer 1: the filesystem semantics the guest actually gets, replacing DECB's flat 8.3-uppercase 68-granule model. PRIMARY FOCUS per user direction is the WRITE side -- creating, extending and editing newly generated files is the point of the exercise, not just loading. SCOPE: path handling (hierarchical, long names -- FatFs is already built with FF_USE_LFN 3), open/close/read/write/seek/truncate, create/delete/rename/mkdir, directory enumeration, and file attributes/size/timestamps (note: no RTC, so get_fattime stamps a fixed epoch -- see PIZERO-64). Defines the canonical error codes that the hypercall ABI (PIZERO-72) surfaces to the guest. Runs entirely in C over the PIZERO-70 backend interface; no 6809 code here. Depends on PIZERO-70. Blocks PIZERO-72.", "type": "feature", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["vfs", "filesystem", "write", "foundation"], "theme": "storage"}, {"id": "PIZERO-72", "summary": "Guest hypercall ABI: versioned command-block protocol for filesystem access (the contract)", "description": "Layer 2 and the CRUX of the whole design: the stable contract between guest code and the firmware filesystem. Everything else can be rewritten; this cannot, because BASIC (PIZERO-74), Bare Naked Forth and any future guest software all bind to it. Get it right before building on it. SCOPE: claim an unused I/O address range (the $FF90-$FF93 area is contested by PIZERO-62's GIME timer -- pick deliberately and document), define a command block laid out in guest RAM (opcode, handle, long-path pointer, buffer pointer, length, result/errno), and the doorbell/completion signalling. MUST BE VERSIONED from day one -- a capability/version query opcode so guest code can detect what it is talking to and degrade instead of corrupting. MUST HANDLE LATENCY: an SD write can stall tens-to-hundreds of ms while core 0 has only ~31% slack per frame (PIZERO-48), so the ABI needs either explicit async (submit, poll status, complete) or a documented blocking contract with the PIZERO-65 write-back queue behind it -- decide this HERE, since retrofitting async into a synchronous ABI breaks every client. Uses the same bus-interception technique as PIZERO-55's palette registers. Document the ABI in docs/ as a first-class spec, not a code comment. Depends on PIZERO-71 (semantics) and PIZERO-65 (latency strategy). Blocks PIZERO-73/74.", "type": "feature", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["abi", "hypercall", "vfs", "guest", "forth", "critical"], "theme": "storage"}, {"id": "PIZERO-73", "summary": "Replacement cart ROM: thin 6809 shim over the hypercall + 6809 assembler in the build", "description": "Layer 3a: the guest-side code that replaces disk11.rom in the $C000 cart slot. DESIGN RULE: keep it THIN. All filesystem logic lives in C on the RP2350 behind the PIZERO-72 hypercall; the ROM is a shim that marshals arguments and hooks BASIC. This is what makes the backend abstraction possible and keeps us out of a full DOS-in-assembly project. SCOPE: an 8 KB cart image, the BASIC hook points needed by PIZERO-74, and the marshalling glue. NEW BUILD DEPENDENCY: this needs a 6809 assembler (lwasm or asm6809) wired into the PlatformIO build, with the assembled ROM embedded in flash -- document it in docs/BUILD.md, which is the source of truth for the build. Note the port already loads carts by name (coco_boot_load_cart_named, coco_boot.h:49) so the mounting path exists. Depends on PIZERO-72.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["rom", "6809", "cart", "toolchain", "decb-replacement"], "theme": "storage"}, {"id": "PIZERO-74", "summary": "New guest command surface: filesystem commands replacing DECB's", "description": "Layer 3b: what the user actually types. Replaces DECB's command set with commands built for a hierarchical long-filename filesystem instead of a 35-track floppy -- explicitly NOT DECB-compatible (user direction: provide the abilities without the arcane DECB context and its limitations). SCOPE: load/save of programs and binaries, directory listing with hierarchy, change/make/remove directory, delete/rename/copy, and sequential file I/O for guest programs (the equivalent of OPEN/CLOSE/PRINT#/INPUT# but over real paths). Decide and document the naming: reusing DECB keywords with new semantics is friendlier but silently changes behaviour for old software, while new keywords are honest but unfamiliar -- pick one and record the rationale. Error messages should surface the PIZERO-71 error codes usefully rather than DECB's numbered errors. Depends on PIZERO-72 and PIZERO-73. Bare Naked Forth binds to PIZERO-72 directly and does not need this ticket.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["basic", "commands", "ux", "decb-replacement", "guest"], "theme": "storage"}, {"id": "PIZERO-75", "summary": "RAM disk backend (fast VFS test target, no card required)", "description": "A backend with no hardware and no latency, useful out of proportion to its size: it lets the VFS (PIZERO-71), hypercall (PIZERO-72) and command surface (PIZERO-74) be developed and tested without an SD card inserted and without the write-latency problem confounding results -- and it is a real user feature (scratch space, fast intermediate files). SCOPE: a small backend over an SRAM allocation, sized against the tight budget (README: SRAM ~89-94% full, PSRAM unpopulated), so expect tens of KB, not megabytes; size configurable, contents volatile, capabilities reported honestly via the PIZERO-70 interface. Depends on PIZERO-70.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["storage", "backend", "ramdisk", "testing"], "theme": "storage"}, {"id": "PIZERO-76", "summary": "DriveWire / serial storage backend", "description": "Backend over a simple serial transport -- host-provided storage with no local media, and the on-ramp to FujiNet-class networked storage (PIZERO-77), which the user flags as a major focus. SCOPE: the transport plus enough of the protocol to serve the PIZERO-70 backend interface. NOTE the framing question up front: DriveWire is natively a virtual-FLOPPY protocol (sector reads/writes against disk images on the host), which sits oddly under a hierarchy-and-long-names VFS -- so decide whether we speak stock DriveWire (compatible with existing host servers, but constrained to its sector model) or a file-level protocol over the same wire (better fit, needs our own host tool). Record the decision and rationale. Serial plumbing overlaps the bit-banger tap technique from PIZERO-59; check whether the transport can be shared. Depends on PIZERO-70.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["storage", "backend", "drivewire", "serial", "network"], "theme": "storage"}, {"id": "PIZERO-77", "summary": "FujiNet-class networked storage over TCP/IP hardware", "description": "Networked storage and services in the FujiNet mould, with appropriate TCP/IP-capable hardware attached -- flagged by the user as a major focus, ticketed now to hold the shape rather than to start. SCOPE (to be narrowed): which hardware provides the network stack (the RP2350 has no radio; an ESP32-class companion or a wired module on a spare header is the likely route -- this is a hardware decision, so it needs the schematic and a free-pin audit before design), then a backend over it serving the PIZERO-70 interface, and which FujiNet-style services beyond file access are in scope. Deliberately shallow until PIZERO-70/71/72 are real and the hardware path is chosen. Depends on PIZERO-70 and PIZERO-76's transport work.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit when a networking hardware decision is actually made; it is the blocker, not the software.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-08-05", "updated": "2026-09-16", "tags": ["storage", "backend", "fujinet", "network", "tcpip", "future"], "theme": "storage"}, {"id": "PIZERO-78", "summary": "USB mass-storage backend", "description": "Backend for a USB drive on the PIO-USB host port. SCOPE: USB MSC class support plus a PIZERO-70 backend over it. CONSTRAINTS to check first: PIO-USB already costs real core budget and the host stack currently runs one device on the root port, so using a drive alongside the keyboard needs the hub work (PIZERO-54); MSC bulk transfers plus DVI scanout plus emulation on the same chip is a genuine throughput question, so measure before designing. Lower priority than the SD and RAM backends since SD already serves the primary use case. Depends on PIZERO-70 and PIZERO-54.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit once the backend abstraction (PIZERO-70) exists and a second backend is wanted.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-08-05", "updated": "2026-09-16", "tags": ["storage", "backend", "usb", "msc", "future"], "theme": "storage"}, {"id": "PIZERO-79", "summary": "Demote floppy support to a peripheral: DECB/.DSK as optional legacy device", "description": "Formalises the reframing (user direction 2026-08-05): floppy emulation stops being the storage model and becomes ordinary peripheral support, for people who want to run old images. The new filesystem layer (PIZERO-70..74) is the DEFAULT; DECB and the emulated WD279x become an opt-in device. SCOPE: (1) boot policy -- the replacement cart ROM (PIZERO-73) loads by default instead of disk11.rom, with DECB + a .DSK selectable per-title via autorun.txt and the BIOS overlay (PIZERO-53); the two models must not both claim the cart slot, so make the choice explicit and documented. (2) COEXISTENCE: the existing direct-load path (autorun.txt direct_name -> coco_boot_parse_loadm, main.cpp:1084) and the .DSK path (:1097) are already mutually exclusive at boot -- fold both into one coherent 'what am I booting' decision alongside the new default. (3) Re-scope the legacy tickets: guest SAVE/SAVEM to .DSK (PIZERO-66) and DECB disk maintenance (PIZERO-68) are now nice-to-have peripheral polish, not the path to writable storage -- that is PIZERO-71's job. (4) Documentation: README/ROADMAP must say plainly that floppy compatibility is peripheral support and the new VFS is the supported way to create and edit files, so the intent is not re-litigated later. Depends on PIZERO-73 for the default cart; touches PIZERO-53.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["decb", "floppy", "legacy", "peripheral", "policy", "boot"], "theme": "storage"}, {"id": "PIZERO-80", "summary": "Evaluate 4-bit PIO SDIO vs 1-bit SPI for SD (throughput + the only non-blocking transfer API we have)", "description": "Evaluate switching the SD backend from 1-bit SPI to 4-bit PIO SDIO. Two independent payoffs: raw throughput, and -- the reason this is ticketed separately -- it is the ONLY path in our stack with a non-blocking, start/poll transfer API.\n\nFINDINGS (verified in the installed lib, 2026-08-05, carlk3 no-OS-FatFS-SD-SDIO-SPI-RPi-Pico 3.5.1): (1) NOTHING in the PlatformIO/Arduino ecosystem offers an async FILESYSTEM. Every FatFs entry point in ff15/source/ff.h is a synchronous FRESULT f_xxx() (f_forward takes a callback but is a read-side pull helper, not asynchrony). SdFat (installed as an Adafruit SPIFlash dep) is likewise synchronous. So no library choice removes PIZERO-65. (2) The carlk3 driver DOES use DMA (sd_driver/SPI/my_spi.c, sd_driver/dma_interrupts.c, sd_driver/SDIO/rp2040_sdio.c) but then SPIN-WAITS on it -- my_spi.c:198 'while (dma_channel_is_busy(rx) || dma_channel_is_busy(tx)) tight_loop_contents();' and rp2040_sdio.c:250 -- so DMA buys throughput, not free CPU; from core 0 it is fully blocking. (3) A vestigial async hook exists but is DEAD: sd_callback_t / azplatform_set_sd_callback (sd_driver/SDIO/ZuluSCSI_platform.h:75-76), inherited from ZuluSCSI, is declared and never defined or called anywhere in the library -- do not build on it. (4) THE ASYNC-SHAPED API IS IN THE SDIO BACKEND: rp2040_sdio.h:101-111 exposes rp2040_sdio_tx_start()/tx_poll() and rx_start()/rx_poll(), backed by a real state machine (sdio_transfer_state_t SDIO_IDLE/RX/TX/TX_WAIT_IDLE, wr_status in rp2040_sdio.h:39-87). That is submit-then-poll -- driveable from a per-frame drainer without ever blocking. (5) WE ARE NOT ON IT: src/hw_config.c configures SD_IF_SPI on spi1 at 12.5 MHz (SCK 30 / MOSI 31 / MISO 40 / CS 43), matching the Waveshare demo -- i.e. the blocking 1-bit path.\n\nCRITICAL CAVEAT that bounds the whole payoff: the dominant write latency is NOT transfer time, it is the card's internal program/erase, during which the card holds the line busy (can be 100 ms+). SDIO and DMA shorten the transfer; NEITHER shortens the erase. So SDIO cannot remove the need for PIZERO-65's queue -- at best it lets the drainer poll instead of spin, and moves bulk loads (ROM/DSK/wavetable reads) meaningfully faster. Do not let this ticket be mistaken for a fix for the write-stall problem.\n\nSCOPE: (1) HARDWARE FEASIBILITY FIRST, before any code -- does this board's microSD socket even expose DAT1-DAT3? The vendor demo uses SPI (.ref/demo/RP2350-PiZero/Arduino/03-MicroSD/, C/03-MicroSD/), which is weak evidence the extra lines may not be wired; check docs/RP2350-PiZero-schematic.pdf. If they are not brought out, close this ticket -- that is a valid and cheap outcome. (2) PIN + PIO BUDGET AUDIT: SDIO needs CLK/CMD/DAT0-3 on suitable pins, and it is itself PIO-based, so it contends with libdvi (which already uses PIO with pio_set_gpio_base(pio,16) because TMDS is on GPIO 32-39) and Pico-PIO-USB (HOST_PIN_DP=28). Confirm free PIO state machines and instruction space, not just free GPIOs. (3) Verify carlk3's SDIO path actually supports RP2350 (the files are named rp2040_sdio.*) and works at our 252 MHz sys clock -- PIO timing is clock-derived, so this is a real risk, and the same clock-conflict class as the documented HSTX/DVI constraint. (4) MEASURE against the PIZERO-64 SPI baseline: sequential read throughput, single- and multi-block write, and worst-case write+sync stall. (5) Only if all the above pass, wire the start/poll API into the PIZERO-65 drainer so it polls rather than blocks, and consider keeping SPI as a build-flag fallback.\n\nDECISION RULE (set now so this doesn't drift): if PIZERO-64 measures worst-case write+sync in the low tens of ms, SPI is adequate indefinitely and this ticket stays deferred. Pursue SDIO only if the measurements are bad, or if a later feature (PIZERO-17 synth wavetable streaming from flash/SD, large PIZERO-71 VFS files) needs the read bandwidth. Depends on PIZERO-64 for the baseline numbers; informs PIZERO-65 and PIZERO-70 (the backend interface should not assume a blocking transport).\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit if SD throughput is measured as a real bottleneck; today it is a guess.]", "type": "decision", "status": "deferred", "priority": "low", "created": "2026-08-05", "updated": "2026-09-16", "tags": ["sd", "sdio", "spi", "performance", "async", "pio", "hardware", "research", "deferred"], "theme": "storage"}, {"id": "PIZERO-81", "summary": "F12 disk-image switcher: keyboard-driven launcher with 6847 look (port of the AMOLED picker)", "description": "Adopt the simple disk-image switching launcher from the AMOLED port (~/github/coco-rp2350-waveshare-touch-amoled-18), driven by the KEYBOARD instead of touch gestures. USER SPEC (2026-08-05): F12 activates, LEFT/RIGHT select, ENTER launches, ESC cancels and returns to the running app. Rendered with the 6847 path so it matches the emulator's look and feel. SETTLED BEHAVIOUR: (a) ENTER COLD-BOOTS the machine, same as the other implementations -- not a live floppy hot-swap; (b) the emulator is PAUSED while the overlay is up; (c) all three entry types are supported (DSK, BIN, CART), matching the port's three existing boot paths (autorun.txt disk_name / direct_name / cart_name).\n\nWHAT WE ALREADY HAVE (verified 2026-08-05, so this is smaller than it looks): coco_boot_blit_vdg_pizero_src(const uint8_t *src, uint16_t *fb) ALREADY EXISTS at coco_boot.h:76 -- the source-pointer blit that PIZERO-53 assumed would need a render_alpha_frame refactor. It does not; an overlay is just a VDG-format scratch buffer handed to that function. font_6847t1 is already exposed (coco_machine.cpp:873). F12 is HID usage 0x45 and is UNMAPPED in hid_table_init (main.cpp:311-334, table memset to 0xFF), so it is free to claim.\n\nWHAT MUST BE PORTED: coco_boot_enumerate() + struct coco_entry (this port only has coco_boot_find_default_dsk, coco_boot.h:26); the card renderer coco_boot_card_clear/card_text/card_buffer (AMOLED coco_boot.cpp:278-310) -- note it does NOT reuse render_alpha_frame, it is a small separate renderer drawing real font_6847t1 glyphs at 8x12 into a VDG-format buffer, which is the same look with less coupling; and coco_machine_reset(), which AMOLED has (its coco_machine.h:39) and THIS PORT DOES NOT.\n\nKEY-CAPTURE CARE: unlike F12, the other three keys are live CoCo keys and must be intercepted ONLY while the overlay is open, never swallowed otherwise -- ENTER is 0x28 -> K_ENTER, LEFT/RIGHT are 0x50/0x4F -> K_LEFT/K_RIGHT, and ESC is 0x29 which this port maps to K_BREAK (main.cpp:322).\n\nSub-sliced as PIZERO-81a..81d; each is independently testable. Last-launched persistence is PIZERO-82 (needs SD write). This is the disk-switching slice only -- firmware settings (SAM-speed cap, joystick source, audio env) remain PIZERO-53, which becomes the superset built on this.", "type": "feature", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["launcher", "ui", "vdg", "keyboard", "sd", "f12", "parent"], "theme": "experience"}, {"id": "PIZERO-81a", "summary": "Pick a disk image on screen: read the card's catalogue (launcher 1 of 4)", "description": "Slice 1 of PIZERO-81. Port coco_boot_enumerate() and struct coco_entry from the AMOLED port (~/github/coco-rp2350-waveshare-touch-amoled-18 src/coco_boot.h:40-45, and the scan in coco_boot.cpp) so the firmware can produce a catalogue of launchable SD content. This port currently has only coco_boot_find_default_dsk (coco_boot.h:26), which finds one .dsk and stops. SCOPE: scan the SD for all three entry types -- COCO_ENTRY_DSK / _BIN / _CART -- across the directories this port already searches (coco_boot_resolve handles /coco/dsk, /coco/bin, /coco/rom, /coco), returning a bounded array of {name[24], type}. Sort stably (alphabetical) so LEFT/RIGHT ordering is predictable across boots. Decide and document the entry cap and what happens past it (log it, do not silently truncate). NO UI in this slice: prove it over serial by dumping the catalogue, the same way AMOLED shipped its Ctrl-B LIST_KEY before any on-screen UI existed. ACCEPTANCE: serial dump lists every DSK/BIN/ROM on a real card, correctly typed, in stable order.\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"Launcher slice 1: SD catalogue enumeration (DSK/BIN/CART), serial-verifiable\"]", "type": "task", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-09-17", "tags": ["launcher", "sd", "enumerate", "slice"], "theme": "experience"}, {"id": "PIZERO-81b", "summary": "Launcher slice 2: 6847-look overlay renderer (card buffer + font_6847t1)", "description": "Slice 2 of PIZERO-81. Port the 6847-look overlay renderer so the launcher matches the emulator's appearance. Port coco_boot_card_clear(paper) / coco_boot_card_text(col,row,text,ink,paper) / coco_boot_card_buffer() from AMOLED coco_boot.cpp:278-310 plus the COCO_CARD_COLS/ROWS (32x16) defines. It draws real font_6847t1 glyphs at 8x12 per cell into a scratch buffer in VDG format, with the ASCII->font-index mapping the T1 character ROM needs (uppercase-fold, screen code + 0x40, unrenderable -> space). It deliberately does NOT reuse render_alpha_frame -- same font ROM, same look, far less coupling, and it means PIZERO-53's planned refactor is unnecessary. PORTING DETAIL TO CHECK: AMOLED's card buffer is 4bpp nibble-packed to match ITS VDG framebuffer; confirm the exact source format coco_boot_blit_vdg_pizero_src(const uint8_t*, uint16_t*) expects here (coco_boot.h:76, implementation coco_boot.cpp:496) and match it -- this is the one place the port is likely to differ. Watch the SRAM cost of the scratch buffer (README: SRAM ~89-94% full). NO INPUT in this slice: prove it by blitting a static card over the running emulator. ACCEPTANCE on HW: a legible CoCo-looking text card appears over the frame, correct colours, no tearing or corruption of the emulator image.", "type": "task", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["launcher", "vdg", "render", "font", "slice"], "theme": "experience"}, {"id": "PIZERO-81c", "summary": "Launcher slice 3: F12 overlay state machine, key capture, pause emulation", "description": "Slice 3 of PIZERO-81. The overlay state machine and its key capture -- the interaction layer, still with no launching (ESC-only exit). SCOPE: (1) claim F12 (HID usage 0x45, currently unmapped in hid_table_init, main.cpp:311-334) as the activate key; it must never reach the CoCo. (2) While the overlay is OPEN, intercept LEFT/RIGHT (HID 0x50/0x4F) to move the selection, ENTER (0x28) to confirm and ESC (0x29) to cancel -- and CRITICALLY, pass all four through untouched when the overlay is CLOSED, since they are live CoCo keys (ESC is mapped to K_BREAK at main.cpp:322). A regression here silently breaks normal typing, so test both states. (3) PAUSE EMULATION while the overlay is up (user decision): stop advancing coco_machine_run_cycles, and decide what the audio path does -- the ring will drain and the core-1 consumer will underrun, so either feed silence or stop the stream cleanly rather than let it warble (this is the PIZERO-35/38/39 failure class; do not reintroduce it). Keep the DVI scanout running throughout. (4) Held-key repeat for LEFT/RIGHT, and sane edge behaviour at the ends of the list (clamp or wrap -- pick one and document). (5) Draw the selection using the PIZERO-81b renderer, with the on-screen hint text updated for keys rather than AMOLED's 'SWIPE = BROWSE / TAP = RUN'. ACCEPTANCE on HW: F12 opens over a running program, LEFT/RIGHT scroll the selection, audio does not warble while paused, ESC returns and the program resumes cleanly with keyboard input still working normally. Depends on PIZERO-81a and PIZERO-81b.", "type": "task", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["launcher", "keyboard", "hid", "pause", "audio", "slice"], "theme": "experience"}, {"id": "PIZERO-81d", "summary": "Launcher slice 4: ENTER cold-boots the selection (needs coco_machine_reset ported)", "description": "Slice 4 of PIZERO-81, and the one that makes it useful: ENTER cold-boots the selected entry. USER DECISION: cold boot, not a live floppy hot-swap -- consistent with the other implementations. BLOCKER TO PORT FIRST: this port has NO coco_machine_reset(); AMOLED does (its coco_machine.h:39, used at its main.cpp:872/955). Port it, preserving the semantics its comment documents -- reset keeps the ROM, the installed cartridge and the disk-read callback intact, so the machine restarts without re-initialising everything. SCOPE: a launch_entry(idx) equivalent handling all three types -- DSK (coco_boot_attach_dsk then reset), BIN (coco_boot_parse_loadm into RAM then jump to the entry vector, as main.cpp:1084-1095 already does at boot), CART (coco_boot_load_cart_named then reset so the autoboot FIRQ takes the guest to $C000, per the note at coco_machine.h:29). Fold this into ONE coherent boot decision with the existing autorun.txt path rather than adding a second, divergent launch route -- main.cpp:1084 (direct) and :1097 (dsk) are already mutually exclusive, and PIZERO-79 will revisit the same code. Handle failure honestly: a missing or corrupt image should report on the card and leave the previous program running, not hang or half-boot. ACCEPTANCE on HW: launching a DSK, a BIN and a CART each cold-boots correctly from the overlay; the previously running program is fully replaced; audio and video are clean after the switch; repeated switching does not leak handles or degrade. Depends on PIZERO-81c.", "type": "task", "status": "open", "priority": "high", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["launcher", "boot", "reset", "cart", "dsk", "bin", "slice"], "theme": "experience"}, {"id": "PIZERO-82", "summary": "Remember last launched entry and boot back into it (laststate.txt)", "description": "Remember the last launched entry and boot straight back into it, as the AMOLED port does (~/github/coco-rp2350-waveshare-touch-amoled-18 coco_boot.h:47-54, /coco/laststate.txt). Split out of PIZERO-81 because it needs SD WRITE, which this port does not have yet. SCOPE: persist the last entry launched via the PIZERO-81 launcher, and at cold boot prefer it over the autorun.txt default -- with a clear precedence rule (laststate vs autorun.txt vs first-DSK fallback) that is documented, not implicit. Use the atomic-replace helper from PIZERO-64 so an interrupted write cannot leave a truncated file that breaks the next boot, and treat an unparseable or stale entry (file since deleted from the card) as absent rather than an error. NOTE the AMOLED ticket's own reasoning, which applies here too: this is stored on the SD card, NOT in flash via LittleFS, because the earlephilhower core's flash filesystem is unsafe alongside this workload. Also decide whether a user can turn it off -- booting into the last game is great until it is the thing you want to escape; if PIZERO-53 has landed, that is a settings toggle. Depends on PIZERO-64 (SD write) and PIZERO-81d (something to record).", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["launcher", "persistence", "sd", "write", "boot"], "theme": "experience"}, {"id": "PIZERO-83", "type": "decision", "status": "open", "priority": "high", "summary": "Decision: new video device framebuffer residency (guest RAM vs firmware aperture) + geometry", "tags": ["video", "display", "framebuffer", "decision", "address-space", "6809", "blocker"], "created": "2026-08-17", "updated": "2026-08-17", "description": "DECIDE BEFORE PIZERO-84. A new linear indexed video device (1/2/4bpp) needs two questions settled; both change the guest-visible interface and cannot be retrofitted cheaply.\n\n(1) RESIDENCY. Option A -- the framebuffer lives in the guest's 64K address space, like real hardware. Authentic; the 6809 plots pixels with plain stores. But 320x240@4bpp = 38,400 bytes = 59% of the ENTIRE address space, leaving ~26KB for code + BASIC + variables. This is precisely why the real GIME shipped an MMU; without banking, 4bpp is barely usable. Option B -- the framebuffer lives in FIRMWARE SRAM outside the 64K map, reached through a narrow aperture (window/base register + data port) or a command interface. The 6809 never holds 32KB of pixels, SD->VRAM blits (PIZERO-87) become nearly free, and the address-space cost falls to a handful of registers. Cost: it stops being a CoCo, and guest-side plotting goes through an indirection. RECOMMENDATION: Option B, because PIZERO-87 (SD bitmap blit) is a stated requirement and Option B composes with the PIZERO-72 hypercall ABI instead of fighting it. A hybrid (aperture-mapped sliding window into firmware VRAM) is a real third option and should be weighed explicitly, since it recovers direct stores for the hot region while keeping the map small.\n\n(2) GEOMETRY. User proposed 320x240. Note 320x240@4bpp = 38,400 B, which OVERSHOOTS the stated '32K image' target by 20%. The authentic CoCo3 hi-res geometry is 320x192@4bpp = 30,720 B (the classic 32K mode); 320x200 = 32,000 B. Against that, 320x240 exactly fills the host framebuffer (PIZERO_FB_W/H, src/coco_boot.cpp:484) with no border, which is the cleanest possible blit. Per-depth footprints at 320x240: 1bpp 9,600 B (15% of the map), 2bpp 19,200 B (29%), 4bpp 38,400 B (59%). Geometry may legitimately differ per bit depth.\n\nFACTS ALREADY ESTABLISHED (verified 2026-08-17): PSRAM is NOT available -- the pad is unpopulated (README.md:74), so this is an SRAM-only target (520KB; last recorded build 70.6%, so roughly 150KB free). A 38KB firmware-side VRAM therefore fits comfortably. Read-only assets can live in the 16MB flash. Blocks PIZERO-84/85/86/87.", "theme": "devices"}, {"id": "PIZERO-84", "type": "feature", "status": "open", "priority": "medium", "summary": "Linear indexed video device: 320x240 at 1/2/4bpp with a single-stage blit", "tags": ["video", "display", "framebuffer", "indexed", "bpp", "device", "renderer"], "created": "2026-08-17", "updated": "2026-08-17", "description": "A NEW video device alongside the 6847, not a modification of it. Gives the guest a linear indexed framebuffer at a resolution the 6847 cannot reach.\n\nWHY THIS IS SMALLER THAN IT SOUNDS (verified 2026-08-17): the display pipeline is ALREADY 4bpp-indexed. lib/coco_machine/src/coco_machine.cpp:92 holds a nibble-packed palette-index buffer (2 indices per byte) and src/coco_boot.cpp:496 expands it through a 16-entry RGB565 LUT into the framebuffer. The mechanism exists; what is missing is a device that drives it linearly. For reference, the best existing 2bpp mode is CG6/PMODE 3 at 128x192 (render_graphics_frame, coco_machine.cpp:1013) horizontally replicated x2 -- this device targets roughly 3x that pixel count.\n\nDESIGN -- COLLAPSE TO ONE STAGE. The 6847 path is two stages: render (guest RAM -> 4bpp intermediate via mode decode, 2.75ms) then blit (4bpp -> RGB565, 1.5ms). This device should blit STRAIGHT from its framebuffer to RGB565. Two payoffs: (a) the 2.75ms mode-decode disappears entirely -- there are no 6847 modes to decode; (b) bit depth starts to matter to HOST cost, not just guest cost -- 1bpp reads 8 px/byte, 2bpp 4 px/byte, 4bpp 2 px/byte, so a 2bpp screen becomes genuinely cheaper to draw rather than being expanded into a 4bpp intermediate and paying full price. Suggested 2bpp fast path: a 256-entry byte->4-pixel LUT making the inner loop near-memcpy, mirroring the existing g_alpha_lut trick at coco_machine.cpp:897. ACCEPT that this is a second, parallel renderer sharing no code with the 6847 path -- the same 'small separate renderer, less coupling' call PIZERO-81b already made for the launcher card.\n\nSCOPE: mode/enable/base control registers; 1/2/4bpp support; the single-stage blit; and a clean switch between this device and the 6847 in coco_machine_render_frame (coco_machine.cpp:1058), including defined behaviour when the device is disabled. ADDRESS RANGE MUST BE CHOSEN DELIBERATELY -- PIZERO-72's hypercall block and PIZERO-62's GIME timer both eye $FF90-$FF95; do not squat it by accident. Palette is PIZERO-85, font is PIZERO-86, SD bitmaps are PIZERO-87.\n\nBUDGET: blit cost scales with OUTPUT pixels -- 256x192 = 49,152 writes today vs 320x240 = 76,800 (~1.56x). Core 0 currently runs emulate 10.8ms + render 2.75 + blit 1.5 = ~15.1ms of 16.67ms per PIZERO-18's telemetry, while PIZERO-48 records ~31% slack from an older pre-audio baseline; the two disagree and neither is post-60Hz. Re-baseline via PIZERO-88 before assuming headroom. Core 1 cannot absorb the blit without PIZERO-40's headroom measurement.\n\nRELATIONSHIP TO PIZERO-16: -16 is the deferred 'alternate video device' with TMS9918A-style sprites plus extended palette. This ticket is the framebuffer half of that territory; if both proceed, narrow -16 to sprites so they do not overlap. SCOPE FLAG: docs/product-plan.md section 3.7 lists an alternate video device as explicitly OUT OF SCOPE for V1.0. This cluster is therefore post-V1.0 or a deliberate scope change -- settle that before sequencing it ahead of the launcher (PIZERO-81) or storage (PIZERO-64) work. Depends on PIZERO-83.", "theme": "devices"}, {"id": "PIZERO-85", "type": "feature", "status": "open", "priority": "medium", "summary": "Programmable 16-entry palette register file for the new video device (CoCo3 $FFB0-$FFBF style)", "tags": ["palette", "video", "registers", "coco3", "gime", "6847", "config"], "created": "2026-08-17", "updated": "2026-08-17", "description": "Give the PIZERO-84 device a writable 16-entry palette in the CoCo3 register style.\n\nESSENTIALLY FREE AT RUNTIME: the blit already performs a per-pixel LUT lookup (g_vdg_rgb565_native[16], src/coco_boot.cpp:488). Making it writable turns a .rodata array into .data and costs nothing per pixel. Worth stating plainly because it is a genuine emulation dividend: a real 6847 has NO palette registers at all -- its colours are hardwired into the chip, which is why PIZERO-55 exists as a feature rather than a given. We get CoCo3-class palette control on a CoCo1/2-class machine for free. Indices 12-15 of the current LUT are unused (0x0000) since the 6847 only ever needs 12, so there is free space even before the LUT becomes writable.\n\nCOORDINATE WITH PIZERO-55 -- DO NOT DUPLICATE IT. PIZERO-55 already covers making the SAME LUT writable, a BIOS palette editor, per-title .pal sidecars, and $FFB0-$FFBF bus-write interception for the classic 6847 modes. The register file must be built ONCE and shared. Decide explicitly: (a) PIZERO-55 lands first and this ticket merely binds the new device's modes to the existing register file (PREFERRED -- less work, one code path), or (b) this ships first and PIZERO-55 adopts it.\n\nWORTH KNOWING BEFORE SEQUENCING: with a programmable palette, the EXISTING 6847 CG modes already become '2bpp with colours you choose' -- render_graphics_frame computes cg_base + a 2-bit value (coco_machine.cpp:1041), and only cg_base is hardwired (CSS picks the GREEN or WHITE set). So PIZERO-55 ON ITS OWN delivers half the stated goal at 128x192, with no new device at all. Only the RESOLUTION needs PIZERO-84. That makes PIZERO-55 the cheaper first move if the palette matters more than the pixel count. Depends on PIZERO-83; coordinate with PIZERO-55.\n\n[2026-08-17 CROSS-TEST + PRECISION CONSTRAINTS -- full write-up lives in PIZERO-55, which owns the shared register file; summarised here because this ticket can be worked independently.\n  * `xroar -m coco3` IS an equivalent desktop test target: the GIME applies palette_reg[] in VDG-COMPATIBLE mode (tcc1014.c:1400-1421, inside `if (gime->COCO)`), and its CG index arithmetic `cg_colours + ((gdata >> 6) & 3)` (tcc1014.c:1408) is identical to our `cg_base + ((b >> 6) & 3)` (coco_machine.cpp:1041). On CoCo 1/2 the range is unmapped and writes are ignored, so nothing conflicts.\n  * PALETTE INDICES 0-7 MATCH GIME EXACTLY; 8-15 DO NOT (GIME: RGCSS fg/bg pairs at 8-11, alpha/semigraphics pairs at 12-15; ours: 8=BLACK, 9=DARK_GREEN, 10-15 unused). Adopting GIME's 8-15 assignment is free today since those slots are empty.\n  * REGISTERS ARE 6-BIT (RGB222, & 0x3f, tcc1014.c:792) and READABLE (tcc1014.c:795). Do not widen $FFB0-$FFBF to 16-bit or the cross-test equivalence is lost -- put any wider format elsewhere or behind a mode bit.\n  * OUTPUT CEILING IS RGB565, ASYMMETRIC: both libdvi TMDS tables are 6 bits per channel (tmds_table.h / tmds_table_fullres.h headers), so green is an exact 6/6 match while red and blue are capped at 5 bits by the framebuffer. GIME's RGB222 fits with room to spare; 'full RGB' here means 5/6/5, never 8/8/8.]", "theme": "devices"}, {"id": "PIZERO-86", "type": "feature", "status": "deferred", "priority": "low", "summary": "Guest-writable character generator: font bitmap in RAM for the new video device", "tags": ["font", "video", "character-set", "ram", "device", "tms9918"], "created": "2026-08-17", "updated": "2026-09-16", "description": "Let the guest redefine the character set at runtime instead of being fixed to the 6847's mask ROM.\n\nCURRENT STATE (verified 2026-08-17): font_6847t1 is a const 1536-byte array (128 glyphs x 12 rows) at lib/xroar_core/src/mc6847/font-6847t1.c:6, pinned into the .time_critical section, and indexed directly at two sites -- lib/xroar_core/src/mc6847/mc6847.c:427 (upstream beam renderer, currently suppressed by SUPPRESS_RENDER_SCANLINE) and lib/coco_machine/src/coco_machine.cpp:948 (the live alpha renderer). Making it swappable means replacing those direct references with a pointer indirection (g_font) and deciding where the writable copy lives. RAM cost is modest: 1.5KB for a 128-glyph 8x12 set, more for a larger or multi-page character set. PSRAM is NOT available (README.md:74) -- SRAM only; flash is fine for read-only defaults.\n\nNOTE THIS IS NOT A COCO3 FEATURE. The GIME's text mode still used a fixed ROM font; a programmable character generator is a TMS9918/C64-class capability. So it belongs to the new device (PIZERO-84, and adjacent to PIZERO-16's territory), not to 6847 fidelity -- do not present it as CoCo3 compatibility.\n\nDISTINGUISH FROM PIZERO-57, the firmware-side cousin: that loads a .FNT from SD to replace the default font, with a BIOS loader, live preview and per-title sidecars. That is a FIRMWARE-driven swap; this is a GUEST-driven one (the 6809 pokes glyph bitmaps and sees them appear immediately). They should share the SAME g_font indirection -- build it once, in whichever ticket lands first, and have the other adopt it. Depends on PIZERO-84.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit with the new video device (PIZERO-84); meaningless before it.]", "theme": "devices"}, {"id": "PIZERO-87", "type": "feature", "status": "deferred", "priority": "low", "summary": "Load bitmaps from SD and blit them into video memory", "tags": ["video", "sd", "bitmap", "blit", "storage", "assets", "read-only"], "created": "2026-08-17", "updated": "2026-09-16", "description": "Load a prepared image off the SD card directly into the PIZERO-84 device's framebuffer, so a full-screen picture costs the 6809 almost nothing.\n\nTHIS IS THE REQUIREMENT THAT MOST FAVOURS OPTION B IN PIZERO-83. If the framebuffer lives in firmware RAM, an SD->VRAM blit never crosses the 64K address space at all -- the guest issues a command and the firmware moves the bytes. If it lives in guest RAM, every pixel has to be pushed through the 6809's map.\n\nSIZES (at the PIZERO-83 geometry): 320x240 = 9,600 B at 1bpp / 19,200 B at 2bpp / 38,400 B at 4bpp; the authentic 320x192 4bpp CoCo3 mode is 30,720 B. So a ~32KB image is exactly one full-screen 4bpp picture -- the right size for a title screen, a loading screen, or a game background.\n\nSCOPE: an on-SD image format (packed indexed pixels plus a small header carrying geometry, bit depth, and an OPTIONAL 16-entry palette so an image can carry its own colours -- pairs directly with PIZERO-85), the loader, and the blit into VRAM.\n\nDEPENDENCY -- DECIDE DELIBERATELY. The clean route is through the storage stack (PIZERO-70 backend -> PIZERO-71 VFS -> PIZERO-72 hypercall), none of which exists yet. The shortcut is a narrow direct-FatFs read modelled on the existing read helpers (src/coco_boot.cpp:100 ROM, :276 autorun.txt, :324 DSK, :379 LOADM -- all FA_READ). Prefer the shortcut ONLY if it is written so PIZERO-72 can absorb it later WITHOUT a guest-visible ABI change. GOOD NEWS ON TIMING: this path is READ-ONLY, so it does NOT depend on PIZERO-64/65 (the SD write foundation and write-back queue) and none of the write-latency risk applies. Depends on PIZERO-83 and PIZERO-84.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit with the new video device (PIZERO-84).]", "theme": "devices"}, {"id": "PIZERO-88", "type": "task", "status": "open", "priority": "medium", "summary": "Know how much frame time is left at 60 Hz, USB and keyboard included", "tags": ["measurement", "budget", "telemetry", "performance", "core0", "pre-work", "instrumentation"], "created": "2026-08-17", "updated": "2026-09-17", "description": "PRE-WORK for PIZERO-84 (new video device) and design input for PIZERO-65 (SD write-back): nobody currently knows core 0's real slack. TWO PROBLEMS, both verified in the source 2026-08-17.\n\n(1) THE RECORDED FIGURES DISAGREE AND ARE STALE. PIZERO-18 records emulate 10.8ms + render 2.75ms + blit 1.5ms = ~15.1ms against a 16.76ms budget (about 10% slack). PIZERO-48 records ~9.4ms used and 'only ~31% slack at 1x'. The 31% almost certainly predates the audio tap (which itself added +1.4ms to emulation) and counts emulation alone. Neither has been re-measured since PIZERO-45 promoted the build to true 640x480p60 at 252MHz. Every open ticket that reasons about headroom -- PIZERO-65, PIZERO-84, PIZERO-17 -- is currently reasoning against an unknown somewhere between 10% and 31%.\n\n(2) USB AND KEYBOARD ARE NOT TIMED AT ALL. In loop() (src/main.cpp:1122) the timestamp `a` is taken AFTER pump_keyboard() returns, so the [run] telemetry's cpu= field (src/main.cpp:1268) covers coco_machine_run_cycles only. USBHost.task() -- the prime freeze suspect, and the entire reason PIZERO-33's phase markers exist -- contributes ZERO to the reported frame time, as does pump_keyboard(). This is the largest instrumentation gap on the board: the one phase most likely to blow the budget is the one phase never measured.\n\nDO: add two timestamps so USBHost.task() and pump_keyboard() report alongside cpu/render/blit/aud in the [run] line, then capture a baseline on the default pizero_stream_60 env in three conditions -- (a) idle at the BASIC prompt (text mode), (b) a graphics-mode game (spacewarp), (c) with and without a USB keyboard attached, which isolates the USB cost. Record the numbers in this ticket, correct PIZERO-48, and update docs/cpu-speed.md.\n\nCHEAP, and it converts three design tickets from guesswork into arithmetic. SEE ALSO PIZERO-40, which would take the equivalent CORE-1 headroom measurement (its 'core-1 IRQ headroom from the PIZERO-36 counter' item is still unvalidated). Run together, the two give the first complete picture of the board's compute budget -- and decide whether the PIZERO-84 blit could ever move to core 1.\n\n[2026-08-17 A THIRD, DIFFERENT FIGURE exists: PIZERO-14 records 'core0 uses 11.3/16.76ms' (2026-05-27, pre-audio, pre-60Hz). So the recorded core-0 totals now span 9.4ms (PIZERO-48), 11.3ms (PIZERO-14) and 15.1ms (PIZERO-18), taken at different dates against different builds and two different refresh rates. This ticket supersedes all three with one current measurement on pizero_stream_60.]\n\n[2026-09-14 Run in the same session as PIZERO-98 (25-hour soak). The untimed USBHost.task() phase is also the leading freeze suspect in PIZERO-33, so timing it lets the soak correlate any freeze with a USB-time spike. Cross-port context: the Fruit Jam port's avg-run figure already includes USB and audio (FRUITJAM-76, 12,583 us idle), so a like-for-like comparison of the two 252 MHz DVI boards needs this number; the PiZero's current best figure (11.5 ms) predates audio and 60 Hz.]\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"Re-baseline core-0 frame budget at 60Hz and time the untimed USB/keyboard phases\"]", "theme": "trust"}, {"id": "PIZERO-89", "type": "feature", "status": "open", "priority": "medium", "summary": "Wide alphanumeric modes: 40x16 and 40x20 text with CoCo3 attribute encoding", "tags": ["video", "text", "alphanumeric", "coco3", "gime", "attributes", "font", "palette"], "created": "2026-08-17", "updated": "2026-08-17", "description": "Add 40-column text alongside the existing 32-column VDG alpha mode. Same look, same 8x12 cell, just wider -- and 40 columns is ALREADY a CoCo3 mode (VRES_HRES_BPR_TEXT[8] = {32,40,32,40,64,80,64,80} at ~/github/xroar src/tcc1014/tcc1014.c:421, HRES=1 selects 40).\n\nGEOMETRY (both fall out exactly):\n  * 40x16 = 320x192 -- fills the framebuffer WIDTH exactly (40 x 8 = 320), letterboxed 24 lines top and bottom, which is the existing blit border offset (PIZERO_Y0=24, src/coco_boot.cpp:484). Literally the 32-col mode with the side borders removed.\n  * 40x20 = 320x240 -- fills the framebuffer ENTIRELY, no border. 20 x 12 = 240.\nNeither needs a new blit or new geometry code. Memory: 640/800 cells, doubling to 1,280/1,600 bytes when attributes are enabled.\n\nADOPT THE COCO3 ATTRIBUTE ENCODING (source-confirmed in xroar tcc1014.c:1380-1387, not from memory):\n  bit 7    BLINK      -- when set and the blink phase is on, fg is forced to bg (glyph vanishes)\n  bit 6    UNDERLINE  -- on the cell's LAST row only, the glyph row is forced to 0xFF\n  bits 5-3 FOREGROUND -- fg = 8 | ((attr >> 3) & 7)  -> palette entries 8-15\n  bits 2-0 BACKGROUND -- bg = attr & 7               -> palette entries 0-7\nAttributes are enabled by CRES bit 0; when OFF the GIME hardwires fg=1, bg=0. Two bytes per cell (char, attr interleaved) and the row stride doubles (row_stride = BPR << (CRES & 1), tcc1014.c:1131).\n\nWHY THIS FITS US PERFECTLY: CoCo3 text attributes need exactly 16 palette entries split 8 foreground / 8 background -- which is exactly the 16-entry LUT that PIZERO-55 / PIZERO-85 make writable. No adaptation needed. Also the GIME font is font_gime[1536] = 128 glyphs x 12 rows, BYTE-IDENTICAL in geometry and indexing (font[c*12+row]) to our font_6847t1[1536], so a RAM font (PIZERO-86) serves both with one format.\n\nALSO WORTH ADOPTING (all source-confirmed): $FF9A BRDR border colour -- we have visible borders in every mode narrower than 320 or shorter than 240 and they are currently hardcoded black (painted once at init, coco_boot.cpp:493); $FF9C VSC vertical scroll -- smooth text scrolling is expensive in software, near-free in the renderer; HVEN horizontal virtual screen, which forces a 256-BYTE ROW STRIDE (tcc1014.c:1131) -- the same power-of-two addressing win argued for on the graphics side, already present in the hardware. OPTIONAL: LPR variable glyph height (LPR_rowmask[8] = {0,1,2,8,9,10,11,16}, tcc1014.c:426) giving 1/2/3/9/10/11/12-row cells -- interesting because an 8-row RAM font would yield 24 text rows -- but it interacts with the UNDERLINE bit (which keys off rowmask), so adopt both together or neither.\n\nDO NOT ADOPT: MOCH / BPI (monochrome, burst-phase invert -- composite artifact controls, meaningless over HDMI); H50 (we are locked to 60Hz by PIZERO-45). 80-COLUMN IS OUT OF SCOPE HERE and cannot work in this pipeline -- 80 x 8 = 640 px against a 320-wide framebuffer. Tracked separately as PIZERO-90. Write the 40-column ceiling into the docs so nobody promises 80 later from this ticket.\n\nADDRESS-MAP CONSEQUENCE (decide with PIZERO-83): adopting GIME conventions means wanting GIME addresses -- $FF98 VMODE/LPR, $FF99 VRES/HRES/CRES, $FF9A BRDR, $FF9C VSC. That is the $FF90-$FF9F block. NOTE these do NOT collide with PIZERO-62's GIME timer at $FF94/$FF95 -- both are authentic GIME registers in the same chip's map. The outlier is PIZERO-72's hypercall. RECOMMENDATION: reserve $FF90-$FF9F wholesale as the GIME-compatible block, relocate the hypercall to $FF60-$FF6F, and use $FF60 only for things GIME never had (aperture, SD bitmap commands, RAM-font control). Be GIME-compatible wherever GIME has a concept; extend elsewhere. Depends on PIZERO-85 (palette) and PIZERO-86 (RAM font) for the full feature set, but the plain 40x16/40x20 geometry works without either.", "theme": "devices"}, {"id": "PIZERO-90", "type": "feature", "status": "deferred", "priority": "low", "summary": "80x40 native-resolution text mode via 1bpp TMDS scanout (second display path)", "tags": ["video", "text", "80-column", "libdvi", "tmds", "1bpp", "scanout", "editor", "risk"], "created": "2026-08-17", "updated": "2026-09-16", "description": "An 80x40 text mode at NATIVE 640x480 -- not a new text mode on the existing pipeline, but a SECOND SCANOUT MODE. Filed separately from PIZERO-89 because the cost profile is completely different.\n\nTHE GEOMETRY IS EXACT: 80 x 8 = 640 and 40 x 12 = 480. That is the native HDMI resolution precisely, using the SAME 8x12 cell and the SAME 1536-byte font format already in the tree (font_6847t1 / font_gime). Memory is trivial: 80 x 40 x 2 = 6,400 bytes of char+attr plus 1,536 bytes of font.\n\nTHE ENCODER ALREADY EXISTS in the vendored libdvi: tmds_encode_1bpp() is declared at lib/libdvi/tmds_encode.h:17 (hand-written assembly in tmds_encode.S) and there is a PIO-accelerated variant in lib/libdvi/tmds_encode_1bpp.pio.h. This is the standard PicoDVI high-resolution text path, not something we would invent.\n\nTHE COST -- 4x THE CORE-1 ENCODE WORK. The build is currently configured for 320x240 doubled to 640x480 (platformio.ini:46-47: -DDVI_VERTICAL_REPEAT=2 -DDVI_SYMBOLS_PER_WORD=2). Native 640x480 needs BOTH at 1, i.e. 4x the unique pixels encoded per frame on core 1. 1bpp encoding is far cheaper per pixel than the current 16bpp path and the RP2350 at 252MHz has real headroom, so this is EXPECTED to fit -- but core 1's utilisation has NEVER been measured. DO NOT START THIS BEFORE PIZERO-40 (core-1 headroom) lands; that measurement is the go/no-go, exactly as PIZERO-36 was for in-IRQ audio encode.\n\nTWO DESIGN QUESTIONS TO SETTLE:\n  (1) RUNTIME SWITCHING. DVI_VERTICAL_REPEAT and DVI_SYMBOLS_PER_WORD are COMPILE-TIME defines affecting buffer sizes and encoder selection. Moving between 320x240 graphics and 640x480 text at runtime means tearing down and re-initialising libdvi. The DVI TIMING is identical either way (640x480p60), so only the encode path and buffer layout change -- plausible, but it touches the PIO/DMA setup and must not wedge the shared PIO resources (same class of risk as the PIZERO-51 stop/restart work). Alternative: ship it as a separate build env first and defer runtime switching.\n  (2) PER-CHARACTER COLOUR. tmds_encode_1bpp encodes a span against ONE fg/bg pair, but CoCo3 attributes (PIZERO-89) give every cell its own pair. Either encode per 8-pixel cell (more per-cell overhead, still cheap) or restrict this mode to a single global fg/bg. Decide deliberately; do not discover it during implementation.\n\nWHY IT IS WORTH IT: at 80x40 the text is genuinely 1:1 sharp -- far crisper than anything the current doubled pipeline can display -- which makes a real 80-column editor on the CoCo possible. That lines up directly with docs/product-plan.md's 'write and run your own programs' positioning. Also note the audio data-island encode already shares core 1 (~2.3ms/frame per PIZERO-36) and must keep fitting alongside the heavier encode. Depends on PIZERO-40 (measurement, hard gate) and PIZERO-89 (attribute/font conventions).\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit if 80 columns is asked for; it is a second display path, not a tweak.]", "theme": "devices"}, {"id": "PIZERO-91", "type": "task", "status": "open", "priority": "medium", "summary": "Replace product-plan.md with a friends-and-family kit plan (docs/kit.md)", "tags": ["docs", "kit", "hardware", "bom", "assembly", "distribution"], "created": "2026-08-17", "updated": "2026-08-17", "description": "SUPERSEDES the original version of this ticket (which was a refresh list for docs/product-plan.md). USER DIRECTION 2026-08-17: the commercial proposal is not appropriate to this project's context -- there is no store, no orders, and no pricing tiers. Units are built in low quantity and given to friends at the author's own expense; anyone who asks is generally eligible. docs/product-plan.md DELETED in the same commit rather than edited, because half-updating it would leave a document with a confused identity (its tiering, margins, unboxing and CoCoFEST! positioning all answer questions nobody is asking).\n\nTHAT DELETION ALSO RESOLVES the most serious problem the old ticket recorded: product-plan.md:88 asserted the hot-replug symptom was 'caused by marginal dev-port VBUS' and recommended a better power supply -- a root cause PIZERO-11b explicitly retracted ('an agent assumption, not a tested result') and PIZERO-51's T1 test disproved (VBUS is never SWITCHED; there is no software VBUS control, schematic-confirmed). That claim is now gone rather than corrected. Same for the section 3.5-vs-7 self-contradiction over the audio warble, the superseded ~52Hz/PIZERO-44 language, and the inverted joystick/disk-swap scope.\n\nWRITE docs/kit.md IN ITS PLACE, covering ONLY hardware and assembly:\n  * WHAT SHIPS -- the Waveshare board (off the shelf), a case (3D-printed or an adapted off-the-shelf shell), a mini-HDMI->HDMI cable, and a USB-C male -> USB-A female OTG adapter. Those last two are the load-bearing 'incidentals': the board's HDMI is the MINI size and its USB HOST port is a Type-C (README.md:76 -- the OTHER Type-C is power/programming), so a normal USB keyboard cannot physically reach the host port without an adapter. Without both items the unit is unusable and the recipient will not know why.\n  * WHAT DOES NOT SHIP -- keyboard (any simple wired USB one), microSD (any), USB-C power (any phone charger), HDMI cable (if a mini->HDMI cable rather than an adapter is supplied), and ROMs/games/programs (recipients source their own; gifting is still distribution, so the no-copyrighted-ROMs rule from the deleted plan's section 4 still holds and is already stated in README.md).\n  * PRE-FLASH EVERY UNIT. The build already emits .pio/build/pizero_stream_60/firmware.uf2 (~483 KB), so the update path for a recipient is hold BOOT, plug USB-C, drag the .uf2 onto the RPI-RP2 drive -- no PlatformIO, no toolchain. Ship that .uf2 on the SD card if one is included. This is the difference between a thing people play with and a thing that sits in a drawer.\n  * THE GOTCHA CARD -- these four items will generate every support question, so print them: (1) THE KEYBOARD MUST BE ATTACHED BEFORE POWER-ON; hot-plug does not work and is a hardware limitation, not a pending fix (PIZERO-51). (2) USB 1.1 ONLY -- simple wired keyboards and full-speed wireless receivers work; high-speed USB 2.0 peripherals do not enumerate. (3) The two Type-C ports look identical -- label which is power and which is host. (4) FAT32 SD card, ROMs in /coco, see AUTORUN.md.\n\nCASE -- OPEN QUESTION TO SETTLE BEFORE ORDERING IN QUANTITY: the board is 65 x 30 mm, the SAME OUTLINE as a Raspberry Pi Zero, so off-the-shelf Pi Zero shells should fit the footprint and mounting holes. BUT a real Pi Zero uses MICRO-USB where this board uses USB-C, and it has an extra Type-C, a 2-pin battery connector and a 3-pin debug header. So the cutouts will NOT line up even though the outline does. Verify with one physical case before buying ten: either enlarge the USB cutouts (easy in soft plastic), print a custom shell, or choose an open-edge/GPIO-exposed style where the sides are open anyway. Must expose both Type-C ports, mini-HDMI, the microSD slot, and BOOT BUTTON ACCESS -- BOOT is the recovery path when a flash goes wrong.\n\nBOM / QUANTITY: initial run of 10 units. Board pricing as of research 2026-08-17: $9.99 direct from Waveshare's own store vs $17.17 on Amazon (both per CNX Software's launch coverage), and ~$7.21 seen on AliExpress. Waveshare-direct is roughly half the Amazon price, so ordering the boards direct is the single biggest lever on total cost; order spares, since the board is the only irreplaceable item in the kit. Accessory prices were NOT obtainable programmatically (Amazon blocks automated price retrieval) -- fill in real figures when ordering rather than trusting an estimate.\n\nALSO STILL OPEN from the old ticket, unaffected by the deletion: docs/BUILD.md section 5 tells the builder to verify 'fps~=52' when the default pizero_stream_60 env runs at 60 -- one-word fix. And ROADMAP.md needs a pass to add PIZERO-83..91 and retire its 'Now: Input/USB' framing now that PIZERO-51's software path is disproven. ALREADY OWNED ELSEWHERE: docs/cpu-speed.md's stale budget figures are PIZERO-88; the missing docs/compatibility.md referenced by ROADMAP.md:25 is PIZERO-52.", "theme": "kit"}, {"id": "PIZERO-92", "type": "feature", "status": "open", "priority": "high", "summary": "Say what is wrong instead of showing a black screen", "tags": ["ux", "boot", "diagnostics", "vdg", "sd", "rom", "kit", "first-run"], "created": "2026-08-17", "updated": "2026-09-17", "description": "FOUND while drafting docs/kit.md 2026-08-17 by checking the failure path rather than assuming it. THE PROBLEM: if the SD card has no /coco/roms/bas12.rom, setup() prints 'ROM load FAILED (need /coco/bas12.rom [+extbas11.rom])' and RETURNS EARLY (src/main.cpp:1066); g_machine_running stays false and loop() just delay(1000)s (:1201). The message goes ONLY over USB-CDC serial. But multicore_launch_core1(core1_main) already ran at :1060, so libdvi IS running -- the monitor SYNCS and then shows a black frame.\n\nWHY THAT IS THE WORST POSSIBLE FAILURE MODE: a monitor that syncs to a black picture is indistinguishable from a dead unit. The recipient of a gifted unit (PIZERO-91) has no serial console, no expectation of one, and no reason to suspect the ROM. They will conclude the hardware is broken. This is the single most likely first-run experience for anyone who plugs in before reading the card, because we deliberately ship NO ROMs (copyright) -- so EVERY unit fails this way on first power-up BY DESIGN.\n\nSAME CLASS OF FAILURE, same silent result: SD mount failure ('SD mount FAILED -- no ROMs, idle.', main.cpp:1065) and coco_machine_init failure (:1070). All three return early to a black screen.\n\nFIX: draw the diagnostic to the framebuffer instead of only to serial. The renderer needed already exists and is cheap -- coco_boot_blit_vdg_pizero_src(const uint8_t*, uint16_t*) (coco_boot.h:76) takes any VDG-format buffer, and font_6847t1 is available; PIZERO-81b is porting exactly this kind of small text-card renderer (coco_boot_card_clear / card_text / card_buffer from the AMOLED port). If PIZERO-81b lands first, reuse its card renderer verbatim -- this is the same 32x16 text card with different content. Otherwise this ticket justifies building it, and PIZERO-81b then reuses THIS.\n\nMESSAGE CONTENT should be actionable, not an error code -- the reader is a non-technical recipient:\n  * no SD card / mount failed -> 'NO SD CARD -- INSERT A FAT32 CARD'\n  * card present, no bas12.rom -> 'NO ROM FOUND. COPY bas12.rom TO /coco/roms/ ON THE SD CARD. SEE THE CARD IN THE BOX.' Name the exact file and path; that is the whole fix for them.\n  * machine init failed -> a distinguishable message so a real fault is not confused with a missing file.\nKeep it legible on a TV at a distance: the existing 32x16 card at 8x12 glyphs is right, and it is the same look as the emulator so it does not appear to be a different device.\n\nALSO: keep the serial messages, do not replace them -- they are how WE debug. And ensure the screen keeps refreshing / the loop still pets the watchdog (PIZERO-33) so the board does not appear to hang while showing the message.\n\nPRIORITY high, ahead of most of the video-mode work: it is small, it reuses existing code, and it is the difference between a gift that works and a gift that looks broken. Blocks nothing, but PIZERO-91 (kit.md) currently has to warn recipients in print that a black screen is expected -- which is a documentation workaround for a UX bug.\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"On-screen boot diagnostics: a missing ROM currently shows a BLACK SCREEN with no explanation\"]", "theme": "trust"}, {"id": "PIZERO-93", "type": "task", "status": "open"
