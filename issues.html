<script id="snapshot" type="application/json">{"issues": [{"id": "PIZERO-01", "summary": "Confirm RP2350-PiZero pinout (HDMI, SD, USB host)", "description": "RESOLVED from the Waveshare schematic + official demo source (docs/RP2350-PiZero-schematic.pdf, .ref/demo). RP2350B, 520KB SRAM, 16MB flash, PSRAM pad UNPOPULATED. HDMI TMDS on GPIO32-39 (D2=32/33, D1=34/35, D0=36/37, CLK=38/39). microSD SPI: SCK=30, MOSI=31, MISO=40, CS=43, card-detect=22, ~12.5MHz. PIO-USB host: D+=28, D-=29. I2C0 SDA=6/SCL=7, UART0 TX=0/RX=1, WS2812 LED=2. Full pinout in README.md.", "type": "decision", "status": "done", "priority": "high", "created": "2026-05-27", "updated": "2026-05-27", "tags": ["hardware", "pinout"], "theme": "platform"}, {"id": "PIZERO-02", "summary": "Decision: libdvi (PIO) DVI, 320x240 fb hardware-doubled to 640x480", "description": "RESOLVED. HDMI is wired to GPIO32-39, but HSTX is hardwired to GPIO12-19 only, so HSTX CANNOT drive this board's HDMI -- libdvi (Wren6991/PicoDVI, PIO) is mandatory, matching Waveshare's reference demo. Framebuffer = 320x240 RGB565 (~154KB, fits 520KB SRAM); libdvi scans out pixel/line-doubled (DVI_VERTICAL_REPEAT=2) to 640x480p 60Hz. CoCo 256x192 centers in 320x240 -> 512x384 with blank borders on screen. Config = pico_sock_cfg, invert_diffpairs=false, pio_set_gpio_base(pio,16). See README.md.", "type": "decision", "status": "done", "priority": "high", "created": "2026-05-27", "updated": "2026-05-27", "tags": ["display", "decision"], "theme": "platform"}, {"id": "PIZERO-02b", "summary": "DEFERRED: reconcile DVI (~252MHz) vs PIO-USB (120/240MHz) system clock", "description": "DEFERRED to the USB phase (PIZERO-11+). Decision: prove XRoar rendering first by running DVI at its native ~252MHz TMDS clock (close to the AMOLED port's 250MHz, so emulation gets full headroom and no clock compromise). The conflict only matters once USB host is added: libdvi 640x480p60 needs sys ~252MHz, Pico-PIO-USB needs exactly 120/240MHz (252/48 is fractional -> USB jitter). A custom DVI driver would NOT help -- the bit-rate=sysclk coupling is inherent to PIO DVI. When revisited: feed libdvi a 240MHz-friendly 640x480 timing (24MHz pixel clock ~57Hz, monitor-tolerated) so USB is happy, and verify on a real monitor. [IN-PROGRESS 2026-05-28: spike on path 1 -- sysclk 252->240 MHz with a custom 640x480 timing at 24 MHz pixel clock (~57.14 Hz refresh). Unblocks PIZERO-11.] [DONE 2026-05-28: path 1 verified on hardware. sysclk 240 MHz, custom 640x480 timing at 24 MHz pixel clock (~57.14 Hz refresh) -- monitor accepts, BASIC boots normally, emulator still hits 60 fps (decoupled from display refresh via FRAME_PERIOD_US). Unblocks PIZERO-11.]", "type": "task", "status": "done", "priority": "low", "created": "2026-05-27", "updated": "2026-05-28", "tags": ["risk", "clock", "display", "usb", "deferred"], "theme": "platform"}, {"id": "PIZERO-03", "summary": "Fork reusable skeleton from the AMOLED port", "description": "Copy board-agnostic code from ~/github/coco-rp2350-waveshare-touch-amoled-18: lib/xroar_core, lib/coco_machine, src/coco_boot.cpp/h, AUTORUN.md, deploy.sh. OMIT board-specific: lib/sh8601, lib/qspi_pio, lib/hal (touch/IMU), src/hw_config.c (AMOLED SD pins), and the AMOLED-rotation parts of the blitter. main.cpp written fresh for libdvi. DONE: xroar_core/coco_machine/psram_stub/coco_boot reused unchanged; AMOLED display/QSPI/HAL omitted.", "type": "task", "status": "done", "priority": "high", "created": "2026-05-27", "updated": "2026-05-27", "tags": ["scaffolding"], "theme": "platform"}, {"id": "PIZERO-04", "summary": "PlatformIO config for RP2350B + earlephilhower + libdvi", "description": "platformio.ini: RP2350B board id (-DPICO_RP2350B=1), framework=arduino (earlephilhower). Vendor libdvi (Wren6991/PicoDVI, from .ref/demo Arduino/01-DVI) into lib/; lib_deps Pico-PIO-USB + Adafruit TinyUSB, carlk3/no-OS-FatFS-SD. USB Stack = Adafruit TinyUSB. Keep -O2, build_unflags=-Os, lib_ldf_mode=deep+. Arduino.h before XRoar headers (_Bool gotcha). System clock per PIZERO-02b. DONE (build-verified): board=waveshare_rp2350_pizero, -DPICO_PIO_USE_GPIO_BASE=1 for TMDS on GPIO32-39, DVI_VERTICAL_REPEAT=2, DVI_SYMBOLS_PER_WORD=2. Fixed tmds_encode.S assembly by guarding the SDK config includes in dvi_config_defs.h under !__ASSEMBLER__. Compiles+links to firmware.uf2, RAM 31.7%.", "type": "task", "status": "done", "priority": "high", "created": "2026-05-27", "updated": "2026-05-27", "tags": ["build"], "theme": "platform"}, {"id": "PIZERO-05", "summary": "libdvi bring-up: 320x240 test pattern on HDMI monitor", "description": "Port the hello_dvi reference (libdvi, pico_sock_cfg, TMDS on GPIO32-39, gpio_base=16, vreg ~1.2V) to show a static 320x240 RGB565 test pattern scaled to 640x480p60 on a real HDMI monitor. DVI IRQ/scanout on core1. Confirm stable sync and correct RGB565 colors (watch byte order). Baseline before integrating emulation. DONE: verified on hardware 2026-05-27 — colour bars (black/blue/green/cyan/red/magenta/yellow/white) + white border render correctly at 640x480, confirming pin map, TMDS sync, RGB565 byte order (no swap), and 2x doubling.", "type": "task", "status": "done", "priority": "high", "created": "2026-05-27", "updated": "2026-05-27", "tags": ["display", "bringup"], "theme": "platform"}, {"id": "PIZERO-06", "summary": "SRAM RAM-allocation path in coco_machine", "description": "coco_machine currently leans on PSRAM for the 64KB CoCo RAM. PiZero PSRAM pad is unpopulated; allocate CoCo RAM from main SRAM (static/SRAM malloc) like the AMOLED port did. Verify against the SRAM budget alongside the 154KB framebuffer + libdvi TMDS buffers. DONE: psram_stub 64KB SRAM pool backs the CoCo RAM; verified by successful link + boot (no PSRAM).", "type": "task", "status": "done", "priority": "medium", "created": "2026-05-27", "updated": "2026-05-27", "tags": ["memory", "coco_machine"], "theme": "platform"}, {"id": "PIZERO-07", "summary": "New coco_boot_blit_vdg() -> 320x240 centered, no rotation", "description": "Re-derive the blitter for the 320x240 RGB565 framebuffer: map the nibble-packed VDG 256x192 buffer + palette into a centered 256x192 region (32px L/R, 24px T/B border), no rotation (landscape native). Feed scanlines to the libdvi colour-buffer queue. Re-derive any lookup tables. Simpler than the AMOLED portrait-rotation math. DONE: coco_boot_blit_vdg_pizero verified on hardware — CoCo image centered with black border, correct colors.", "type": "task", "status": "done", "priority": "high", "created": "2026-05-27", "updated": "2026-05-27", "tags": ["display", "blitter"], "theme": "platform"}, {"id": "PIZERO-08", "summary": "SD mount + ROM load on PiZero SD pins", "description": "Wire no-OS-FatFS-SD to the PiZero microSD SPI pins (SCK=30, MOSI=31, MISO=40, CS=43, CD=22, ~12.5MHz). Mount the card and load /coco/bas12.rom + /coco/extbas11.rom into the 16KB ROM image via the existing coco_boot ROM loader. DONE: SD mounted and ROMs loaded on the PiZero spi1 pins; Color BASIC reached OK.", "type": "task", "status": "done", "priority": "high", "created": "2026-05-27", "updated": "2026-05-27", "tags": ["storage", "sd"], "theme": "platform"}, {"id": "PIZERO-09", "summary": "Milestone: Color BASIC boots to OK on HDMI", "description": "Integrate emulator loop + blitter + libdvi scanout: XRoar runs, VDG output renders, Color BASIC reaches the OK prompt on the HDMI monitor. Parity with the AMOLED port's Phase 2. DONE 2026-05-27: Color BASIC boots to OK on HDMI at 54fps (cpu 9.3ms, render+blit 9.4ms per frame). Above the 30fps target; ahead of the AMOLED port (~15fps).", "type": "milestone", "status": "done", "priority": "high", "created": "2026-05-27", "updated": "2026-05-27", "tags": ["milestone"], "theme": "platform"}, {"id": "PIZERO-10", "summary": "Autonomous AUTORUN.TXT demo on HDMI", "description": "Get the AUTORUN.TXT autotype + disk/cart demo path working on HDMI (parity with AMOLED Phase 3): @DISK/@CART/@DIRECT directives, LOADM .bin direct-load, autotype queue. Confirm a self-running BASIC/demo on the monitor. DONE 2026-05-27: verified on hardware — dsk finder fixed (skips macOS ._* files, attaches real coco.dsk); sample-sd/coco/autorun.txt autotypes a BASIC graphics demo that self-runs on HDMI.", "type": "task", "status": "done", "priority": "medium", "created": "2026-05-27", "updated": "2026-05-27", "tags": ["demo", "autorun"], "theme": "platform"}, {"id": "PIZERO-11", "summary": "PIO-USB host bring-up: enumerate a USB keyboard", "description": "DONE 2026-05-29 on hardware. Pico-PIO-USB host on the PIO-USB port (D+=28 / D-=29) brought up via Adafruit_TinyUSB, host stack on PIO 1 (libdvi owns PIO 0). Three fixes were needed for a clean enumeration + report flow:\\n\\n(1) Initialize USB host BEFORE multicore_launch_core1 — alarm_pool_create() spins forever if core 1 is already inside libdvi's DMA-IRQ loop. Init while core 1 is idle, then launch libdvi.\\n\\n(2) Add -DCFG_TUH_HID_EPIN_BUFSIZE=64 / EPOUT_BUFSIZE=64 to build flags so TinyUSB has a place to land incoming HID reports.\\n\\n(3) Call tuh_hid_set_default_protocol(HID_PROTOCOL_BOOT) BEFORE USBHost.begin() — common wireless keyboard/mouse dongles need to be talked to in boot protocol for reports to flow without report-descriptor parsing. Doing it via set_default (pre-mount) keeps both interfaces mounting cleanly; trying it via set_protocol AFTER mount breaks the second interface.\\n\\nVerified: USB-A wireless dongle enumerates (VID:PID 05ac:0256), two interfaces mount (idx=0 boot mouse, idx=1 generic), and [usb] HID report lines stream 8-byte boot-keyboard reports as keys are pressed (e.g. 0x2C = space). PIZERO-12 (HID -> DSCAN) picks up from here.\\n\\nKNOWN CAVEAT: not all USB devices enumerate — modern USB 2.0 high-speed keyboards/mice (e.g. Keychron K2, standalone gaming mice) do not work with PIO-USB's 1.1-only stack. Period-correct simple wired USB keyboards or wireless USB receivers are the compatible class.", "type": "task", "status": "done", "priority": "low", "created": "2026-05-27", "updated": "2026-05-29", "tags": ["input", "usb"], "theme": "input"}, {"id": "PIZERO-12", "summary": "Map USB HID keycodes -> CoCo keyboard matrix", "description": "DONE 2026-05-29 on hardware. USB HID boot-keyboard reports are translated into CoCo DSCAN codes and injected via the existing coco_machine_press_key()/release_key() matrix hooks. Verified: typing PRINT \"HI\" + Enter on a USB keyboard via the wireless dongle yields the expected output in Color BASIC on the HDMI display.\n\nImplementation in src/main.cpp: (1) static 256-entry hid_to_dscan[] lookup mapping HID usage codes to CoCo K_* values with 0xFF sentinel for unmapped; (2) hid_keyboard_apply() diffs the current 6-byte HID keycode set against the previous and issues press/release events for transitions, plus shift modifier handling (HID bits 1/5 of byte 0); (3) per-key release in pump_keyboard() so autotype/serial input no longer clears USB-held keys via release_all_keys().\n\nNotes: works around our test dongle mislabeling its keyboard interface as proto=2 (mouse) by treating any 8-byte report as a boot-keyboard report regardless of declared protocol. tuh_hid_set_default_protocol(HID_PROTOCOL_BOOT) (PIZERO-11) keeps incoming reports in the predictable 8-byte format.", "type": "task", "status": "done", "priority": "high", "created": "2026-05-27", "updated": "2026-05-29", "tags": ["input", "keyboard"], "theme": "input"}, {"id": "PIZERO-13", "summary": "USB gamepad/joystick -> CoCo joystick", "description": "Map a USB HID gamepad to the CoCo joystick axes/buttons. [2026-06-28 PROMOTED to high -- this is the joystick path the user actually wants: they have a PS2-style USB controller to try and expect the analog sticks to work. Reuses the joystick-injection API/comparator from PIZERO-50 (coco_machine_set_joystick_axis/fire + the PIA0 PA7 DAC compare in coco_pia0_preread_a). TWO REAL RISKS to validate on hw: (1) ENUMERATION -- PIO-USB is USB 1.1 only (PIZERO-11a/11b caveat); a USB controller/adapter may or may not be a full-speed 1.1 HID, so first confirm it enumerates at all (and, until PIZERO-11b is fixed, boot with it attached). (2) PARSING -- gamepads have NO boot protocol, so the current 'any 8-byte report = boot keyboard' path (PIZERO-12) does NOT apply; need tuh_hid_parse_report_descriptor in tuh_hid_mount_cb to find the X/Y/Z/Rz axes + button usages and decode the report-protocol reports. Map two analog axes -> CoCo port-0 axes (scale to 0..65535), one button -> fire. Verify: PRINT JOYSTK(0) sweeps with the stick, fire registers.]\n\n[2026-09-28 BUILT, ported from the Fruit Jam port (FRUITJAM-18, done on hardware with the same pad), awaiting hardware here.] The user's pad is multi-mode: it mounts as a Switch Pro (057E:2009, silent) and re-enumerates itself as a DualShock 4 (054C:09CC) about 2 s later; only the DS4 identity is bound, by VID/PID, and decoded at fixed offsets (it supplies no report descriptor, so descriptor parsing cannot handle it). src/gamepad.h (host-tested, test/test_gamepad): pad_identify, pad_axis (deadzone 0x06, measured in FRUITJAM-92), pad_decode_ds4. Mapping as Fruit Jam: left stick -> RIGHT CoCo joystick (port 0), right stick -> LEFT (port 1), D-pad overrides the left stick; cross/circle/R1 = right fire, square/L1 = left fire. lib/coco_machine: coco_machine_set_joystick_axis/fire and release_all_joysticks; coco_pia0_preread_a now pulls PA0/PA1 for fire and answers the PA7 comparator via joy_compare.h (CB2 = port, CA2 = axis, threshold ((PIA1 A & 0xFC)|2)<<8). Before this, PA7 always read high. main.cpp: pad bound at tuh_hid_mount_cb, released (sticks centered, fire up) on unmount; reports from any known pad identity are kept off the keyboard path, which previously took any report of 8+ bytes (PIZERO-12) and would have typed junk from the pad's 64-byte reports; the bound pad is exempt from the PIZERO-51 phantom-flood detector (pizero_hotplug env only), since a pad at rest repeats identical reports. Keyboard and pad together need an external hub: PIZERO-54. HARDWARE CHECK: pad alone, type over serial: PRINT JOYSTK(0),JOYSTK(1) sweeps 0-63 with the left stick; JOYSTK(2),JOYSTK(3) with the right; PRINT PEEK(65280) shows fire bits clear on cross (bit 0) and square (bit 1); serial shows the Switch identity then the DS4 mount as 'gamepad'.\n\n[2026-09-28 CONFIRMED ON HARDWARE (user): sticks and both fire buttons respond, via PRINT JOYSTK(0..3);PEEK(65280)AND3.] WHAT THE PAD ACTUALLY DID ON THIS BOARD (differs from Fruit Jam): it is a GameSir Tegenaria Lite, and it never took the DS4 identity here. Identities seen: 057E:2009 Switch Pro (silent; where it sits after Home+Y, and where it returned after RUN restarts and a power-on); 3537:1093 with automatic detection restored (hold Home 10 s): a keyboard+mouse+vendor descriptor whose vendor report 0x10 carries the standard Xbox 360 input report (PAD_XINPUT decoder); 3537:1094 in Android mode (Home+A): a standard HID gamepad on interface 0 (PAD_HIDGP decoder, the mode tested). All layouts were measured with a PAD_PROBE build (descriptor at mount, reports on change; now off by default, -DPAD_PROBE=1 to measure a new pad). A pad now binds on the first interface whose report its decoder accepts, since the GameSir identities put the gamepad on different interfaces. Found on the way: a signed-axis Y flip by negation missed the top rail by one (fixed with -1-d, host-tested). 180 host tests. Deliberately NOT done, filed: the Switch Pro handshake so Switch mode works (PIZERO-157); keyboard and pad together needs a hub (PIZERO-54, open); unused pad buttons (Start, Select, top face, triggers) are not mapped to keys, pending the user's call. Docs: README item 7.", "type": "task", "status": "done", "priority": "high", "created": "2026-05-27", "updated": "2026-09-28", "tags": ["input", "joystick", "usb", "gamepad"], "theme": "input"}, {"id": "PIZERO-14", "summary": "Dual-core split: emu + video render on core0, libdvi scanout on core1", "description": "core0 = CoCo emulation; core1 = libdvi DVI scanout (IRQ-driven) + SD/USB host servicing. Pico-PIO-USB host already wants to run on core1, and libdvi scanout runs on core1 too -- confirm they coexist (PIO blocks: libdvi on pio0, PIO-USB on another). Depends on the system-clock outcome from PIZERO-02b. Target >=30fps per the README. DONE 2026-05-27: double-buffered (two 320x240 fbs, core1 samples volatile front ptr once/frame, core0 renders back then publishes) — tear-free, locked 60fps, RAM 89%. Note: fully offloading video to core1 is impossible (libdvi owns core1) and unnecessary (core0 uses 11.3/16.76ms). [2026-08-17 CORRECTION (PIZERO-83 session): the original summary said 'emu on core0, video/USB/SD on core1', which does not describe the shipped code. ACTUAL split, read off src/main.cpp: core 1 runs ONLY libdvi (core1_main at :200 -- dvi_register_irqs_this_core + dvi_start + dvi_static_framebuf_main_16bpp, which never returns); there is no loop1()/setup1() in this port. Core 0's loop() (:1122) does USBHost.task(), pump_keyboard(), emulate, VDG render, blit, audio and pacing -- so USB and BOTH video stages are on core 0, not core 1. Core 1's only non-scanout work is the per-line HDMI audio data-island encode inside the DVI IRQ (HDMI_STREAM_AUDIO, ~2.3ms/frame per PIZERO-36). The description's closing note was already correct; only the summary was wrong. Kept done -- this is a record correction, not reopened work.]", "type": "task", "status": "done", "priority": "medium", "created": "2026-05-27", "updated": "2026-05-27", "tags": ["perf", "dual-core"], "theme": "platform"}, {"id": "PIZERO-15", "summary": "Performance pass: instrument timing, tune clock/vreg", "description": "Add per-frame timing instrumentation (CPU/blit/scanout) like the AMOLED port. Tune the system clock and vreg within the PIZERO-02b constraints to hit >=30fps. Compare real-time % against the AMOLED port baseline (~36%). DONE 2026-05-27: hit locked 60fps. Two core-0 wins: (1) blit skips re-clearing the static border each frame (54->58fps), (2) alpha renderer uses a precomputed glyph->packed-word LUT instead of per-pixel put2 RMW, cutting render 6.4ms->0.56ms. Per-frame core0 = cpu 9.4ms + render 0.56ms + blit 1.5ms = 11.5ms (<16.76ms budget).", "type": "task", "status": "done", "priority": "low", "created": "2026-05-27", "updated": "2026-05-27", "tags": ["perf"], "theme": "platform"}, {"id": "PIZERO-16", "summary": "TMS9918A video chip as an add-on, using the vrEmuTms9918 library (F18A extensions later)", "description": "HEAVIER TRACK behind PIZERO-26. The lightweight, faithful first increment -- a programmable palette that augments the native VDG (GIME-style palette registers) -- was split out into PIZERO-26 and is the preferred near-term direction (keeps the CoCo architecture, recolors existing modes, no foreign chip). THIS issue remains the full 'alternate video device' exploration beyond what a palette indirection gives. DEFERRED / future exploration. Add an optional alternate video mode that emulates a sprite-capable, higher-color video chip in place of (or alongside) the MC6847 VDG, to explore 'what if the CoCo had a different graphics board'. Target: TMS9918A-class features first (32 hardware sprites, 15-color palette, tile/pattern modes) -- period-correct alternative to the 6847; stretch to V9938/V9958 (256 colors, more sprites, per-line palette). Prior art on RP2350 to mine: PICO9918 PRO (visrealm/pico9918) emulates the TMS9918A on an RP2350 with HDMI out (open source); console PPUs already run on RP2350+DVI (pico-infonesPlus NES PPU, pico-genesisPlus/pico-smsplus Sega VDPs). NOTE: those projects drive HDMI via HSTX (GPIO12-19); our board wires HDMI to GPIO32-39 so HSTX is unavailable -- reuse only the VDP emulation core, keep our libdvi/PIO scanout. Implementation sketch: VRAM array + register file + per-scanline renderer feeding the existing 320x240 RGB565 libdvi framebuffer; branch coco_machine's VDG hookup (lib/coco_machine) to route to an alternate video device. Investigate how XRoar models video devices and whether the alternate chip is bus-addressable like a cart/expansion. References captured in chat 2026-05-27.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit if the PIZERO-83/84 video device lands and sprites become a small addition rather than a new subsystem.]\n\n[2026-10-01 PROMOTED from a deferred experiment, user: 'TMS9918A seems to be a no brainer. it always looked good on the ti.'] Concrete plan: emulate a TMS9918A at a cartridge I/O address using vrEmuTms9918 (MIT, by Troy Schrapel), the core inside the PICO9918 (github.com/visrealm/pico9918), already proven on RP2040/RP2350. WHY IT FITS: 15 colors + transparent, 32 sprites, its own 16 KB of video memory, Graphics I/II, 40x24 text and multicolor modes; 256x192 fits today's 320x240 framebuffer exactly, like the 6847, so no new display path; and it pairs with the SN76489 we already emulate (PIZERO-143), the ColecoVision's video-and-sound combination. LATER: the F18A extensions on the same base (64-color palette from 4,096, smooth scrolling on two layers, up to 32 sprites per line, a coprocessor); its 80-column text needs the 640-wide path (PIZERO-175). Upstream XRoar has no TMS9918A, so this is new code, not a port. DEFAULT: on, as an extension (the CoCo Zero is a developer's playground; 'classic' turns extensions off, PIZERO-177). TO DECIDE: the I/O address (must not clash with the FDC, the SN76489 at $FF41, the GIME registers at $FF90-$FFBF or the hypercall plans of PIZERO-72), how the CoCo screen and the TMS9918A screen share the display (switch, or overlay with the 9918's transparent color), and the vertical-blank interrupt line.", "type": "task", "status": "open", "priority": "medium", "created": "2026-05-27", "updated": "2026-10-01", "tags": ["experiment", "display", "video", "sprites", "deferred", "future"], "theme": "devices"}, {"id": "PIZERO-17", "summary": "Custom wavetable/sampled-voice synth device (Blofeld-style) for the CoCo", "description": "[REFRAMED 2026-07-19: the goal is NOT to emulate a classic chip (those are already emulated elsewhere) but to build an ORIGINAL synth engine as a CoCo sound device -- specifically a WAVETABLE + SAMPLED-VOICE engine in the spirit of the Waldorf Blofeld (morphing wavetables, per-voice multimode filter, envelopes/LFOs). The old AMY/AY/SID framing is kept at the bottom as reference alternatives only.] OUTPUT PATH NOW EXISTS: PIZERO-18's 48 kHz/16-bit SPSC-ring -> HDMI data-island path shipped (PIZERO-35/45), so the old hard dependency is satisfied. The synth generates NATIVELY at 48 kHz (no resampling, unlike the tick-keyed CoCo DAC), mixes with the CoCo audio in audio_emit (coco_machine.cpp), and rides the existing ring out to HDMI. PLACEMENT: runs on CORE 0 (where CoCo audio is already produced); core 1 is full (DVI TMDS encode + scanout + USB + SD servicing), no room. BUDGET (measured, README perf table): core-0 per 16.67 ms frame = ~11.5 ms used (emu 9.4 + render 0.56 + blit 1.5), ~5.3 ms (31%) FREE -- but that free slice is ALSO the frame-drop safety margin and the SAM high-speed-POKE ceiling (PIZERO-48), so budget only ~3-4 ms/frame for synth. At ~3.5 ms/frame that is ~880k cyc/frame / 800 samples = ~1100 cyc/sample for the WHOLE synth -> rough polyphony: ~10 voices at 100 cyc/sample (wavetable+lin-interp+ADSR), ~7 at 150 (+resonant filter+wave morph), ~4-5 at 250 (Blofeld-grade: 2D wavetable interp + multimode filter + 2 env + LFOs). Confirm the real cycles/voice via the PIZERO-58 bench BEFORE committing. Synth cost is CONSTANT/predictable per active voice (unlike emulation), so use a CONFIGURABLE VOICE CAP + graceful degradation (drop voices / simpler interp when a frame runs long). COMPUTE: RP2350 M33 cores have single-precision FPU + DSP/SIMD -> float wavetables/filters (~1-3 cyc/op) OR Q15 fixed with DSP MACs; pick per the bench. MEMORY IS THE REAL CONSTRAINT (not CPU): SRAM is ~89-94% used (double-buffer video + the audio ring) leaving only tens of KB, and the PSRAM pad is UNPOPULATED on this board -- so wavetables/samples CANNOT live in SRAM. They live in the 16 MB FLASH (ample), read via XIP; for the hot per-sample loop MIRROR only the active wave frame(s) into SRAM (~1 KB: current+next morph frame, 256 samples x 2 B each) so XIP cache-miss jitter never hits the inner loop. SAMPLED/PCM VOICES are the tricky bit: sequential playback has OK XIP locality but PITCHED (interpolated, non-unity-rate) playback wanders flash and can thrash the cache -> add a small SRAM prefetch/DMA window per playing sample; PROTOTYPE this before committing. Loading NEW banks from SD at runtime = flash PROGRAMMING, which STALLS XIP on both cores (video hiccup) -> do bank loads only at a 'load' moment (BIOS action / between titles), never mid-performance; bank SWITCHING within already-flashed data is just a pointer change (free). CONTROL SURFACE (this is the 'design your own engine' part): intercept guest bus writes to a chosen address range into a synth register file (same trick as the PIZERO-55 $FFB0 palette interception, or branch coco_machine like the VDG hookup); YOU define the register map -- note on/off/pitch, wavetable select, morph position, envelope, filter cutoff/res, LFO routing. Guest writes are tick-keyed; render the synth in SUB-BLOCKS (e.g. 8 x 100 samples ~= 2 ms) so control latency feels instrument-tight. Gate behind a build flag; RAM is the gating constraint so measure RAM cost too. DEPENDS ON: PIZERO-58 (voice-budget bench, do first). Cross-link docs/ROADMAP.md, docs/hdmi-audio-notes.md, PIZERO-55 (shared bus-interception mechanism). Verify on hw: N-voice patch plays via a $range poke, correct pitch, fps stays 60 / core-0 frame < 16.67 ms, no video hiccup.\\n\\n---\\n[PRIOR FRAMING kept for reference -- classic-chip alternatives, superseded by the custom-engine goal above:] Companion to PIZERO-16 (alternate video): add an optional synth/sound-chip 'sound board' for the CoCo, beyond the native 6-bit DAC + single-bit sound XRoar already emulates. PRIMARY candidate: AMY (shorepine/amy), a fixed-point MCU synth library that runs on RP2350 (Arduino support for ESP32-S3/RP2040/RP2350/Teensy; AMYboard hardware is ESP32-S3 but the engine is portable). AMY gives virtual-analog (Juno-6), FM (DX7 6-op), partial/breakpoint (Alles/Atari AMY), wavetable/PCM sampler, and an 808-style drum machine -- expose a few as an alternate sound device. Discrete-chip alternatives (portable C cores): AY-3-8910/YM2149 (libayemu, emu2149 -- cheap, period-correct), SID 6581/8580 (reSID heavy; lighter reimpls -- aspirational), YM2612/SN76489 (libOPNMIDI, ymfm -- FM, cycle-hungry). RP2350 reference: Datanoise PicoADK v2.\\n\\nPREREQUISITE DECISIONS (gate the work):\\n1. Audio output path -- our Waveshare board has no audio DAC and libdvi isn't set up for HDMI audio. Choose PWM audio, I2S to an external DAC, or add HDMI audio islands to libdvi. Decide first (analogous to the PIZERO-02b clock decision for video).\\n2. CPU/core budget -- core0 ~11.5/16.76ms at 60fps, core1 owned by libdvi scanout (+ future USB host). AMY/AY are affordable, SID/FM are not. Likely generate a fixed sample-block per frame on whichever core has slack.\\n\\nImplementation sketch: a synth/sound device fed either by a bus-addressable register interface (chip emulation, branch coco_machine like the VDG hookup) or by a higher-level note API (AMY). References captured in chat 2026-05-27.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit if MIDI (PIZERO-59/60) is ever picked up, or if someone asks for the CoCo as a sound module.]", "type": "feature", "status": "deferred", "priority": "low", "created": "2026-05-27", "updated": "2026-09-16", "tags": ["audio", "sound", "synth", "wavetable", "sampler", "device", "future"], "theme": "devices"}, {"id": "PIZERO-11a", "summary": "Investigate why USB host port on PiZero refuses to enumerate (hardware-level)", "description": "DONE 2026-05-29 — no hardware investigation needed. The board supports USB host correctly. The earlier failures were device-compatibility, not board hardware: PIO-USB is USB 1.1 only, so high-speed USB 2.0 devices (Keychron K2, standalone mouse) do not enumerate. A full-speed wireless USB receiver enumerated and streamed HID reports as documented in PIZERO-11.", "type": "task", "status": "done", "priority": "low", "created": "2026-05-28", "updated": "2026-05-29", "tags": ["input", "usb", "hardware", "deferred"], "theme": "input"}, {"id": "PIZERO-11b", "summary": "A USB device pulled out is never noticed, so nothing works until reboot", "description": "OPEN / UNDIAGNOSED. Symptom: USB devices enumerate only on a cold boot with the device already attached; unplugging and re-plugging (or hot-plugging a new device) does not re-enumerate.\n\nNO CONFIRMED ROOT CAUSE — nothing has been tested or verified. Two UNVERIFIED hypotheses have been raised, neither reproduced or ruled out:\n  (1) Power: insufficient VBUS / inrush current from the development USB-C port. Would predict that powering the board from a battery / powered hub makes hot-replug work. UNTESTED.\n  (2) Software: RP2350-E9 input leakage masking the unplug, plus the Pico-PIO-USB state machine holding the J line, so the disconnect event is never seen. UNVERIFIED.\n\n(History note 2026-06-01: an earlier revision of this issue asserted the power hypothesis as a confirmed 'root cause found via user diagnostic'. That was an agent assumption, not a tested result — corrected here to avoid a misleading record.)\n\nNEXT STEP when revisited: actually test. Power from a battery / powered hub and hot-replug; instrument the PIO-USB connection-state path to see whether a disconnect event is ever delivered; bisect power vs software before claiming either.\n\nReferences for a future deep dive:\n  - RP2350-E9: https://hackaday.com/2024/09/20/raspberry-pi-rp2350-e9-erratum-redefined-as-input-mode-leakage-current/\n  - tinyusb #3296: https://github.com/hathach/tinyusb/issues/3296 [OBS 2026-06-04 (during PIZERO-29 HDMI work): reproduced the warm-vs-cold distinction -- after a picotool warm reboot (-x) the USB keyboard does NOT enumerate (emulation runs but no input -> game frozen); a COLD power-cycle enumerates it fine. Data point only, NOT a diagnosis: warm-vs-cold points at USB/PIO-USB reset state rather than power, but still UNTESTED and deferred per user.] [2026-06-06: likely surfaces as a CURSOR/SYSTEM FREEZE when typing under load (e.g. a few SOUND commands) with the USB keyboard enumerated (usb=1). Same load driven over the serial console (usb=0) never wedges -> implicates the USB host path. To confirm: when frozen, check whether the [run] serial log goes SILENT (core0 stuck in USBHost.task) vs keeps printing.] [2026-06-06: USER reports REGULAR freezes over the past few days (pre-dates the PIZERO-31 timer fix, confirming it's a standing stability issue, not the timer work). Watching for a repro to capture: when frozen, leave powered and check the [run] serial log -- SILENT = core0 stuck in USBHost.task (USB). Promote priority if it keeps recurring.]\n\n[2026-06-08: another hard hang during PIZERO-41 debugging -- board dropped USB completely (no CDC, no BOOTSEL) under repeated flash/reset cycles; only a physical power-cycle recovered it. Also consistently saw usb=0 (USB keyboard not enumerated) after WARM flash-reboots throughout the session, needing serial-console input instead. Keeps recurring -> consider promoting priority; PIZERO-33 watchdog is the diagnostic path.]\n\n[2026-06-28 PROMOTED to high + in-progress at user request -- hotplug is now the priority and it also gates reliable USB-gamepad testing (PIZERO-13): without re-enumeration the user must cold-boot with the controller attached. ATTACK PLAN is diagnostic-first (can't fix blind): (1) capture the boot line 'RP2350 chip_id=.. revision=N (E9 workaround active: yes/NO)' (main.cpp:787) -- directly tests the leading hypothesis (E9 input-leakage masking disconnect so the host never sees the unplug; the cold-vs-warm asymmetry fits this); (2) add ~1Hz instrumentation of PIO-USB root-port line/connection state + g_usb_devices into the [run] telemetry to see whether a connect/disconnect event is EVER delivered after boot; (3) hardware bisect -- power from battery/powered hub and retry, and check docs/RP2350-PiZero-schematic.pdf for host-side 15k pull-downs on D+/D- that PIO-USB disconnect detection needs; (4) only then attempt a flag-gated periodic root-port reset / re-enumeration when unmounted (tinyusb#3296 workaround), guarded so it can't wedge the shared PIO1 (this path is the PIZERO-33 freeze suspect). Honest expectation: may need a hardware change (hub/pull-downs), not just software.]\n\n[2026-06-28 DIAGNOSED ON HARDWARE -- root cause confirmed via instrumented build (src/usb_hotplug_diag.c shim over pio_usb_ll.h: line_state + root_port.connected/is_fullspeed/event/ep_error/ints; main.cpp [run] line + per-frame [usb-evt] edge log + HID rpts/rfail counters). FINDINGS: (1) This board is RP2350 revision=3 and PIO-USB's RP2350-E9 input-leakage workaround is COMPILED OUT -- pio_usb_bus_get_line_state() gates the drain on chip_version<=2 only (boot line: 'revision=3 (E9 workaround active: NO)'). (2) The disconnect is masked at the LINE layer: once a device enumerates, PIO-USB's TX state machine pins D+/D- at J/FS, so line_state + the debounced root_port.connected flag NEVER change on unplug. 75s capture with a real unplug+replug = ZERO change (ls=J/FS conn=1 usb=1 flat throughout, no [usb-evt], no umount cb, no ep_error). The host drives the bus, so line-state/connected are electrically blind to the device. (3) The line CAN read SE0 only while the SM is released: the [usb-evt] log caught J/FS->SE0->J/FS during the boot RESET sequence, then it pins J/FS after enumeration. (4) usb= mount count is therefore a PHANTOM after any hotplug -- it reflects whatever enumerated at cold boot and never updates (observed: usb=1 conn=1 for 90s while a hot-swapped keyboard sat unpolled at rpts=0). CONCLUSION: this RULES OUT the 'TinyUSB sees the disconnect but fails to re-enumerate' theory -- the event never reaches the stack. RULES IN the line-masking cause (rev3 E9-workaround-off + SM-holds-J). WORKING PATH CONFIRMED: cold-boot with the keyboard attached enumerates cleanly (composite kbd: idx0 proto=1 keyboard + idx1/idx2 generic) and keystrokes flow (rpts 0->101, rfail=0, eperr=0). FIX DIRECTIONS to try next (not line-state based, since that's blind): (a) re-enable the E9 drain in get_line_state regardless of rev (patch the vendored lib or pre-drain) and see if SE0 becomes detectable post-enumeration; (b) detect device-gone from TRANSFER errors (HID IN polls NAK/timeout once removed) and trigger pio_usb_host_stop()/restart() to re-enumerate; (c) hardware: confirm host-side 15k D+/D- pull-downs in docs/RP2350-PiZero-schematic.pdf, try a powered hub. NOTE: unplug did NOT freeze the board (fps stayed 60) -> the PIZERO-33 freeze is a SEPARATE event, not caused by unplug per se.]\n\n[2026-06-29 KEY MECHANISM FOUND (HW-confirmed, user-verified timing) -- and it INVALIDATES the 'detect via transfer errors' fix path. Experiment: cold-boot with keyboard (working, rpts climbs on keypress), then UNPLUG at ~23s, then REPLUG at ~45s, watching the rpts/rfail/eperr/ints counters. RESULT: on unplug, instead of errors or a stall, the HID report stream EXPLODES into a steady ~180 reports/SECOND phantom flood (rpts 298 -> 7126 at a dead-constant +180/s for the rest of the capture) with rfail=0, eperr=0, ints=0, conn=1, ls=J/FS THROUGHOUT. PIO-USB keeps polling the now-device-less bus, decodes the SM-held J idle line as a valid IN response, and 'completes' a HID transfer ~180x/s forever. The REPLUG at ~45s was ALSO invisible: the flood continued with zero discontinuity, no [usb] device attached, no re-enum -> reproduces 'reattached devices not noticed' exactly. CONSEQUENCES: (a) line_state/connected/event/ep_error/ints are ALL useless as a disconnect signal here (confirmed flat) -> fix paths (a) E9-drain and (b) transfer-error-detection are DEAD: the line is actively DRIVEN to J by the SM (not floating-high from leakage), so the E9 drain can't reveal SE0 post-enumeration, and there are no errors to catch. (b) The phantom flood IS the detectable signature: a real boot keyboard sends reports ONLY on key transitions, so a high steady rate of reports -- especially byte-IDENTICAL ones -- means the device is gone. NEW FIX DESIGN (the first data-grounded one): in tuh_hid_report_received_cb, track consecutive byte-identical reports per interface; when >=N identical arrive in a row (phantom flood, N ~ 50-100), declare disconnect and trigger a root-port re-enumeration via pio_usb_host_stop() + pio_usb_host_restart() (both exist in pio_usb.h). Gate behind a flag; keep it OFF the freeze-prone hot path (PIZERO-33); a real working device never trips it (its reports change or stop). On re-enum, a freshly-attached OR replugged device mounts cleanly. RISK: stop/restart on the shared PIO1 while libdvi runs on PIO0/core1 must not wedge -- validate carefully. Instrumentation to add for implementing: log the report PAYLOAD bytes to confirm phantom reports are identical/empty (current build only counts them). Diagnostic build state: src/usb_hotplug_diag.c + main.cpp counters + platformio.ini src-filter entry are committed-to-working-tree (NOT yet a flag); curate per PIZERO-42 once the fix lands.]\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"USB hot-replug does not re-enumerate after disconnect\"]", "type": "task", "status": "in-progress", "priority": "high", "created": "2026-05-29", "updated": "2026-09-17", "tags": ["input", "usb", "bug"], "theme": "input"}, {"id": "PIZERO-18", "summary": "Native CoCo audio output (6-bit DAC + 1-bit sound)", "description": "Make the CoCo actually make sound. XRoar already emulates the 6-bit DAC + single-bit cassette/speaker tap internally, but nothing on this board drives those samples to an output -- the PiZero is currently silent. Filed after the 43b reconciliation (2026-05-31): 43b treats native audio as a first-class deliverable (COCO-7 decision -> COCO-19 implementation, see its docs/audio-decision.md), and that split is the transferable lesson. This issue is the basic, in-scope audio path; PIZERO-17 (synth/sound-chip device) is a separate far-future stretch that DEPENDS on the output path decided here.\\n\\nGATE (decide first, analogous to PIZERO-02b's clock decision; full feasibility scoping in docs/audio-decision.md):\\nChoose the audio output sink. PRIMARY candidate: HDMI audio data-island packets emitted by libdvi -- sound over the single existing cable, no extra hardware (needs libdvi data-island support, which it currently lacks; investigate cost vs the 240 MHz / 24 MHz-pixel-clock timing already in use). FALLBACK: PWM to a free GPIO + RC filter or a small Class-D amp (simplest, needs a wire/part). Decide before implementing.\\n\\nIMPLEMENTATION SKETCH: tap XRoar's sound_module / DAC output, generate a fixed PCM sample-block per frame (CoCo native rate) on whichever core has slack (core0 has ~5ms headroom of the 16.76ms budget; core1 is owned by libdvi scanout), feed the chosen sink. Verify on hardware: audible BASIC SOUND / PLAY / key-click at correct pitch with core0 frame time staying under 16.76ms.\\n\\n[IN-PROGRESS 2026-06-02: prioritized as the next deliverable. De-risk order per docs/audio-decision.md: (1) prove the monitor accepts HDMI audio over this board's wiring before investing in the full data-island port; (2) cost RAM; (3) port data islands + tap XRoar audio. Code investigation underway to ground the implementation plan.]\\n\\n[FINDING 2026-06-02 (code-verified, corrects an earlier premise): this stripped RP2350 port has NO audio source at all. xroar_core vendors no sound.c / sound_module / sample stream (desktop XRoar's sound pipeline was not vendored). The CoCo audio bits exist only as PIA1-B register state (coco_machine.cpp:122/878) and are currently masked off and discarded. So PIZERO-18 is TWO independent sub-problems, not one: (A) BUILD a correct PCM source -- sample the 6-bit DAC + 1-bit sound off PIA1-B with emulation-cycle-accurate timing (integrate-and-dump resampler keyed to the master clock, or vendor upstream sound.c) into a ring buffer; (B) BUILD the sink -- HDMI data islands (from scratch in our patched libdvi; the riskiest subsystem in the project -- libdvi has zero data-island/TERC4/InfoFrame code, only the IRQ-hazard warning at dvi_timing.cpp:191) OR PWM to a GPIO (simple, needs a wire/amp). (A) is shared and unavoidable; cheapest validation of (A) is PWM, which doubles as the guaranteed fallback. RECOMMENDED SEQUENCING: build + prove (A) first (hardware-independent code), then swap in the HDMI sink with a known-good stream. audio-decision.md's 'XRoar already synthesises the DAC internally' line refers to DESKTOP XRoar and needs correcting.]\\n\\n[(A) IMPLEMENTED 2026-06-02, build-verified, awaiting hardware listen-test. coco_machine.cpp: new audio section taps the 6-bit DAC (PIA1 PORT A bits 2..7 via PIA_VALUE_A -- NOT port B, which is the VDG-mode port) + single-bit sound (PIA1 PB1), resampled to 32 kHz mono int16 by SLICING coco_machine_run_cycles on sample boundaries (exact-pitch Bresenham, rates x4 so divisor 3579545 is integer). Overwrite ring (2048 samples / 4 KB) drained via new API coco_machine_audio_read()/coco_machine_audio_rate() in coco_machine.h. main.cpp: -DAUDIO_WAV_DUMP build streams a base64 WAV over USB-CDC (markers ---WAV-BEGIN---/---WAV-END---, 9 s window) and autotypes 'FOR I=1TO8:SOUND I*28,4:NEXT' as a deterministic ascending-tone test -- no wiring needed. Both normal and dump builds link. TWO THINGS TO WATCH ON HARDWARE: (1) RAM now 94.3% (was ~89%) -- the HDMI data-island sink (B) needs more (grown DMA lists + packet buffers), so RAM is now a hard constraint; may need to claw back. (2) per-slice cpu->run re-entry (~530/frame) -- verify core-0 frame time stays < 16.76 ms; if not, switch (A) to PIA-postwrite-timestamp reconstruction. NEXT: user runs the dump build, decodes the WAV, confirms clean ascending tones at correct pitch -> then start (B) the HDMI data-island port.]\\n\\n[(A) VALIDATED ON HARDWARE 2026-06-02. Flashed the dump build, captured the base64 WAV over USB-CDC, decoded + analysed. The dump build also needed -DAUDIO_WAV_DUMP to SKIP the SD autorun boot (it DIRECT-loads spacewarp.bin -> our injected SOUND program went nowhere; first capture was a constant DC level, not a tap bug). With a clean Extended Color BASIC boot, 'FOR I=1TO8:SOUND I*28,4:NEXT' produced 8 monotonically ascending tones (200->230->270->310->370->470->650->1120/1280 Hz), strong +/-20880 square wave -> DAC tap (PIA1 PA2..7), 32 kHz resampler, and capture/decode pipeline all correct. PERF: normal build live timing while running spacewarp (graphics mode) = fps 60 locked, cpu 10.8 ms (+1.4 ms vs 9.4 ms pre-audio), render 2.75 + blit 1.5 = ~15.1 ms / 16.76 ms budget. Slicing approach confirmed; postwrite-timestamp fallback NOT needed. (A) done; remaining work is (B) the HDMI data-island sink, where RAM (94.3%) is the gating constraint.] [2026-06-06: sink (B) substantially done via PIZERO-30 — HDMI audio works, pitch-matched, 48kHz; at the off-spec-timing ceiling. PLAY-timer bug split to PIZERO-31; ACR/monitor-compat to PIZERO-32.]\n\n[2026-09-17 CLOSED. Part (A), the source side, was confirmed on hardware in June: DAC tap, resampler and capture pipeline all correct, with eight ascending tones measured. Part (B), delivery, shipped as PIZERO-30. The port has had working audio for months and this ticket has been tracking nothing since. What remains lives in tickets of its own: fidelity in PIZERO-41, the sink's clock assumption in PIZERO-32, pool depth in PIZERO-40.]", "type": "task", "status": "done", "priority": "medium", "created": "2026-05-31", "updated": "2026-09-17", "tags": ["audio", "sound", "dac"], "theme": "platform"}, {"id": "PIZERO-26", "summary": "Programmable VDG palette (GIME-style palette registers)", "description": "[SUPERSEDED 2026-07-19 by PIZERO-55, which subsumes this as its Part 1 and adds a BIOS palette editor + per-title .pal profiles. This ticket's unique mechanisms (guest-side $FFB0-$FFBF bus-write interception so CoCo-3-aware recolor pokes work live; default=stock-palette transparency; the PIZERO-15 glyph-LUT rebuild-on-write wrinkle; GIME-address mirroring; the GIME default slot->color verify TODO) have been folded into PIZERO-55. Closed as superseded -- see PIZERO-55.] ORIGINAL: Augment the native MC6847 VDG with a programmable color palette instead of bolting on a foreign video chip -- the preferred, faithful 'extend the VDG' direction (split out of PIZERO-16, which stays as the heavier full-alternate-video track). MECHANISM: a 16-entry palette register file mirroring the real GIME palette addresses $FFB0-$FFBF (6-bit R-G-B, 2 bits/channel = 16 colors from 64). Intercept writes to that range on the CoCo bus; the VDG renderers (render_alpha/render_graphics/render_rg6 in lib/coco_machine) emit palette[index] -> RGB565 instead of fixed CoCo color constants. DEFAULT palette = the stock CoCo colors, so unmodified games look exactly like a normal CoCo and the feature is completely transparent until a program POKEs the registers. AUTHENTICITY: this mirrors a real CoCo 3 behavior -- in GIME VDG-compatible mode, classic VDG-mode colors route through palette RAM and can be recolored live via $FFB0+ pokes; a recolor program would behave the same here as on real CoCo 3 hardware. DECISIONS: (1) depth -- accept authentic 6-bit at $FFB0-$FFBF AND optionally expose an extended RGB565 palette at our own addresses for beyond-hardware color; (2) modes -- text/semigraphics/CG are index-based and the natural fit; RG6/PMODE4 artifact color is emergent from bit patterns, so palette there means redefining the endpoints (a separate, later mechanism); (3) mirror GIME addresses so CoCo-3-aware code just works. BOUNDARY: this is VDG+palette only, NOT full GIME/CoCo3 -- no hi-res GIME bitmap modes, no extra RAM/MMU, no hardware scroll, no GIME interrupts (those remain PIZERO-16). IMPLEMENTATION WRINKLE: PIZERO-15 precomputes glyph->packed-word LUTs with colors baked in; a palette write must rebuild those small LUTs (cheap -- palette writes are rare, once per screen not per frame). TODO before coding: verify the exact GIME VDG-compatible default slot->color mapping against GIME docs rather than guessing. Product context in docs/product-plan.md (the 'open platform you can extend' story; our homebrew game showcases it).", "type": "task", "status": "closed", "priority": "medium", "created": "2026-06-02", "updated": "2026-07-19", "tags": ["display", "video", "color", "palette", "gime", "extension", "superseded"], "theme": "experience"}, {"id": "PIZERO-27", "summary": "HDMI data-island encoder core (TERC4 + BCH + packet framing)", "description": "M1 of PIZERO-18 (B) HDMI audio sink. The bedrock, host-validatable with NO board (like the PIZERO-18 (A) WAV host-test). Build a standalone encoder: (1) TERC4 4-bit->10-bit symbol LUT; (2) BCH ECC for the packet header + 4 subpacket ECC bytes (HDMI 1.4 packet structure); (3) framing for the mandatory packets -- General Control Packet (GCP), AVI InfoFrame, Audio InfoFrame, Audio Clock Regeneration (ACR; at our 24 MHz pixel clock 32 kHz -> N=4096 CTS=24000), and Audio Sample Packet (IEC 60958 subframes). Validate on the host against HDMI-spec test vectors / the shuichitakano PicoDVI-audio fork before any integration. Pure data transformation -> no timing risk here; this de-risks the most mechanical part. Parent: PIZERO-18. Blocks PIZERO-28.\\n\\n[BUILT + HOST-VALIDATED 2026-06-03. New lib/libdvi/dvi_data_island.{h,c} (pure C, no SDK deps -> builds on host and firmware). BCH generator determined deterministically by brute force to match the reference table: LSB-first, poly 0x83 (HDMI ECC). Host test (/tmp/di_test.c, includes the .c to see static bch_table) ALL PASS: (1) bch_table[0..15] == reference bytes; (2) BCH is a real ECC -- remainder of data||parity == 0 for header and all 4 subpackets; (3) ACR carries CTS=24000 N=4096 (32 kHz @ 24 MHz pixel clock); (4) AVI + Audio InfoFrame CEA checksums == 0; Audio InfoFrame SF/SS = 0x05 (32k/16-bit); (5) all 16 TERC4 symbols match binary spec + guard band 0x133; (6) header TERC4 round-trip -- reconstructed all 32 header bits from lane-0 nibble bit2. Compiles in firmware build (GC'd while unused -> 0 RAM until M2). NOT YET wired into libdvi -- that is M2 (PIZERO-28). NOTE: audio-sample IEC 60958 bit positions are best-effort and get verified on the sink in M4 (PIZERO-30).]", "type": "task", "status": "done", "priority": "medium", "created": "2026-06-02", "updated": "2026-06-03", "tags": ["audio", "hdmi", "data-island", "terc4", "libdvi"], "theme": "platform"}, {"id": "PIZERO-28", "summary": "Inject benign data island into libdvi blanking without breaking sync", "description": "M2 of PIZERO-18 (B). Extend struct dvi_scanline_dma_list with data-island blocks (preamble -> leading guard band -> TERC4 island -> trailing guard band) on ALL THREE lanes, added as extra CHAIN_TO links in the per-scanline DMA chain. CRITICAL: keep the SINGLE back-porch IRQ per scanline -- do NOT take per-block IRQs -- which dodges the documented guard-band hazard (dvi_timing.cpp:191). Pre-encode the per-line packet into a small TERC4 buffer (same pattern as TMDS scanline encoding). For this milestone inject only a NULL/benign packet during blanking. HARDWARE ACCEPTANCE (first monitor test): video stays rock-solid and in sync, fps still 60. RAM: grown DMA lists ~1 KB + packet buffers ~1-2 KB, fits the ~30 KB free. Depends on PIZERO-27. Parent PIZERO-18.\\n\\n[DESIGN REFINED 2026-06-03 (two de-risking changes vs the original framing): (1) inject during VERTICAL blanking first, not active-line hblank -- vblank lines carry no visible video, so a malformed island cannot corrupt the picture; if the monitor stays synced the mechanism is proven at near-zero risk. (2) BUFFER-SWAP not DMA-restructure: the vblank 'active' region's DMA block already supports pointing at a non-repeating 640px buffer (same as video lines), so fill a per-lane island-line buffer [control fill -> data-island preamble (8px) -> leading guard (2px) -> TERC4 island (32px) -> trailing guard (2px) -> control fill] and point the existing blocks at it. NO grown struct, NO new IRQs, does NOT touch the guard-band-hazard path. Pixel count identical. Budget: our timing h_fp=16/h_sync=96/h_bp=48 = 160px hblank; vblank lines fully blank (640+160 free). Will be flag-guarded (-DHDMI_DATA_ISLAND) so the known-good video path is the default and we can A/B. STILL NEEDED before coding: the fork's exact data-island PREAMBLE control symbols (CTL0-3 for the data-island period differ from the 4 basic vsync/hsync ctrl syms) and guard-band placement -- fetching shuichitakano/pico_lib's line-assembly (dvi.cpp) next.]\\n\\n[HW RESULT 2026-06-04: implemented + flashed. Pipeline stayed healthy (fps 60, DMA/IRQ fine) BUT the monitor went BLACK with the island injected. Control-only diagnostic (swap buffer filled with pure control symbols, no island) -> VIDEO CORRECT. CONCLUSION: the buffer-swap/repoint mechanism is SOUND; the black screen was the island content. Root cause: you cannot half-do HDMI -- once a sink sees data-island preambles it expects full HDMI framing (video guard bands + preamble on ACTIVE lines + AVI InfoFrame), which our bare-DVI active lines lacked, so it rejected the signal. DECISION: merge M2+M3 -- convert the whole signal to HDMI (video preamble+guard on active lines via the same proven repoint, AND an AVI InfoFrame data island in vblank), then audio (M4). dvi_ctrl_syms confirmed = standard TMDS control tokens duplicated (0xd5354=(0x354<<10)|0x354), so get_ctrl_sym works directly for preambles. Mechanism (repoint blanking blocks at prepared buffers, no struct/IRQ change) carries forward to active lines too. [DONE 2026-06-04: merged into PIZERO-29 (full HDMI mode); the buffer-swap repoint mechanism was validated (control-only diagnostic = correct video) and HDMI-mode video confirmed correct on hardware.]", "type": "task", "status": "done", "priority": "medium", "created": "2026-06-02", "updated": "2026-06-04", "tags": ["audio", "hdmi", "data-island", "libdvi", "dma", "irq"], "theme": "platform"}, {"id": "PIZERO-29", "summary": "Switch DVI -> HDMI signaling (General Control Packet + AVI InfoFrame)", "description": "M3 of PIZERO-18 (B). Emit the General Control Packet + AVI InfoFrame (and the HDMI video preamble/guard bands before active video) so the sink switches from DVI mode to HDMI mode and accepts subsequent audio packets. HARDWARE ACCEPTANCE: monitor still syncs on our off-spec ~57 Hz timing and ideally reports an HDMI (not DVI) input. This is the riskiest monitor-acceptance gate -- if a monitor refuses HDMI signalling on the off-spec timing, fall back to PWM (documented in docs/audio-decision.md). Depends on PIZERO-28. Parent PIZERO-18. [DONE 2026-06-04 on hardware. M2+M3 MERGED: bare data islands need full HDMI mode (a sink rejects island-only = the M2 black screen). Implemented in lib/libdvi: dvi_setup_scanline_for_vblank_island (AVI InfoFrame island in vblank) + dvi_setup_active_hdmi_framing (video preamble + guard band on active lines), both via the validated buffer-swap repoint -- NO DMA struct or IRQ changes. Uses dvi_di_set_avi_infoframe (PIZERO-27). Flashed via picotool load -x (cp-to-BOOTSEL-drive was unreliable). USER CONFIRMED video renders correctly in HDMI mode at fps 60 -- the riskiest monitor-acceptance gate PASSED. Build flag -DHDMI_DATA_ISLAND. Next: M4 (PIZERO-30) audio. Keyboard freeze after warm flash = PIZERO-11b (deferred); cold boot fixes it.]", "type": "task", "status": "done", "priority": "medium", "created": "2026-06-02", "updated": "2026-06-04", "tags": ["audio", "hdmi", "data-island", "infoframe"], "theme": "platform"}, {"id": "PIZERO-30", "summary": "HDMI audio: ACR + Audio InfoFrame + Audio Sample Packets from the ring", "description": "M4 of PIZERO-18 (B), completes the audio feature. Feed coco_machine_audio_read() (32 kHz mono, duplicated mono->stereo) into Audio Sample Packets; emit Audio Clock Regeneration (N=4096 CTS=24000 @ 32 kHz with our 24 MHz pixel clock) and the Audio InfoFrame. TERC4-encode on core 1 (where libdvi scanout lives) with a clean producer/consumer handoff from core 0's ring. HARDWARE ACCEPTANCE: audible CoCo BASIC SOUND/PLAY + game audio out the monitor speakers at correct pitch, video still locked 60 fps, core-0 frame time < 16.76 ms. Then re-run the PIZERO-18 (A) ascending-tone test end-to-end through HDMI. Depends on PIZERO-29. Parent PIZERO-18. [2026-06-06 HDMI AUDIO WORKING — at off-spec ceiling; PLAY-melody now plays. (1) Source proven CLEAN via WAV-over-CDC host analysis -> the gap was HDMI delivery, not the resampler. (2) Fixed the 'motorboat': distribute audio across ACTIVE lines (vblank-only burst starved the sink FIFO) — new dvi_setup_active_audio_line + active_line_callback; widened blanking (h_fp 16->14, h_bp 48->130, refresh ~52Hz). (3) DMA-split lanes 1/2 blanking into [fp+sync][bp][active] (DVI_NOSYNC_LANE_CHUNKS 2->3) so per-line audio buffers are bp-only -> freed ~47KB (HDMI build 93%->84%); video re-validated on HW. (4) Rebuilt source resampler as event-driven integrate-and-dump (band-limited, keyed to event ticks via PIA-write hook); removed CPU slicing. (5) PITCH FIX: sink reconstructs the audio clock from the ASSUMED standard 25.175MHz pixel clock, not our 24MHz — ACR CTS=24000 ran ~5% fast (high pitch + FIFO-underrun buzz). CTS=25176 makes pitch MATCH desktop xroar (see PIZERO-32). (6) 48kHz native (N=6144; 231 packets / 77 lines) + dropped the now-redundant output LPF. (7) Dropped bogus PIA1-PB1 'single-bit' tap (DC only; real 1-bit sound is CB2). RESULT: pitch-matched, recognizable music; still slightly more distorted than desktop xroar through the SAME monitor (speaker confound ruled out) — residual is the off-spec 24MHz/~52Hz signal, which is locked (240MHz sysclk required by PIO-USB; 240/25.175 not integer). Ruled out: 32 vs 48kHz, island packing/margin, distribution (all RAM-bounded ~77 lines). NOT yet user-confirmed as 'good enough for V1.0'. All committed.]\n\n[2026-09-17 CLOSED. HDMI audio works: ACR, Audio InfoFrame and sample packets stream from the ring, pitch matches desktop XRoar, and the 60 Hz build (PIZERO-45) removed the off-spec 24 MHz timing that this ticket's last note called the residual cause of distortion. Since then PIZERO-119 removed a 0.9% delivery shortfall that was making the stream repeat a sample ~320 times a second, which is a better explanation of the remaining buzz than anything left here. The open question 'is it good enough for V1.0' is now PIZERO-41's, and it should be re-judged by ear on the current build rather than against June's recording.]", "type": "task", "status": "done", "priority": "medium", "created": "2026-06-02", "updated": "2026-09-17", "tags": ["audio", "hdmi", "data-island", "acr", "dac"], "theme": "platform"}, {"id": "PIZERO-31", "summary": "PLAY / cursor-blink / SOUND-duration hang — 60 Hz timer IRQ left disabled", "description": "BUG. FIX APPLIED, awaiting user HW confirm. Symptom: PLAY hangs forever on the first note (tone sustains, command never returns); cursor doesn't blink; PRINT TIMER always 0; SOUND n,d stalls. SOUND-without-duration worked (single tone, no note advance) which masked it; the earlier 'garbage truck' was this stuck first note + the (now-fixed) audio distortion. ROOT CAUSE (serial-driven repro + PIA/CPU instrumentation): the VDG drives field-sync FS -> PIA0 CB1 correctly (fs callback ~120/s), but this port's autorun DIRECT-jumps into a program that leaves PIA0 CB1's interrupt DISABLED (CRB bit0=0) and nothing re-enables it -> BASIC's 60Hz TIMER frozen at 0. Confirmed live: POKE&HFF03,&H35 (set CB1 IRQ enable) -> TIMER advances, PLAY completes and returns. FIX (lib/coco_machine coco_machine_run_cycles): force PIA0 CRB bit0=1 each frame (FS line is physically wired; real BASIC keeps the timer IRQ on). Only bit0 touched — CB2/sound-mux + edge bits intact. Self-verified over serial: PLAY plays the full melody and returns from a cold boot, no POKE. PENDING user HW confirm: cursor blinks, PRINT TIMER climbs, autorun/video unaffected. Pre-existing bug, surfaced during PIZERO-30 audio work. [2026-06-06: fix STRESS-VERIFIED clean over serial — 12 rapid SOUNDs + long PLAY, usb=0: CRB stays 35, no IRQ storm (irq=0, CC.I=0), PC advances through all commands and returns to idle (a7d3 POLCAT loop). The user's 'cursor froze after 3 SOUNDs' was on a cold boot with usb=1 (USB keyboard live) -> attributed to PIZERO-11b USB-host stall under load, NOT this timer fix. Still awaiting user HW confirm that PLAY/cursor/TIMER work AND that the freeze only occurs with USB keyboard use.] [2026-06-06: USER-CONFIRMED on hardware — PLAY plays the full melody and returns, cursor blinks, TIMER climbs. DONE.]", "type": "bug", "status": "done", "priority": "high", "created": "2026-06-06", "updated": "2026-06-06", "tags": ["emulation", "pia", "irq", "timer", "play"], "theme": "platform"}, {"id": "PIZERO-32", "summary": "HDMI audio ACR CTS depends on sink's pixel-clock assumption (V1.0 monitor compat)", "description": "OPEN / V1.0 risk. The ACR CTS=25176 that makes HDMI audio pitch correct ASSUMES the sink reconstructs the audio sample clock from the standard 25.175 MHz 640x480 pixel clock, NOT our actual off-spec 24 MHz. Confirmed on the dev monitor: CTS=24000 (correct for 24 MHz) ran fs ~5% fast (high pitch + FIFO-underrun distortion); CTS=25176 (= 25.175e6*N/(128*fs)) makes pitch MATCH desktop xroar. A sink that genuinely MEASURES the 24 MHz TMDS clock would, with CTS=25176, play ~5% LOW instead — so the value is monitor-dependent. For broad V1.0 monitor support, consider: parse EDID, expose a user-selectable CTS, or accept the trade-off and document it. Parent PIZERO-18/30.\n\n[2026-06-08 IMPORTANT FINDING on the current monitor: this sink IGNORES ACR entirely -- CTS 25176 -> 26674 -> 50000 (the last would be ~1 octave if honored) had ZERO audible pitch effect. AND HDMI_STD_TIMING (standard 25.2MHz pixel) also changed nothing. So on THIS sink the pitch is NOT derived from ACR or the pixel clock -> the residual ~1-semitone-sharp is SOURCE-side, not HDMI (moved to PIZERO-41). CTS is now parameterized via -DHDMI_ACR_CTS=<n> (default 25176) in src/main.cpp -- KEEP it (OTHER monitors DO honor ACR, so this multi-monitor concern stands), but it is INERT here. Decoupled from the current pitch problem.]", "type": "task", "status": "open", "priority": "medium", "created": "2026-06-06", "updated": "2026-06-08", "tags": ["audio", "hdmi", "acr", "compat", "v1"], "theme": "trust"}, {"id": "PIZERO-33", "summary": "Catch a freeze with enough evidence to fix it", "description": "OPEN. User reports REGULAR system freezes over the past few days (cursor freezes; pre-dates the PIZERO-31 timer fix, so it is a standing stability issue -- likely the PIZERO-11b USB-host path). Add an always-on, low-risk freeze detector so the NEXT freeze auto-dumps the smoking gun instead of needing a live catch. Design: core 1 (the DVI worker, which keeps running via DMA/PIO even if core 0 wedges) watches a core-0 heartbeat counter that loop() bumps each frame; if it stops advancing for ~1 s, dump over serial: core-0 PC, whether it is inside USBHost.task (set a 'in_usb_task' flag around the call), the libdvi SOF/frame counter, and millis(). Optionally arm the RP2350 hardware watchdog as a last-resort auto-reset (gated behind a flag so we can choose log-only vs reset). Keep it cheap and off the hot path. Parent PIZERO-11b.\n\n[2026-06-08 DATA POINT: during PIZERO-41 audio-fidelity debugging (many flash/reset cycles + a WAV-dump build) the board HARD-HUNG and dropped off USB entirely -- no CDC serial port, not in BOOTSEL, invisible to picotool. A simple replug did NOT recover it; required a physical power-cycle (and was prone to needing BOOT-button BOOTSEL). This is exactly the freeze class this watchdog is meant to catch -- a clean repro of a hard hang that takes out USB. Reinforces priority.]\n\n[2026-06-09 IN-PROGRESS -- user confirms freezes are the #1 everyday-use problem (minutes to a couple hours). Implementing a REVISED design (core 1 never returns from libdvi's scanout loop, so the original 'core-1 watches a heartbeat' is impractical without hacking libdvi). Instead: HARDWARE WATCHDOG petted from core 0 loop() -> auto-reboots a wedged board in WATCHDOG_TIMEOUT_MS (default 3000ms) = auto-RECOVERY for everyday use. Plus PHASE MARKERS in watchdog scratch registers (survive a watchdog reset, cleared on power-on, guarded by WD_MAGIC in scratch[0]): scratch[1]=phase (SETUP/USBHost.task/emulate/render/blit/audio/pace), scratch[2]=heartbeat. On boot, if watchdog_caused_reboot() && magic matches, print '*** FREEZE RECOVERED *** stuck in <phase>' -> root-causes ACROSS the reset (confirms/denies the USB-host hypothesis). -DWATCHDOG_DISABLE leaves a freeze frozen for live debugging. src/main.cpp: includes + wd_phase/wd_heartbeat helpers + boot diagnosis + loop() arm/pet/markers. Build/flash pending.]\n\n[2026-06-14 IMPLEMENTED + COMMITTED (4d49192); builds clean (pizero_stream RAM 70.4%). Added a hands-free self-test env pizero_wdtest (-DWATCHDOG_SELFTEST) that wedges core 0 at hb==520 (~10s) in phase 'emulate'. HW VALIDATION BLOCKED: the board DROPPED USB AGAIN (another freeze -- it was running idle on the LPF build) so the 1200bps-touch upload fails (no CDC to trigger BOOTSEL). 3rd USB-drop this session. To deploy/validate, the board must be flashed via MANUAL BOOTSEL (hold BOOT + plug) -> picotool sees it directly, no touch needed. NEXT: user puts board in BOOTSEL; flash pizero_wdtest, confirm '*** FREEZE RECOVERED *** stuck in emulate' prints after ~3s auto-reboot; then flash pizero_stream (watchdog on by default) for everyday use. The repeated unflashable hangs are themselves strong evidence the watchdog (auto-reboot) is needed.]\n\n[2026-06-15 MECHANISM HW-VALIDATED + DEPLOYED. Recovered the board via the serial port (it re-enumerated as /dev/cu.usbmodem101 -- the cu.* NUMBER changes across re-enumeration, which is why prior --upload-port usbmodem2101 failed; always `ls /dev/cu.usbmodem*` first). Flashed pizero_wdtest and captured END-TO-END proof: ran ~10s at fps=52, '[selftest] forcing a core-0 hang in phase emulate', then ~3s later the board AUTO-REBOOTED back into the app (not BOOTSEL) and printed '[watchdog] *** FREEZE RECOVERED *** core 0 was stuck in emulate (heartbeat=520) -> auto-rebooted', then resumed fps=52. Auto-reboot, app-reentry, phase-trace-across-reset, and heartbeat all CONFIRMED. Then flashed pizero_stream (watchdog default-on, NO selftest) for everyday use -- verified clean boot, no reboot loop, fps=52 stable, usb=1. REMAINING to close: capture a REAL-WORLD freeze's phase report (auto-recovery is now live; the next everyday freeze will auto-reboot in ~3s and print which phase it hit -> roots-cause PIZERO-11b). Stays in-progress pending that real-world datum.]\n\n[2026-06-15 PERSISTENT FREEZE LOG added + HW-validated (commit b108d87). scratch[3] packs freeze-count|last-phase across reboots; the [run] telemetry now ends with '| freezes=N last=<phase>' so a real freeze's cause is catchable by connecting a monitor ANY TIME (while still powered) -- no need to catch the recovery boot live. WD_MAGIC bumped to 0x05330534 (new layout) + >1e6 garbage clamp. Boot report: 'FREEZE RECOVERED ... stuck in <phase> after ~N frames (~Ns); freeze #M this session'. Validated on the self-test: count incremented #3->#4->#5 across reboots and appeared in [run] with correct phase 'emulate' + ~10s uptime. SEMANTICS: count = freezes since last CLEAN start; a genuine watchdog TIMER timeout (real freeze) increments+persists, any clean boot resets to 0. PLATFORM NUANCE (discovered): earlephilhower's 1200bps/BOOTSEL/picotool reboots are themselves watchdog-implemented, so the TIMER-reason discriminator can MISCOUNT a dev-tool reboot as a freeze -- but that only affects dev flashing, NOT real use (a cold power-on clears scratch -> freezes=0; users never issue tool reboots). The current freezes=1 reading is dev-flash residue and self-clears on the next cold power-on. Deployed on pizero_stream. Still in-progress: awaiting a REAL freeze to root-cause PIZERO-11b.]\n\n[2026-09-14 COMPLETION PATH: this has waited since 2026-06-15 for a real freeze to happen by chance. PIZERO-98 turns the wait into a measurement: a 25-hour logged soak reading the freeze counter. If it records zero freezes, close this as done with the watchdog kept as a safety net and file any later freeze fresh. If it records any, the phase report is the root-cause lead this issue was built to catch.]\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"Add core-1 watchdog / freeze detector to root-cause the recurring hangs\"]\n\n[2026-09-17 *** A REAL FREEZE WAS CAPTURED ***, the first since this issue was opened on 2026-06-15, and it took three minutes of the new PIZERO-108 harness rather than the 25-hour soak. Log: docs/measurements/logs/2026-09-17-1610-pizero_stream_60.log, archived record in docs/measurements/2026-09.jsonl.\n\nWHAT HAPPENED: the board ran clean at 60 fps from 16:10:12 to 16:10:55 (steady cpu ~10.4 ms, render ~4.84 ms, blit ~1.57 ms, no USB device attached). At 16:10:55 telemetry stopped dead. The USB CDC dropped three seconds later (the logger recorded 'Device not configured', which is the board rebooting, and is why no SILENT marker appeared). At 16:11:00 it came back and reported: core 0 stuck in 'emulate' after ~4002 frames (~76 s of uptime), freeze #1, auto-rebooted. It then ran another 2 min 12 s clean. Firmware was the default pizero_stream_60 with OPIL-EN.dsk autorunning.\n\nTHE PHASE CONTRADICTS THE STANDING HYPOTHESIS. WP_EMU wraps exactly one call, coco_machine_run_cycles(CYCLES_PER_FRAME) at src/main.cpp:1208-1209. It is not USB: USBHost.task() runs under WP_USB (:1141) and pump_keyboard() under WP_KBD (:1205), and no USB device was even attached (rpts=0, usb=1). Every earlier note here and in PIZERO-88 named the untimed USB phase as the leading suspect. On this evidence it is not.\n\nLEAD WORTH CHASING FIRST: a hang inside run_cycles means the loop stopped retiring cycles. The classic 6809 shape for that is SYNC or CWAI waiting for an interrupt that never arrives: if the core treats those as 'wait' without consuming cycles, the cycle budget never drains and the call never returns. That fits the evidence (fixed phase, no USB involvement, recoverable only by reset) and is cheap to check in the XRoar core's SYNC/CWAI handling and in how run_cycles decides it is done. A guest infinite loop would NOT do this, since it still retires cycles.\n\nNEXT: the 25-hour soak (PIZERO-98) now has a known-reproducible failure to count, and the per-hour rate from this sample (1 freeze in ~3.5 min of board uptime) suggests it will not be rare.]\n\n[2026-09-17 SECOND FREEZE REPORT, and this one is ambiguous. On the boot that starts the 25-hour soak the watchdog reported core 0 stuck in 'frame-pace' after ~17,701 frames (~340 s), which matches how long a BASIC loop parked in PMODE 4 had been running. Two readings: either a real freeze in WP_PACE (the delayMicroseconds at the end of the loop, a different phase from the 'emulate' freeze captured earlier the same day), or stale watchdog scratch surviving the power cut that preceded the boot. A power cut does not fire the watchdog, so the scratch may simply not have been cleared; the same caveat is already noted here for dev-tool reboots. NOT counted as a freeze in the soak: the analyser treats a counter that is already non-zero when logging starts as a baseline. WORTH SETTLING CHEAPLY: have the boot path clear or version-stamp the freeze scratch on a power-on reset, so the next report of this kind is unambiguous. Until then any freeze seen immediately after a power cycle is unusable evidence.]\n\n[2026-09-18 THREE MORE FREEZES, ALL IN 'emulate', from the PIZERO-98 soak. This is no longer a single captured event; it is a rate.\n  02:03:43  stuck in 'emulate' after 1,338,568 frames = 6.2 h of uptime\n  02:18:27  stuck in 'emulate' after 52,714 frames = 14.6 min (15 min after the previous one)\n  06:17:38  stuck in 'emulate' after 860,690 frames = 4.0 h\nRate: 3 in 13.07 h = 0.23/h on the post-PIZERO-119 build with a keyboard attached and AUTORUN's OPIL-EN.dsk running. The watchdog recovered every one; the board came back and carried on.\nEVERY FREEZE SO FAR IS IN WP_EMU, which wraps exactly one call, coco_machine_run_cycles (src/main.cpp:1208). That is four out of four counting the 3-minute shakedown. The USB hypothesis this ticket carried for months stays dead: a keyboard was attached throughout and USB runs in different phases.\nTHE CLUSTERING IS A CLUE: 6.2 h, then 15 minutes, then 4 h. Not a fixed interval and not obviously load-related, but two freezes 15 minutes apart argues against a slow accumulation (a counter overflowing, a ring filling) and for a state the guest can enter and re-enter. That fits the SYNC/CWAI lead already recorded here better than it fits a leak.\nNEXT: the lead is unchanged and now worth acting on. Check how run_cycles decides it is done, and what the core does with SYNC and CWAI when no interrupt is pending: if either waits without retiring cycles, the cycle budget never drains and the call never returns.]\n\n[2026-09-18 RATE CORRECTED UPWARD: the host slept through 5.68 h of the soak, so three of the freezes left no message. The board's counter moved 6 against 3 messages seen, making the rate about 0.46/h rather than 0.23/h. Still every observed one in 'emulate'.]\n\n[2026-09-18 SYNC/CWAI LEAD IS DEAD, and a better one replaces it. Read the core rather than assuming.\nSYNC (mc6809.c:307) does NVMA_CYCLE every iteration, which is peek_byte -> our memory hook, so it DOES retire cycles and the budget drains normally. CWAI is the same shape: mc6809_state_dispatch_irq consumes nothing, but it alternates with mc6809_state_cwai_check_halt, which does NVMA_CYCLE, so the pair always retires one per loop. Neither can hang run_cycles. I checked every state in the switch for one that continues without a cycle-consuming call; the four that do all hand off to a state that does.\n\nNEW LEAD, and it fits better: THE EVENT QUEUE. event_run_queue (events.h) is `while (event_pending(list, to_time)) event_dispatch_next(list);`, and it runs INSIDE the memory hook. If a dispatched callback re-queues itself at a tick still within this window -- a zero or negative interval -- the loop never exits. No cycle is retired, cycles_remaining never drains, coco_machine_run_cycles never returns, and core 0 sits in WP_EMU until the watchdog reboots. That is exactly what the four captured freezes look like, and it explains the spacing better than a leak would: it needs a particular scheduling coincidence, which a guest can stumble into and stumble into again fifteen minutes later.\n\nGUARD ADDED rather than a guess at the culprit: event_run_queue now caps dispatches per window at 4096 (a normal window dispatches a handful), and on tripping it records the offending callback's address and tick, drops that one event so everything else stays scheduled, and lets the machine keep running. The 1 Hz telemetry prints [runaway] with the callback pointer. The next occurrence therefore names the event instead of the phase, and does NOT take the board down.\nCosts one increment and one compare per dispatch; firmware RAM unchanged at 71.0%.\nNOT YET FLASHED: the soak is still running. Flash with the hardware batch, then the next soak either shows [runaway] with a pointer to chase, or the freezes continue and the event queue is exonerated too.]", "type": "task", "status": "in-progress", "priority": "high", "created": "2026-06-06", "updated": "2026-09-18", "tags": ["stability", "watchdog", "usb", "diagnostics"], "theme": "trust"}, {"id": "PIZERO-34", "summary": "Even HDMI audio delivery (fill vblank gap) to kill frame-rate warble", "description": "OPEN. After the ACR-cadence fix the synth sine still warbles at frame rate on the monitor. Cause: bursty region-split delivery -- audio rides only the 480 active lines; the 43 vblank lines carry no audio, so the sink sees a ~1.6ms audio gap every frame. Fix: spread ~116 audio lines (2 pkts each = 924 samp/frame @48k) evenly across ALL 523 lines incl vblank, using bp-only audio islands on vblank lines (the DMA split gave no-sync lines a repointable back-porch block). New piece: dvi_setup_blank_audio_line -- a vblank-line audio buffer whose island trails into CONTROL (no video preamble/guard). Keep ACR on vblank active-blocks (dual island). RAM ~122KB (fits). Behind -DHDMI_EVEN_AUDIO. Risk: intricate per-line framing; uncertain payoff. [2026-06-06 NOT VIABLE on this sink: placing audio data islands in the vblank BACK PORCH breaks video sync -- dual island per vblank line (audio bp + info active) gave green-flash-then-black; single island (audio bp + control active) gave immediate black. Active-line bp-audio works and vblank ACTIVE-BLOCK info islands work, but vblank back-porch islands do not. So the per-frame vblank audio gap cannot be filled this way; even delivery abandoned. Code kept behind -DHDMI_EVEN_AUDIO (off) + the dvi_setup_active_audio_line video_follows generalization. Residual frame-rate warble stands; the ACR-cadence fix (PIZERO-30) was the achievable gain.]", "type": "task", "status": "closed", "priority": "medium", "created": "2026-06-06", "updated": "2026-06-06", "tags": ["audio", "hdmi", "delivery", "warble"], "theme": "platform"}, {"id": "PIZERO-35", "summary": "Re-architect HDMI audio delivery using Takano's reference (even per-active-line streaming)", "description": "OPEN. Our packet ENCODER is already ported from shuichitakano/pico_lib dvi/data_packet.cpp (lib/libdvi/dvi_data_island.c -- TERC4/BCH/header/subpacket/ACR/InfoFrame), and it's sound. What we never adopted is his DELIVERY/SCHEDULING architecture -- where/when audio islands are placed in the scanline stream -- and that is the source of our residual frame-rate WARBLE.\n\nSTATE OF KNOWLEDGE (from this session):\n* Pitch fixed via ACR CTS=25176 for the sink's assumed 25.175MHz clock (PIZERO-30/32).\n* Source is clean (WAV-verified); the gap is HDMI DELIVERY, not the waveform/resampler.\n* ACR cadence matters: 1/frame warbled; ~43/frame (every vblank line) audibly better (PIZERO-30).\n* Active-line back-porch audio islands WORK on this sink; vblank BACK-PORCH islands BREAK video sync (PIZERO-34 -- even delivery via vblank is NOT viable here).\n* Our limit is RAM: only ~77 pre-encoded per-line buffers of 480 active lines -> bursty delivery (audio bunched in active region, ~1.6ms gap during vblank) -> sink FIFO/PLL wobble at frame rate.\n\nPLAN:\n1. Read shuichitakano/pico_lib (and the RP2350 PicoDVI HDMI-audio ports) DELIVERY path: how he interleaves audio sample packets + ACR into the H-blanking of (nearly) every ACTIVE line, and how he encodes per-scanline rather than pre-allocating one buffer per line.\n2. Adopt streaming/on-the-fly per-active-line audio encode so audio rides EVERY active line evenly (matching standard HDMI), sidestepping BOTH our buffer-count RAM cap AND the vblank-island sink rejection. Active-line audio already works on this sink, so this is the direction the sink accepts.\n3. Re-examine 'Option A' (encode in the DMA IRQ) which blacked the screen early on -- determine whether that was a specific bug vs fundamental, and how he avoids it (which core, timing, handoff).\n4. Keep the ACR-cadence fix; spread ACR per his cadence too.\n\nACCEPTANCE: synth-sine (HDMI_AUDIO_SYNTH) plays as a clean steady tone on the monitor (no frame-rate warble), real CoCo SOUND/PLAY sounds smooth, video rock-solid, RAM fits, core-0 frame budget holds. References: shuichitakano/pico_lib; PicoDVI HDMI-audio forks/RP2350 ports; rh1tech/FRANK (IEC framing, already matched). Supersedes the abandoned PIZERO-34 vblank approach.\n\n[2026-06-07 PLAN + STAGED into PIZERO-36..40. KEY ARCHITECTURE FINDINGS from code review: (1) The per-line bp buffer is sized by the FIXED back porch (bpw = h_back_porch/DVI_SYMBOLS_PER_WORD ~= 65 words, dvi_timing.cpp:458), INDEPENDENT of packet count -- so the pre-encoded double-buffered banks g_la0/1/2[2][77][72] already cost ~130KB at 94% SRAM and the RAM lever is CARRIER-LINE COUNT, not packets/line. The bank model is structurally capped at ~77 lines (120 lines = +74KB, impossible). You CANNOT fix warble by adding carrier lines to the current model. (2) Therefore the only route to even per-line delivery within RAM is Takano's actual model: stop pre-allocating per line; encode ONE 16.16-metered audio packet per active line ON THE FLY in the DMA IRQ into a tiny rotating pool (~4 buffers, ~3.5KB). (3) The original 'Option A' IRQ-encode blackout is almost certainly flash latency: the encoder (dvi_di_encode_header/subpacket + dvi_terc4_syms) is FLASH-resident; moving it to RAM (PIZERO-37) is the surgical fix that makes IRQ encode viable. Spike-measure first (PIZERO-36). All behind -DHDMI_STREAM_AUDIO with the 77-line path as fallback. Plan: ~/.claude/plans/hi-whats-on-the-fluttering-quiche.md]\n\n[2026-06-08 MEASURED (PIZERO-36 done) -- CORRECTS hypothesis (3) above. PIZERO-37 put the encode
