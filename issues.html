y. USER DECISION: cold boot, not a live floppy hot-swap -- consistent with the other implementations. BLOCKER TO PORT FIRST: this port has NO coco_machine_reset(); AMOLED does (its coco_machine.h:39, used at its main.cpp:872/955). Port it, preserving the semantics its comment documents -- reset keeps the ROM, the installed cartridge and the disk-read callback intact, so the machine restarts without re-initialising everything. SCOPE: a launch_entry(idx) equivalent handling all three types -- DSK (coco_boot_attach_dsk then reset), BIN (coco_boot_parse_loadm into RAM then jump to the entry vector, as main.cpp:1084-1095 already does at boot), CART (coco_boot_load_cart_named then reset so the autoboot FIRQ takes the guest to $C000, per the note at coco_machine.h:29). Fold this into ONE coherent boot decision with the existing autorun.txt path rather than adding a second, divergent launch route -- main.cpp:1084 (direct) and :1097 (dsk) are already mutually exclusive, and PIZERO-79 will revisit the same code. Handle failure honestly: a missing or corrupt image should report on the card and leave the previous program running, not hang or half-boot. ACCEPTANCE on HW: launching a DSK, a BIN and a CART each cold-boots correctly from the overlay; the previously running program is fully replaced; audio and video are clean after the switch; repeated switching does not leak handles or degrade. Depends on PIZERO-81c.\n\n[2026-09-17 DESIGN DIRECTION, set with the user after reading the Fruit Jam implementation (its whole overlay is ~350 lines of UI in src/coco/coco_main.cpp, plus ~450 lines of disk plumbing). Still blocked on porting coco_machine_reset()/cold_reset() from the AMOLED port; Fruit Jam has both (coco_machine.h:40,45). Note the inconsistency it lives with (FRUITJAM-67): its button path cold-boots while its keyboard path hot-swaps. Decide one behaviour here and state it.]\n\n[2026-09-17 Summary rewritten to say what it delivers. Previous summary: \"Launcher slice 4: ENTER cold-boots the selection (needs coco_machine_reset ported)\"]\n\n[2026-09-27 BUILT, not yet on hardware, per the PIZERO-115 decision. coco_machine_cold_reset() (ported from Fruit Jam FRUITJAM-69: RAM zeroed so BASIC cold-starts, SAM reset incl. TY/F, PIAs deliberately untouched; also palette, GIME timer and FDC registers reset; cart, disk reader and drives kept). The overlay asks main.cpp overlay_launch_request(kind, path) while still open, which checks up front (DISK needs disk11.rom; BIN must parse as LOADM; CART must be exactly 8 KB, 16 KB reported as not yet supported) and reports failures on the status line without touching the running program. Accepted launches run from loop() via perform_launch(): DISK mounts drive 0, installs Disk BASIC and the reader, cold-resets, reads the RSDOS directory of drive 0 (src/rsdos_dir.h, 6 host tests) and queues RUN\"X\" or LOADM\"X\":EXEC through the existing autotype with the autorun.txt 3 s warmup; BIN removes the cart, cold-resets, waits 30 frames (as @DIRECT does at power-on) and then loads and jumps; CART loads the 8 KB image, installs it and cold-resets. RAM 73.2%. 115 host tests pass.]\n\n[2026-09-27 ON HARDWARE, DISKS path seen working in a serial capture during the user's test: ENTER on spacewarp.dsk moved it to drive 0, installed disk11.rom, cold-booted and queued LOADM\"SPACEWRP\":EXEC; ENTER on tiny-agent.dsk queued LOADM\"RAIN\":EXEC (the first runnable entry in its directory). Drives 1 and 2 were assigned and kept. BIN and CART not yet exercised.]\n\n[2026-09-27 CARTRIDGES path confirmed on hardware: eight carts of 2 to 16 KB launched from the overlay and ran (PIZERO-139 capture). Still to see: a BIN launch.]\n\n[2026-09-28 DONE: the user confirms .bin programs launch fine from the F9 list; disks and cartridges were confirmed earlier (PIZERO-139, PIZERO-152).]", "type": "task", "status": "done", "priority": "high", "created": "2026-08-05", "updated": "2026-09-28", "tags": ["launcher", "boot", "reset", "cart", "dsk", "bin", "slice"], "theme": "experience"}, {"id": "PIZERO-82", "summary": "Remember last launched entry and boot back into it (laststate.txt)", "description": "Remember the last launched entry and boot straight back into it, as the AMOLED port does (~/github/coco-rp2350-waveshare-touch-amoled-18 coco_boot.h:47-54, /coco/laststate.txt). Split out of PIZERO-81 because it needs SD WRITE, which this port does not have yet. SCOPE: persist the last entry launched via the PIZERO-81 launcher, and at cold boot prefer it over the autorun.txt default -- with a clear precedence rule (laststate vs autorun.txt vs first-DSK fallback) that is documented, not implicit. Use the atomic-replace helper from PIZERO-64 so an interrupted write cannot leave a truncated file that breaks the next boot, and treat an unparseable or stale entry (file since deleted from the card) as absent rather than an error. NOTE the AMOLED ticket's own reasoning, which applies here too: this is stored on the SD card, NOT in flash via LittleFS, because the earlephilhower core's flash filesystem is unsafe alongside this workload. Also decide whether a user can turn it off -- booting into the last game is great until it is the thing you want to escape; if PIZERO-53 has landed, that is a settings toggle. Depends on PIZERO-64 (SD write) and PIZERO-81d (something to record).", "type": "feature", "status": "open", "priority": "medium", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["launcher", "persistence", "sd", "write", "boot"], "theme": "experience"}, {"id": "PIZERO-83", "type": "decision", "status": "open", "priority": "high", "summary": "Decision: new video device framebuffer residency (guest RAM vs firmware aperture) + geometry", "tags": ["video", "display", "framebuffer", "decision", "address-space", "6809", "blocker"], "created": "2026-08-17", "updated": "2026-08-17", "description": "DECIDE BEFORE PIZERO-84. A new linear indexed video device (1/2/4bpp) needs two questions settled; both change the guest-visible interface and cannot be retrofitted cheaply.\n\n(1) RESIDENCY. Option A -- the framebuffer lives in the guest's 64K address space, like real hardware. Authentic; the 6809 plots pixels with plain stores. But 320x240@4bpp = 38,400 bytes = 59% of the ENTIRE address space, leaving ~26KB for code + BASIC + variables. This is precisely why the real GIME shipped an MMU; without banking, 4bpp is barely usable. Option B -- the framebuffer lives in FIRMWARE SRAM outside the 64K map, reached through a narrow aperture (window/base register + data port) or a command interface. The 6809 never holds 32KB of pixels, SD->VRAM blits (PIZERO-87) become nearly free, and the address-space cost falls to a handful of registers. Cost: it stops being a CoCo, and guest-side plotting goes through an indirection. RECOMMENDATION: Option B, because PIZERO-87 (SD bitmap blit) is a stated requirement and Option B composes with the PIZERO-72 hypercall ABI instead of fighting it. A hybrid (aperture-mapped sliding window into firmware VRAM) is a real third option and should be weighed explicitly, since it recovers direct stores for the hot region while keeping the map small.\n\n(2) GEOMETRY. User proposed 320x240. Note 320x240@4bpp = 38,400 B, which OVERSHOOTS the stated '32K image' target by 20%. The authentic CoCo3 hi-res geometry is 320x192@4bpp = 30,720 B (the classic 32K mode); 320x200 = 32,000 B. Against that, 320x240 exactly fills the host framebuffer (PIZERO_FB_W/H, src/coco_boot.cpp:484) with no border, which is the cleanest possible blit. Per-depth footprints at 320x240: 1bpp 9,600 B (15% of the map), 2bpp 19,200 B (29%), 4bpp 38,400 B (59%). Geometry may legitimately differ per bit depth.\n\nFACTS ALREADY ESTABLISHED (verified 2026-08-17): PSRAM is NOT available -- the pad is unpopulated (README.md:74), so this is an SRAM-only target (520KB; last recorded build 70.6%, so roughly 150KB free). A 38KB firmware-side VRAM therefore fits comfortably. Read-only assets can live in the 16MB flash. Blocks PIZERO-84/85/86/87.", "theme": "devices"}, {"id": "PIZERO-84", "type": "feature", "status": "open", "priority": "medium", "summary": "Linear indexed video device: 320x240 at 1/2/4bpp with a single-stage blit", "tags": ["video", "display", "framebuffer", "indexed", "bpp", "device", "renderer"], "created": "2026-08-17", "updated": "2026-08-17", "description": "A NEW video device alongside the 6847, not a modification of it. Gives the guest a linear indexed framebuffer at a resolution the 6847 cannot reach.\n\nWHY THIS IS SMALLER THAN IT SOUNDS (verified 2026-08-17): the display pipeline is ALREADY 4bpp-indexed. lib/coco_machine/src/coco_machine.cpp:92 holds a nibble-packed palette-index buffer (2 indices per byte) and src/coco_boot.cpp:496 expands it through a 16-entry RGB565 LUT into the framebuffer. The mechanism exists; what is missing is a device that drives it linearly. For reference, the best existing 2bpp mode is CG6/PMODE 3 at 128x192 (render_graphics_frame, coco_machine.cpp:1013) horizontally replicated x2 -- this device targets roughly 3x that pixel count.\n\nDESIGN -- COLLAPSE TO ONE STAGE. The 6847 path is two stages: render (guest RAM -> 4bpp intermediate via mode decode, 2.75ms) then blit (4bpp -> RGB565, 1.5ms). This device should blit STRAIGHT from its framebuffer to RGB565. Two payoffs: (a) the 2.75ms mode-decode disappears entirely -- there are no 6847 modes to decode; (b) bit depth starts to matter to HOST cost, not just guest cost -- 1bpp reads 8 px/byte, 2bpp 4 px/byte, 4bpp 2 px/byte, so a 2bpp screen becomes genuinely cheaper to draw rather than being expanded into a 4bpp intermediate and paying full price. Suggested 2bpp fast path: a 256-entry byte->4-pixel LUT making the inner loop near-memcpy, mirroring the existing g_alpha_lut trick at coco_machine.cpp:897. ACCEPT that this is a second, parallel renderer sharing no code with the 6847 path -- the same 'small separate renderer, less coupling' call PIZERO-81b already made for the launcher card.\n\nSCOPE: mode/enable/base control registers; 1/2/4bpp support; the single-stage blit; and a clean switch between this device and the 6847 in coco_machine_render_frame (coco_machine.cpp:1058), including defined behaviour when the device is disabled. ADDRESS RANGE MUST BE CHOSEN DELIBERATELY -- PIZERO-72's hypercall block and PIZERO-62's GIME timer both eye $FF90-$FF95; do not squat it by accident. Palette is PIZERO-85, font is PIZERO-86, SD bitmaps are PIZERO-87.\n\nBUDGET: blit cost scales with OUTPUT pixels -- 256x192 = 49,152 writes today vs 320x240 = 76,800 (~1.56x). Core 0 currently runs emulate 10.8ms + render 2.75 + blit 1.5 = ~15.1ms of 16.67ms per PIZERO-18's telemetry, while PIZERO-48 records ~31% slack from an older pre-audio baseline; the two disagree and neither is post-60Hz. Re-baseline via PIZERO-88 before assuming headroom. Core 1 cannot absorb the blit without PIZERO-40's headroom measurement.\n\nRELATIONSHIP TO PIZERO-16: -16 is the deferred 'alternate video device' with TMS9918A-style sprites plus extended palette. This ticket is the framebuffer half of that territory; if both proceed, narrow -16 to sprites so they do not overlap. SCOPE FLAG: docs/product-plan.md section 3.7 lists an alternate video device as explicitly OUT OF SCOPE for V1.0. This cluster is therefore post-V1.0 or a deliberate scope change -- settle that before sequencing it ahead of the launcher (PIZERO-81) or storage (PIZERO-64) work. Depends on PIZERO-83.", "theme": "devices"}, {"id": "PIZERO-85", "type": "feature", "status": "done", "priority": "high", "summary": "Programmable 16-entry palette register file for the new video device (CoCo3 $FFB0-$FFBF style)", "tags": ["palette", "video", "registers", "coco3", "gime", "6847", "config"], "created": "2026-08-17", "updated": "2026-09-18", "description": "Give the PIZERO-84 device a writable 16-entry palette in the CoCo3 register style.\n\nESSENTIALLY FREE AT RUNTIME: the blit already performs a per-pixel LUT lookup (g_vdg_rgb565_native[16], src/coco_boot.cpp:488). Making it writable turns a .rodata array into .data and costs nothing per pixel. Worth stating plainly because it is a genuine emulation dividend: a real 6847 has NO palette registers at all -- its colours are hardwired into the chip, which is why PIZERO-55 exists as a feature rather than a given. We get CoCo3-class palette control on a CoCo1/2-class machine for free. Indices 12-15 of the current LUT are unused (0x0000) since the 6847 only ever needs 12, so there is free space even before the LUT becomes writable.\n\nCOORDINATE WITH PIZERO-55 -- DO NOT DUPLICATE IT. PIZERO-55 already covers making the SAME LUT writable, a BIOS palette editor, per-title .pal sidecars, and $FFB0-$FFBF bus-write interception for the classic 6847 modes. The register file must be built ONCE and shared. Decide explicitly: (a) PIZERO-55 lands first and this ticket merely binds the new device's modes to the existing register file (PREFERRED -- less work, one code path), or (b) this ships first and PIZERO-55 adopts it.\n\nWORTH KNOWING BEFORE SEQUENCING: with a programmable palette, the EXISTING 6847 CG modes already become '2bpp with colours you choose' -- render_graphics_frame computes cg_base + a 2-bit value (coco_machine.cpp:1041), and only cg_base is hardwired (CSS picks the GREEN or WHITE set). So PIZERO-55 ON ITS OWN delivers half the stated goal at 128x192, with no new device at all. Only the RESOLUTION needs PIZERO-84. That makes PIZERO-55 the cheaper first move if the palette matters more than the pixel count. Depends on PIZERO-83; coordinate with PIZERO-55.\n\n[2026-08-17 CROSS-TEST + PRECISION CONSTRAINTS -- full write-up lives in PIZERO-55, which owns the shared register file; summarised here because this ticket can be worked independently.\n  * `xroar -m coco3` IS an equivalent desktop test target: the GIME applies palette_reg[] in VDG-COMPATIBLE mode (tcc1014.c:1400-1421, inside `if (gime->COCO)`), and its CG index arithmetic `cg_colours + ((gdata >> 6) & 3)` (tcc1014.c:1408) is identical to our `cg_base + ((b >> 6) & 3)` (coco_machine.cpp:1041). On CoCo 1/2 the range is unmapped and writes are ignored, so nothing conflicts.\n  * PALETTE INDICES 0-7 MATCH GIME EXACTLY; 8-15 DO NOT (GIME: RGCSS fg/bg pairs at 8-11, alpha/semigraphics pairs at 12-15; ours: 8=BLACK, 9=DARK_GREEN, 10-15 unused). Adopting GIME's 8-15 assignment is free today since those slots are empty.\n  * REGISTERS ARE 6-BIT (RGB222, & 0x3f, tcc1014.c:792) and READABLE (tcc1014.c:795). Do not widen $FFB0-$FFBF to 16-bit or the cross-test equivalence is lost -- put any wider format elsewhere or behind a mode bit.\n  * OUTPUT CEILING IS RGB565, ASYMMETRIC: both libdvi TMDS tables are 6 bits per channel (tmds_table.h / tmds_table_fullres.h headers), so green is an exact 6/6 match while red and blue are capped at 5 bits by the framebuffer. GIME's RGB222 fits with room to spare; 'full RGB' here means 5/6/5, never 8/8/8.]\n\n[2026-09-17 PRIORITISED (medium -> high) with PIZERO-55. Note the overlap and do not build it twice: 85 defines the CoCo 3-style 16-entry register file at the $FFB0-$FFBF layout, 55 makes the existing 6847 LUT writable and adds the UI. The decision in PIZERO-111 is to take GIME register LAYOUTS wherever we adopt a GIME feature, so unmodified CoCo 3 software has a chance of working; that makes 85's layout the one 55 should write through, even before the PIZERO-84 video device exists.]\n\n[2026-09-17 SATISFIED by the shared register file built under PIZERO-55; see that ticket for the detail. Sequencing option (a) from this ticket's own text is what happened: the file exists now and binds to the classic 6847 modes, so when the PIZERO-84 device arrives it adopts the same table rather than inventing a second one. The API is coco_machine_palette/_set/_get/_reset/_written, and the guest-facing registers are the real $FFB0-$FFBF. What remains here is purely the new device's binding, which cannot start before PIZERO-83/84.]\n\n[2026-09-18 CONFIRMED ON HARDWARE by the user: POKEing the GIME palette registers at $FFB0-$FFBF recolours a running CoCo 2, on the pizero_gime build on the second board. A real 6847 has no palette registers at all, so this is a capability the original hardware cannot have; it costs nothing per pixel because the blit already did one table lookup per pixel, and the measured frame budget with GIME_PALETTE and GIME_TIMER on is 12,700 us, 76.2%, indistinguishable from the product build.\nCLOSED. What this ticket owed was the register file in the real GIME layout, and that exists, is tested (14 host tests) and now works on a board. The remaining palette work is PIZERO-55's UI: the BIOS editor and per-title .pal sidecars, both of which need the overlay.]\n\n[2026-09-18 NOW IN THE DEFAULT BUILD, and the separate pizero_gime env is gone. Keeping a second build was the wrong call: it meant a board could silently lose the feature on an ordinary reflash, which is exactly what happened today mid-test. The justification for gating was that these were unproven on hardware; the palette is now proven, both blocks are unused on a CoCo 2, the decode claims no CoCo 2 address (asserted by host tests), and both are transparent until a guest writes to them: the palette holds the stock VDG colours, the timer stays stopped. Frame budget measured identical at 76.2%, RAM +484 bytes.]", "theme": "devices"}, {"id": "PIZERO-86", "type": "feature", "status": "deferred", "priority": "low", "summary": "Guest-writable character generator: font bitmap in RAM for the new video device", "tags": ["font", "video", "character-set", "ram", "device", "tms9918"], "created": "2026-08-17", "updated": "2026-09-16", "description": "Let the guest redefine the character set at runtime instead of being fixed to the 6847's mask ROM.\n\nCURRENT STATE (verified 2026-08-17): font_6847t1 is a const 1536-byte array (128 glyphs x 12 rows) at lib/xroar_core/src/mc6847/font-6847t1.c:6, pinned into the .time_critical section, and indexed directly at two sites -- lib/xroar_core/src/mc6847/mc6847.c:427 (upstream beam renderer, currently suppressed by SUPPRESS_RENDER_SCANLINE) and lib/coco_machine/src/coco_machine.cpp:948 (the live alpha renderer). Making it swappable means replacing those direct references with a pointer indirection (g_font) and deciding where the writable copy lives. RAM cost is modest: 1.5KB for a 128-glyph 8x12 set, more for a larger or multi-page character set. PSRAM is NOT available (README.md:74) -- SRAM only; flash is fine for read-only defaults.\n\nNOTE THIS IS NOT A COCO3 FEATURE. The GIME's text mode still used a fixed ROM font; a programmable character generator is a TMS9918/C64-class capability. So it belongs to the new device (PIZERO-84, and adjacent to PIZERO-16's territory), not to 6847 fidelity -- do not present it as CoCo3 compatibility.\n\nDISTINGUISH FROM PIZERO-57, the firmware-side cousin: that loads a .FNT from SD to replace the default font, with a BIOS loader, live preview and per-title sidecars. That is a FIRMWARE-driven swap; this is a GUEST-driven one (the 6809 pokes glyph bitmaps and sees them appear immediately). They should share the SAME g_font indirection -- build it once, in whichever ticket lands first, and have the other adopt it. Depends on PIZERO-84.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit with the new video device (PIZERO-84); meaningless before it.]", "theme": "devices"}, {"id": "PIZERO-87", "type": "feature", "status": "deferred", "priority": "low", "summary": "Load bitmaps from SD and blit them into video memory", "tags": ["video", "sd", "bitmap", "blit", "storage", "assets", "read-only"], "created": "2026-08-17", "updated": "2026-09-16", "description": "Load a prepared image off the SD card directly into the PIZERO-84 device's framebuffer, so a full-screen picture costs the 6809 almost nothing.\n\nTHIS IS THE REQUIREMENT THAT MOST FAVOURS OPTION B IN PIZERO-83. If the framebuffer lives in firmware RAM, an SD->VRAM blit never crosses the 64K address space at all -- the guest issues a command and the firmware moves the bytes. If it lives in guest RAM, every pixel has to be pushed through the 6809's map.\n\nSIZES (at the PIZERO-83 geometry): 320x240 = 9,600 B at 1bpp / 19,200 B at 2bpp / 38,400 B at 4bpp; the authentic 320x192 4bpp CoCo3 mode is 30,720 B. So a ~32KB image is exactly one full-screen 4bpp picture -- the right size for a title screen, a loading screen, or a game background.\n\nSCOPE: an on-SD image format (packed indexed pixels plus a small header carrying geometry, bit depth, and an OPTIONAL 16-entry palette so an image can carry its own colours -- pairs directly with PIZERO-85), the loader, and the blit into VRAM.\n\nDEPENDENCY -- DECIDE DELIBERATELY. The clean route is through the storage stack (PIZERO-70 backend -> PIZERO-71 VFS -> PIZERO-72 hypercall), none of which exists yet. The shortcut is a narrow direct-FatFs read modelled on the existing read helpers (src/coco_boot.cpp:100 ROM, :276 autorun.txt, :324 DSK, :379 LOADM -- all FA_READ). Prefer the shortcut ONLY if it is written so PIZERO-72 can absorb it later WITHOUT a guest-visible ABI change. GOOD NEWS ON TIMING: this path is READ-ONLY, so it does NOT depend on PIZERO-64/65 (the SD write foundation and write-back queue) and none of the write-latency risk applies. Depends on PIZERO-83 and PIZERO-84.\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit with the new video device (PIZERO-84).]", "theme": "devices"}, {"id": "PIZERO-88", "type": "task", "status": "open", "priority": "medium", "summary": "Know how much frame time is left at 60 Hz, USB and keyboard included", "tags": ["measurement", "budget", "telemetry", "performance", "core0", "pre-work", "instrumentation"], "created": "2026-08-17", "updated": "2026-09-17", "description": "PRE-WORK for PIZERO-84 (new video device) and design input for PIZERO-65 (SD write-back): nobody currently knows core 0's real slack. TWO PROBLEMS, both verified in the source 2026-08-17.\n\n(1) THE RECORDED FIGURES DISAGREE AND ARE STALE. PIZERO-18 records emulate 10.8ms + render 2.75ms + blit 1.5ms = ~15.1ms against a 16.76ms budget (about 10% slack). PIZERO-48 records ~9.4ms used and 'only ~31% slack at 1x'. The 31% almost certainly predates the audio tap (which itself added +1.4ms to emulation) and counts emulation alone. Neither has been re-measured since PIZERO-45 promoted the build to true 640x480p60 at 252MHz. Every open ticket that reasons about headroom -- PIZERO-65, PIZERO-84, PIZERO-17 -- is currently reasoning against an unknown somewhere between 10% and 31%.\n\n(2) USB AND KEYBOARD ARE NOT TIMED AT ALL. In loop() (src/main.cpp:1122) the timestamp `a` is taken AFTER pump_keyboard() returns, so the [run] telemetry's cpu= field (src/main.cpp:1268) covers coco_machine_run_cycles only. USBHost.task() -- the prime freeze suspect, and the entire reason PIZERO-33's phase markers exist -- contributes ZERO to the reported frame time, as does pump_keyboard(). This is the largest instrumentation gap on the board: the one phase most likely to blow the budget is the one phase never measured.\n\nDO: add two timestamps so USBHost.task() and pump_keyboard() report alongside cpu/render/blit/aud in the [run] line, then capture a baseline on the default pizero_stream_60 env in three conditions -- (a) idle at the BASIC prompt (text mode), (b) a graphics-mode game (spacewarp), (c) with and without a USB keyboard attached, which isolates the USB cost. Record the numbers in this ticket, correct PIZERO-48, and update docs/cpu-speed.md.\n\nCHEAP, and it converts three design tickets from guesswork into arithmetic. SEE ALSO PIZERO-40, which would take the equivalent CORE-1 headroom measurement (its 'core-1 IRQ headroom from the PIZERO-36 counter' item is still unvalidated). Run together, the two give the first complete picture of the board's compute budget -- and decide whether the PIZERO-84 blit could ever move to core 1.\n\n[2026-08-17 A THIRD, DIFFERENT FIGURE exists: PIZERO-14 records 'core0 uses 11.3/16.76ms' (2026-05-27, pre-audio, pre-60Hz). So the recorded core-0 totals now span 9.4ms (PIZERO-48), 11.3ms (PIZERO-14) and 15.1ms (PIZERO-18), taken at different dates against different builds and two different refresh rates. This ticket supersedes all three with one current measurement on pizero_stream_60.]\n\n[2026-09-14 Run in the same session as PIZERO-98 (25-hour soak). The untimed USBHost.task() phase is also the leading freeze suspect in PIZERO-33, so timing it lets the soak correlate any freeze with a USB-time spike. Cross-port context: the Fruit Jam port's avg-run figure already includes USB and audio (FRUITJAM-76, 12,583 us idle), so a like-for-like comparison of the two 252 MHz DVI boards needs this number; the PiZero's current best figure (11.5 ms) predates audio and 60 Hz.]\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"Re-baseline core-0 frame budget at 60Hz and time the untimed USB/keyboard phases\"]\n\n[2026-09-17 FIRST NUMBERS from the PIZERO-108 harness, default pizero_stream_60, idle at the OPIL-EN autorun, NO keyboard attached: cpu median 10.37 ms (max 15.50, p99 11.42), render 4.84 ms, blit 1.57 ms, audio ~0-2 us. Those three phases sum to about 16.8 ms against a 16.67 ms frame, so the headroom at 60 Hz is essentially nil, and that is BEFORE USB and keyboard cost, which this run does not include (rpts=0). Treat as indicative, not the baseline this ticket asks for: 173 windows only, and the phase timers may overlap in ways the sum hides. It does say the re-baseline is overdue and that the answer may be uncomfortable.]\n\n[2026-09-17 MEASURED, and the answer is that there is no headroom: frame work is 16,821 us median against the 16,667 us period, 100.9%, with NO keyboard attached and USB therefore nearly free. Breakdown: cpu 10,383 us, render 4,862 us, blit 1,580 us, audio ~0. The consequence is visible in the audio stream (PIZERO-118): the machine runs 0.97% slow and 1% of audio samples are never produced. This ticket's re-baseline is therefore not just bookkeeping; the budget is already exceeded before the USB and keyboard phases it was opened to measure.]\n\n[2026-09-17 After the PIZERO-119 SG4 fix the budget looks completely different: frame total 12,902 us median, 77.4% of the period, with cpu 10,910 us, render 478 us, blit 1,515 us. That leaves ~3.7 ms of headroom for the USB and keyboard phases this ticket exists to measure, where before there was none.]\n\n[2026-09-17 WITH A KEYBOARD, cold-booted so it enumerates (usb=1): frame 12,504 us median = 75.0% of the period, p99 13,443 us, cpu 10,475 us, render ~470 us, blit ~1,550 us. USB and keyboard cost about 350 us. Audio steady: prod 48,010/s, short 0.0%, ring holding ~4,130. Log: docs/measurements/logs/2026-09-17-1944-pizero_stream_60-keyboard.log. Note the keyboard had to be present at boot: attaching it later leaves usb=0 and rpts=0, which is PIZERO-11b.]", "theme": "trust"}, {"id": "PIZERO-89", "type": "feature", "status": "open", "priority": "medium", "summary": "Wide alphanumeric modes: 40x16 and 40x20 text with CoCo3 attribute encoding", "tags": ["video", "text", "alphanumeric", "coco3", "gime", "attributes", "font", "palette"], "created": "2026-08-17", "updated": "2026-08-17", "description": "Add 40-column text alongside the existing 32-column VDG alpha mode. Same look, same 8x12 cell, just wider -- and 40 columns is ALREADY a CoCo3 mode (VRES_HRES_BPR_TEXT[8] = {32,40,32,40,64,80,64,80} at ~/github/xroar src/tcc1014/tcc1014.c:421, HRES=1 selects 40).\n\nGEOMETRY (both fall out exactly):\n  * 40x16 = 320x192 -- fills the framebuffer WIDTH exactly (40 x 8 = 320), letterboxed 24 lines top and bottom, which is the existing blit border offset (PIZERO_Y0=24, src/coco_boot.cpp:484). Literally the 32-col mode with the side borders removed.\n  * 40x20 = 320x240 -- fills the framebuffer ENTIRELY, no border. 20 x 12 = 240.\nNeither needs a new blit or new geometry code. Memory: 640/800 cells, doubling to 1,280/1,600 bytes when attributes are enabled.\n\nADOPT THE COCO3 ATTRIBUTE ENCODING (source-confirmed in xroar tcc1014.c:1380-1387, not from memory):\n  bit 7    BLINK      -- when set and the blink phase is on, fg is forced to bg (glyph vanishes)\n  bit 6    UNDERLINE  -- on the cell's LAST row only, the glyph row is forced to 0xFF\n  bits 5-3 FOREGROUND -- fg = 8 | ((attr >> 3) & 7)  -> palette entries 8-15\n  bits 2-0 BACKGROUND -- bg = attr & 7               -> palette entries 0-7\nAttributes are enabled by CRES bit 0; when OFF the GIME hardwires fg=1, bg=0. Two bytes per cell (char, attr interleaved) and the row stride doubles (row_stride = BPR << (CRES & 1), tcc1014.c:1131).\n\nWHY THIS FITS US PERFECTLY: CoCo3 text attributes need exactly 16 palette entries split 8 foreground / 8 background -- which is exactly the 16-entry LUT that PIZERO-55 / PIZERO-85 make writable. No adaptation needed. Also the GIME font is font_gime[1536] = 128 glyphs x 12 rows, BYTE-IDENTICAL in geometry and indexing (font[c*12+row]) to our font_6847t1[1536], so a RAM font (PIZERO-86) serves both with one format.\n\nALSO WORTH ADOPTING (all source-confirmed): $FF9A BRDR border colour -- we have visible borders in every mode narrower than 320 or shorter than 240 and they are currently hardcoded black (painted once at init, coco_boot.cpp:493); $FF9C VSC vertical scroll -- smooth text scrolling is expensive in software, near-free in the renderer; HVEN horizontal virtual screen, which forces a 256-BYTE ROW STRIDE (tcc1014.c:1131) -- the same power-of-two addressing win argued for on the graphics side, already present in the hardware. OPTIONAL: LPR variable glyph height (LPR_rowmask[8] = {0,1,2,8,9,10,11,16}, tcc1014.c:426) giving 1/2/3/9/10/11/12-row cells -- interesting because an 8-row RAM font would yield 24 text rows -- but it interacts with the UNDERLINE bit (which keys off rowmask), so adopt both together or neither.\n\nDO NOT ADOPT: MOCH / BPI (monochrome, burst-phase invert -- composite artifact controls, meaningless over HDMI); H50 (we are locked to 60Hz by PIZERO-45). 80-COLUMN IS OUT OF SCOPE HERE and cannot work in this pipeline -- 80 x 8 = 640 px against a 320-wide framebuffer. Tracked separately as PIZERO-90. Write the 40-column ceiling into the docs so nobody promises 80 later from this ticket.\n\nADDRESS-MAP CONSEQUENCE (decide with PIZERO-83): adopting GIME conventions means wanting GIME addresses -- $FF98 VMODE/LPR, $FF99 VRES/HRES/CRES, $FF9A BRDR, $FF9C VSC. That is the $FF90-$FF9F block. NOTE these do NOT collide with PIZERO-62's GIME timer at $FF94/$FF95 -- both are authentic GIME registers in the same chip's map. The outlier is PIZERO-72's hypercall. RECOMMENDATION: reserve $FF90-$FF9F wholesale as the GIME-compatible block, relocate the hypercall to $FF60-$FF6F, and use $FF60 only for things GIME never had (aperture, SD bitmap commands, RAM-font control). Be GIME-compatible wherever GIME has a concept; extend elsewhere. Depends on PIZERO-85 (palette) and PIZERO-86 (RAM font) for the full feature set, but the plain 40x16/40x20 geometry works without either.", "theme": "devices"}, {"id": "PIZERO-90", "type": "feature", "status": "deferred", "priority": "low", "summary": "80x40 native-resolution text mode via 1bpp TMDS scanout (second display path)", "tags": ["video", "text", "80-column", "libdvi", "tmds", "1bpp", "scanout", "editor", "risk"], "created": "2026-08-17", "updated": "2026-09-16", "description": "An 80x40 text mode at NATIVE 640x480 -- not a new text mode on the existing pipeline, but a SECOND SCANOUT MODE. Filed separately from PIZERO-89 because the cost profile is completely different.\n\nTHE GEOMETRY IS EXACT: 80 x 8 = 640 and 40 x 12 = 480. That is the native HDMI resolution precisely, using the SAME 8x12 cell and the SAME 1536-byte font format already in the tree (font_6847t1 / font_gime). Memory is trivial: 80 x 40 x 2 = 6,400 bytes of char+attr plus 1,536 bytes of font.\n\nTHE ENCODER ALREADY EXISTS in the vendored libdvi: tmds_encode_1bpp() is declared at lib/libdvi/tmds_encode.h:17 (hand-written assembly in tmds_encode.S) and there is a PIO-accelerated variant in lib/libdvi/tmds_encode_1bpp.pio.h. This is the standard PicoDVI high-resolution text path, not something we would invent.\n\nTHE COST -- 4x THE CORE-1 ENCODE WORK. The build is currently configured for 320x240 doubled to 640x480 (platformio.ini:46-47: -DDVI_VERTICAL_REPEAT=2 -DDVI_SYMBOLS_PER_WORD=2). Native 640x480 needs BOTH at 1, i.e. 4x the unique pixels encoded per frame on core 1. 1bpp encoding is far cheaper per pixel than the current 16bpp path and the RP2350 at 252MHz has real headroom, so this is EXPECTED to fit -- but core 1's utilisation has NEVER been measured. DO NOT START THIS BEFORE PIZERO-40 (core-1 headroom) lands; that measurement is the go/no-go, exactly as PIZERO-36 was for in-IRQ audio encode.\n\nTWO DESIGN QUESTIONS TO SETTLE:\n  (1) RUNTIME SWITCHING. DVI_VERTICAL_REPEAT and DVI_SYMBOLS_PER_WORD are COMPILE-TIME defines affecting buffer sizes and encoder selection. Moving between 320x240 graphics and 640x480 text at runtime means tearing down and re-initialising libdvi. The DVI TIMING is identical either way (640x480p60), so only the encode path and buffer layout change -- plausible, but it touches the PIO/DMA setup and must not wedge the shared PIO resources (same class of risk as the PIZERO-51 stop/restart work). Alternative: ship it as a separate build env first and defer runtime switching.\n  (2) PER-CHARACTER COLOUR. tmds_encode_1bpp encodes a span against ONE fg/bg pair, but CoCo3 attributes (PIZERO-89) give every cell its own pair. Either encode per 8-pixel cell (more per-cell overhead, still cheap) or restrict this mode to a single global fg/bg. Decide deliberately; do not discover it during implementation.\n\nWHY IT IS WORTH IT: at 80x40 the text is genuinely 1:1 sharp -- far crisper than anything the current doubled pipeline can display -- which makes a real 80-column editor on the CoCo possible. That lines up directly with docs/product-plan.md's 'write and run your own programs' positioning. Also note the audio data-island encode already shares core 1 (~2.3ms/frame per PIZERO-36) and must keep fitting alongside the heavier encode. Depends on PIZERO-40 (measurement, hard gate) and PIZERO-89 (attribute/font conventions).\n\n[2026-09-16 DEFERRED in the PIZERO-107 triage. Not rejected, parked: it is an idea, not scheduled work, and leaving it open misrepresented intent. REVISIT TRIGGER: Revisit if 80 columns is asked for; it is a second display path, not a tweak.]", "theme": "devices"}, {"id": "PIZERO-91", "type": "task", "status": "open", "priority": "medium", "summary": "Replace product-plan.md with a friends-and-family kit plan (docs/kit.md)", "tags": ["docs", "kit", "hardware", "bom", "assembly", "distribution"], "created": "2026-08-17", "updated": "2026-08-17", "description": "SUPERSEDES the original version of this ticket (which was a refresh list for docs/product-plan.md). USER DIRECTION 2026-08-17: the commercial proposal is not appropriate to this project's context -- there is no store, no orders, and no pricing tiers. Units are built in low quantity and given to friends at the author's own expense; anyone who asks is generally eligible. docs/product-plan.md DELETED in the same commit rather than edited, because half-updating it would leave a document with a confused identity (its tiering, margins, unboxing and CoCoFEST! positioning all answer questions nobody is asking).\n\nTHAT DELETION ALSO RESOLVES the most serious problem the old ticket recorded: product-plan.md:88 asserted the hot-replug symptom was 'caused by marginal dev-port VBUS' and recommended a better power supply -- a root cause PIZERO-11b explicitly retracted ('an agent assumption, not a tested result') and PIZERO-51's T1 test disproved (VBUS is never SWITCHED; there is no software VBUS control, schematic-confirmed). That claim is now gone rather than corrected. Same for the section 3.5-vs-7 self-contradiction over the audio warble, the superseded ~52Hz/PIZERO-44 language, and the inverted joystick/disk-swap scope.\n\nWRITE docs/kit.md IN ITS PLACE, covering ONLY hardware and assembly:\n  * WHAT SHIPS -- the Waveshare board (off the shelf), a case (3D-printed or an adapted off-the-shelf shell), a mini-HDMI->HDMI cable, and a USB-C male -> USB-A female OTG adapter. Those last two are the load-bearing 'incidentals': the board's HDMI is the MINI size and its USB HOST port is a Type-C (README.md:76 -- the OTHER Type-C is power/programming), so a normal USB keyboard cannot physically reach the host port without an adapter. Without both items the unit is unusable and the recipient will not know why.\n  * WHAT DOES NOT SHIP -- keyboard (any simple wired USB one), microSD (any), USB-C power (any phone charger), HDMI cable (if a mini->HDMI cable rather than an adapter is supplied), and ROMs/games/programs (recipients source their own; gifting is still distribution, so the no-copyrighted-ROMs rule from the deleted plan's section 4 still holds and is already stated in README.md).\n  * PRE-FLASH EVERY UNIT. The build already emits .pio/build/pizero_stream_60/firmware.uf2 (~483 KB), so the update path for a recipient is hold BOOT, plug USB-C, drag the .uf2 onto the RPI-RP2 drive -- no PlatformIO, no toolchain. Ship that .uf2 on the SD card if one is included. This is the difference between a thing people play with and a thing that sits in a drawer.\n  * THE GOTCHA CARD -- these four items will generate every support question, so print them: (1) THE KEYBOARD MUST BE ATTACHED BEFORE POWER-ON; hot-plug does not work and is a hardware limitation, not a pending fix (PIZERO-51). (2) USB 1.1 ONLY -- simple wired keyboards and full-speed wireless receivers work; high-speed USB 2.0 peripherals do not enumerate. (3) The two Type-C ports look identical -- label which is power and which is host. (4) FAT32 SD card, ROMs in /coco, see AUTORUN.md.\n\nCASE -- OPEN QUESTION TO SETTLE BEFORE ORDERING IN QUANTITY: the board is 65 x 30 mm, the SAME OUTLINE as a Raspberry Pi Zero, so off-the-shelf Pi Zero shells should fit the footprint and mounting holes. BUT a real Pi Zero uses MICRO-USB where this board uses USB-C, and it has an extra Type-C, a 2-pin battery connector and a 3-pin debug header. So the cutouts will NOT line up even though the outline does. Verify with one physical case before buying ten: either enlarge the USB cutouts (easy in soft plastic), print a custom shell, or choose an open-edge/GPIO-exposed style where the sides are open anyway. Must expose both Type-C ports, mini-HDMI, the microSD slot, and BOOT BUTTON ACCESS -- BOOT is the recovery path when a flash goes wrong.\n\nBOM / QUANTITY: initial run of 10 units. Board pricing as of research 2026-08-17: $9.99 direct from Waveshare's own store vs $17.17 on Amazon (both per CNX Software's launch coverage), and ~$7.21 seen on AliExpress. Waveshare-direct is roughly half the Amazon price, so ordering the boards direct is the single biggest lever on total cost; order spares, since the board is the only irreplaceable item in the kit. Accessory prices were NOT obtainable programmatically (Amazon blocks automated price retrieval) -- fill in real figures when ordering rather than trusting an estimate.\n\nALSO STILL OPEN from the old ticket, unaffected by the deletion: docs/BUILD.md section 5 tells the builder to verify 'fps~=52' when the default pizero_stream_60 env runs at 60 -- one-word fix. And ROADMAP.md needs a pass to add PIZERO-83..91 and retire its 'Now: Input/USB' framing now that PIZERO-51's software path is disproven. ALREADY OWNED ELSEWHERE: docs/cpu-speed.md's stale budget figures are PIZERO-88; the missing docs/compatibility.md referenced by ROADMAP.md:25 is PIZERO-52.", "theme": "kit"}, {"id": "PIZERO-92", "type": "feature", "status": "done", "priority": "high", "summary": "Say what is wrong instead of showing a black screen", "tags": ["ux", "boot", "diagnostics", "vdg", "sd", "rom", "kit", "first-run"], "created": "2026-08-17", "updated": "2026-09-27", "description": "FOUND while drafting docs/kit.md 2026-08-17 by checking the failure path rather than assuming it. THE PROBLEM: if the SD card has no /coco/roms/bas12.rom, setup() prints 'ROM load FAILED (need /coco/bas12.rom [+extbas11.rom])' and RETURNS EARLY (src/main.cpp:1066); g_machine_running stays false and loop() just delay(1000)s (:1201). The message goes ONLY over USB-CDC serial. But multicore_launch_core1(core1_main) already ran at :1060, so libdvi IS running -- the monitor SYNCS and then shows a black frame.\n\nWHY THAT IS THE WORST POSSIBLE FAILURE MODE: a monitor that syncs to a black picture is indistinguishable from a dead unit. The recipient of a gifted unit (PIZERO-91) has no serial console, no expectation of one, and no reason to suspect the ROM. They will conclude the hardware is broken. This is the single most likely first-run experience for anyone who plugs in before reading the card, because we deliberately ship NO ROMs (copyright) -- so EVERY unit fails this way on first power-up BY DESIGN.\n\nSAME CLASS OF FAILURE, same silent result: SD mount failure ('SD mount FAILED -- no ROMs, idle.', main.cpp:1065) and coco_machine_init failure (:1070). All three return early to a black screen.\n\nFIX: draw the diagnostic to the framebuffer instead of only to serial. The renderer needed already exists and is cheap -- coco_boot_blit_vdg_pizero_src(const uint8_t*, uint16_t*) (coco_boot.h:76) takes any VDG-format buffer, and font_6847t1 is available; PIZERO-81b is porting exactly this kind of small text-card renderer (coco_boot_card_clear / card_text / card_buffer from the AMOLED port). If PIZERO-81b lands first, reuse its card renderer verbatim -- this is the same 32x16 text card with different content. Otherwise this ticket justifies building it, and PIZERO-81b then reuses THIS.\n\nMESSAGE CONTENT should be actionable, not an error code -- the reader is a non-technical recipient:\n  * no SD card / mount failed -> 'NO SD CARD -- INSERT A FAT32 CARD'\n  * card present, no bas12.rom -> 'NO ROM FOUND. COPY bas12.rom TO /coco/roms/ ON THE SD CARD. SEE THE CARD IN THE BOX.' Name the exact file and path; that is the whole fix for them.\n  * machine init failed -> a distinguishable message so a real fault is not confused with a missing file.\nKeep it legible on a TV at a distance: the existing 32x16 card at 8x12 glyphs is right, and it is the same look as the emulator so it does not appear to be a different device.\n\nALSO: keep the serial messages, do not replace them -- they are how WE debug. And ensure the screen keeps refreshing / the loop still pets the watchdog (PIZERO-33) so the board does not appear to hang while showing the message.\n\nPRIORITY high, ahead of most of the video-mode work: it is small, it reuses existing code, and it is the difference between a gift that works and a gift that looks broken. Blocks nothing, but PIZERO-91 (kit.md) currently has to warn recipients in print that a black screen is expected -- which is a documentation workaround for a UX bug.\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"On-screen boot diagnostics: a missing ROM currently shows a BLACK SCREEN with no explanation\"]\n\n[2026-09-18 IMPLEMENTED, not yet seen on a screen (the board is mid-soak).\nA 32x16 text card in the machine's own 8x12 font and live palette, so a diagnostic looks like it came from the CoCo rather than from some other device: coco_boot_card_clear/_text/_center/_present in src/coco_boot.cpp, declared in coco_boot.h.\nCOSTS 512 BYTES, not the 24 KB a second VDG buffer would have: the card holds a character grid and renders straight into the framebuffer a glyph row at a time. PIZERO-81b can reuse it; it is the same card with different content.\nAll three pre-machine failures now draw as well as print (serial messages kept, as the ticket required): SD mount, ROM load, machine init. The idle loop already pets the watchdog every second, so the board holds the message instead of rebooting under it.\nMESSAGES name the exact path, since that IS the fix for the reader: 'COPY BAS12.ROM TO /COCO/ROMS/ ON THE SD CARD'. Checked against the resolver rather than the old serial string, which said /coco/bas12.rom: coco_boot_resolve prefers /coco/roms/ and falls back to flat /coco/ (coco_boot.cpp:147), so the message quotes the preferred path. The init failure is worded differently on purpose so a real fault is not mistaken for a missing file.\nREUSES TESTED CODE rather than re-deriving it: the glyph fold is vdg_alpha_glyph_index from vdg_pack.h, already covered by PIZERO-109's tests. The ASCII mapping and centring moved into src/text_card.h and got 8 host tests of their own, including that every one of the 256 possible bytes lands inside the font block, that unprintables become spaces rather than random glyphs, and that every real message fits 32 columns. 66 tests now pass.\nREMAINING: see it on a screen. The natural check is to rename bas12.rom on the card and power on.]\n\n[2026-09-18 TURNED INTO FULL PAGES, and the two gaps closed.\nThe card is 512 characters and we were using about 80 of them. A failure now gets a page: a centred title, a wrapped body saying what happened and what to do, and a detail block carrying the evidence. House style recorded in src/boot_messages.h: what happened then what to do, name exact files and folders, no error codes, no jargon, no blame.\nGAP 1 CLOSED, a truncated ROM used to say NO ROM FOUND. coco_boot_load_rom_from_sd now records what it found (struct coco_rom_status: found flags and byte counts), so a present-but-wrong-size bas12.rom gets its own page, ROM FILE IS DAMAGED, with the actual byte count in the detail line. Someone is no longer sent hunting for a file that is sitting on the card.\nGAP 2 CLOSED, a missing extbas11.rom was silent. It is not fatal, so the machine still starts, but it silently costs Extended and Disk BASIC and a recipient has no way to connect failing DISK commands to a file they never copied. A COLOR BASIC ONLY page now shows for 4 seconds before handing over.\nMESSAGES MOVED OUT OF main.cpp into src/boot_messages.h so the tests can see what the reader will see. 8 more tests, 74 in the suite: every body fits its 7 rows and every detail its 3 at 28 columns, titles fit centred, wrapping always makes progress (a wrap bug that returned 0 would hang the boot path of the very feature meant to stop the machine looking broken), long paths hard-break instead of vanishing, every message is printable in the 6847 font, the two ROM failures do not read alike, and each names the exact path.\nOne test failed first time and the error was mine again, in the expected value rather than the code: the first 8 characters of /COCO/ROMS/BAS12.ROM are /COCO/RO.\nRendered all five pages as text on the host to check the layout by eye (.ref/preview_pages.cpp, not committed). Still to do: see one on a real screen.]\n\n[2026-09-27 DONE: seen on a real screen. The user booted a CoCo Zero with no microSD card and photographed the NO SD CARD page on a TV: title centred, body wrapped as written in src/boot_messages.h, detail line at the foot, in the CoCo font and green, with no black screen. Only that page was photographed; the other four (NO ROM FOUND, ROM FILE IS DAMAGED, EMULATOR DID NOT START, COLOR BASIC ONLY) are filed as PIZERO-144.]", "theme": "trust"}, {"id": "PIZERO-93", "type": "task", "status": "open", "priority": "medium", "summary": "docs/kit.md: power & keyboard section -- supply sizing, power-bank gotcha, keyboard selection criteria", "tags": ["docs", "kit", "hardware", "power", "usb", "keyboard", "bom"], "created": "2026-08-26", "updated": "2026-08-26", "description": "WHY: docs/kit.md tells a recipient to use \"any phone charger\" (kit.md:32) and \"any simple wired USB keyboard\" and says nothing more. Both are underspecified in ways that produce silent, confusing failures -- an undersized supply or a power bank that switches itself off looks exactly like a dead unit, and a keyboard with a built-in hub is the most likely \"it just doesn't work\" report the PIZERO-91 kit will generate. Add a POWER & KEYBOARD section to docs/kit.md.\n\nWHAT THE SCHEMATIC ESTABLISHES (verified 2026-08-25 by reading docs/RP2350-PiZero-schematic.pdf; these are facts, not estimates):\n  * Main rail is a TMI3112H synchronous buck (1uH / 3.5A inductor, FB = 0.6V) -> 3V3. Grossly oversized for this load; the regulator is not the constraint.\n  * BOTH USB-C PORTS SIT ON ONE SHARED VBUS NET, reaching VSYS through an MBR230LSFT1G schottky. There is NO load switch and NO polyfuse on the host port -- a keyboard draws straight from the input supply, minus one diode drop. (Consistent with PIZERO-11b/PIZERO-51: VBUS is never switched, there is no software VBUS control.)\n  * Each port has 5.1K CC pulldowns (Rd, sink config), so the board presents as a legitimate 5V sink and C-to-C from a modern PD charger works -- it will not be starved.\n  * CONSEQUENCE WORTH PRINTING: because VBUS is one net, plugging power into the \"wrong\" Type-C still powers the board; it just leaves the keyboard nowhere to go. That is a friendlier failure than kit.md:120 (\"The two USB-C ports are different\") currently implies, and the gotcha card can say so.\n  * There is also an ETA6096 Li-ion charger and a BAT pad (R15 selects 1A / 2A / 2.5A charge current), so battery operation is a latent hardware option. NOT in scope for the kit; mention only if it stops the reader from wondering what the 2-pin connector is.\n\nWHAT IS NOT KNOWN: Waveshare publishes NO power-consumption figure for this board -- not on the wiki, not in the schematic. The figures below are ENGINEERING ESTIMATES for the pizero_stream_60 product build (252 MHz, both cores saturated, PIO+DMA shifting TMDS continuously). Label them as estimates in the doc until measured.\n\n  Board @ 3V3: RP2350B both cores ~100-130mA; TMDS drive into 4x 100R differential pairs ~40-60mA; SD card 20-100mA in burst during autorun only; LEDs/quiescent ~10mA. Total ~150-250mA @ 3V3, which through the buck at ~88% is ~120-190mA @ 5V -- call it 1W steady.\n  Keyboard @ 5V, added on top: basic wired membrane 20-50mA; 2.4GHz wireless dongle 30-100mA; unlit mechanical 50-100mA; white-backlit mechanical 150-350mA; RGB gaming board 300-500mA and spikier.\n  Worst realistic total ~0.7A @ 5V (~3.5W). Typical with a sane keyboard ~0.3A (~1.5W).\n\nRECOMMENDATIONS TO WRITE UP:\n  * SUPPLY: 5V / 2A (10W) minimum, 5V / 3A ideal. Any decent phone charger or PD brick. 1A technically works but leaves no headroom for a hungry keyboard plus inrush.\n  * POWER BANKS -- THE REAL GOTCHA. At ~1.5W many banks decide nothing is connected and shut off after 15-30 seconds. If battery operation is suggested at all, specify a bank with a low-current / trickle mode; otherwise do not suggest it. This belongs on the gotcha card, not buried in prose.\n  * KEYBOARD SELECTION CRITERIA: wired, dumb, no lighting, and -- most important -- NO BUILT-IN USB HUB OR PASSTHROUGH PORT. Pico-PIO-USB's hub support is the weak spot in that stack; a keyboard that enumerates as a hub with a HID device behind it is the likeliest hard failure. A plain 60%/65% wired membrane or an unlit mechanical is the safe pick and keeps the whole unit pocketable. A 2.4GHz wireless mini-keyboard is attractive (one endpoint, low draw, tiny) but MUST be tested -- the dongle has to present as a boot-protocol HID keyboard. This sits alongside the existing USB 1.1 / full-speed-only constraint already recorded in kit.md and README.md.\n\nMEASUREMENT LEFT AS A TODO FOR THE USER (hardware, cannot be done by an agent): put a USB-C inline power meter between the charger and the power port, boot the pizero_stream_60 build, and record three states -- idle at the BASIC prompt, running a game, and with the keyboard attached. That converts every estimate above into a measured figure. Write the section with the estimates and a clearly marked placeholder, then fill in the real numbers; do not block the doc on the measurement.\n\nRelated: PIZERO-91 owns docs/kit.md itself. This is filed separately rather than folded into it because PIZERO-91 is already large and its remaining scope is the case decision and the BOM.", "theme": "kit"}, {"id": "PIZERO-94", "summary": "3D-printable case: parametric OpenSCAD shell for the Waveshare RP2350-PiZero", "description": "WHY: docs/kit.md sec.5 plans off-the-shelf Pi Zero CNC shells (~$6) and notes they do NOT match this board's ports: two USB-C instead of micro-USB, plus a 2-pin BAT connector and a 3-pin debug header. kit.md already lists 'publish an STL once a printed design exists' as a follow-on. This ticket is that design.\n\nTOOLING: OpenSCAD 2021.01 is installed (/Applications/OpenSCAD-2021.01.app) and BambuStudio for slicing. Code-defined CAD, so the agent can author and render it headlessly and every dimension stays a named parameter. Files live in hardware/case/.\n\nREFERENCE GEOMETRY (Waveshare wiki dimension drawing, 800x400 px, scaled off the 65.00 mm callout; +/- ~0.2 mm, to be confirmed with calipers on a real board):\n  board outline 65.00 x 30.00 mm, same as a Raspberry Pi Zero\n  mounting holes dia 3.00 mm, Pi Zero pattern: 58 x 23 mm, 3.5 mm inset from each edge\n  bottom edge, measured from the left edge:\n    mini-HDMI   6.3 - 18.4 mm  (width ~12.0, centre ~12.35)\n    USB-C PIO   34.3 - 43.9 mm (width ~9.6,  centre ~39.1)  <- USB host / keyboard\n    USB-C power 48.8 - 58.4 mm (width ~9.6,  centre ~53.6)\n  left edge:  microSD slot ~9.0 - 19.2 mm from the top edge\n  right edge: 2-pin BAT JST ~6.4 - 15.6 mm from the top edge\n  top edge:   40-pin 2.54 mm header\nA Pi Zero puts its micro-USB ports at ~41.4 and ~54.0 mm, so the USB cutouts genuinely move.\n\nSTILL NEEDED (not derivable from a top-down drawing): PCB thickness, connector heights above the PCB, how far each connector overhangs the outline, header height, and tallest top-side component.\n\nSCOPE: parametric .scad source, rendered STLs, a fit-test coupon (ports and holes only, ~10 min print) before committing to a full shell, and a short hardware/case/README.md. Openings for BOOT and RUN, the microSD slot, and the 40-pin header are design decisions to settle with the user.\n\nDONE 2026-09-12. Confirmed on hardware: base and lid both print clean and no supports, board seats without force, case closes, ports line up, both buttons reachable through the vent slots. Case is 69.8 x 34.8 x 20.6 mm, four M2.5 x 12 countersunk screws. Source is hardware/case/pizero_case.scad, 493 lines and 78 parameters; STLs and a fit-test coupon render from it. Fourteen revisions, 578a84a..09d3767. Remainder filed as PIZERO-95, 96 and 97.", "type": "feature", "status": "done", "priority": "medium", "created": "2026-09-11", "updated": "2026-09-12", "tags": ["hardware", "case", "3d-print", "openscad", "kit", "mechanical"], "theme": "kit"}, {"id": "PIZERO-95", "summary": "docs/kit.md section 5: replace the CNC-shell plan with the printed case", "description": "WHY: kit.md sec.5 still says 'Current plan: off-the-shelf CNC aluminum shells (~$6), cutouts opened by hand' and lists 'publish an STL once a printed design exists' as a follow-on. That design now exists and is confirmed on hardware (PIZERO-94), so the section's premise is stale and its cost argument needs redoing.\n\nWHAT: point sec.5 at hardware/case, drop the file-the-cutouts-by-hand instructions, and revisit the buy-vs-print sums. The old break-even was ~40 cases against a printer you did not own; the printer now exists and the shells do not need modifying, which inverts the answer. Also update the fit note, which currently warns that Pi Zero shells do not match this board's ports.\n\nALSO: nothing outside hardware/ mentions the case at all. README has no pointer to it, so a visitor to the public repo will not know the case exists. Add a short 'Case' section to README linking hardware/case/README.md, and mention it in the 'What you need' list as an optional printed alternative to a bought shell.\n\n[2026-09-12 PART DONE: the README half is finished. Project README now carries a Case section before References, links hardware/case/README.md from it and from 'What you need', and warns that a stock Pi Zero shell fits the outline but not the ports. hardware/case/README.md gained an overview table, a 'Printing it' quick start and a 'How it was designed' section. REMAINING: docs/kit.md sec.5 still plans bought CNC shells with hand-filed cutouts and its buy-vs-print sums predate owning a printer.]\n\n[2026-09-12 DONE: kit.md sec.5 rewritten around the printed case. Bought CNC shells and the hand-filing budget are gone; the section now leads with hardware/case, carries a spec table, and states plainly what changed and why (the design and the printer both now exist, so the old ~40-case break-even no longer applies). Knock-on edits: sec.1 table row, sec.2 BOM line and total ($28 -> $23/unit, ~$230 for ten), sec.3 step 2 (no filing, but check BOOT access through the vents). Two honest gaps recorded in sec.5: the 40-pin header is enclosed rather than exposed, and the two USB-C ports are not labelled on the case.]", "type": "task", "status": "done", "priority": "medium", "created": "2026-09-12", "updated": "2026-09-12", "tags": ["3d-print", "bom", "case", "docs", "kit", "readme"], "theme": "kit"}, {"id": "PIZERO-96", "summary": "Case: countersink is 72.5 degrees, not the 90 a standard screw head wants", "description": "FOUND while speccing fasteners for PIZERO-94. screw_head_h is 1.5 mm across a 5.0 -> 2.8 mm taper, which is a 72.5 degree included angle. A standard DIN 965 M2.5 head is 90.\n\nEFFECT: the head seats 0.20 mm below the outer face, bearing on the rim of the countersink rather than across the cone face. It is flush, it does not rock, and it clamps fine, so the printed base is usable as it is. Line contact will dig into the plastic over many open/close cycles.\n\nFIX: screw_head_h 1.5 -> 1.1 makes it a true 90 degree cone. One line. Deliberately not applied yet, because it changes the base that is currently confirmed on hardware; fold it in whenever a base is reprinted for another reason.\n\n[2026-09-25 APPLIED IN THE MODEL at the user's go-ahead: screw_head_h 1.5 to 1.1. Measured on the rendered base mesh: countersink 4.98 mm across, 1.09 mm deep, 90.0 degree included angle (was 72.5). A 4.7 mm DIN 965 head now seats on the cone face about 0.15 mm below the surface instead of on its rim at 0.20, and there is 0.4 mm more floor under each seat. Base only: BASE v9 to v10; base.stl and plate.stl re-rendered, lid files untouched. The v9 base in use is fine and does not need replacing.\nDONE WHEN: a BASE v10 is printed and the screw heads seat flush and flat.]\n\n[2026-09-25 DONE: BASE v10 printed; the user reports it \"screwed together much nicer\", so the 90 degree seat is right. The heads stood just proud enough in the last turns to scrape a desk, so seat DEPTH is filed separately as PIZERO-127 rather than holding this open.]", "type": "bug", "status": "done", "priority": "low", "created": "2026-09-12", "updated": "2026-09-25", "tags": ["hardware", "case", "3d-print", "openscad", "fasteners"], "theme": "kit"}, {"id": "PIZERO-97", "summary": "Case: [?] parameters are still estimates, never measured against a board", "description": "PCB thickness, USB-C and microSD connector heights, plug overmould sizes and the base relief depth are all still marked [?] in hardware/case/pizero_case.scad: estimates that were never checked with calipers. Everything fits, so they are right enough, but nobody knows by how much margin.\n\nWHY IT MATTERS: the margins are invisible until a supplier changes a connector or the case is adapted to another board, at which point a wrong estimate reads as a mystery fit problem. Measuring them converts luck into knowledge.\n\nHOW: the base wall rim sits exactly at the PCB top surface by design, so with a board seated the rim is a z-zero datum to measure connector heights against. Re-mark each parameter [M] once measured.", "type": "task", "status": "open", "priority": "low", "created": "2026-09-12", "updated": "2026-09-12", "tags": ["hardware", "case", "3d-print", "openscad", "measurement"], "theme": "kit"}, {"id": "PIZERO-98", "summary": "Prove it runs 25 hours unattended: freezes and video dropouts per hour", "description": "WHY: this board is regarded as the most stable of the RP2350 XRoar ports in everyday use, but no long run has ever been recorded here. There is no soak, no video-dropout counter, and PIZERO-33's persistent freeze counter has never caught a real freeze. The sibling Fruit Jam port has a measured 25-hour baseline of 7.6 video dropouts per hour, each about 1 s of black (its README, FRUITJAM-56/58). Until this board is measured the same way, \"more stable\" is an impression rather than a figure, and it is the figure the friends-and-family kit (docs/kit.md) rests on. Raised by the 2026-09-14 cross-port comparison (xroar-adafruit-rp2350-fruit-jam/docs/rp2350-port-comparison.html).\n\nDO:\n(1) Flash the default pizero_stream_60 env and start from a COLD power-on. A dev-tool reboot can leave freezes=1 residue (PIZERO-33).\n(2) Log serial for at least 25 hours with wall-clock timestamps. The Fruit Jam port's scripts/serial_logger.py survives reboots and can be copied. Kill any previous logger first: two readers on one port produce \"device reports readiness to read but returned no data\", which reads exactly like a board fault.\n(3) Record freezes=N and last phase, fps and cpu from the [run] line. The watchdog only sees core-0 hangs, so also sample the frame count on a fixed interval (Fruit Jam uses 150 ms) to catch a video fault while the emulator keeps running. Log on an interval, never only on change, so a quiet log cannot be confused with a dead probe.\n(4) Keep a USB keyboard attached, since PIZERO-11b/31 attribute earlier freezes to USB-host load. If any freeze appears, run a second arm without the keyboard.\n(5) Confirm the probe strings are in the flashed binary (strings on firmware.elf) before believing a zero.\n\nCOMPLETION CONDITION: freezes per hour and video-fault episodes per hour over at least 25 h, recorded here and in the README, stated against Fruit Jam's 7.6/hr. Zero is a valid result and would let PIZERO-33 close. Run in the same session as PIZERO-88 so the re-baselined frame budget comes from the same build.\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"25-hour soak of pizero_stream_60: freezes per hour and video faults per hour, comparable with Fruit Jam's 7.6/hr\"]\n\n[2026-09-17 19:51 SOAK RUNNING. 25 h logged by scripts/soak.py to docs/measurements/logs/2026-09-17-1951-pizero_stream_60.log, on the post-PIZERO-119 build (frame 12.5 ms, 75% of budget, audio short 0.0%), cold-booted with the keyboard attached so it enumerates, AUTORUN loading OPIL-EN.dsk. The watchdog reported a freeze in 'frame-pace' at that boot; it coincides with the power cut so it is treated as baseline, not as a freeze during this run (see PIZERO-33).]\n\n[2026-09-18 AT 13 HOURS, and the headline changed once the analyser stopped lying.\n  uptime   99.981% of seconds in band, 5 bad windows in 13.07 h\n  sound    shortfall 0.0%, underruns 0; but 402,769 ring-overflow skips, the PIZERO-121 defect\n  sync     0.38 short windows/h, no silences\n  crashes  THREE freezes, all in 'emulate', 0.23/h -- see PIZERO-33\nI reported this run as clean at 4.9 h and that was wrong: the analyser was misattributing real freezes. Two bugs, one in the firmware and one in the harness, and they hid each other. The firmware computed the uptime in the freeze message as frames/52, a leftover from the off-spec ~52 Hz build, which overstates it by 15% at 60 Hz; the harness then compared that inflated number against the session that had just STARTED rather than the one that died, and concluded every freeze belonged to somebody else. Fixed in both places: the firmware now divides by 60, and the harness attributes by structure (only the first banner in a log can describe a session that began before we attached) rather than by arithmetic on a number the firmware got wrong.\nCOMPARISON THE TICKET ASKS FOR: the Fruit Jam's baseline is 7.6 video dropouts/h. This board shows 0.38 short windows/h and no video dropouts of the second-long kind, so on video it is far better. On crashes it is not clean at all: 0.23 freezes/h, every one recovered by the watchdog.]\n\n[2026-09-18 THE HOST SLEPT AND WE LOST 43% OF THE RUN. 45 gaps totalling 5.68 h of a 13.14 h span, in ~16-minute chunks: the laptop sleeping and briefly waking with the lid closed. The board kept running throughout (it is on its own power and the telemetry resumes mid-stream); what stopped was us listening.\nCONSEQUENCES, both now corrected in the harness: per-hour rates were divided by wall clock rather than by time OBSERVED, understating everything by 43%; and freezes that happened inside a gap leave no watchdog message to count. The board's own counter moved 6 while we saw 3 messages, so the true freeze count is about SIX in 13 h, i.e. ~0.46/h, not the 0.23/h reported earlier.\nThe analyser now reports wall clock and observed hours separately, lists the gaps, computes rates per hour observed, and flags when the board counter disagrees with the message count.\nFOR THE REST OF THIS RUN AND THE NEXT: keep the lid open, or the Mac awake. A soak measured through a sleeping host is a soak of the host.]\n\n[2026-09-18 A UF2 FLASH WAS MANUFACTURING FAKE FREEZES. Flashing reboots THROUGH the watchdog, so 'timer reset plus surviving magic' was enough to be reported as a freeze, and the payload was uninitialised: 'stuck in loop-top after ~268435456 frames (~51 days)', which is 0x10000000. Since the analyser counts these messages, every flash would have seeded the next soak with a phantom.\nFIXED by sanity-checking the payload as well as the magic: a real freeze carries a plausible frame count (a week at 60 Hz is 36.3 M) and a phase that is one of ours. An invalid one now prints 'scratch invalid after a timer reset -- treating as a fresh start, not a freeze' and drops the carried tally. Verified on the next flash, which printed exactly that instead of a bogus freeze.\nThis is the third time a measurement bug has hidden behind a plausible-looking number in this ticket: frames/52, the attribution rule, and now flash scratch. Distrust the summary; read the raw line.]\n\n[2026-09-28 CLOSED at ~80% on the user's call ('haven't we done 98 enough?').] Delivered: the comparison the ticket was for. Video 0.38 short sync windows/h and no second-long dropouts vs Fruit Jam's 7.6 dropouts/h; freezes about 0.46/h, all in 'emulate', all watchdog-recovered (PIZERO-33 owns them). Three measurement bugs found and fixed on the way (frames/52 uptime, freeze attribution, UF2 flash faking freezes). Recorded in README ('Stability, measured'). NOT delivered: 25 h observed (13 h wall clock, ~7.5 h observed; the host slept). Not re-run on the old build because the firmware has changed a great deal since (key layers, fonts, gamepad, hub). Filed as PIZERO-168: soak the current firmware, 25 h observed, paired with PIZERO-121's first long run.", "type": "task", "status": "done", "priority": "high", "created": "2026-09-14", "updated": "2026-09-28", "tags": ["stability", "measurement", "kit"], "theme": "trust"}, {"id": "PIZERO-99", "summary": "Picture locks on other people's TVs, not just the one development monitor", "description": "The default pizero_stream_60 timing is 800x525 at 25.2 MHz with horizontal blanking split 8/96/56 (front porch / sync / back porch), narrowed from the standard to make room for HDMI audio data islands (PIZERO-44/45). It has only been validated on the one development monitor, and that monitor ignores HDMI audio clock regeneration (PIZERO-32), so it is also a lenient test of the audio packets. docs/kit.md plans a batch of about ten units for other people, who will plug them into TVs and monitors nobody here has tried.\n\nDO: try at least three further sinks, ideally including a TV and an HDMI capture device or cheap HDMI adapter, which tend to be the least tolerant of off-standard blanking. For each, record: does it lock, time to lock, any edge rolling or shimmer, whether audio plays, whether pitch matches desktop XRoar (the ACR question in PIZERO-32), and behaviour after a cold boot and after switching the sink's input away and back.\n\nCOMPLETION CONDITION: a compatibility table in docs/kit.md (or the README) listing every sink tried and its result. A sink that rejects the timing becomes its own bug naming the model; do not hold this issue open for it. Revisit trigger for PIZERO-32: any sink that honours ACR and plays at a different pitch. Raised by the 2026-09-14 cross-port comparison (xroar-adafruit-rp2350-fruit-jam/docs/rp2350-port-comparison.html).\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"60 Hz timing (8 px front porch, 56 px back porch) has only been verified on one monitor: test more sinks before kits ship\"]", "type": "task", "status": "open", "priority": "medium", "created": "2026-09-14", "updated": "2026-09-17", "tags": ["display", "hdmi", "kit"], "theme": "trust"}, {"id": "PIZERO-100", "summary": "Renderer draws $0400 when the SAM display base is legitimately $0000 (bug shared by all four RP2350 ports)", "description": "lib/coco_machine/src/coco_machine.cpp:522 and :1077 compute 'const uint16_t base = g_m.sam_f ? g_m.sam_f : 0x0400;'. Zero is treated as \"never set\", so a program that clears every SAM F bit to put the display at $0000 has $0400 drawn instead.\n\nThe identical line is in all four RP2350 XRoar ports: the AMOLED port (filed as AMOLED-70, open, high, inferred from source and not yet confirmed on hardware), the Fruit Jam (FRUITJAM-108) and the 4.3B (flagged by its uncommitted COCO-68 diagnostics). This glue descends from the AMOLED port.\n\nIMPACT: probably rare, since BASIC and most software never place the display at $0000. The fallback presumably exists because SAM F reads 0 before BASIC initialises it, so a fix must not show a frame of $0000 garbage at boot: track whether F has been written, or start sam_f at the reset state desktop XRoar uses.\n\nCOMPLETION CONDITION: confirmed on hardware (clear the F bits with POKEs to $FFC6-$FFD3 in a graphics mode) and fixed, or shown not to occur, with the result noted in AMOLED-70 so the other ports can take the same fix. Found during the 2026-09-14 cross-port comparison (xroar-adafruit-rp2350-fruit-jam/docs/rp2350-port-comparison.html).", "type": "bug", "status": "open", "priority": "low", "created": "2026-09-14", "updated": "2026-09-14", "tags": ["vdg", "video", "emulation"], "theme": "trust"}, {"id": "PIZERO-101", "summary": "Case style pass: base vents, 5 mm corners, rounded port openings, 2 mm groove loop on the lid", "description": "User feedback on the PIZERO-94 case, which works on hardware; changes are stylistic.\n\n1. BASE VENTS: same slots as the lid (3 mm wide, 3 mm rib, 6 mm pitch, rounded ends) cut through the floor, running front to back. Two banks of four, 6 mm gap between banks, centred on the board.\n2. CORNERS: outer vertical corner radius 4 -> 5 mm. Inner cavity radius stays 2 mm so board fit cannot change. Top edge stays a chamfer (a 5 mm fillet would break through the wall/roof).\n3. PORT CORNERS: round the visible corners of the front port openings and plug pockets (HDMI, both USB-C).\n4. GROOVES: widen from 0.5 to 2 mm (depth stays 0.6). Instead of running off the side walls, join front and back grooves with front-to-back legs near the left and right edges, just inside the top chamfer, with rounded corners: one closed loop outlining the top (user chose option (a)).\n\nDONE WHEN: rendered, printed, and user confirms on hardware.\n\n[2026-09-15 REV 2 after viewing rev 1 in the slicer: user happy with vents, port corners and vertical corners. Two changes. (a) Groove: legs move off the top onto the left and right side walls; front and back grooves wrap over the edge and down the sides, joined by a front-to-back leg with the rounded corners on the side face. (b) Top edge: the 1 mm chamfer becomes a 5 mm round matching the vertical corners; the cavity top is rounded 3 mm to keep the shell about 2 mm thick. Print note: roof-down, the bottom ~1.5 mm of the round is a shallow overhang at the bed.]\n\n[2026-09-15 REV 3: user confirmed rev 2 groove and edges are as asked. Battery connector opening (right wall, opposite microSD) tightened: right edge seen from outside pulled in 1 mm (bat_y1 23.6 -> 22.6), top lowered 0.5 mm (bat_oh 6.0 -> 5.5). Groove leg re-anchored to the top round so it does not move.]\n\n[2026-09-15 REV 4: top grooves must sit at least 5 mm from the front and back edges (off the rounds), and the roof grille must be centred front to back. Four rows plus two grooves do not fit the 24.8 mm of flat roof, so user chose three rows. Now 3.0 mm slots on a 5.0 mm pitch at y 10/15/20, grooves at y 6.5 and 23.5 (7.9 mm from the edges), slot length unchanged at 20.8. No pitch centres both buttons with a centred grille; 5 mm gives each 0.65 mm of plunger under open slot (was 1.25). Paperclip test needed on the print. Base floor vents unchanged.]\n\n[2026-09-15 REV 5: grooves back to 1 mm wide; roof slots 1 mm wide so more fit. User chose option A of three spacings: five rows on a 3.33 mm pitch (a third of the RUN to BOOT distance, 2.33 mm rib), centred, rows 2 and 5 within 0.07 mm of BOOT and RUN (1.18 mm of plunger open). Grooves at y 5.83 and 24.17. Base floor vents unchanged (own 3 mm slot width).]\n\n[2026-09-15 REV 6: base floor vents match the roof: 1 mm slots on the 3.33 mm pitch, seven per bank, same 21 mm footprint as before.]\n\n[2026-09-15 REV 7: rev 6 printed badly on the 5 mm 3D-rounded top edges. Top edge back to the crisp 1 mm chamfer (top_r = 0); vertical 5 mm corners kept. Groove no longer wraps down the sides: user now prefers it on the roof as a closed 1 mm loop 3 mm clear of the vent slots on all sides (groove_hug).]\n\n[2026-09-15 REV 8: 1 mm chamfer added to the base's bottom outer edge (bottom_chamfer), matching the lid's top chamfer.]\n\n[2026-09-16 DONE: printed at ff24eb7 (revs 1-8 plus the PIZERO-103 microSD channel) and confirmed by the user: \"that print turned out pretty ok. the closed one.\" Delivered: floor vents matching the roof, 5 mm vertical corners, rounded port openings, 1 mm crisp top chamfer (the 5 mm 3D-rounded top edge of rev 6 printed badly and was reverted), 1 mm groove loop hugging the grille 3 mm clear of the slots, 1 mm slots on a 3.33 mm pitch on roof and floor, 1 mm bottom chamfer. NOT verified and filed as PIZERO-104: paperclip access to RUN and BOOT through the narrower 1 mm slots. The PIZERO-102 header lid keeps its own open issue.]", "type": "feature", "status": "done", "priority": "low", "created": "2026-09-14", "updated": "2026-09-16", "tags": ["hardware", "case", "3d-print", "openscad", "style"], "theme": "kit"}, {"id": "PIZERO-102", "summary": "Alternate case lid with an opening over the 40-pin header, plugged by a printed cover when unused", "description": "An alternate top for the PIZERO-94/101 case that exposes the 40-pin GPIO header, so a 2x20 female connector can be pushed on without a struggle. The base and the standard lid stay as they are; this is a second lid variant rendered from the same pizero_case.scad (part=\"top_header\"). The user already has a small printed cover that will sit in the opening when nothing is connected, so the opening must also suit that cover.\n\nCONSTRAINTS FOUND: the header sits right against the back wall, so the opening lands between the back row of vent slots and the back wall, cuts through the back arm of the groove loop, and is boxed in left to right by the two back screw bosses (about 52 mm clear between them).\n\nDONE WHEN: opening size agreed (connector type and cover dimensions), grille/groove layout adjusted to suit, rendered, printed, a connector plugs on and the cover fits, confirmed by the user on hardware.", "type": "feature", "status": "open", "priority": "low", "created": "2026-09-15", "updated": "2026-09-15", "tags": ["hardware", "case", "3d-print", "openscad", "gpio"], "theme": "kit"}, {"id": "PIZERO-103", "summary": "A microSD card goes in easily, stays in, and can be pulled back out", "description": "User report on the printed case: inserting a microSD card is unreliable. Sometimes the card goes right inside the case and misses the reader entirely; other times it will not enter the reader because it catches on the sides. The thumb dish cut into the base (sd_scoop straddles the split line) is unnecessary. The lid's slot and dish need to line up better with the actual socket.\n\nDO: (1) re-derive the socket's card-entry position (y extent and height above the PCB) from the Waveshare dimension drawing, schematic/socket part, and board photos, replacing the sd_y0/sd_y1/sd_oh estimates; (2) remove the dish from the base; (3) resize and re-centre the lid slot on the socket mouth; (4) add internal guides between the wall and the socket, a funnel that narrows to the socket mouth in width and height, so the card cannot ride over the socket or catch its edges.\n\nDONE WHEN: rendered, printed, and a card inserts and ejects reliably, confirmed by the user on hardware. Applies to both the standard lid and the PIZERO-102 header lid.\n\n[2026-09-15 FINDINGS: socket is XunPu TF-110 (LCSC C266613): housing 11.95 W x 11.55 D x 1.32 H, latched card tail 3.90 mm out of the housing. Waveshare drawing puts the housing at y 10.9..22.9, front x 0.5; card y 11.4..22.4. Old slot y 9.8..21.5 was 1.2 mm forward (card caught on the back edge) and 2.5 mm tall (card could ride over the socket). FIX: channel 11.6 x 1.3 centred y 16.9, guide block on the inner wall face to 0.4 mm short of the housing, flared outer mouth, dish lid-only. Base no longer cut.]\n\n[2026-09-16 PRINTED: card now goes in easily and stays in; user credits the side/bottom guide block. Two things left: the card latches FLUSH with the outer wall, and the round dish is too shallow to grip it. REV 2: (a) sd_front_x corrected 0.5 -> 1.5 [M] (flush card + 3.90 mm tail means the housing sits 1 mm further in than the drawing), so the guide block grows from 0.5 to 1.5 mm long; (b) finger relief 18 x 5 x 1.2 deep cut into the outer wall around the mouth in BOTH halves, replacing the dish, leaving the card 1.2 mm proud with a recess to pinch. Considered and rejected: shortening that edge, which caps at 1.0 mm on a 2 mm wall and shortens the channel.]\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"microSD fit in the case: drop the base dish, re-align the lid slot to the socket, add card guides\"]\n\n[2026-09-25 DONE: confirmed on the TOP v12 print, which has the rev 2 channel and guide block plus the taller PIZERO-123 relief: \"the microsd works well now.\"]", "type": "bug", "status": "done", "priority": "medium", "created": "2026-09-15", "updated": "2026-09-25", "tags": ["hardware", "case", "3d-print", "openscad", "microsd"], "theme": "kit"}, {"id": "PIZERO-104", "summary": "Verify paperclip access to RUN and BOOT through the 1 mm roof vent slots", "description": "
