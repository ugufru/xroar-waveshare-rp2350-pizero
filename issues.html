owercase = off in its NAME.TXT.\n\nCLOSED 2026-09-28, user confirmed on hardware. Final state: font = classic | 6847t1 | 6847t2 (default); 6847t2 is its own font, font_6847t2.c generated by scripts/make_font_6847t2.py (caret, underscore, a new backtick, a house for DEL), fixing the duplicate underscore and missing backtick the user found in a character map; lowercase = on by default. A host test checks all 95 printable ASCII characters draw differently.", "type": "feature", "status": "done", "priority": "medium", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["font", "display", "settings"], "theme": "display"}, {"id": "PIZERO-167", "summary": "Keyboard auto-repeat, with a configurable rate or off", "description": "User request 2026-09-28: auto-repeat on USB keyboard input, with the repeat rate configurable or turned off. TODAY: a held USB key is simply held down in the CoCo's key matrix (PIZERO-163 key layers), so any repeat is whatever the running program does; Color BASIC itself does not auto-repeat a held key. The on-screen editor already has its own repeat (TEK_REPEAT_DELAY 24 frames, TEK_REPEAT_RATE 3, src/text_edit_keys.h), which shows the timing approach. DESIGN NOTES: repeat by releasing and re-pressing the held key in the USB layer (coco_machine_release_key_src / press_key_src) on a frame timer, for the newest held key only (as PC keyboards do), and only for keys that type characters or move the cursor, never SHIFT or BREAK. A release must stay down for at least as long as BASIC's keyboard scan needs to see it (see PIZERO-158, where a 3-frame press was missed after Enter). Games read held keys directly from the matrix; repeat would make them see flickering presses, which is why it must be switchable, per game too (NAME.TXT). SETTINGS: key_repeat = off | on (or a rate), key_repeat_delay = milliseconds, key_repeat_rate = per second; exact names to decide. Default: probably off, so games behave as on a real CoCo, and on in settings.txt for typing; decide with the user.\n\nUSER DECISION 2026-09-28: default ON ('by default every improvement we make is default'). BUILT, awaiting hardware. key_translate.h kt_repeat(): the newest held USB key, after key_repeat_delay, is released for KT_REPEAT_GAP=2 frames every period (60/key_repeat_rate frames, at least KT_REPEAT_MIN=5, so 12 a second at most) and pressed again; BREAK never repeats; a new press restarts the delay; older held keys stay down. kt_keys omits the newest key during the gap. main.cpp hid_key_repeat() runs once a frame beside pump_keyboard. Settings key_repeat (on), key_repeat_delay (500 ms, 100-2000), key_repeat_rate (10, 1-30); 5 host tests for the timer plus settings tests. SETTINGS.md and README. HARDWARE CHECK: hold a letter at the OK prompt: one, then after half a second a steady stream; hold Backspace (LEFT) to delete a run; key_repeat = off in settings.txt stops it; a game that reads held keys, with key_repeat = off in its NAME.TXT if it flickers.\n\nCONFIRMED ON HARDWARE 2026-09-28 (user: 'key repeat is sweet'). Closed at ~80%: not yet tried against a game that reads held keys directly; if one flickers, key_repeat = off in its NAME.TXT is the documented answer.", "type": "feature", "status": "done", "priority": "medium", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["keyboard", "settings", "input"], "theme": "input"}, {"id": "PIZERO-168", "summary": "Soak the current firmware for 25 hours observed: freezes and video faults per hour", "description": "Split from PIZERO-98 (done), which answered the comparison with Fruit Jam on the 2026-09-17 build (video 0.38 short windows/h, no dropouts; freezes ~0.46/h, watchdog-recovered) but observed only ~7.5 h of a 13 h run because the laptop slept. Much has changed since (USB gamepad and hub, per-source key layers, keycap keyboard, auto-repeat, fonts), so this is also a regression check of the product build. DO: flash pizero_stream_60, cold power-on, keyboard and pad attached through the simple hub (the everyday setup since PIZERO-54); run scripts/soak.py for 25 h with the Mac kept awake (caffeinate, lid open), since a sleeping host is a soak of the host (PIZERO-98); read the analyser's observed hours, not wall clock, and check the board's freeze counter against the messages. Pair with PIZERO-121: the audio servo's first long run is the same session. COMPLETION: freezes/h and video-fault episodes/h over at least 25 h observed on the current build, in the README's 'Stability, measured' paragraph, compared with PIZERO-98's figures.", "type": "task", "status": "open", "priority": "medium", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["soak", "stability", "measurement"], "theme": "stability"}, {"id": "PIZERO-169", "summary": "The pad drives the overlay: Home toggles it, D-pad moves, A selects, B goes back", "description": "User request 2026-09-28: the controller's HOME button toggles the overlay, the D-pad navigates it, A selects and B goes back, so the machine can be used with the pad alone.\n\nDESIGN: the overlay (disk_overlay.cpp, overlay_keys.h) is driven by HID keyboard codes with its own edge detection, so the pad produces the same codes and main.cpp merges them with the keyboard's before calling disk_overlay_key (feeding the two separately would make its edge detection see alternating reports). Pure mapping pad_nav_codes() in gamepad.h, host-tested. Closed: Home = the F key of the list last shown (opens it). Open: Home and B (right face) = ESC, A (bottom face) = ENTER, D-pad = arrows (up/down move, left/right switch lists), L1/R1 = PgUp/PgDn, X (left face) = TAB (edit the entry's settings, PIZERO-154). Home stops being mappable (pad_home removed). While the overlay is open the pad presses no CoCo keys or fire; buttons held when it closes stay inert until released, so launching with A or leaving with B is not also a fire press (the pad's version of FRUITJAM-68). NOT covered: assigning a disk to drives 0-3 from the pad (keyboard only), and typing in the text editor.\n\nBUILT 2026-09-28, awaiting hardware. gamepad.h pad_nav_codes() (host-tested, codes checked against overlay_keys.h); PAD_BUTTON_NAMES has no 'home', so pad_home is now an unknown setting and pad_resolve never maps Home. main.cpp: overlay_feed() merges the keyboard's held keys (g_kb_codes) with the pad's (g_pad_nav) before disk_overlay_key, and on close resyncs both (kt_resync, and g_pad_inert/g_pad_dpad_inert keep held pad controls inert until let go). Home: opens via disk_overlay_open() (the last list shown); closes only once let go since opening, else the opening press would close it at once. While open the pad sends the machine centered sticks, no fire, no keys. Held D-pad gets the overlay's own key repeat. SETTINGS.md, README item 7. HARDWARE CHECK: Home opens the list last shown; D-pad up/down moves (held repeats), left/right switch lists; A starts a program/cartridge/disk without a stray fire in the game; B closes; Home closes; X opens the highlighted game's settings file; the keyboard still drives the overlay with the pad plugged in.\n\nCONFIRMED ON HARDWARE 2026-09-28 (user: 'that's working pretty well'; telemetry showed the machine paused under an overlay opened from the pad). Closed at ~80%: individual checks (X for settings, D-pad repeat, no stray fire after launching with A) were not reported one by one. Not covered by design: drives 0-3 and typing in the editor, which need the keyboard.", "type": "feature", "status": "done", "priority": "high", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["gamepad", "overlay", "input"], "theme": "input"}, {"id": "PIZERO-170", "summary": "GIME timer: confirm which revision's reload quirk to emulate (it sets the tempo of timer music)", "description": "Split from PIZERO-62 (done: the GIME-compatible timer works on hardware, 2026-09-28). The GIME's timer counts a reload of N as N+2 on the 1986 part and N+1 on the 1987 part (per ~/github/coco coco-guides/coco3-intro.md; PIZERO-62 first recorded this backwards and corrected it on 2026-09-18). The build option GIME_PERIOD_BIAS defaults to 2, the 1986 part. Music and timing loops written for one revision run slightly fast or slow on the other, so the choice sets the tempo of timer-driven music. TO SETTLE: time a known CoCo 3 timer program (a music player with a published tempo, or a test that counts timer interrupts per second against the 60 Hz frame) on this board, against the same program on desktop XRoar set to each GIME revision, or a recording from a real CoCo 3 of known revision. If the difference is inaudible in practice, record that and keep 2. A setting (gime_revision = 1986 | 1987) is an option if both matter; under the project rule the default would be whichever real programs expect most. Also recorded in PIZERO-62 and kept deliberately: a reload of 0 stops the timer here, where real hardware re-asserts the interrupt at once (the 'Arkanoid sound bug'), because an every-tick timer would wedge the emulator.", "type": "task", "status": "open", "priority": "low", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["gime", "timer", "coco3", "audio"], "theme": "platform"}, {"id": "PIZERO-171", "summary": "Attract mode: when idle, cycle through a playlist of demos and games until someone touches a control", "description": "User request 2026-09-28, for showing the CoCo Zero at Tandy Assembly (Saturday 2026-10-03): an attract mode. When nobody has touched a control for a few minutes, the machine starts cycling through a playlist of demos and games, each for a while, until someone presses a key or a pad button, which stops the cycle and leaves them in whatever is running (or returns to where they were). Classic booth behaviour: a board on a table keeps showing something worth watching.\n\nWHAT EXISTS TO BUILD ON: the launcher (perform_launch in src/main.cpp, PIZERO-81d) already cold-starts a .bin, .ccc or .dsk by path, applying its per-game settings (settings_for_game, PIZERO-154); autorun.txt already names what to start at power-on; all input arrives in one place (hid_keyboard_apply, the pad path in tuh_hid_report_received_cb, serial pump), so 'last activity' is one timestamp updated there; the frame counter g_frame_count gives the time.\n\nDESIGN SKETCH, to settle when worked: (1) the playlist: a text file, e.g. /coco/attract.txt, one program, cartridge or disk per line with an optional time in seconds, in the autorun.txt style (reuse its parsing and name resolution, and report missing names the same way, PIZERO-152). (2) settings: attract = on | off, attract_idle (minutes before it starts), attract_time (default seconds per entry); by the project rule an improvement is on by default, but with no attract.txt there is nothing to cycle, so it only acts once a playlist exists. (3) any key, pad button or stick movement stops cycling immediately and does NOT reach the game as input (the same 'inert until released' rule as the overlay close, PIZERO-169), so a visitor's first press just takes over. (4) never while an overlay list or the editor is open; never while serial typing is active. (5) the watchdog restart after a freeze (PIZERO-33) should land back in attract mode, which autorun.txt pointing at the first entry already gives. (6) optionally a one-line caption on screen when an entry starts (its name), using the card; only if cheap.\n\nTESTS: the idle timer and playlist stepping as a pure header with host tests (next entry, wrap-around, per-entry time, the input that stops it). HARDWARE: leave the board alone with a 3-entry playlist and watch it cycle; press a pad button mid-entry and check the game keeps running without receiving that press.\n\nTIMING: only worth building before the show if the display (PIZERO-99), freeze (PIZERO-168) and hub-replug (PIZERO-51) checks come out clean by midweek.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["demo", "launcher", "show"], "theme": "ui"}, {"id": "PIZERO-172", "summary": "Documentation sweep before Tandy Assembly: bring README, SETTINGS, AUTORUN and docs/ up to date with the firmware", "description": "User request 2026-09-28: a documentation sweep before writing the quick-start card for the Tandy Assembly show (2026-10-03). A great deal changed on 2026-09-28 alone (gamepad and hub, keycap keyboard, auto-repeat, fonts, per-game settings, pad-driven overlay, screenshots, per-source key layers), and several docs predate it. SCOPE: README.md, SETTINGS.md, AUTORUN.md, docs/*.md, hardware/case/README.md where it touches use, CLAUDE.md pointers. Check every statement a user or builder relies on against the code: settings names and defaults (src/settings.h), keys (overlay_keys.h, key_translate.h), pad (gamepad.h), build envs (platformio.ini vs docs/BUILD.md), file layout on the card, test counts, and links. Known stale items already recorded elsewhere: BUILD.md section 5 says fps~=52 (PIZERO-91); ROADMAP.md:25 cites a missing docs/compatibility.md (PIZERO-52). Also the house rules: no em dashes, American spelling.\n\nAUDIT FINDINGS 2026-09-28 (read-only agent pass; checked against code; apply these):\nREADME.md: :11 'Only joystick input remains open' -> only USB hot-plug (PIZERO-51). :291 and :305 still list PIZERO-13 as open; only 51/11b remain. :295-296 and :320-321 'silent fallback env is double-buffered' -> silent envs retired (PIZERO-150); all shipping builds single-buffer, only pizero_wavmeas double-buffers. :343 RAM 70.4% -> ~75% (2026-09-27). :327-330 '~9.4 ms, 31% headroom' conflicts with 76.2% frame budget (platformio.ini:130); re-measure or cite 76%. :62-63 and :285-286 ROM path /coco/bas12.rom -> /coco/roms/bas12.rom (flat /coco also works). :71-72 carts '2 to 16 KB' -> also bank-switched. :92-94 settings list omits font, lowercase, key repeat, joystick_swap, pad settings. :108-109 pad in overlay: add L1/R1 page, X edits settings. :112-113 hot-plug: through a hub it works; straight into the board needs power-on. :126-127 Ctrl-P needs serial_keyboard = on. :203/:263 fallback pizero_stream lacks GIME palette/timer. :360 case 20.6 mm -> 18.6 mm. :252-259 audio: add SN76489 (PIZERO-143). British: :174 serialiser, :189 centred. 36 em dashes.\nSETTINGS.md: :51-66 example block omits dpad and pad_* (template emits them); :68 claim 'sets everything to its default'. :78-79 gime_palette/gime_timer do nothing on pizero_stream. Document on/off also accepts yes/no/1/0 (settings.h:138-141).\nAUTORUN.md: :71 limits -> ~256 chars/line, typed lines 1 KB total (coco_boot.h:41, coco_boot.cpp:517). :140 '~12 seconds' -> ~3 s (180 frames, main.cpp). :148 'case-sensitive' wrong: letters typed in the CoCo's upper case (kt_chord). :119 carts also bank-switched. :121-123 typed lines need a cartridge (Disk BASIC or @CART). :207-284 'edge cases' section reads as proposals; implemented: A @DIRECT wins, typed lines ignored silently; B missing names reported (PIZERO-152) and boot continues; C names not restricted, appended to /coco/ paths; D case-insensitive; E add run_skips_autorun = off; F boot pages exist (PIZERO-92); G drives 0-3 via F12, @DISK sets drive 0. :301/:304 decision tree titles -> NO SD CARD / NO ROM FOUND, only bas12.rom required. :29-43 SD layout: add screendumps/ and per-game NAME.TXT. :42/:332 README.txt 'ships with the device': nothing provides it. Add: autorun-started game applies its NAME.TXT. British :200 colour. 15 em dashes.\nCONTRIBUTING.md: style only, 10 em dashes.\ndocs/kit.md: :127-128, :215-219, :103-104 black screen with no ROM -> NO ROM FOUND page (PIZERO-92). :133 'F11 settings' -> F11 files. :115-117 hot-plug: hub caveat. Box card never mentions the gamepad (Home opens the lists). :150 20.6 -> 18.6 mm. :181-183 RUN skips autorun unless run_skips_autorun = off. British :160 aluminium, :194 labelled. 17 em dashes.\ndocs/BUILD.md: :183 fps~52 -> 60. :23 pizero_stream lacks GIME flags. :42-50 vs :76-77 RAM figures (70.4%, 96.8% silent envs retired) -> rewrite around pizero_wavmeas ~99% vs audio envs ~75%. :74 main.cpp:98 -> 205. :44 pizero_hotplug: HW-disproven, re-test only. :99 recommended audio path -> pizero_stream_60. :109/:117 HDMI_STD_TIMING listed twice; delete stale Timing subsection. Env table lacks native (pio test -e native, 16 suites, 222 cases). 23 em dashes.\ndocs/ROADMAP.md: :27 missing docs/compatibility.md -> PIZERO-52 (open). :28 docs list: add SETTINGS, AUTORUN, kit, usb-retrospective. :38-41 PIZERO-164/165 done; add 169. :55-69 overlay milestone done (81, 114, 115, 153, 154). :72-75 PIZERO-53 settings shipped as settings.txt + editor (145/146). :76-82 PIZERO-55 done as color_* settings. :83-88 PIZERO-57: built-in fonts shipped (166). :141-142 and :256-258 'cannot write to SD' wrong: whole-file writes exist (editor, screenshots). :161-162 drop 'multi-drive'. :182-183 streaming already default. :211-213 RAM 70.4%/96.8% -> ~75%. :238-243 PIZERO-62 done. :250-252 delete 13/54 bullet. :270-272 GIME timer occupies $FF90-$FF95. British: colour, catalogue, honour, colours. 61 em dashes.\ndocs/pipeline.md: :73-76 double-buffer claim -> single-buffer except pizero_wavmeas. Add SN76489 to audio source. Many stale main.cpp/coco_boot.cpp/coco_machine.cpp line refs: use symbol names. :173 name both DVI timing structs. 12 em dashes.\ndocs/cpu-speed.md: stale line refs (use symbols). :102/:109 PIZERO-48 done; measurement untracked. :74-76 ~9.4 ms conflicts with 76%. 18 em dashes.\nhardware/case/README.md: :489 20.6 mm reads as current -> mark historical. British: modelling, centred (many), centre/centreline (many), quantise.\nSkimmed: hdmi-audio-notes.md :166-168 streaming now default, :74-75 historical; British behaviour, honoured. coco3-feasibility.md :31 RAM 70.9% optimistic; British colour, optimisation. coco3-plan.md British behaviour, Optimising, analyse, serialise, colours. audio-decision.md is labelled historical; British synthesises, serialiser, signalling.\nPLAN (agreed): fix every factual item; fix British spellings everywhere; remove em dashes from the user-facing docs (README, SETTINGS, AUTORUN, kit.md, CONTRIBUTING); leave em dashes in engineering notes for later. README first.\n\n[2026-09-29 SWEEP DONE, awaiting the user's read.] README.md by hand; three agents in parallel on the rest, each checking facts against the code. 15 files, docs only. User-facing docs (README, SETTINGS, AUTORUN, docs/kit.md, CONTRIBUTING, plus pipeline and cpu-speed) have no em dashes; no British spellings remain in any doc (code names, file names and quoted identifiers left). Every audit finding applied. Found on the way and fixed: AUTORUN.md example 4 was wrong (@DISK alone now runs the disk's first program); docs/cpu-speed.md claimed SAM double speed works but costs CPU, when it has no effect at all (PIZERO-132; PIZERO-48 corrected); README performance table re-based on 2026-09-28 telemetry (~11 ms emulation, ~13 ms total, ~20% headroom, 75.7% RAM); pipeline.md file:line references replaced by symbol names; BUILD.md gained the native test env and the GIME flags. LEFT FOR LATER: em dashes in engineering notes (BUILD.md, ROADMAP.md on untouched lines, audio-decision, hdmi-audio-notes); stale comments in platformio.ini for pizero_hotplug and pizero_stream_60; @DIRECT silently dropping typed autorun lines gets no serial warning (a firmware change, if wanted).\n\n[2026-09-30 user: 'we really can't use the word HDMI because it's trademarked'.] The name belongs to HDMI Licensing, for licensed adopters. Removed from the public docs (README, docs/kit.md, hardware/case/README.md): the signal is called DVI (what the board sends), the port 'the mini video port', the cable 'a mini video cable (the kind sold for the Raspberry Pi Zero)', the display 'a TV or computer monitor with a digital video input', the sound 'over the same video cable'. NOT yet changed, by choice: the engineering docs (pipeline, BUILD, hdmi-audio-notes.md and its file name, audio-decision, ROADMAP, cpu-speed, coco3-plan), code comments and identifiers, build-flag names (HDMI_DATA_ISLAND, HDMI_STREAM_AUDIO, ...) and the OpenSCAD variable name; renaming flags and files is a larger change with build risk. Also USB-C named throughout the user docs, and the README lists rewritten as plain sentences (user: 'don't be clever with the bullet points').\n\n[2026-09-30 CLOSED on the user's read: 'docs are fine/better'.] The remainder (em dashes and the HDMI name in the engineering notes, code comments, build-flag and file names; stale platformio.ini comments; no warning when @DIRECT drops typed autorun lines) is filed as PIZERO-174.", "type": "task", "status": "done", "priority": "high", "created": "2026-09-28", "updated": "2026-09-30", "tags": ["docs", "show"], "theme": "docs"}, {"id": "PIZERO-173", "summary": "Type { } | ~ and backtick (and paste faster) by handing characters to BASIC's keyboard routine, as XRoar does", "description": "User question 2026-09-30: with the USB keyboard translation, why can't { } | ~ and backtick be typed, when the 6847t2 font can show them? Because Color BASIC reads keys through its own decoder from the CoCo's key matrix, and no CoCo key or chord produces those characters; the keyboard translation (src/key_translate.h, PIZERO-163) can only press CoCo keys. Lower-case mode only shifts letters.\n\nTHE PROVEN WAY: upstream XRoar's automatic typing (src/auto_kbd.c in ~/github/xroar) does not press keys at all. It sets a breakpoint on the ROM's keyboard routine POLCAT and, when BASIC asks for a key, hands it the character directly. XRoar's symbol table (src/symtab.c) gives POLCAT per ROM: $A1C1 for Color BASIC (symtab.c:144), $A1CB in another (symtab.c:238), with $A000 being the POLCAT vector (symtab.c:66). No ROM file is modified.\n\nPLAN: (1) in the emulation loop, a cheap check when the CPU reaches the POLCAT entry (for example in coco_mem_cycle when the opcode fetch address matches, or a PC compare in mc6809_run), and only while a character is queued; (2) when one is queued, return it as POLCAT does (A = the character, the 'key ready' flag set, then RTS), exactly as auto_kbd.c's handler; (3) queue the characters the matrix cannot make ({ } | ~ `), from key_translate.h, so the keyboard otherwise keeps pressing real keys (games read the matrix and must keep working); (4) route serial typing and autotype through the same queue, which should fix PIZERO-158 (serial dropping the first character of a line) and make pasting fast; (5) a table of POLCAT addresses per supported ROM, identified by a checksum of bas12.rom / extbas11.rom at boot, and the old key-press path whenever the ROM is unknown.\n\nLIMITS: works wherever a program reads keys through BASIC's routine (the prompt, INPUT, INKEY$); a program that scans the keyboard hardware itself still sees only real key presses. The characters then display through the 6847t2 font with lowercase on (both defaults; PIZERO-166).\n\nTESTS: the queue and the ROM table as pure headers with host tests; on hardware, type { } at the prompt and see them, paste a long program over serial and count dropped characters (PIZERO-158's test).\n\nTIMING: after the Tandy Assembly show (2026-10-03); not a pre-show change.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-09-30", "updated": "2026-09-30", "tags": ["keyboard", "serial", "rom"], "theme": "input"}, {"id": "PIZERO-174", "summary": "Docs and code follow-up: em dashes and the HDMI name in the engineering notes, flags and file names", "description": "Split from PIZERO-172 (done 2026-09-30), which cleaned the public docs (README, SETTINGS, AUTORUN, docs/kit.md, CONTRIBUTING, hardware/case/README.md) and left these deliberately:\n1. EM DASHES (house style forbids them) remain in the engineering notes: docs/BUILD.md and docs/ROADMAP.md (untouched lines), docs/audio-decision.md, docs/hdmi-audio-notes.md, and code comments.\n2. THE HDMI NAME (user, 2026-09-30: 'we really can't use the word HDMI because it's trademarked'; the name is licensed to HDMI adopters). Still in: docs/pipeline.md, docs/BUILD.md, docs/audio-decision.md, docs/hdmi-audio-notes.md (and its FILE NAME), docs/ROADMAP.md, docs/cpu-speed.md, docs/coco3-plan.md; code comments in src/ and lib/coco_machine/; build-flag names in platformio.ini and code (HDMI_DATA_ISLAND, HDMI_STREAM_AUDIO, HDMI_STD_TIMING, HDMI_ACR_CTS and others); log tags such as [hdmi]; the OpenSCAD variable `hdmi` in the case source. The public docs link to pipeline.md and BUILD.md, so a reader can still reach the word. Renaming flags touches every build env and CLAUDE.md; do it in one change with all envs built (pizero_stream_60, pizero_stream, pizero_wavmeas and the diagnostics) and the host tests run. Suggested vocabulary, as in the public docs: DVI for the signal, 'audio data islands' for the sound, 'the mini video port' for the connector.\n3. platformio.ini comments for pizero_hotplug and pizero_stream_60 are out of date (PIZERO-172 audit).\n4. When autorun.txt's @DIRECT wins, its typed lines are dropped with no warning, not even on serial (AUTORUN.md now says so); a one-line serial warning would make it explainable.\n\n[2026-10-01 STEP 1 DONE] Our 11 build flags renamed HDMI_* -> AV_* (DATA_ISLAND, STREAM_AUDIO, 60HZ, 60HZ_TEST, STD_TIMING, AUDIO_SYNTH, AUDIO_SWAPTEST, EVEN_AUDIO, AUDIO_STATIC, ACR_CTS, ENCODE_BENCH) in src/, platformio.ini and docs; HDMI_ISLAND_CONTROL_ONLY stays (libdvi's own). PROOF: with the version pinned (new FW_VERSION_OVERRIDE / FW_DATE_OVERRIDE in scripts/fw_version.py), all 11 firmware envs were built before and after; every firmware.bin is byte-identical, and a no-change rebuild confirmed the builds are deterministic. Next: comments and prose in code and docs, the docs file rename, then the [hdmi] log tag as its own step.\n\n[2026-10-02 ALL STEPS DONE, awaiting the user's say-so.] (2) Code comments, platformio.ini and CLAUDE.md reworded: six kept firmware envs byte-identical. (3) Serial log tag [hdmi] -> [disp], same length: each firmware differs in exactly the four letters of the one tagged message it prints (pizero_wavmeas prints none, fully identical). (4) Engineering docs and THIRD_PARTY_LICENSES.md: the HDMI name and every em dash removed (BUILD, ROADMAP, pipeline, audio-decision, coco3-plan, video-audio-notes); docs/hdmi-audio-notes.md renamed docs/video-audio-notes.md and every link fixed. LEFT DELIBERATELY: libdvi's own names (dvi_setup_active_hdmi_framing, HDMI_ISLAND_CONTROL_ONLY, comments in lib/libdvi) as vendored third-party code; third-party project names and URLs in docs/audio-decision.md (pico_hdmi, PicoHDMI, an Adafruit blog URL); archived logs in docs/measurements/ that show the old [hdmi] tag; the OpenSCAD variable `hdmi` in the case source; issues.jsonl history.", "type": "task", "status": "in-progress", "priority": "low", "created": "2026-09-30", "updated": "2026-10-02", "tags": ["docs", "trademark", "cleanup"], "theme": "docs"}, {"id": "PIZERO-175", "summary": "Benchmark the CoCo 3 (GIME) video modes on the board, including a 640-wide display path", "description": "User 2026-10-01: 'can we start benchmarking coco3 video modes xroar supports?' and 'we should evaluate for a 640-wide display path for performance. we may be surprised.' Independent of the CPU-speed track (PIZERO-129 to 131): that decides whether a CoCo 3 can RUN fast enough; this measures whether the board can DRAW its modes. WHAT TO MEASURE, per mode, on hardware: (1) core 0's cost to turn a frame of GIME video memory into display pixels (XRoar's tcc1014.c produces each scanline as 6-bit GIME color values, up to 640 per line, through its render_line delegate; ~/github/xroar pin a2d31903); (2) core 1's cost to scan out a 640-wide picture, which today's 320x240 RGB565 framebuffer (doubled to 640x480) cannot do: candidates are an indexed framebuffer (640x240 at 8, 4 or 2 bits per pixel: 150, 75 or 38 KB) with palette lookup during the TMDS encode, or per-line rendering straight into the line buffer (no full framebuffer); (3) the RAM each needs against today's ~127 KB free (75.7 percent used); (4) whether streaming audio islands still fit alongside. MODE MATRIX (from tcc1014.c): text at 32, 40, 64 and 80 columns; graphics at 256, 320, 512 and 640 pixels wide with 2, 4 or 16 colors; 192, 200 and 225 lines. At least: 320x225x16, 640x225x4, 640x225x2, 256x192x16, 80x24 text and 40x24 text. HOW: a bench env (like the old pizero_bench, retired in PIZERO-150) that fills video memory with a pattern per mode, renders with a GIME-compatible renderer (vendored from tcc1014.c, or a minimal equivalent of its render path) and prints per-frame microseconds for render and encode; no 6809 needed. Results into docs/measurements/ and docs/coco3-feasibility.md. WHY IT MATTERS: the same 640-wide path unlocks CoCo 3 80-column and 640-wide modes (PIZERO-134), native 80-column text (PIZERO-90), the F18A's 80 columns (PIZERO-16) and an MC6845 80-column card (PIZERO-176). The user expects it may be surprisingly feasible; measure before deciding. STEP 1 STARTED 2026-10-02: env pizero_videobench (-DVIDEO_BENCH) times libdvi's encoders per scanline on core 0 with interrupts off while core 1 scans out (src/main.cpp, VIDEO_BENCH block). Getting the 640-wide encoders to link needed two libdvi fixes: lib/libdvi/tmds_encode.h now gives every assembly encoder C linkage (only the two loops in use had it, so tmds_fullres_*, tmds_palette_* and tmds_encode_1bpp/2bpp were unlinkable from C++), and the fullres/palette loops and their tables do not fit in scratch X/Y beside the core stacks (X over by 1480 bytes, Y by 768), so -DTMDS_FULLRES_IN_SRAM=1 moves them to main SRAM for the bench. A real 640 path must solve that placement (smaller stacks, or one copy in X for core 1 only). Product, fallback and wavmeas firmware verified byte-identical with these changes. STEP 1 RESULTS 2026-10-02 (board 1D21CC1CBE17D6F6, 252 MHz, core 0 with interrupts off while core 1 scans out; ns per encoded line, budget 63,500 because each line is shown twice, minus core 1's audio island work): libdvi software: today 320 doubled 16bpp 25,200; 640 distinct 16bpp 55,600; 640 palette 16 or 256 colors 57,900; 640 1bpp 5,950; 640 2bpp 6,600. Placement and options, measured and dropped: fullres loops in scratch Y instead of SRAM 54,400 (-2%), palette loop in scratch 57,400 (-1%); TMDS_FULLRES_NO_DC_BALANCE 46,800 fullres / 53,800 palette; plus NO_INTERP_SAVE 45,500. None leaves comfortable room for audio. THE FINDING: the RP2350 has a hardware TMDS encoder in SIO (one per core, SIO_TMDS_CTRL/WDATA/PEEK_DOUBLE_Ln/POP_DOUBLE_Ln) that libdvi predates. One write of two RGB565 pixels, one read per lane gives two symbols in libdvi's two-symbols-per-word format, DC-balanced by the hardware. Bench (src/main.cpp, bench_hw_*): today's 320 doubled 12,600 (half of today's software cost); 640 distinct 16bpp 15,700 to 17,200; 640 from 8-bit palette indices via an RGB565 lookup 23,700. A decode self-check (bench_hw_check) decodes all 1,920 symbols of a 640 line back to pixels: 0 errors, so symbol order and lane order match libdvi. NOT YET SHOWN: a picture from the hardware encoder on a real display (the bench never sends its symbols). NEXT: (a) a 640-wide display path on core 1 using the SIO encoder, needing a 640-wide framebuffer or a per-line render (RAM: a 640x240 16bpp buffer is 300 KB, too much beside audio; 8-bit index lines rendered per line, or 4bpp 150 KB/2bpp, are the options); (b) step 2, GIME per-mode render cost on core 0. Even without 640, switching today's encode to the SIO encoder would halve core 1's video encode time.", "type": "task", "status": "in-progress", "priority": "medium", "created": "2026-10-01", "updated": "2026-10-02", "tags": ["coco3", "video", "benchmark"], "theme": "platform"}, {"id": "PIZERO-176", "summary": "MC6845 CRTC: an 80-column card for the CoCo Zero, for demos and developers", "description": "User 2026-10-01: 'i've been considering supporting the MC6845 CRTC' and, if the 640-wide path holds, 'it's worth doing the mc6845 emulation in context just for the demos if nothing else. CoCo Zero is like a little playground for developers, and our limits do not always need to be practical if they are within reach.' WHAT A 6845 IS: a CRT controller, a timing chip: it generates sync and the video-memory addresses but draws nothing itself. A card built on it supplies its own video RAM and character ROM. In the CoCo world that means an 80-column card (Radio Shack's Word-Pak is believed to be 6845-based; verify, and find its I/O address and character ROM before building). Elsewhere: IBM MDA/CGA, BBC Micro, Amstrad CPC, Apple II 80-column cards. Upstream XRoar has no 6845 emulation, so this is new code. DEPENDS ON the 640-wide display path (PIZERO-175): 80 readable columns need 640 pixels across, and today's framebuffer is 320 wide. SCOPE: the 6845 register file (screen geometry, cursor), an 80x24 text card with its own RAM and a character ROM we can ship (our own font, like the 6847T2, not a copyrighted ROM), and enough compatibility for existing CoCo 80-column software if any can be found; homebrew demos otherwise. DEFAULT: on, as an extension; off under 'classic' (PIZERO-177).", "type": "feature", "status": "open", "priority": "low", "created": "2026-10-01", "updated": "2026-10-01", "tags": ["video", "80-column", "extension"], "theme": "platform"}, {"id": "PIZERO-177", "summary": "A 'classic' setting: one line that turns every extension off for an authentic CoCo 2", "description": "User 2026-10-01: 'Although we should support \"classic\" configurations, that will not be our default.' The CoCo Zero's default is the extended machine (project rule in CLAUDE.md: improvements are on by default). Today each extension has its own setting, so getting a stock CoCo 2 means turning many off. PLAN: a setting such as `machine = classic | extended` (name to settle; extended is the default) that, when classic, sets every extension to its authentic value in one go: sn76489 off, gime_palette and gime_timer off, font = classic (or 6847t1), lowercase off, key_repeat off, and future extensions off too (TMS9918A PIZERO-16, MC6845 PIZERO-176). Individual settings after it in the file still override it, and it works per game in NAME.TXT (PIZERO-154), so one game can be classic. Host-tested in test_settings; documented in SETTINGS.md.", "type": "feature", "status": "open", "priority": "medium", "created": "2026-10-01", "updated": "2026-10-01", "tags": ["settings", "classic"], "theme": "settings"}], "roadmap": [{"rank": 1, "id": "PIZERO-168", "why": "Replaces PIZERO-98, closed with its answer (no video dropouts; ~0.46 freezes/h). The firmware has changed a lot since, so the next 25 h run is a regression check of the current build, with the Mac kept awake this time. Soak one board while working on another.", "added": "2026-09-28"}, {"rank": 2, "id": "PIZERO-41", "why": "Same session, needs the keyboard: play something audible. Two things changed under it (in-spec 60 Hz timing, and the 0.9% shortfall gone), and it is the only way to hear whether PIZERO-121's 8.7 discarded samples a second matter.", "added": "2026-09-18"}, {"rank": 3, "id": "PIZERO-121", "why": "The servo has first hardware evidence (2026-09-28: fill climbed 3,063 -> 3,916 toward its set-point, rate easing 48,031 -> 48,005, no underruns or skips) but no long run yet. Its long run is the PIZERO-168 soak: one session proves both.", "added": "2026-09-18"}, {"rank": 4, "id": "PIZERO-51", "why": "Still the worst daily-use defect: a keyboard attached after boot never enumerates, which cost us a power cycle mid-measurement today. No longer a freeze suspect, since the soak is clean, so it is a usability fix rather than a stability one.", "added": "2026-09-17"}, {"rank": 5, "id": "PIZERO-120", "why": "Demoted from 3 to 9: the mechanism is understood (our symbol stream is legal but the hardest case for a receiver's equalisation, and this monitor fails on colour in one region) and no other sink has shown it. Pair with PIZERO-99; re-raise immediately if a second screen shows it.", "added": "2026-09-18"}, {"rank": 6, "id": "PIZERO-99", "why": "Other people's screens, which the kit rests on, and the same session answers whether the fuzz follows the board or the monitor.", "added": "2026-09-17"}, {"rank": 7, "id": "PIZERO-110", "why": "Turns vetting into something every build repeats. The pieces exist (156 host tests, the soak harness, the [run]/[aud]/[csg] telemetry), so this is mostly assembly: a firmware build that runs the checks and prints PASS or FAIL with the measured number.", "added": "2026-09-17"}, {"rank": 8, "id": "PIZERO-129", "why": "CoCo 3 track, stage 1: a 6809 lockstep correctness harness. Host only, and the precondition for touching the core at all.", "added": "2026-09-26"}, {"rank": 9, "id": "PIZERO-130", "why": "CoCo 3 track, stage 2: the 1.79 MHz benchmark and baseline, so the speed work has a target.", "added": "2026-09-26"}, {"rank": 10, "id": "PIZERO-131", "why": "CoCo 3 track, stage 3: the speed-up the whole CoCo 3 effort hangs on. Its gate decides whether PIZERO-133 happens.", "added": "2026-09-26"}, {"rank": 11, "id": "PIZERO-133", "why": "CoCo 3 track, stage 4, behind the PIZERO-131 gate and the PIZERO-135 decisions.", "added": "2026-09-26"}]}</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  var TAG_PILL_LIMIT = 20;   // the rest hide behind a "+N more" toggle
  // Themes are the coarse grouping: one per issue, from a fixed vocabulary,
  // unlike the free-form tags. Order is the order they are worked in.
  var THEME_ORDER = ['trust', 'kit', 'input', 'experience', 'platform', 'storage', 'devices'];
  var LIVE = ['open', 'in-progress'];
  var KEY = 'issues-view:' + location.pathname;
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|md|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|sh|toml|ya?ml|cfg|ini|txt|bas|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [], theme: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.dataset.theme = i.theme || '';
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
        (i.theme ? '<span class="chip th">' + esc(i.theme) + '</span>' : '') +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  // The roadmap stores only rank, id and why. Everything shown here is joined
  // from the tracker, so an entry pointing at a missing or finished issue is
  // visibly wrong rather than quietly stale.
  function drawRoadmap(plan, byId) {
    if (!plan.length) return;
    var host = document.getElementById('plan');
    plan.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (e) {
        var issue = byId[e.id];
        var li = document.createElement('li');
        li.className = 'step';
        var head, warn = '';
        if (!issue) {
          head = '#' + esc(e.id) + ' is not in the tracker';
          warn = 'no such issue';
          li.className += ' bad';
        } else {
          head = '<a href="#i' + esc(e.id) + '">#' + esc(e.id) + ' ' +
                 esc(summaryOf(issue)) + '</a> <span class="chip st-' +
                 esc(issue.status) + '">' + esc(issue.status) + '</span>';
          if (LIVE.indexOf(issue.status) === -1) {
            warn = 'already ' + issue.status + ', take it off the roadmap';
            li.className += ' bad';
          }
        }
        li.innerHTML = '<span class="rank">' + esc(e.rank || '?') + '.</span>' +
          '<span class="what">' + head +
          '<span class="why">' + esc(e.why || '') + '</span>' +
          (warn ? '<span class="warn">' + esc(warn) + '</span>' : '') + '</span>';
        var link = li.querySelector('a');
        if (link) {
          link.addEventListener('click', function () {
            var target = document.getElementById('i' + e.id);
            if (target) { target.hidden = false; setOpen(target, true); }
          });
        }
        host.appendChild(li);
      });
    document.getElementById('roadmap').hidden = false;
  }

  function pills(host, filter, values, counts, limit) {
    var hidden = (limit && values.length > limit) ? values.length - limit : 0;
    document.getElementById(host).innerHTML = values.map(function (v, idx) {
      var extra = hidden && idx >= limit;
      return '<button class="pill' + (extra ? ' extra' : '') + '"' +
        (extra ? ' hidden' : '') +
        ' data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('') + (hidden
      ? '<button class="morebtn" data-host="' + host + '">+' + hidden + ' more</button>'
      : '');
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.theme.length || active.theme.indexOf(el.dataset.theme) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, plan, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {}, byId = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) {
      counts[i.status] = (counts[i.status] || 0) + 1;
      byId[i.id] = i;
    });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });
    drawRoadmap(plan || [], byId);

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));

    var themeCounts = {};
    issues.forEach(function (i) {
      if (i.theme) themeCounts[i.theme] = (themeCounts[i.theme] || 0) + 1;
    });
    var themes = THEME_ORDER.filter(function (t) { return themeCounts[t]; })
      .concat(Object.keys(themeCounts).filter(function (t) {
        return THEME_ORDER.indexOf(t) === -1;
      }).sort());
    document.getElementById('f-theme').parentNode.hidden = !themes.length;
    pills('f-theme', 'theme', themes, themeCounts);
    // A project can accumulate hundreds of tags, most of them used once.
    // Showing every one buries the results, so lead with the most used and
    // keep the long tail behind a toggle.
    var tagCounts = {};
    issues.forEach(function (i) {
      tagsOf(i).forEach(function (t) { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    });
    var tagNames = Object.keys(tagCounts).sort(function (a, b) {
      return tagCounts[b] - tagCounts[a] || (a < b ? -1 : a > b ? 1 : 0);
    });
    pills('f-tag', 'tag', tagNames, tagCounts, TAG_PILL_LIMIT);

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    [].forEach.call(document.querySelectorAll('.morebtn'), function (b) {
      b.addEventListener('click', function () {
        var host = document.getElementById(b.dataset.host);
        var extras = host.querySelectorAll('.pill.extra');
        var show = extras.length && extras[0].hidden;
        [].forEach.call(extras, function (p) { p.hidden = !show; });
        b.textContent = show ? 'fewer' : '+' + extras.length + ' more';
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open' +
      ((plan && plan.length) ? ', ' + plan.length + ' on the roadmap' : '') +
      '. Read from <code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [], theme: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function lines(text) {
    return text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse);
  }

  function grab(name) {
    return fetch(name, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(lines);
  }

  // The live files first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen. A missing
  // roadmap.jsonl is not an error: the section just stays hidden.
  grab('issues.jsonl')
    .then(function (data) {
      grab('roadmap.jsonl')
        .catch(function () { return []; })
        .then(function (plan) { draw(data, plan); });
    })
    .catch(function () {
      var snap = JSON.parse(document.getElementById('snapshot').textContent);
      draw(snap.issues, snap.roadmap,
        'Showing the snapshot saved when this page was last built, because the browser would ' +
        'not read the .jsonl files from disk. To see them live, serve the directory ' +
        '(python3 -m http.server) and open it over http, or rebuild this page.');
    });
})();
</script>
</body>
</html>
