ERO-81d, PIZERO-115.\n\n[2026-09-27 BUILT with PIZERO-81d: src/dsk_catalog.h now lists one kind at a time (enum cat_kind: CAT_DSK, CAT_BIN, CAT_CART) from the kind's folder (/coco/dsk, /coco/bin, /coco/roms) then /coco. CART takes .rom and .ccc but not the machine's own ROMs (bas*, extbas*, coco3*); disk11.rom is kept since it is the Disk BASIC cartridge. Left/Right in the overlay switch list and rescan, so only one 8 KB list is ever in RAM. Titles < DISKS > / < PROGRAMS > / < CARTRIDGES >, a legend per list, and an empty-list message saying which folder to use; all checked by host tests.]\n\n[2026-09-27 Per the user, cartridge files are .ccc: the CART list now takes .ccc only (from /coco/roms then /coco), leaving .rom to the machine's own ROMs, so the bas*/extbas*/coco3* exclusion is gone and disk11.rom is no longer listed (the DISKS list's ENTER still installs it).]\n\n[2026-09-27 Per the user, cartridges live in /coco/cart: the CART list scans /coco/cart then /coco. The overlay now loads the exact file chosen (coco_boot_load_cart_path) instead of resolving a name, and coco_boot_load_cart_named (autorun.txt @CART, and disk11.rom) searches /coco/cart, then /coco/roms, then /coco, with .CCC appended to a bare name in /coco/cart. AUTORUN.md says so.]\n\n[2026-09-28 DONE: BIN and CART lists confirmed on hardware (programs launch from F9, cartridges of 2-16 KB from F10).]", "created": "2026-09-27", "updated": "2026-09-28", "tags": ["overlay", "launcher", "sd"]}, {"id": "PIZERO-137", "theme": "trust", "type": "task", "status": "open", "priority": "low", "summary": "Confirm from serial that only a RUN press is read as a RUN reset", "description": "Remainder of PIZERO-116. The user confirmed on hardware that RUN lands at the BASIC prompt, but no serial capture caught a restart, so the '[boot] chip_reset=0x........' line (src/main.cpp setup, POWMAN CHIP_RESET HAD_RUN_LOW) has not been read for the other restart kinds.\n\nDO: with a card that has an autorun.txt and a serial capture running from before the restart (scripts/soak.py record survives reboots), record chip_reset for: cold power-on, a RUN press, a picotool/UF2 flash, and a PIZERO-51 USB-replug watchdog reboot. Only the RUN press should carry '(RUN button)' and skip AUTORUN; the others must autorun. Also confirm BOOT+RUN still enters BOOTSEL.\n\nDONE WHEN: the four values are recorded here and behave as expected.\n\n[2026-09-27 PARTIAL: power-on reads chip_reset=0x00010000 (HAD_POR), captured twice in the PIZERO-139 session, and a picotool flash of pizero_stream_60 also came up 0x00010000 with no '(RUN button)' and AUTORUN running. Still to capture: a RUN press, a USB-replug watchdog reboot, and BOOT+RUN into BOOTSEL.]\n\n[2026-09-27 CAUTION: a picotool flash of pizero_stream_60 on board 1D21CC1CBE17D6F6 came up chip_reset=0x00040000 '(RUN button)', where an earlier flash read 0x00010000. So a flash can look like a RUN press, and with run_skips_autorun = on it would skip AUTORUN. Harmless for users (they do not flash), but worth knowing when testing autorun right after a flash: power-cycle instead.]", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["boot", "buttons", "verify"]}, {"id": "PIZERO-138", "theme": "kit", "type": "feature", "status": "open", "priority": "low", "summary": "Cassette (.cas) images in the F12 overlay", "description": "User request 2026-09-27, deliberately deferred: a fourth list in the F12 overlay for .cas cassette images, alongside disks, programs and cartridges (PIZERO-136). More involved than the other three: this port has no cassette emulation at all yet (no tape input on PIA1 CA1/the cassette DAC path, no motor relay, no CLOAD/CLOADM timing), so it needs the tape device first, then a list and ENTER behaviour (for example: cold boot and type CLOAD then RUN, or CLOADM:EXEC).\n\nREFERENCE: upstream ~/github/xroar has tape.c and the CAS/WAV handling; the Fruit Jam port has a fixed-path tape (see its coco_main.cpp around 1992-2015).", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["overlay", "cassette", "launcher"]}, {"id": "PIZERO-139", "theme": "kit", "type": "feature", "status": "done", "priority": "medium", "summary": "Cartridges of 2, 4, 8 and 16 KB, not just 8 KB", "description": "User request 2026-09-27. The machine kept an 8 KB cartridge buffer and hardwired an 8 KB mirror (lib/coco_machine/src/coco_machine.cpp, the S=3 read: cart_rom[A & 0x1FFF]), and every loader required exactly 8192 bytes, so a 16 KB .ccc was refused (the F12 overlay said '16K CARTS NOT YET SUPPORTED').\n\nHARDWARE: the cartridge window is $C000-$FEFF, just under 16 KB. Cartridges came in 2, 4, 8 and 16 KB; smaller ones repeat through the window because they do not decode the upper address lines. XRoar handles this with a size mask.\n\nDO: coco_machine_install_cart_sized(rom, len) with a power-of-two mask (install_cart keeps meaning 8 KB); the cartridge buffer becomes 16 KB where RAM allows; loaders report the size read; the overlay and autorun.txt @CART accept 2/4/8/16 KB. The double-buffered fallback env 'pizero' is at 99.5% static RAM and cannot take +8 KB, so it keeps an 8 KB limit and says so.\n\nNOT IN SCOPE: bank-switched cartridges larger than 16 KB, which need per-cartridge mappers.\n\nDONE WHEN: a 16 KB .ccc starts from the F12 overlay on hardware, and an 8 KB one still does.\n\n[2026-09-27 BUILT, not yet on hardware. coco_machine.cpp: cart_mask (size - 1) replaces the hardwired 0x1FFF in the S=3 read, set by the new coco_machine_install_cart_sized(rom, len); install_cart keeps meaning 8 KB. src/dsk_catalog.h cat_cart_size_ok(size, max) holds the rule (2/4/8/16 KB, no bigger than the buffer; host test). coco_boot_load_cart_path/_named take (buf, max, &len), check the size with f_stat BEFORE touching the buffer so a refused file leaves the installed cart intact, and serve the overlay, autorun.txt @CART and disk11.rom alike. main.cpp COCO_CART_MAX is 16384 under HDMI_DATA_ISLAND (the product build, RAM 73.2% to 74.7%) and 8192 otherwise, where the overlay says '16K CARTS NOT IN THIS BUILD'. 116 host tests pass.]\n\n[2026-09-27 DONE: confirmed on hardware by the user (\"the 16k cartridge works\"). A serial capture of the same session shows every size loading and starting from the F12 overlay: Popcorn 2 KB; Galactic Attack, Quasar Commander, Space Assault 4 KB; Color Robot Battle, Mega-Bug 8 KB; Fahrfall (Pandemic Edition) and Tetris 16 KB. Long names with spaces and brackets load fine. Bank-switched carts over 16 KB (Mind Roll 32 KB and Dunjunz 64 KB on CoCo 1/2; XRoar's GMC type) and the CoCo 3-only unbanked 32 KB titles remain out of scope.]", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["cartridge", "overlay", "machine"]}, {"id": "PIZERO-140", "theme": "trust", "type": "bug", "status": "done", "priority": "high", "summary": "GM0-GM6 graphics modes render too slowly: Popcorn runs at 50 fps, Space Assault at 59", "description": "Found 2026-09-27 in a serial capture while testing cartridges from the F12 overlay (PIZERO-139). Two titles push the frame over budget in the render phase alone:\n\n  Popcorn (2 KB cart)        [vdg] mode=gm5  render ~7,500 us  fps=50 (one second at 49)\n  Space Assault (4 KB cart)  [vdg] mode=gm4  render ~3,750 us  fps=59\n\nfor comparison, alpha/SG4 renders in ~450 us and RG6 is LUT-driven. With cpu ~11,100-11,500 us and blit ~1,600 us, Popcorn's frame is ~20.2 ms against 16.67 ms, so pacing resyncs, emulated time runs at ~83% and the audio producer falls short with it (the PIZERO-119 failure class).\n\nCAUSE: lib/coco_machine/src/coco_machine.cpp render_graphics_frame (GM 0-6, AMOLED-60) expands every pixel with per-bit / per-cell loops and an inner hrep loop into rowbuf, then packs nibbles. PIZERO-119 only fixed its row repeats (pack once, memcpy) and LUT'd SG4; RG6 has its own LUT path (render_rg6_frame).\n\nFIX DIRECTION: the same move PIZERO-119 made: per-byte lookup tables that emit the packed 4bpp nibbles directly. RG modes: one table per (fg,bg) set indexed by the data byte (rebuilt only when CSS changes); CG modes: 2-bit cells through a small table. Handle hrep 1/2/4 by table width. Verify byte-identical output against the current renderer on the host first (.ref/lutcheck.cpp and sg4check.cpp are the precedent), then measure render= on hardware with Popcorn (gm5) and Space Assault (gm4).\n\nDONE WHEN: every GM 0-6 mode renders well under 1 ms on hardware and Popcorn holds 60 fps with the audio shortfall at 0%.\n\n[2026-09-27 BUILT, not yet measured on hardware. lib/coco_machine/src/vdg_pack.h: vdg_gm_expand() is the old per-pixel rule verbatim; vdg_gm_lut_build() turns it into a 256-entry table of packed output bytes per data byte (8 for the 16-byte-row modes, 4 for the 32-byte-row modes), rebuilt only when gm or css changes; vdg_render_gm() does one lookup and memcpy per data byte and memcpy for the row repeats. render_graphics_frame in coco_machine.cpp now just calls it (GM_nLPR moved to VDG_GM_NLPR; static_assert added for PAL_BLACK and PAL_DARK_GREEN). HOST TESTS: whole frames for GM 0-6, both colour sets, six base addresses, plus every byte value in every mode, byte-identical to a verbatim copy of the old renderer. Checked the tests bite: a planted CG shift bug fails both; a planted nibble swap does not, correctly, because every GM 0-6 pixel is at least doubled horizontally so both nibbles of a packed byte are always equal. RAM 75.1% (+1.7 KB, the table). CHECK ON HARDWARE: render= for Popcorn (gm5) and Space Assault (gm4), fps 60, [aud] short 0%.]\n\n[2026-09-27 SECOND DEFECT, reported by the user on the table-driven build: Popcorn showed only half a screen of game; its pixels should be double height. Pre-existing, since the host tests prove the new renderer matches the old one exactly. CAUSE: on a CoCo the SAM, not the VDG, generates video addresses, so the SAM's V mode sets the bytes between data rows and the display lines per row; the renderer took both from the VDG mode alone. Popcorn pairs VDG GM5 (one line per row) with a SAM mode that doubles rows, so 96 data rows were drawn once each in the top half. FIX: the SAM V register ($FFC0-$FFC5) is now shadowed as g_m.sam_v (reset by the cold reset), vdg_gfx_geometry(gm, sam_v) in vdg_pack.h gives the row stride and repeat from the SAM when it is in a graphics mode (1-6) and falls back to the VDG mode's own otherwise, and both render_graphics_frame and render_rg6_frame use it (so RG6 under SAM V4 doubles too). The VDG mode still decides how a byte becomes pixels. The [vdg] telemetry line now also prints sam=V. Host tests: SAM geometry table, SAM agreeing with VDG reproduces the old frames exactly, and GM5 under SAM V3 matches GM3 over the whole screen. 120 tests pass.]\n\n[2026-09-27 DONE: confirmed on hardware by the user (\"that looks good\"): Popcorn now fills the screen. The serial capture shows Popcorn's game screen is VDG gm7c with SAM V4 (256x96, rows doubled), holding 60 fps for all 61 s with render at most 237 us and no audio shortfall. The GM 0-6 table renderer is proven byte-identical to the old one by host tests; its hardware timing in GM4/GM5 was not captured in this session and is filed as PIZERO-141 rather than holding this open.]", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["video", "performance", "vdg"]}, {"id": "PIZERO-141", "theme": "trust", "type": "task", "status": "done", "priority": "low", "summary": "Time the table-driven GM4/GM5 renderer on hardware", "description": "Remainder of PIZERO-140. The GM 0-6 renderer is now table-driven (vdg_pack.h vdg_render_gm) and host tests prove it byte-identical to the old per-pixel one, but no hardware capture has yet shown a GM4 or GM5 frame on the new build. Before: Space Assault (gm4) rendered in ~3.7 ms at 59 fps; Popcorn's gm5 screen ~7.5 ms at 50 fps.\n\nDO: with a serial capture running, run Space Assault and whatever Popcorn screen uses gm5 (its attract or title screen: the game screen is gm7c/SAM V4). Read render=, fps and [aud] short% per mode (the [vdg] line now prints sam=V too).\n\nDONE WHEN: GM4 and GM5 render well under 1 ms on hardware at 60 fps with no audio shortfall.\n\n[2026-09-28 DONE on hardware (board 1D21CC1CBE17D6F6), Space Assault from F10: [vdg] mode=gm4 sam=4 for 31 s, render avg 169 us, max 197 us (was ~3,750 us before PIZERO-140, about 20x), fps=60 every second, [aud] short=0.0% and under=0/s throughout. GM5 was not seen in this session (Popcorn's game screen is gm7c/SAM V4, already measured at 237 us max), but GM4 and GM5 share the same table renderer and the host tests cover all GM 0-6 modes.]", "created": "2026-09-27", "updated": "2026-09-28", "tags": ["video", "performance", "verify"]}, {"id": "PIZERO-142", "theme": "kit", "type": "feature", "status": "in-progress", "priority": "medium", "summary": "Bank-switched cartridges over 16 KB (Games Master Cartridge banking)", "description": "User request 2026-09-27, after PIZERO-139 made 2-16 KB carts work. The cartridge window is 16 KB, so bigger carts switch 16 KB banks. XRoar treats any image over 16 KB as a Games Master Cartridge (~/github/xroar/src/gmc.c, cart.c:360-375): reads of $C000-$FEFF come from rom[bank | (A & 0x3FFF)]; a write to an EVEN address in $FF40-$FF5F sets bank = (D << 14) & ((size - 1) & 0x3C000); an ODD address goes to its SN76489 sound chip; reset selects bank 0. Titles in XRoar's list that run on a CoCo 1/2: Mind Roll (32 KB, 1988 Tandy) and Dunjunz (64 KB, 2020). Predator (64 KB) and RoboCop (128 KB) are CoCo 3 only.\n\nMEMORY: a permanent 64 KB buffer would take the RAM the 128 KB CoCo 3 plan (PIZERO-133) needs, so a banked image is allocated on the heap only while it is installed, and freed when another cartridge replaces it; a launch that will not fit says so and leaves the running program alone.\n\nDO: bank switching in lib/coco_machine (switching moves the cart pointer, so reads cost nothing extra); $FF40-$FF5F writes go to the bank register instead of the FDC while a banked cart is in; overlay and autorun.txt @CART accept power-of-two images of 32 KB and up that fit in memory.\n\nNOT IN THIS ISSUE: the SN76489 sound chip (odd-address writes are counted but silent), filed separately.\n\nDONE WHEN: a 32 KB and a 64 KB banked cart start from the F12 overlay on hardware, and plain carts and disks still work after switching back.\n\n[2026-09-27 BUILT, not yet on hardware. lib/coco_machine/src/cart_gmc.h holds the rules (cart_is_banked_size: power of two 32-256 KB; gmc_bank_offset; even/odd register), 3 host tests including every D for every size staying inside the image. coco_machine: coco_machine_install_cart_banked(rom, len) starts in bank 0; an even $FF40-$FF5F write moves cart_rom to the selected bank inside cart_base (reads cost nothing extra); odd writes (SN76489) are counted in csg_writes; FDC reads return $FF while a banked cart is in; cold reset returns to bank 0. main.cpp install_cart_file() installs any cart file: plain ones in the fixed 16 KB buffer, banked ones in a heap buffer of their own size, released when another cart replaces it (unplugged first, so nothing reads freed memory). The overlay pre-check refuses a banked cart that will not fit with 'NOT ENOUGH MEMORY FOR nK'. disk11.rom and autorun.txt @CART go through the same path (coco_boot_resolve_cart), so @CART can name a banked cart too; the old coco_boot_load_cart_named is gone. Boot prints '[mem] free heap N bytes'. 123 host tests pass; product RAM 75.1% static.\nALSO FIXED: PIZERO-140's 2 KB renderer table had pushed the double-buffered fallback envs (pizero, pizero_60hz) over RAM, so they failed to link. dsk_catalog.h now gives those builds a 64-entry list (128 in the product build), and pizero, pizero_60hz, pizero_stream and pizero_stream_60 all build (99.1%, 99.1%, 75.0%, 75.1%).]\n\n[2026-09-27 When testing a banked cart on hardware, also listen: PIZERO-143's SN76489 is confirmed working via POKE, and a GMC title that uses it shows [csg] writes on serial. Note two boards are in use; name the board (USB serial) with each flash.]\n\n[2026-09-28 The user is not sure they have a bank-switched cartridge image to test with. Candidates that run on a CoCo 1/2: Mind Roll (1988, 32 KB) and Dunjunz (2020, 64 KB, GMC; its author distributes it). Until one is found this stays open; the code path is host-tested (cart_gmc.h).]", "created": "2026-09-27", "updated": "2026-09-28", "tags": ["cartridge", "overlay", "machine"]}, {"id": "PIZERO-143", "theme": "kit", "type": "feature", "status": "done", "priority": "medium", "summary": "SN76489 sound chip for Games Master Cartridge titles", "description": "Remainder of PIZERO-142. The Games Master Cartridge carries an SN76489 sound chip, written at ODD addresses in $FF40-$FF5F. PIZERO-142 counts those writes (coco_machine_cart_csg_writes) but produces no sound, so a GMC title that uses it (modern homebrew such as Dunjunz is the likely case; Mind Roll predates the GMC) runs silent or partly silent.\n\nDO: port ~/github/xroar/src/sn76489.c (XRoar configures it at 4 MHz, gmc.c sn76489_configure) and mix its output into the DAC audio path the ring buffer feeds (lib/coco_machine audio_integrate / the 48 kHz producer), without breaking the PIZERO-121 rate servo or the CPU budget. First check a title actually writes it: the csg_writes counter shows that without any sound code.\n\nDONE WHEN: a GMC title's music plays on hardware and ordinary DAC sound is unchanged.\n\n[2026-09-27 STARTED at the user's request. Approach: a fresh integer implementation in a host-tested header rather than vendoring XRoar's float sn76489.c (which pulls filter.h, part, serialise), matching the behaviour XRoar models: 3 square tones at 4 MHz / (32 N), N 10-bit with 0 = 1024; a 15-bit noise LFSR reset to $4000 on each noise write, white = parity of bits 0-1, periodic = bit 0, clocked at one of three rates or by tone 3; 4-bit attenuation in 2 dB steps, 15 = off; unipolar outputs summed. Stepped per 48 kHz output sample on core 0 in the same loop as the CPU, so writes land between samples where the program made them. Authentic placement first (only with a GMC cart in). OPEN QUESTION for the user: also expose it with Disk BASIC in, at an address the disk controller does not use, as our own extension.]\n\n[2026-09-27 BUILT, not yet heard on hardware. lib/coco_machine/src/csg_sn76489.h: integer model of XRoar's behaviour (250 kHz chip tick; tones 125 kHz / N with 0 = 1024; 15-bit LFSR reset to $4000 per noise write, white = parity bits 0-1, periodic = bit 0, reload 16/32/64 or tone 3; SN_LEVEL 2 dB steps with full scale a quarter of the DAC swing per channel; latch/data protocol incl. a data byte replacing a volume; writes inside 32 chip clocks (SN_READY_TICKS 115 event ticks) ignored, as XRoar does). Starts silent rather than mimicking the chip's half-random power-on state. 9 host tests: silence, divider bytes, volume, 1 kHz pitch at N=125, a 125 kHz tone averaging to half level (no aliasing), the 15-step periodic pulse, white noise and its reset, tone-3 noise clocking, the ready gap. coco_machine.cpp: odd $FF40-$FF5F writes with a banked cart go to sn_write (dropped if too soon); audio_integrate adds sn_render(tk) to each sample, averaging the chip over that sample's event ticks; the chip is reset and idle on any cart change and on cold reset, and costs nothing until first written. Serial prints '[csg] writes=N dropped=M' once a second while a program uses it. RAM 75.3%; all four envs build; 132 host tests pass.\nSTILL OPEN: the user's question whether to expose it with Disk BASIC in, at an address the disk controller does not use, as our own extension.]\n\n[2026-09-27 DECIDED by the user: available all the time, not only with a GMC; a settings page (PIZERO-53) will switch features like this on and off. IMPLEMENTED: without a banked cart, the odd mirrors of the disk controller's drive latch ($FF41/43/45/47 and $FF51-57, cart_gmc.h csg_on_latch_mirror, host-tested) go to the chip; the latch at $FF40 and the WD279x at $FF48-$FF4B are untouched, since Disk BASIC and OS-9 write the latch only at $FF40. That puts the chip at $FF41, where GMC software writes it, with Disk BASIC still in. Trade-off: a real FD-502 would take $FF41 as the latch; coco_machine_csg_always(false) restores that, for the settings page. With a GMC in, the authentic routing applies (every odd address). README documents $FF41. All four envs build; 133 host tests pass.]\n\n[2026-09-27 DONE: heard on hardware by the user (\"yeah it's playing\"), with no GMC plugged in, on board 1D21CC1CBE17D6F6 at the Disk BASIC prompt. Typed over serial: POKE &HFF41,142 / 15 / 144 (tone 1, N = 254, ~492 Hz, full volume): [csg] writes 1-3 with none dropped, [aud] tone ~1,780/s; POKE &HFF41,159 silenced it (tone 0/s). Also reproduced on board C58D06257AE30E85. Hearing a GMC title's own music depends on a banked cart and is folded into PIZERO-142's hardware test. The Disk BASIC prompt, SOUND, disks and the audio servo were unaffected throughout (prod 48,00x/s, no underruns).]", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["audio", "cartridge", "gmc"]}, {"id": "PIZERO-144", "type": "task", "status": "open", "priority": "low", "summary": "See the other four boot pages on a real screen", "description": "Remainder of PIZERO-92, which closed when the NO SD CARD page was seen on a TV (2026-09-27). The other pages are written and host-tested but not yet seen on hardware:\n\n  NO ROM FOUND           rename or remove /coco/roms/bas12.rom\n  ROM FILE IS DAMAGED    put a truncated bas12.rom on the card (any file of the wrong size)\n  COLOR BASIC ONLY       remove extbas11.rom; the page shows for about 4 s, then BASIC starts\n  EMULATOR DID NOT START needs a machine-init failure; skip unless there is a cheap way to force one\n\nDONE WHEN: the first three have been seen on a screen and read as written in src/boot_messages.h.", "tags": ["ux", "boot", "diagnostics", "kit", "first-run"], "created": "2026-09-27", "updated": "2026-09-27", "theme": "trust"}, {"id": "PIZERO-145", "theme": "kit", "type": "feature", "status": "done", "priority": "medium", "summary": "Settings in /coco/settings.txt, each a runtime switch", "description": "User direction 2026-09-27: collect the firmware's switches into settings that can be toggled at runtime and are stored on the SD card. There is to be NO settings GUI: the file is edited as text (PIZERO-146), so the file is the source of truth.\n\nSETTINGS (proposed to the user, no objections):\n  sn76489            on|off            SN76489 at $FF41 without a GMC (PIZERO-143; coco_machine_csg_always)\n  volume             0-15              overall level (today AUDIO_DAC_GAIN 60, fixed at build)\n  artifact_colours   off|blue-red|red-blue   PMODE 4 artifact colour or plain mono (today always on, phase fixed by ARTIFACT_PHASE_LEGACY)\n  gime_palette       on|off            CoCo 3-style palette at $FFB0 (today build flag GIME_PALETTE)\n  gime_timer         on|off            CoCo 3-style timer at $FF90 (today build flag GIME_TIMER)\n  run_skips_autorun  on|off            RUN goes straight to BASIC (PIZERO-116)\n  serial_keyboard    on|off            typing into the CoCo over USB serial\n\nFORMAT: /coco/settings.txt, one 'name = value' per line, '#' comments, case-insensitive, the same plain style as autorun.txt. A missing file or line means the default; an unknown name or bad value is reported on serial and ignored, never fatal.\n\nDESIGN: one table of settings with get/set/apply, each applying immediately, so the editor (PIZERO-146) only has to re-read the file after saving. The parser is pure and host-tested, like dsk_catalog.h.\n\nNOT HERE: writing the file (PIZERO-146), a SAM double-speed cap (needs PIZERO-132/48 first).\n\nDONE WHEN: each setting, changed in the file on a PC and booted, visibly or audibly takes effect on hardware, and a malformed file boots with defaults and a serial report.\n\n[2026-09-27 ADDED at the user's request: a default colour palette.\n  palette = NAME|factory   loads /coco/pal/NAME.pal as the power-on palette; 'factory' or no line keeps g_pal_factory (coco_machine.cpp)\nThis is the user-global layer PIZERO-55 planned between per-title palettes and the factory default (fallback order per-title <name>.pal -> user default -> factory). .pal FORMAT, shared with PIZERO-55's per-title files and editable in the PIZERO-146 editor: plain text, 'N = #RRGGBB' per line for palette index N (0 green, 1 yellow, 2 blue, 3 red, 4 white, 5 cyan, 6 magenta, 7 orange, 8 black, 9 dark green, ...), '#' comments; entries not listed keep their factory colour; colours round to RGB565. Applies through coco_machine_palette_set and becomes what coco_machine_palette_reset (and the cold reset) restores. Parser host-tested with the settings parser.]\n\n[2026-09-27 RENAMED sound_chip to sn76489 at the user's request ('too generic'): settings for sound hardware are named after the chip, leaving room for others (e.g. orchestra90).]\n\n[2026-09-27 BUILT, not yet on hardware. src/settings.h: struct coco_settings, settings_defaults, settings_parse_line (case-insensitive, '#' comments on their own line or after a value, reports SET_UNKNOWN / SET_BAD_VALUE / SET_SYNTAX), pal_parse_line ('N = #RRGGBB'), settings_rgb565 (rounded); 6 host tests. artifact_colours takes on|off|swapped (not blue-red/red-blue: 'swapped' is unambiguous relative to today's phase; artifact_colors also accepted). coco_boot.cpp: coco_boot_load_settings() and coco_boot_load_palette() read the files with f_gets, reporting each bad line with its number. coco_machine: runtime switches coco_machine_set_volume (gain = AUDIO_DAC_GAIN * v / 10, the SN76489 scaled with it), set_artifact (replaces the ARTIFACT_PHASE_LEGACY build choice, which now only sets the default), set_gime_palette / set_gime_timer (runtime gates inside the existing build flags; off removes the registers from the bus and resets palette or timer), palette_set_default (g_pal_default, which palette_reset and the cold reset restore). main.cpp: settings_defaults at the top of setup, load + settings_apply right after coco_machine_init and before AUTORUN, a '[settings] ...' line listing every value; run_skips_autorun gates the PIZERO-116 skip; serial_keyboard gates next_keychar. SETTINGS.md documents it all with an example, linked from README. All four envs build, no new warnings; 139 host tests pass.]\n\n[2026-09-27 REVISED at the user's direction, superseding the palette parts above: NO palette files or named styles for now (they would need palette editors to be any good). Instead one setting per 6847 color overrides it directly in settings.txt: color_green, color_yellow, color_blue, color_red, color_white, color_cyan, color_magenta, color_orange, color_black, color_dark_green, color_dark_orange, color_bright_orange = #RRGGBB; colors without a line keep the default. The 'palette = NAME' setting, /coco/pal/*.pal and coco_boot_load_palette are gone. ALSO at the user's direction: American spellings only, and only one form accepted: artifact_colors (artifact_colours is now rejected as unknown), color_ (colour_ rejected). coco_settings carries color[16] + color_set; settings_apply passes them to coco_machine_palette_set_default. SETTINGS.md rewritten to match. All four envs build; 138 host tests pass.]\n\n[2026-09-27 DONE at ~80%: the file loads at boot and re-applies on save (PIZERO-146), and on hardware sn76489 and gime_palette changed from the file took effect at once. Seeing each remaining setting's effect is filed as PIZERO-151.]", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["settings", "sd"]}, {"id": "PIZERO-146", "theme": "kit", "type": "feature", "status": "done", "priority": "medium", "summary": "On-screen text editor for /coco/settings.txt", "description": "User direction 2026-09-27: no settings GUI. Settings are changed by editing /coco/settings.txt directly, in a plain text editor on the CoCo Zero's own screen, opened from the F12 overlay. On save the file is written back to the SD card and the settings are re-read and applied (PIZERO-145), so a change takes effect without a reboot.\n\nSHAPE: the 32x16 6847 text card the overlay already draws (src/coco_boot.cpp g_card, coco_boot_card_present; inverse rows for a cursor line), USB keyboard input through the overlay's key capture (src/overlay_keys.h, which already guarantees nothing leaks into BASIC), the machine paused while editing. Needs: a cursor, insert/delete, line join/split, scrolling for files longer than the screen, horizontal handling of lines longer than 32 columns, save and cancel keys, and a clear on-screen hint line. The 6847 font has no lower case on screen: store what is typed, display upper case, and keep parsing case-insensitive.\n\nSD WRITE: the first firmware write to the card. Write a new file and rename it over the old one, so a power cut mid-save cannot leave a truncated settings file; overlaps PIZERO-64 (SD write foundation), which should take whatever this learns about write latency with HDMI running.\n\nPURE LOGIC FIRST: the edit buffer and its operations as a host-tested header, like overlay_keys.h.\n\nDEPENDS ON: PIZERO-145.\n\nDONE WHEN: on hardware, a setting is changed in the editor, saved, takes effect at once and survives a power cycle, and cancel leaves the file untouched.\n\n[2026-09-27 BUILT, not yet on hardware. OPENING: a fourth F12 list, < FILES >, listing SETTINGS.TXT whether or not it exists; ENTER opens the editor over the list, and a missing file starts from settings_template() (every setting at its default, generated from settings_defaults so it cannot drift; a host test proves it parses back to exactly the defaults). EDITING: src/text_edit.h (buffer: insert, backspace, delete, split/join lines, cursor moves keeping the wanted column, view follows the cursor incl. sideways for lines over 32 columns, '\\r' dropped on load, 4096-byte cap that refuses and says so) and src/text_edit_keys.h (US layout with Shift, Enter/Backspace/Delete/arrows/Home/End/PgUp/PgDn, key repeat at 400 ms then 50 ms, Ctrl-S save, ESC leaves at once when unchanged but warns first when there are changes, a second ESC discards). 12 host tests. SCREEN: src/text_editor.cpp: title with ' *' while modified, 14 text rows, inverse-cell cursor (coco_boot_card_invert_cell), status row; buffer malloc'd only while editing. SAVING: coco_boot_save_text writes PATH.tmp, closes it, removes PATH, renames the .tmp in; coco_boot_recover_text at boot finishes a save a power cut interrupted between those steps. After a save, main.cpp on_file_saved re-reads settings.txt and applies it at once. The overlay now passes the HID modifier byte (disk_overlay_key(mods, ...)); the ENTER that opens the editor is marked held so it is not typed; the ESC that closes it does not also close the overlay. SETTINGS.md and README describe it. 151 host tests pass; product RAM 75.4%, pizero_stream 75.3%, pizero_wavmeas 99.1%.]\n\n[2026-09-27 DONE: confirmed on hardware by the user (\"it works\"), board 1D21CC1CBE17D6F6. Serial capture: '[editor] open 0:/coco/settings.txt (215 bytes)', two Ctrl-S saves ('[save] ... 216 bytes', '... 217 bytes') each followed at once by a '[settings]' line showing the edit applied without a reboot (sn76489=off, then gime_palette=off), then a clean close of editor and overlay.]", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["settings", "overlay", "editor", "sd"]}, {"id": "PIZERO-147", "theme": "kit", "type": "feature", "status": "done", "priority": "medium", "summary": "The same on-screen editor for /coco/autorun.txt", "description": "User direction 2026-09-27: once the settings editor exists (PIZERO-146), edit autorun.txt the same way, from the F12 overlay, instead of taking the card to a PC. The editor itself should need no changes beyond being pointed at a second file; creating the file when it does not exist is part of this. Whether the new autorun applies at the next power-on only, or can be run at once, is to be decided when building. AUTORUN.md documents the format.\n\nDEPENDS ON: PIZERO-146.\n\nDONE WHEN: on hardware, autorun.txt is created or edited on screen, saved, and the next power-on follows it.\n\n[2026-09-27 BUILT, not yet on hardware. AUTORUN.TXT joins SETTINGS.TXT in the F12 < FILES > list (disk_overlay.cpp k_files, now carrying a per-file template). A missing file opens src/file_templates.h AUTORUN_TEMPLATE: commented examples only, so saving it unchanged does nothing (host test: every line starts with '#' and fits 32 columns). DECIDED: a saved autorun.txt applies at the NEXT power-on; saving never restarts the machine. The editor's saved callback now returns the status text: 'SAVED AND APPLIED' for settings.txt, 'SAVED: USED AT NEXT POWER-ON' for autorun.txt. Boot finishes an interrupted autorun.txt save (coco_boot_recover_text) before reading it. The parser already matches directives case-insensitively, so the upper-case-only screen is no problem. AUTORUN.md gains an editing section and its SD layout now shows /coco/cart and settings.txt. 152 host tests pass; product 75.4%, fallback 75.3%, wavmeas 99.1%.]\n\n[2026-09-27 DONE: confirmed on hardware by the user (\"that's all working now\"), board 1D21CC1CBE17D6F6: autorun.txt edited on screen and saved, the not-found page shown and dismissed with a key, and '@DISK SPACEWARP.DSK' on its own starting Spacewarp at power-on.]", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["autorun", "overlay", "editor", "sd"]}, {"id": "PIZERO-148", "theme": "kit", "type": "feature", "status": "open", "priority": "low", "summary": "Orchestra-90CC: two 8-bit stereo DACs at $FF7A/$FF7B", "description": "User request 2026-09-27, from a survey of sound add-ons. Tandy's Orchestra-90CC (1985) is two 8-bit DACs, left at $FF7A and right at $FF7B; music software pushes samples through them. XRoar's whole model is ~/github/xroar/src/orch90.c (158 lines): the write handler stores the byte and sets the external left/right level (D / 255). Its own music program ships in the cartridge ROM (XRoar loads 'orch90').\n\nDO: decode $FF7A/$FF7B writes (no conflict with the disk controller at $FF40-$FF5F, so it can be always available like the SN76489, PIZERO-143), hold the two levels, and mix them into the audio samples through the same integrate-and-average as the DAC. Setting: orchestra90 = on|off in /coco/settings.txt (PIZERO-145).\n\nTHE ONE REAL DECISION: STEREO. The HDMI path sends the same sample to both channels today (main.cpp stream_audio fill: lr[2f] = lr[2f+1]). Honouring left/right means carrying two channels through the ring (coco_machine_audio_read) and the data-island encoder; decide whether to do that here or mix to mono first and file stereo separately.\n\nDONE WHEN: an Orchestra-90 program plays on hardware.", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["audio", "cartridge", "orchestra90"]}, {"id": "PIZERO-149", "theme": "kit", "type": "feature", "status": "open", "priority": "low", "summary": "AY-3-8910 / YM2149 sound chip", "description": "User request 2026-09-27, from a survey of sound add-ons. General Instrument's AY-3-8910 (and the compatible Yamaha YM2149): 3 square tones and noise like the SN76489, plus a hardware envelope generator and per-channel tone/noise mixing; the ZX Spectrum 128 / Amstrad CPC / MSX sound. XRoar added a model in 2024 (~/github/xroar/src/ay891x.c, 587 lines, from the data sheet and the reverse-engineered die in github.com/lvd2/ay-3-8910_reverse_engineered).\n\nON THE COCO it appeared in homebrew add-ons such as the CoCo PSG cartridge (a YM2149). BEFORE BUILDING: confirm the addresses real CoCo AY/YM hardware uses and name software that targets it, so the port has something to be tested against.\n\nDO: a fresh integer model in a host-tested header, as PIZERO-143 did for the SN76489, mixed into the audio samples the same way. Setting named after the chip (e.g. ay8910 = on|off, PIZERO-145).\n\nDONE WHEN: a program written for CoCo AY/YM hardware plays on hardware.", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["audio", "ay8910"]}, {"id": "PIZERO-150", "theme": "trust", "type": "task", "status": "done", "priority": "medium", "summary": "Retire the silent double-buffered builds and finished one-off envs", "description": "User decision 2026-09-27. platformio.ini carried 13 firmware envs. Two silent double-buffered builds (pizero, pizero_60hz) sat at 99% RAM, useless as a fallback for a machine with sound, and constrained every feature (PIZERO-142 had to cut their disk list to 64 entries); pizero was also the base the product build inherited through (pizero -> pizero_audio -> pizero_stream -> pizero_stream_60).\n\nDO: move the shared settings into a non-env base section; retire env:pizero and env:pizero_60hz as buildable targets; delete pizero_bench (PIZERO-36 is closed; its comment said remove it then) and pizero_audio (the legacy bank audio, only a link in the chain; fold its HDMI_DATA_ISLAND flag into pizero_stream). KEEP pizero_stream_60 (product), pizero_stream (the ~52 Hz fallback for displays that reject 60 Hz, until PIZERO-99), and the one-offs tied to open work: pizero_hotplug (PIZERO-51), pizero_wavmeas and pizero_stream_lpf (PIZERO-41), pizero_stream_synth and pizero_stream_std (PIZERO-99/120 display triage), pizero_wdtest (PIZERO-33, until PIZERO-110), waveshare_demo (Waveshare's USB device_info demo, for USB triage: PIZERO-11/51). The code behind removed flags stays; an env is only a preset.\n\nUpdate docs/BUILD.md and CLAUDE.md, which name the fallbacks.\n\nDONE WHEN: every remaining env builds, the product build is byte-for-byte unaffected in behaviour (same flags), and the docs list exactly the envs that exist.\n\n[2026-09-27 DONE IN CONFIG, awaiting the user's word. platformio.ini: the shared settings are now a non-env [pizero_base] section; pizero_stream extends it with -DHDMI_DATA_ISLAND -DHDMI_STREAM_AUDIO (pizero_audio's flag folded in); pizero_wavmeas extends it directly; env:pizero, env:pizero_60hz, env:pizero_audio and env:pizero_bench are gone. VERIFIED with 'pio project config': every surviving env resolves to exactly the same settings as before (only the 'extends' key differs, for pizero_stream and pizero_wavmeas), so the product build is unchanged. All nine remaining firmware envs build (product 75.3%, the stream-based diagnostics ~75%, pizero_wavmeas 99.0%, waveshare_demo 6.4%). CORRECTION: pizero_wavmeas is itself double-buffered (it leaves HDMI audio off to capture the sound), so dsk_catalog.h's 64-entry cap for non-HDMI_DATA_ISLAND builds stays, for that build only. docs/BUILD.md (quick start, env table, flag table, size notes), README, docs/pipeline.md, docs/hdmi-audio-notes.md and CLAUDE.md updated; CLAUDE.md now says to also build pizero_stream and pizero_wavmeas before committing a RAM increase.]\n\n[2026-09-27 DONE: closed on the user's word, verified by the builds and the before/after 'pio project config' comparison (product configuration identical).]", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["build", "cleanup"]}, {"id": "PIZERO-151", "theme": "trust", "type": "task", "status": "open", "priority": "low", "summary": "See each settings.txt setting take effect on hardware", "description": "Remainder of PIZERO-145. Load-at-boot, apply-on-save and two settings (sn76489, gime_palette) are confirmed on hardware. Still to SEE, each changed in the on-screen editor (F12, < FILES >, SETTINGS.TXT, Ctrl-S):\n  volume = 4          SOUND 100,10 is audibly quieter; volume = 0 silent\n  artifact_colors     off: PMODE 4 in black and white; swapped: blue and orange exchanged\n  color_green = ...   the text-screen green changes at once and survives a RUN reset\n  gime_timer = off    a program using the $FF90 timer stops getting it\n  run_skips_autorun   off: RUN behaves like power-on (AUTORUN runs)\n  serial_keyboard     off: text sent over USB serial is no longer typed\nand a deliberately broken line (e.g. 'volume = loud') is reported on serial with its line number while the rest still applies.\n\nDONE WHEN: each has been seen once on a board.", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["settings", "verify"]}, {"id": "PIZERO-152", "theme": "kit", "type": "feature", "status": "done", "priority": "medium", "summary": "autorun.txt: @DISK alone runs the disk's program, and a missing name is reported", "description": "Found testing PIZERO-147 on hardware (2026-09-27): the user wrote '@DISK SPACEWARP.DSK' (saved as 'space-warp.dsk' and 'spacewrp.DSK' on the way) and expected Spacewarp to start. Two gaps, both silent:\n1. A name autorun.txt gives that is not on the card was skipped with no message at all; for @DISK no disk was mounted, and nothing on screen said why.\n2. @DISK only mounts the disk. Running something needs a typed line after it, whereas the F12 overlay's ENTER on a disk runs its first program; the two paths disagreed.\n\nDECIDED with the user: (a) when autorun.txt names a disk and has NO typed lines, run the disk's first program the way the overlay does (RSDOS directory via rsdos_dir.h, RUN\"X\" or LOADM\"X\":EXEC after the autorun warmup). With typed lines present they are typed exactly as before, so existing files behave the same; the default disk (no @DISK) never auto-runs. (b) a name in @DISK, @CART or @DIRECT that is not found shows a boot page naming it and logs it on serial, then boot carries on without it.\n\nDONE WHEN: on hardware, '@DISK SPACEWARP.DSK' alone starts Spacewarp at power-on, and a misspelt name shows the page.\n\n[2026-09-27 BUILT, not yet on hardware. main.cpp boot: each directive's name is resolved on its own; a miss logs '[autorun] @X NAME: not found on the card, skipped' and the first miss shows a boot page (boot_messages.h MSG_ARMISS_*, host-tested with a 63-character name) for 3 s. A missing @CART now falls back to disk11.rom (before, the whole Disk BASIC setup was skipped and the machine came up in plain Color BASIC with no disk); a missing @DISK falls back to the default disk; a missing @DIRECT boots normally. When @DISK named a disk that mounted and there are no typed lines, disk_run_command (the overlay's RSDOS path) queues RUN\"X\" or LOADM\"X\":EXEC with the 180-frame warmup; the default disk never auto-runs. AUTORUN.md documents both. 153 host tests pass.]\n\n[2026-09-27 The user saw the page flash by and asked for a key to dismiss it. boot_wait(max_ms) in main.cpp holds a boot page until a key or the timeout, servicing USBHost.task() itself (loop() has not started) and counting a serial byte as a key. The not-found page now waits up to 30 s ('PRESS ANY KEY' added to its detail; still within the tested 3 rows); AUTORUN SKIPPED (2.5 s) and COLOR BASIC ONLY (4 s) keep their timeouts but a key skips them. Before the machine runs, hid_keyboard_apply only records presses (g_boot_key) and never presses CoCo keys, so the dismissing key cannot reach BASIC. MEASURED on hardware over serial: page up at 1.5 s, still waiting at 7.5 s when a key was sent, machine running 0.1 s later.]\n\n[2026-09-27 DONE: confirmed on hardware by the user (\"that's all working now\"), board 1D21CC1CBE17D6F6: autorun.txt edited on screen and saved, the not-found page shown and dismissed with a key, and '@DISK SPACEWARP.DSK' on its own starting Spacewarp at power-on.]", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["autorun", "boot"]}, {"id": "PIZERO-153", "theme": "kit", "type": "feature", "status": "done", "priority": "medium", "summary": "F9-F12 open the overlay straight on programs, cartridges, files or disks", "description": "User request 2026-09-27. F9 programs, F10 cartridges, F11 files, F12 disks. With the overlay closed, the key opens it on that list; with it open on another list, the key switches to it; pressing the key of the list already shown closes the overlay. ESC and Left/Right keep working. Inside the text editor the F keys do nothing, so they cannot bypass its unsaved-changes guard. Replaces 'F12 toggles the overlay' (PIZERO-81c).\n\nDO: src/overlay_keys.h (claims F9-F12 while closed, as it claimed F12; host tests updated so no other key leaks), disk_overlay.cpp (open on the list, switch, or close), and the docs that say 'F12, then Right until FILES'.\n\nDONE WHEN: on hardware each key opens its list, switches from another, and closes its own.\n\n[2026-09-27 BUILT, not yet on hardware. src/overlay_keys.h: ovk_fkey_list maps F9/F10/F11/F12 to OVK_LIST_BIN/CART/FILES/DSK; ovk_state.list tracks the list on show; closed, a new F-key press opens (OVK_OPEN with the list); open, the F key of the list on show closes, another switches (new OVK_GOTO); ESC still closes. 3 new host tests (each key opens its list and closes it; switching; F1/F8/PrtSc not claimed while closed). disk_overlay.cpp: go_to_list keeps g_ovk.list in step with Left/Right; a static_assert ties the key logic's list numbers to the overlay's. Inside the text editor the F keys stay the editor's (ignored), so its unsaved-changes guard holds. Docs: README, the kit card, SETTINGS.md, AUTORUN.md, and the not-found page (now 'F11, THE FILES LIST'). 156 host tests pass.]\n\n[2026-09-27 DONE: confirmed on hardware by the user (\"works\"), board 1D21CC1CBE17D6F6.]", "created": "2026-09-27", "updated": "2026-09-27", "tags": ["overlay", "input"]}, {"id": "PIZERO-154", "theme": "kit", "type": "feature", "status": "done", "priority": "medium", "summary": "Per-game settings files: NAME.TXT beside a .bin, .ccc or .dsk, edited with Tab", "description": "User direction 2026-09-28, replacing per-title palette files (PIZERO-55 closed): each game can have its own settings file, same format as settings.txt, including color_ lines. NAMING (user's call): ORBIT.BIN, ORBIT.CCC and ORBIT.DSK all use ORBIT.TXT beside the file.\n\nBEHAVIOR: launching a game (overlay ENTER, or autorun.txt @DIRECT / @CART / @DISK) applies settings.txt first and then the game's file on top; launching something else starts again from settings.txt, so one game's settings never leak into the next. Mounting a disk in a drive with 0-3 is not a launch and applies nothing. Tab on a highlighted entry in the F9 / F10 / F12 lists opens its NAME.TXT in the on-screen editor, from a template of commented examples if it does not exist. Saving the running game's file applies it at once; any other game's file applies when that game starts. A game named SETTINGS or AUTORUN would clash with the machine's own files, so Tab refuses it and says why.\n\nDONE WHEN: on hardware, a game's file changes something visible (for example artifact_colors or a color_) only while that game runs, created and edited with Tab.\n\nBUILT 2026-09-28, awaiting hardware. settings_game_path() in src/settings.h (host-tested: ext swap, no-ext and SETTINGS/AUTORUN stems refused). coco_boot_apply_settings_file() layers one file onto a struct. main.cpp settings_for_game() is called from perform_launch (DSK, BIN, CART) and from the autorun boot path; on_file_saved re-applies when the saved file is settings.txt or the running game's file, else says SAVED: USED WHEN IT STARTS. disk_overlay.cpp edit_game_settings(): TAB (OVK_EDIT, overlay_keys.h) opens NAME.TXT with GAME_TEMPLATE (file_templates.h); ignored in the FILES list. text_editor g_path widened 64 -> 96 because /coco/cart/ plus a 63-char name exceeded it. Docs: SETTINGS.md 'Settings for one game', README items 4 and 6. Builds: pizero_stream_60 75.5%, pizero_stream 75.3%, pizero_wavmeas 99.1% RAM; 159 host tests pass.\n\nHARDWARE CHECKS: F9, TAB on a program opens NAME.TXT (template if new); set artifact_colors = swapped, Ctrl-S, ENTER to run it: colors swapped. Launch a different program: back to settings.txt. Same via F10 and F12. TAB in F11 does nothing.\n\nCONFIRMED ON HARDWARE 2026-09-28 (user): TAB in the F9 programs list opens ORBIT.TXT, and artifact_colors = swapped in it swaps the colors when ORBIT runs. Closed at ~80%; the checks not yet made on hardware are filed as PIZERO-155.", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["settings", "overlay", "editor"]}, {"id": "PIZERO-155", "summary": "Per-game settings: hardware checks not yet made (cartridges, disks, revert, autorun)", "description": "Follow-up to PIZERO-154 (done), which was confirmed on hardware only for a program: TAB in F9 opened ORBIT.TXT and artifact_colors = swapped took effect when ORBIT ran. Still unchecked on hardware:\n1. F10 cartridges: TAB on a .ccc opens NAME.TXT beside it in /coco/cart; its settings apply when the cartridge starts (perform_launch CART case, src/main.cpp).\n2. F12 disks: same for a .dsk (perform_launch DSK case). Mounting with 0-3 must apply nothing.\n3. Revert: launching a game with no NAME.TXT after one with a file goes back to plain settings.txt (settings_for_game reloads defaults + settings.txt each time).\n4. autorun.txt: @DIRECT, @CART and @DISK launches pick up the game's file at boot (autorun path near the settings_for_game(game) call in src/main.cpp).\n5. Saving the running game's file with Ctrl-S applies at once (status SETTINGS APPLIED); saving another game's file says SAVED: USED WHEN IT STARTS.\n6. TAB in the F11 files list does nothing; TAB on a game named SETTINGS or AUTORUN shows THAT NAME CANNOT HAVE SETTINGS.\n7. A long cartridge name (path over 64 characters) saves under the right name (text_editor g_path widened to 96 in PIZERO-154).\n\nCONFIRMED ON HARDWARE 2026-09-28 (user): items 1 and 2, per-game settings work for cartridges and disks too. Items 3 to 7 remain.", "type": "task", "status": "open", "priority": "low", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["settings", "overlay", "hardware-check"], "theme": "overlay"}, {"id": "PIZERO-156", "summary": "F1: an info page (board id, temperature, versions) that is also a CoCo-styled Markdown help reader", "description": "User request 2026-09-28: F1 opens an INFO page, which also serves as the HELP system: context-sensitive help, the owner's manual, and any documents the user puts on the SD card, drawn by a Color Computer styled Markdown renderer.\n\n1. F1 KEY. F1 (HID 0x3A) is unmapped today (src/main.cpp hid_keyboard_apply; overlay keys in src/overlay_keys.h, which claims only F9-F12 while closed). F1 pauses the machine and opens the page, as the F9-F12 lists do (same pause, audio silence and key capture, disk_overlay.cpp); F1 or ESC closes it. CAUTION: the CoCo 3 keyboard has real F1/F2 keys, and the Fruit Jam port reserved F1/F2 for the emulated machine for that reason. When CoCo 3 mode lands (PIZERO-133) F1 must either pass through there or move; decide then, note it in the docs.\n\n2. INFO PAGE (first screen). The facts a person or a bug report needs: firmware version and git hash, build env; chip id, revision, unique board id (the flash id, already the USB serial number, e.g. 1D21CC1CBE17D6F6); system clock; chip temperature (analogReadTemp(), RP2350B ADC channel 8, no GPIO, a few degrees rough); last reset reason ([boot] chip_reset); uptime; free heap; SD card state; which ROMs loaded (Color/Extended/Disk BASIC); drives 0-3 and what is in them; the running program or cartridge and whether its NAME.TXT settings applied (PIZERO-154); USB devices, including the bound gamepad identity (PIZERO-13).\n\n3. HELP, CONTEXT-SENSITIVE. F1 from an F9-F12 list explains that list's keys; from the text editor, the editor's keys and, for settings.txt, the settings; from a running machine, an overview (F keys, RUN button, autorun, settings). Built-in help text lives in firmware so it works with an empty card.\n\n4. DOCUMENTS FROM THE CARD. Markdown files in a folder such as /coco/help/ (name to decide), including an owner's manual we ship (README/SETTINGS/AUTORUN material rewritten for the screen) and anything the owner adds. A list of documents like the F11 files list.\n\n5. COCO-STYLED MARKDOWN RENDERER. Draws on the 32x16 text card (coco_boot_card_*, which already has inverse rows and cells) in the real 6847 font. A deliberately small subset: headings, paragraphs with word wrap at 32 columns, bullet and numbered lists, emphasis, inline and fenced code, horizontal rules, and links between documents ([text](other.md): arrows select, ENTER follows, Backspace goes back). Styling ideas to settle while building: headings as inverse bars or on colored SG4 semigraphic blocks (the 6847's 8 colors, as CoCo program title screens did); rules from semigraphic blocks; code in inverse. The 6847 has no lower case: text shows upper case, and lower case could show as inverse, as a real CoCo 2 does, which would also carry emphasis; decide which. Scrolling with Up/Down/PgUp/PgDn/Home/End as in the editor. Parser and layout as a pure header (like text_edit.h, dsk_catalog.h) with host tests: wrapping, every construct, a link table, and a long document fitting in memory (stream it from the card rather than load it whole; free heap ~114 KB).\n\nSUGGESTED ORDER (close at ~80%, file the rest): F1 + info page first (small, useful for bug reports at once); then the renderer with built-in help; then card documents and links; context sensitivity last.\n\n[2026-09-28 FIRST SLICE BUILT, the INFO page only, for Tandy Assembly (user: 'let's at least get that basic info. the firmware version and the chip id/revision/serialnumber stuff').] F1 (HID 0x3A, overlay_keys.h) opens a fifth overlay list, OVL_INFO / OVK_LIST_INFO, '< INFO >', also reachable with Left/Right (so the pad reaches it via Home). Lines come from main.cpp info_lines() through disk_overlay_set_info(): FW (git describe --always --dirty, from the generated src/fw_version.h written by the new pre-script scripts/fw_version.py, gitignored, rewritten only on change), DATE (commit date), BUILD (env), CHIP RP2350 REVISION n, ID (SYSINFO chip id), SERIAL (pico_get_unique_board_id_string, the USB serial number), CLOCK MHz, UP h:mm:ss (redrawn once a second), MEMORY free heap, USB device count and whether a gamepad is bound. Labels 7 wide so a '-dirty' describe still fits 32 columns. The F1-not-claimed host test updated (F1 is ours now). NOT in this slice: temperature, reset reason, SD/ROM/drive state, the running game, the help system and Markdown reader, context-sensitive help. The CoCo 3 caveat (a real CoCo 3 keyboard has F1) still stands for PIZERO-133.", "type": "feature", "status": "in-progress", "priority": "medium", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["overlay", "ui", "help", "docs"], "theme": "overlay"}, {"id": "PIZERO-157", "summary": "Gamepad: make Switch Pro mode work (the startup handshake), so the pad works whatever mode it is in", "description": "Split from PIZERO-13 (done). The user's GameSir Tegenaria Lite keeps returning to its Switch Pro identity (057E:2009) on this board: after Home+Y, and it came back there after RUN restarts and a power-on until Android mode (Home+A) was set by hand. In that identity it sends one 64-byte reply (81 01 00 03 ...) and then nothing, because a Switch Pro controller waits for the host's USB startup handshake. Today src/gamepad.h marks it PAD_SILENT and the mount line says 'gamepad, no input in this mode'.\n\nWORK: send the handshake from main.cpp at mount (or after the first 0x81 reply), over the interrupt OUT endpoint with tuh_hid_send_report, a path this port does not use yet. Known sequence (Linux hid-nintendo, SDL): 0x80 0x02 handshake, 0x80 0x03 baud, 0x80 0x02 again, 0x80 0x04 (USB only, no timeout), then subcommand 0x03 with argument 0x30 to select the full input report. Then decode report 0x30: buttons in bytes 3-5, left and right sticks as packed 12-bit values in bytes 6-11 (Y up is larger, so flip). Add PAD_SWITCH to gamepad.h with host tests, measure with the PAD_PROBE build, same mapping as the other identities.\n\nWHY: the pad would work in any mode, and genuine Switch Pro controllers would work too. Same problem as FRUITJAM-91 in the Fruit Jam port, never done there because that board always got the DS4 identity. COMPLETION: in Switch mode, PRINT JOYSTK(0) sweeps and fire registers.", "type": "feature", "status": "open", "priority": "low", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["usb", "gamepad", "joystick"], "theme": "input"}, {"id": "PIZERO-158", "summary": "Serial typing drops the first character of a line", "description": "Seen 2026-09-28 while typing a test program over the USB serial port (serial_keyboard=on) during PIZERO-13. After NEW and a line 10, the line '20 GOTO 10' was stored as '0 GOTO 10': the leading 2 was lost. The same happened in the first attempt at 30 ms per character, and again at 80 ms per character with a 0.6 s pause after each Enter, so it is not simply typing too fast. Workaround used: start each line with a space, which BASIC ignores.\n\nWHERE: src/main.cpp pump_keyboard() / next_keychar(). Serial characters are pressed for 3 frames (g_kb_hold) and then released with a 2-frame gap (g_kb_gap); autotype uses 5 and 4. Suspects, not yet tested: (1) Color BASIC is busy after Enter (tokenizing and inserting the line) and its key scan misses a 3-frame press, which would explain why only the first character after Enter goes; autotype's longer hold may be why autorun typing has not shown it; (2) the key-rollover logic in the ROM ignoring a press that arrives while it still considers the Enter key down. NOTE the PIZERO-13 joystick change made PIA0 PA7 follow the joystick comparator instead of always reading high; the ROM masks that bit in its key scan, but rule it out.\n\nTEST: over serial, send NEW then 10 lines of '<n> PRINT <n>' with no leading space, then LIST, and count the lines stored with the wrong number. Try the autotype timings (5/4) for serial too, and a longer hold only for the character after a CR. COMPLETION: 100 lines typed over serial arrive intact.\n\n[2026-09-30] Likely fixed by PIZERO-173: serial typing handing characters straight to BASIC's POLCAT routine, as upstream XRoar's auto_kbd.c does, instead of simulated key presses BASIC can miss while busy.", "type": "bug", "status": "open", "priority": "medium", "created": "2026-09-28", "updated": "2026-09-30", "tags": ["serial", "keyboard"], "theme": "input"}, {"id": "PIZERO-159", "summary": "USB: devices behind a multi-chip USB-C hub never mount (TinyUSB enumeration race)", "description": "Split from PIZERO-54 (done). The user's multi-port USB-C hub is two hub chips chained (Terminus FE1.1s 1A40:0101 with a Genesys 05E3:0610 on its port 3) plus a built-in device on the first hub's port 4 (probably a card reader). Since PIZERO-54 both hubs mount (CFG_TUH_HUB=2 via scripts/patch_tinyusb.py), but a pad behind the second hub never does.\n\nMECHANISM, from the pizero_usbdebug env's TinyUSB log: the pad gets its address (Set Address = 1); during the 2 ms post-SET_ADDRESS delay the first hub reports a connection change on port 4 and TinyUSB issues GET_PORT_STATUS on the shared control pipe; when the pad's next request (Get Device Descriptor) is due the pipe is busy, 'enum_delay_async 1627: ASSERT FAILED' (host/usbh.c, ENUM_AFTER_SET_ADDRESS_RECOVERY_DELAY), and the enumeration is abandoned with no retry. Present in Adafruit TinyUSB 3.7.7, the latest release as of 2026-09-28.\n\nOPTIONS: (1) check upstream hathach/tinyusb master for a fix to hub status handling during enumeration, and whether the Arduino library can take it; (2) extend scripts/patch_tinyusb.py to retry (reschedule the delayed step when the control pipe is busy instead of asserting); (3) accept it and document 'use a simple hub'. A simple 4-port hub works (PIZERO-54). Low priority while simple hubs work.", "type": "bug", "status": "open", "priority": "low", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["usb", "hub"], "theme": "input"}, {"id": "PIZERO-160", "summary": "Setting joystick_swap: swap which pad stick drives the CoCo's right and left joysticks", "description": "User request 2026-09-28. The pad mapping (PIZERO-13) puts the pad's LEFT stick (and D-pad) on the CoCo's RIGHT joystick, JOYSTK(0)/(1), the one most software reads, and the right stick on JOYSTK(2)/(3). Some players and games want it the other way. New settings.txt line joystick_swap = on | off (default off). On swaps the two CoCo ports as a whole: pad right stick -> JOYSTK(0)/(1) with the left-hand fire buttons (square, L1) on its fire bit, pad left stick and D-pad -> JOYSTK(2)/(3) with the right-hand buttons. Keeping each stick with the buttons on the other hand's side is deliberate: the steering thumb is busy, so the other hand fires. Because per-game files use the same format (PIZERO-154), a game can swap just for itself with a NAME.TXT. Applies live on save, like the other settings. WHERE: src/settings.h (field, parser, template, host tests in test/test_settings), src/main.cpp (the pad decode loop picks the destination port; [pad] telemetry reports CoCo port 0 after the swap; the [settings] log line), SETTINGS.md table, src/file_templates.h game template example.\n\nCONFIRMED ON HARDWARE 2026-09-28 (user): played several games with joystick_swap = on through the hub with keyboard and pad; 'very helpful'. Nothing left over.", "type": "feature", "status": "done", "priority": "medium", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["settings", "gamepad", "joystick"], "theme": "input"}, {"id": "PIZERO-161", "summary": "USB retrospective: docs/usb-retrospective.md, and refresh the ROADMAP's stale USB section", "description": "User request 2026-09-28: a thorough retrospective on the USB implementation, in the format of hardware/case/RETROSPECTIVE.md (where it stands, timeline, what worked, what went wrong with a Lesson each, still open, working rules). Covers PIZERO-11/11a/11b/12/13/49/50/51/54/157-160, 2026-05-27 to 2026-09-28. Also refresh docs/ROADMAP.md, whose USB section (lines 19, 28-56) still lists PIZERO-13 and PIZERO-54 as future work and PIZERO-51's disproved stop/restart fix. Link the retrospective from README and ROADMAP. Plan: ~/.claude/plans/let-s-try-the-6809-serene-penguin.md (approved 2026-09-28). \n\nCLOSED 2026-09-28 by the user after reading it. docs/usb-retrospective.md (3e63df6, updated 106e94d) covers PIZERO-11 to 167 with ten lessons and the working rules.", "type": "task", "status": "done", "priority": "medium", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["docs", "usb", "retrospective"], "theme": "input"}, {"id": "PIZERO-162", "summary": "Firmware screens draw _ { | } ~ ^ and true lower case (the 6847T1 glyphs we already have)", "description": "User report 2026-09-28: the overlay shows the 6847 left arrow for '_', and the characters { } | ~ ` are missing. FINDING: our screens already draw with font_6847t1 (src/coco_boot.cpp:695, :765), the 128-glyph lowercase 6847T1 font, whose glyphs 0x00-0x1F hold a caret, a-z, { | } ~ and a real underscore; only backtick has no glyph. card_code() (src/text_card.h:17-22) folds everything to upper case and to 0x40-0x7F via vdg_alpha_glyph_index, so those glyphs are unreachable. FIX: card cells hold a direct font index (0-127) plus the inverse bit 7; card_code maps _ -> 0x1F, { | } ~ -> 0x1B-0x1E, ^ -> 0x00, a-z -> 0x01-0x1A, backtick -> the apostrophe glyph; coco_boot_card_present indexes the font directly. Firmware screens only (overlay, editor, boot pages); CoCo programs keep authentic VDG output (a real CoCo shows '_' as a left arrow). Tests in test/test_text_card. Plan: ~/.claude/plans/let-s-try-the-6809-serene-penguin.md (approved 2026-09-28). \n\nBUILT 2026-09-28, awaiting hardware. card_code() now returns a font_6847t1 glyph index (text_card.h, documented layout); card_printable() replaces the tests' card_code(c)==c idiom; coco_boot_card_present indexes the font directly (no vdg fold); CARD_SPACE=0x60 for clear. Host tests: glyph per character, no two characters share a glyph, all indexes < 0x80. SETTINGS.md and the editor's header comment updated. HARDWARE CHECK: a file named MY_game.bin shows MY_game in the F9 list with an underscore and lower case; the F11 editor shows settings.txt in lower case and { | } ~ typed into it.\n\nCLOSED 2026-09-28, user confirmed on hardware. The card now draws with the project's 6847T2 font (c27b899), so backtick is a real backtick too.", "type": "feature", "status": "done", "priority": "medium", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["overlay", "ui", "font"], "theme": "input"}, {"id": "PIZERO-163", "summary": "USB keyboard types what the keycaps say (not CoCo key positions); per-source key matrix", "description": "User request 2026-09-28: the USB keyboard should use USB key mappings instead of emulating CoCo key positions, which is confusing. TODAY (positional): hid_table_init (src/main.cpp:331-357) maps key positions and passes Shift through, so Shift+2 gives '\"', Shift+; gives '+', and no USB key reaches ':', '@', '*' or CLEAR; = [ ] \\ ' ` Tab Home are unmapped. PLAN: (1) coco_machine gets one key mask per source (USB keyboard, serial/autotype, pad) ANDed in coco_pia0_preread_a, because today press/release_key is one bitmask where the last writer wins; (2) new pure header src/key_translate.h, host-tested: USB key + Shift -> ASCII via tek_ascii() (src/text_edit_keys.h:58-76, already the editor's table) -> CoCo key plus a forced SHIFT state via an extended ascii_to_dscan with the Color BASIC chords from upstream XRoar dkbd.c: [ = SHIFT+DOWN, ] = SHIFT+RIGHT, \\ = SHIFT+CLEAR, _ = SHIFT+UP, ^ = UP ({ } | ~ ` press nothing; upstream's ~ = SHIFT+@ is PAUSE, not copied). Letters keep Shift passing through (CoCo's other case). Esc=BREAK, Backspace=LEFT, Home=CLEAR, Caps Lock=SHIFT+0. Physical Shift restored on release, as upstream hkbd.c:1460-1470. No positional option (user: drop it). Serial typing gains the same chords. Plan: ~/.claude/plans/let-s-try-the-6809-serene-penguin.md (approved 2026-09-28). \n\nUser additions 2026-09-28: Caps Lock (not Shift+0) is the case toggle, so Shift+0 types ')'; '- _ = + ; : \\' \" ~ `' were reported unmapped. BUILT 2026-09-28, awaiting hardware. coco_machine: one key layer per source (COCO_KEYS_USB, _TYPED, _PAD), ANDed into the old mask on every change so the PIA read costs the same; old press/release calls are the USB layer, release_all clears every layer. src/key_translate.h (12 host tests): CoCo key names moved here from main.cpp; kt_chord (the old ascii_to_dscan plus [ ] \\\\ _ ^ chords); kt_translate (USB key + Shift -> CoCo key + forced SHIFT; letters, Enter, Space, arrows, Esc, Backspace/Delete keep the physical Shift; Home=CLEAR; Caps Lock=SHIFT+0; the numeric keypad types its characters, which also covers PIZERO-49); kt_update/kt_resync/kt_keys state machine (release lifts the key chosen at press; newest key decides SHIFT; resync makes held keys inert for the overlay's closing ESC). main.cpp: hid_table_init and the 256-byte table are gone; hid_keyboard_apply redraws the USB layer from kt_keys; serial typing uses kt_chord on its own layer, so it can now type [ ] \\\\ _ ^. ~ and backtick press nothing (no CoCo key). README item 8. HARDWARE CHECK: at the OK prompt type PRINT \"A:B@C*D=E+F'G\" and PRINT \"[]\\\\_\"; Caps Lock toggles case; Home clears; keypad digits; a game using SHIFT or arrows still works.\n\nCLOSED 2026-09-28, user confirmed on hardware ('the mapping is pretty good'; Caps Lock as the case toggle and the previously unmapped keys requested by the user are in). Auto-repeat followed as PIZERO-167 (done).", "type": "feature", "status": "done", "priority": "high", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["keyboard", "usb", "input"], "theme": "input"}, {"id": "PIZERO-164", "summary": "Pad buttons press CoCo keys, set in settings.txt (pad_<button> = key), and dpad = arrows", "description": "User request 2026-09-28: use all the pad's buttons; assigning key presses to pad buttons makes most sense. FINDINGS: each decoder in src/gamepad.h yields only two fire bits; unused are HID/Android top, buttons 3 and 6, byte 2 (buttons 9-15) and the triggers; XInput start/back/L3/R3/guide/top/triggers; DS4 top and byte 6 above R1. The CoCo 2 reads one fire button per joystick (PA0/PA1); the second button of two-button sticks is read only by a CoCo 3 (PA2/PA3; upstream coco3.c:1361 vs dragon.c:1341), and on a CoCo 2 those bits are keyboard rows, so a second fire would read as phantom keys; key mapping is the right tool for CoCo 2 games (note added to PIZERO-133). PLAN: pad_state gains a generic buttons mask (bottom, right, left, top, l1, r1, l2, r2, select, start, l3, r3, home), filled by each decoder; settings lines pad_<button> = left_fire | right_fire | none | a CoCo key name (A-Z, 0-9, SPACE, ENTER, BREAK, CLEAR, UP, DOWN, LEFT, RIGHT, SHIFT, @ : ; , - . /), also in a game's NAME.TXT; dpad = joystick | arrows. Defaults keep today's fire buttons plus start=ENTER and top=SPACE. Keys go through the pad's own matrix source (PIZERO-163) and are released on unplug and while the overlay is open. Needs one PAD_PROBE=1 sweep to measure Android byte 2 and XInput start/back/L3/R3; DS4 bits per spec, unverified. Plan: ~/.claude/plans/let-s-try-the-6809-serene-penguin.md (approved 2026-09-28). \n\nSWEEP 2026-09-28 (new env pizero_padprobe, docs/BUILD.md), GameSir in Android mode: byte 2 = L2 01, R2 02, select 04, start 08, home 10, L3 20, R3 40; top face = byte 1 10; analog L2 in byte 9, R2 in byte 8. The M button is NOT a gamepad button: it sends a Print Screen keystroke (report ID 3, usage 0x46) from the pad's second interface, which the pad routing keeps off the keyboard path; a candidate trigger for PIZERO-165. The pad's Xbox-format report on interface 1 showed L3 40 / R3 80 in byte 2 and top 80 in byte 3, matching the standard layout. BUILT, awaiting hardware. gamepad.h split into decode (sticks, D-pad direction, a PAD_B_* button mask for 13 buttons; DS4 extra bits per its published layout, unverified) and pad_resolve (a struct pad_map from settings: fire, fire_right, none or a CoCo key per button; dpad = arrows presses arrow keys instead of moving the stick). Defaults reproduce the old fire buttons plus start = enter, top = space. main.cpp presses the pad's keys on the COCO_KEYS_PAD layer (PIZERO-163), redrawn only on change, cleared on unplug. key_translate.h gained kt_key_by_name/kt_key_name. Settings pad_<button> and dpad, also per game; the settings template now lists them (555 bytes: the overlay's and the test's 512-byte template buffers raised to 1 KB, and an 8-byte buffer that 'fire_right' overflowed was found and fixed before it shipped). 213 host tests. SETTINGS.md 'Gamepad buttons', README item 7. HARDWARE CHECK: Start types ENTER, top face types a space at the OK prompt; pad_select = break in settings.txt then Select stops a running program; dpad = arrows then the D-pad moves the BASIC cursor; a game started with its own key via a NAME.TXT.\n\nCONFIRMED ON HARDWARE 2026-09-28 (user): dpad = arrows works (the D-pad pressing CoCo arrow keys through the pad's key layer, set from settings.txt). Closed at ~80%: the default Start = ENTER and top = SPACE and a per-game NAME.TXT mapping were not individually reported, but use the same path. The DS4 identity's extra buttons remain unverified (never seen on this board).", "type": "feature", "status": "done", "priority": "high", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["gamepad", "settings", "input"], "theme": "input"}, {"id": "PIZERO-165", "summary": "Print Screen saves the screen as a PNG in /coco/screendumps on the SD card", "description": "User idea 2026-09-28: pressing Print Screen writes what is on the screen to a PNG file in /coco/screendumps/ on the microSD card.\n\nFACTS FOUND WHEN FILING: Print Screen is HID usage 0x46, unused today (not in overlay_keys.h or key_translate.h). The picture on the HDMI output is g_fb in src/main.cpp:208 (RGB565, FRAME_WIDTH x FRAME_HEIGHT = 320x240, with the CoCo's 256x192 active area centered; a second buffer in the double-buffered builds, main.cpp:213); it already includes artifact colors, a live GIME palette and any overlay card, so capturing g_fb captures exactly what the user sees. SD writes exist (coco_boot_save_text, src/coco_boot.cpp:290, FatFS).\n\nDESIGN NOTES, to settle when worked: (1) capture the 256x192 active area (or the full 320x240 with border; decide), as an 8-bit indexed PNG: the screen uses few colors (16-color palette plus artifact colors), so build the palette while scanning, and fall back to 24-bit if more than 256 appear; 256x192 indexed is 48 KB of pixels. (2) PNG encoder as a pure, host-tested header: IHDR/PLTE/IDAT/IEND, CRC-32 and Adler-32, deflate with STORED blocks (no compression library, no big buffers; a few hundred bytes of code; files ~49 KB), streamed row by row to the file so no 48 KB buffer is needed. Host test: encode a pattern and check it decodes with a reference zlib/PNG reader (python3 in the test script, or known CRCs). (3) File names: /coco/screendumps/SCR0001.PNG counting up (scan for the next free number, create the folder if missing); maybe the running game's name (g_game_path, PIZERO-154) as a prefix. (4) Pause the machine while writing, as the overlay does (g_audio_paused silence, no emulation), since an SD write of ~50 KB takes a noticeable fraction of a second; show a brief confirmation (a status line on the card, or just the serial log) and the file name. (5) Also available from the serial console, so a screenshot can be taken without a keyboard. (6) The overlay card is part of g_fb, so Print Screen with a list open captures the list, which is useful for documentation.\n\nCOMPLETION: Print Screen at the BASIC prompt and in a game each produce a PNG on the card that opens on a computer and matches the screen, including artifact colors.\n\n[2026-09-28 note from PIZERO-164] The GameSir pad's M button sends a Print Screen keystroke (HID usage 0x46, report ID 3) from its second interface. Consider accepting it as the screenshot trigger: a pad-only player could then take screenshots.\n\nBUILT 2026-09-28. Decisions taken: the whole 320x240 screen (border and overlay included), files SCR0001.PNG counting up (no game-name prefix yet). src/png_write.h: streaming 8-bit indexed PNG, zlib with stored deflate blocks, nibble-table CRC-32, Adler-32; 5 host tests (round trip through a test decoder incl. the 320x240 two-block case, the standard IEND CRC), and an independent check: a generated 320x240 PNG decodes with Python zlib (all CRCs good) and reads as PNG 320x240 in macOS sips. coco_boot_screenshot(): creates /coco/screendumps, next free SCRnnnn.PNG, palette built from the screen, streamed through a 512-byte buffer from heap memory (freed after; the double-buffered build has no static RAM to spare), watchdog fed per block. Triggers in main.cpp: USB Print Screen (0x46, works with the overlay open), the GameSir M button (Print Screen from the pad's second interface), Ctrl-P over serial. Taken after a frame is drawn, sound paused, pacing restarted. MEASURED ON HARDWARE via Ctrl-P: SCR0001.PNG 77,131 bytes, 212 ms; SCR0002.PNG 77,134 bytes, 207 ms. HARDWARE CHECK LEFT: Print Screen key and the pad's M button; open a PNG from the card on a computer and compare with the screen (artifact colors, an overlay list).\n\nCONFIRMED ON HARDWARE 2026-09-28 (user: 'screenshots work'). Closed at ~80%. Left for later if wanted: the running game's name as a file-name prefix, and an on-screen confirmation (today it is the serial [shot] line only).\n\n[2026-09-28 follow-up, user: 'screen capture should work in the overlay too'] Print Screen and the pad's M button already did (confirmed: SCR0008 was taken with the FILES list open). Ctrl-P over serial did not, because the serial pump is paused under the overlay; the overlay branch of loop() now takes a Ctrl-P waiting at the front of the serial queue without consuming other characters. Seen reaching the firmware with a list open (the save itself then failed with a disk error because the SD card had been removed, reported cleanly).", "type": "feature", "status": "done", "priority": "medium", "created": "2026-09-28", "updated": "2026-09-28", "tags": ["screenshot", "sd", "ui"], "theme": "ui"}, {"id": "PIZERO-166", "summary": "font setting: classic, 6847t1, or our 6847t2 (default) with a real caret, underscore and { | } ~", "description": "User request 2026-09-28: fix the emulated screen font so ^ looks like a caret, _ is not a left arrow, and curly braces exist; make the font set a setting with the older sets selectable; our own is the default, named 6847T2 for now.\n\nFINDINGS: the machine renders every alpha character through the T1 font's upper block ((ch & 0x3F) | 0x40, coco_machine.cpp render_alpha_frame), i.e. as a plain 6847: codes 0-63 are the INVERSE characters (BASIC's 'lower case' is inverse capitals), ^ is an up arrow and _ a left arrow, and there is no { | } ~. Upstream mc6847.c:470-497 and dragon.c:1216: on a real CoCo 2B the 6847T1's EXT line is PIA1 PB bit 4 (GM0); with EXT on (POKE 65314,16) the T1 indexes its font by the full 7-bit code, which gives true lower case and { | } ~ (T1 glyphs $01-$1E), all drawn with INV set. Programs use codes 0-63 deliberately for inverse title bars and highlights, so always-on lower case (option (a)) would change how they look; the user named the font and did not choose, so the recommended (b) was built: 6847t2 = 6847t1 behavior plus a real caret for ^ (T1 glyph $00) and underscore for _ (T1 glyph $1F) at all times. BASIC cannot type { } from the keyboard even on a real CoCo 2B (no key chord); they display from CHR$ and programs.\n\nSETTING: font = classic | 6847t1 | 6847t2 (default 6847t2), also per game (NAME.TXT). classic uses the original MC6847 font (lib/xroar_core/src/mc6847/font-6847.c, 768 bytes of flash, previously excluded from the build with a 1-byte stub in coco_machine.cpp).\n\nUser 2026-09-28: the choices are classic and 6847t1, with our 6847t2 the default. BUILT, awaiting hardware. vdg_pack.h vdg_alpha_glyph(ch, ext, font, &pair) (host-tested in test_vdg_pack, including checks against the real T1 glyph data: the underscore is one low bar, the caret sits in the top half, the braces mirror). coco_machine: font-6847.c now built (the 1-byte stub is gone), EXT taken from PIA1 PB bit 4 in coco_pia1b_postwrite, render_alpha_frame reads a 128-entry glyph/pair map rebuilt only when the font or EXT changes; coco_machine_set_font(). Setting font = classic | 6847t1 | 6847t2 in settings.h (tests), applied live, logged; SETTINGS.md row. HARDWARE CHECK: at the OK prompt PRINT \"^_\" shows a caret and an underscore (6847t2); POKE 65314,16 then PRINT CHR$(123);CHR$(125);\"abc\" shows { } and lower case; font = classic in settings.txt brings back the arrows; a game with inverse text looks unchanged.\n\nHARDWARE FINDING 2026-09-28 (user: 'the poke didn't work'): instrumented PIA1 port B in the [vdg] line (pb_writes, pb_last, lower). POKE 65314,16 typed at the prompt was undone at once: BASIC wrote the register about 110 more times, back to 00, while reading keys and printing. Inside a running program the POKE held (pb_last=10, lower=1) until a PRINT, which resets it too (Extended BASIC returns the VDG to text mode when it prints). We run the real ROM, so a real CoCo 2B behaves the same: its true lower case only survives in programs that write screen memory directly. DECISION (user): add lowercase = on | off (default off). With font = 6847t2 and lowercase = on, codes 0-31 always show as true lower case and { | } ~ (vdg_lower_case() in vdg_pack.h, host-tested); off keeps inverse text authentic. 6847t1 stays exactly like the chip. HARDWARE CHECK: lowercase = on in settings.txt, Ctrl-S; Caps Lock then typing shows real lower case at the prompt; PRINT CHR$(123);CHR$(125) shows { }.\n\nUSER RULE 2026-09-28: improvements default to on, so lowercase now defaults to on (6847t2 shows true lower case and { | } ~ out of the box); a game whose inverse text suffers gets l
