, "priority": "medium", "summary": "docs/kit.md: power & keyboard section -- supply sizing, power-bank gotcha, keyboard selection criteria", "tags": ["docs", "kit", "hardware", "power", "usb", "keyboard", "bom"], "created": "2026-08-26", "updated": "2026-08-26", "description": "WHY: docs/kit.md tells a recipient to use \"any phone charger\" (kit.md:32) and \"any simple wired USB keyboard\" and says nothing more. Both are underspecified in ways that produce silent, confusing failures -- an undersized supply or a power bank that switches itself off looks exactly like a dead unit, and a keyboard with a built-in hub is the most likely \"it just doesn't work\" report the PIZERO-91 kit will generate. Add a POWER & KEYBOARD section to docs/kit.md.\n\nWHAT THE SCHEMATIC ESTABLISHES (verified 2026-08-25 by reading docs/RP2350-PiZero-schematic.pdf; these are facts, not estimates):\n  * Main rail is a TMI3112H synchronous buck (1uH / 3.5A inductor, FB = 0.6V) -> 3V3. Grossly oversized for this load; the regulator is not the constraint.\n  * BOTH USB-C PORTS SIT ON ONE SHARED VBUS NET, reaching VSYS through an MBR230LSFT1G schottky. There is NO load switch and NO polyfuse on the host port -- a keyboard draws straight from the input supply, minus one diode drop. (Consistent with PIZERO-11b/PIZERO-51: VBUS is never switched, there is no software VBUS control.)\n  * Each port has 5.1K CC pulldowns (Rd, sink config), so the board presents as a legitimate 5V sink and C-to-C from a modern PD charger works -- it will not be starved.\n  * CONSEQUENCE WORTH PRINTING: because VBUS is one net, plugging power into the \"wrong\" Type-C still powers the board; it just leaves the keyboard nowhere to go. That is a friendlier failure than kit.md:120 (\"The two USB-C ports are different\") currently implies, and the gotcha card can say so.\n  * There is also an ETA6096 Li-ion charger and a BAT pad (R15 selects 1A / 2A / 2.5A charge current), so battery operation is a latent hardware option. NOT in scope for the kit; mention only if it stops the reader from wondering what the 2-pin connector is.\n\nWHAT IS NOT KNOWN: Waveshare publishes NO power-consumption figure for this board -- not on the wiki, not in the schematic. The figures below are ENGINEERING ESTIMATES for the pizero_stream_60 product build (252 MHz, both cores saturated, PIO+DMA shifting TMDS continuously). Label them as estimates in the doc until measured.\n\n  Board @ 3V3: RP2350B both cores ~100-130mA; TMDS drive into 4x 100R differential pairs ~40-60mA; SD card 20-100mA in burst during autorun only; LEDs/quiescent ~10mA. Total ~150-250mA @ 3V3, which through the buck at ~88% is ~120-190mA @ 5V -- call it 1W steady.\n  Keyboard @ 5V, added on top: basic wired membrane 20-50mA; 2.4GHz wireless dongle 30-100mA; unlit mechanical 50-100mA; white-backlit mechanical 150-350mA; RGB gaming board 300-500mA and spikier.\n  Worst realistic total ~0.7A @ 5V (~3.5W). Typical with a sane keyboard ~0.3A (~1.5W).\n\nRECOMMENDATIONS TO WRITE UP:\n  * SUPPLY: 5V / 2A (10W) minimum, 5V / 3A ideal. Any decent phone charger or PD brick. 1A technically works but leaves no headroom for a hungry keyboard plus inrush.\n  * POWER BANKS -- THE REAL GOTCHA. At ~1.5W many banks decide nothing is connected and shut off after 15-30 seconds. If battery operation is suggested at all, specify a bank with a low-current / trickle mode; otherwise do not suggest it. This belongs on the gotcha card, not buried in prose.\n  * KEYBOARD SELECTION CRITERIA: wired, dumb, no lighting, and -- most important -- NO BUILT-IN USB HUB OR PASSTHROUGH PORT. Pico-PIO-USB's hub support is the weak spot in that stack; a keyboard that enumerates as a hub with a HID device behind it is the likeliest hard failure. A plain 60%/65% wired membrane or an unlit mechanical is the safe pick and keeps the whole unit pocketable. A 2.4GHz wireless mini-keyboard is attractive (one endpoint, low draw, tiny) but MUST be tested -- the dongle has to present as a boot-protocol HID keyboard. This sits alongside the existing USB 1.1 / full-speed-only constraint already recorded in kit.md and README.md.\n\nMEASUREMENT LEFT AS A TODO FOR THE USER (hardware, cannot be done by an agent): put a USB-C inline power meter between the charger and the power port, boot the pizero_stream_60 build, and record three states -- idle at the BASIC prompt, running a game, and with the keyboard attached. That converts every estimate above into a measured figure. Write the section with the estimates and a clearly marked placeholder, then fill in the real numbers; do not block the doc on the measurement.\n\nRelated: PIZERO-91 owns docs/kit.md itself. This is filed separately rather than folded into it because PIZERO-91 is already large and its remaining scope is the case decision and the BOM.", "theme": "kit"}, {"id": "PIZERO-94", "summary": "3D-printable case: parametric OpenSCAD shell for the Waveshare RP2350-PiZero", "description": "WHY: docs/kit.md sec.5 plans off-the-shelf Pi Zero CNC shells (~$6) and notes they do NOT match this board's ports: two USB-C instead of micro-USB, plus a 2-pin BAT connector and a 3-pin debug header. kit.md already lists 'publish an STL once a printed design exists' as a follow-on. This ticket is that design.\n\nTOOLING: OpenSCAD 2021.01 is installed (/Applications/OpenSCAD-2021.01.app) and BambuStudio for slicing. Code-defined CAD, so the agent can author and render it headlessly and every dimension stays a named parameter. Files live in hardware/case/.\n\nREFERENCE GEOMETRY (Waveshare wiki dimension drawing, 800x400 px, scaled off the 65.00 mm callout; +/- ~0.2 mm, to be confirmed with calipers on a real board):\n  board outline 65.00 x 30.00 mm, same as a Raspberry Pi Zero\n  mounting holes dia 3.00 mm, Pi Zero pattern: 58 x 23 mm, 3.5 mm inset from each edge\n  bottom edge, measured from the left edge:\n    mini-HDMI   6.3 - 18.4 mm  (width ~12.0, centre ~12.35)\n    USB-C PIO   34.3 - 43.9 mm (width ~9.6,  centre ~39.1)  <- USB host / keyboard\n    USB-C power 48.8 - 58.4 mm (width ~9.6,  centre ~53.6)\n  left edge:  microSD slot ~9.0 - 19.2 mm from the top edge\n  right edge: 2-pin BAT JST ~6.4 - 15.6 mm from the top edge\n  top edge:   40-pin 2.54 mm header\nA Pi Zero puts its micro-USB ports at ~41.4 and ~54.0 mm, so the USB cutouts genuinely move.\n\nSTILL NEEDED (not derivable from a top-down drawing): PCB thickness, connector heights above the PCB, how far each connector overhangs the outline, header height, and tallest top-side component.\n\nSCOPE: parametric .scad source, rendered STLs, a fit-test coupon (ports and holes only, ~10 min print) before committing to a full shell, and a short hardware/case/README.md. Openings for BOOT and RUN, the microSD slot, and the 40-pin header are design decisions to settle with the user.\n\nDONE 2026-09-12. Confirmed on hardware: base and lid both print clean and no supports, board seats without force, case closes, ports line up, both buttons reachable through the vent slots. Case is 69.8 x 34.8 x 20.6 mm, four M2.5 x 12 countersunk screws. Source is hardware/case/pizero_case.scad, 493 lines and 78 parameters; STLs and a fit-test coupon render from it. Fourteen revisions, 578a84a..09d3767. Remainder filed as PIZERO-95, 96 and 97.", "type": "feature", "status": "done", "priority": "medium", "created": "2026-09-11", "updated": "2026-09-12", "tags": ["hardware", "case", "3d-print", "openscad", "kit", "mechanical"], "theme": "kit"}, {"id": "PIZERO-95", "summary": "docs/kit.md section 5: replace the CNC-shell plan with the printed case", "description": "WHY: kit.md sec.5 still says 'Current plan: off-the-shelf CNC aluminum shells (~$6), cutouts opened by hand' and lists 'publish an STL once a printed design exists' as a follow-on. That design now exists and is confirmed on hardware (PIZERO-94), so the section's premise is stale and its cost argument needs redoing.\n\nWHAT: point sec.5 at hardware/case, drop the file-the-cutouts-by-hand instructions, and revisit the buy-vs-print sums. The old break-even was ~40 cases against a printer you did not own; the printer now exists and the shells do not need modifying, which inverts the answer. Also update the fit note, which currently warns that Pi Zero shells do not match this board's ports.\n\nALSO: nothing outside hardware/ mentions the case at all. README has no pointer to it, so a visitor to the public repo will not know the case exists. Add a short 'Case' section to README linking hardware/case/README.md, and mention it in the 'What you need' list as an optional printed alternative to a bought shell.\n\n[2026-09-12 PART DONE: the README half is finished. Project README now carries a Case section before References, links hardware/case/README.md from it and from 'What you need', and warns that a stock Pi Zero shell fits the outline but not the ports. hardware/case/README.md gained an overview table, a 'Printing it' quick start and a 'How it was designed' section. REMAINING: docs/kit.md sec.5 still plans bought CNC shells with hand-filed cutouts and its buy-vs-print sums predate owning a printer.]\n\n[2026-09-12 DONE: kit.md sec.5 rewritten around the printed case. Bought CNC shells and the hand-filing budget are gone; the section now leads with hardware/case, carries a spec table, and states plainly what changed and why (the design and the printer both now exist, so the old ~40-case break-even no longer applies). Knock-on edits: sec.1 table row, sec.2 BOM line and total ($28 -> $23/unit, ~$230 for ten), sec.3 step 2 (no filing, but check BOOT access through the vents). Two honest gaps recorded in sec.5: the 40-pin header is enclosed rather than exposed, and the two USB-C ports are not labelled on the case.]", "type": "task", "status": "done", "priority": "medium", "created": "2026-09-12", "updated": "2026-09-12", "tags": ["3d-print", "bom", "case", "docs", "kit", "readme"], "theme": "kit"}, {"id": "PIZERO-96", "summary": "Case: countersink is 72.5 degrees, not the 90 a standard screw head wants", "description": "FOUND while speccing fasteners for PIZERO-94. screw_head_h is 1.5 mm across a 5.0 -> 2.8 mm taper, which is a 72.5 degree included angle. A standard DIN 965 M2.5 head is 90.\n\nEFFECT: the head seats 0.20 mm below the outer face, bearing on the rim of the countersink rather than across the cone face. It is flush, it does not rock, and it clamps fine, so the printed base is usable as it is. Line contact will dig into the plastic over many open/close cycles.\n\nFIX: screw_head_h 1.5 -> 1.1 makes it a true 90 degree cone. One line. Deliberately not applied yet, because it changes the base that is currently confirmed on hardware; fold it in whenever a base is reprinted for another reason.", "type": "bug", "status": "open", "priority": "low", "created": "2026-09-12", "updated": "2026-09-12", "tags": ["hardware", "case", "3d-print", "openscad", "fasteners"], "theme": "kit"}, {"id": "PIZERO-97", "summary": "Case: [?] parameters are still estimates, never measured against a board", "description": "PCB thickness, USB-C and microSD connector heights, plug overmould sizes and the base relief depth are all still marked [?] in hardware/case/pizero_case.scad: estimates that were never checked with calipers. Everything fits, so they are right enough, but nobody knows by how much margin.\n\nWHY IT MATTERS: the margins are invisible until a supplier changes a connector or the case is adapted to another board, at which point a wrong estimate reads as a mystery fit problem. Measuring them converts luck into knowledge.\n\nHOW: the base wall rim sits exactly at the PCB top surface by design, so with a board seated the rim is a z-zero datum to measure connector heights against. Re-mark each parameter [M] once measured.", "type": "task", "status": "open", "priority": "low", "created": "2026-09-12", "updated": "2026-09-12", "tags": ["hardware", "case", "3d-print", "openscad", "measurement"], "theme": "kit"}, {"id": "PIZERO-98", "summary": "Prove it runs 25 hours unattended: freezes and video dropouts per hour", "description": "WHY: this board is regarded as the most stable of the RP2350 XRoar ports in everyday use, but no long run has ever been recorded here. There is no soak, no video-dropout counter, and PIZERO-33's persistent freeze counter has never caught a real freeze. The sibling Fruit Jam port has a measured 25-hour baseline of 7.6 video dropouts per hour, each about 1 s of black (its README, FRUITJAM-56/58). Until this board is measured the same way, \"more stable\" is an impression rather than a figure, and it is the figure the friends-and-family kit (docs/kit.md) rests on. Raised by the 2026-09-14 cross-port comparison (xroar-adafruit-rp2350-fruit-jam/docs/rp2350-port-comparison.html).\n\nDO:\n(1) Flash the default pizero_stream_60 env and start from a COLD power-on. A dev-tool reboot can leave freezes=1 residue (PIZERO-33).\n(2) Log serial for at least 25 hours with wall-clock timestamps. The Fruit Jam port's scripts/serial_logger.py survives reboots and can be copied. Kill any previous logger first: two readers on one port produce \"device reports readiness to read but returned no data\", which reads exactly like a board fault.\n(3) Record freezes=N and last phase, fps and cpu from the [run] line. The watchdog only sees core-0 hangs, so also sample the frame count on a fixed interval (Fruit Jam uses 150 ms) to catch a video fault while the emulator keeps running. Log on an interval, never only on change, so a quiet log cannot be confused with a dead probe.\n(4) Keep a USB keyboard attached, since PIZERO-11b/31 attribute earlier freezes to USB-host load. If any freeze appears, run a second arm without the keyboard.\n(5) Confirm the probe strings are in the flashed binary (strings on firmware.elf) before believing a zero.\n\nCOMPLETION CONDITION: freezes per hour and video-fault episodes per hour over at least 25 h, recorded here and in the README, stated against Fruit Jam's 7.6/hr. Zero is a valid result and would let PIZERO-33 close. Run in the same session as PIZERO-88 so the re-baselined frame budget comes from the same build.\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"25-hour soak of pizero_stream_60: freezes per hour and video faults per hour, comparable with Fruit Jam's 7.6/hr\"]", "type": "task", "status": "open", "priority": "high", "created": "2026-09-14", "updated": "2026-09-17", "tags": ["stability", "measurement", "kit"], "theme": "trust"}, {"id": "PIZERO-99", "summary": "Picture locks on other people's TVs, not just the one development monitor", "description": "The default pizero_stream_60 timing is 800x525 at 25.2 MHz with horizontal blanking split 8/96/56 (front porch / sync / back porch), narrowed from the standard to make room for HDMI audio data islands (PIZERO-44/45). It has only been validated on the one development monitor, and that monitor ignores HDMI audio clock regeneration (PIZERO-32), so it is also a lenient test of the audio packets. docs/kit.md plans a batch of about ten units for other people, who will plug them into TVs and monitors nobody here has tried.\n\nDO: try at least three further sinks, ideally including a TV and an HDMI capture device or cheap HDMI adapter, which tend to be the least tolerant of off-standard blanking. For each, record: does it lock, time to lock, any edge rolling or shimmer, whether audio plays, whether pitch matches desktop XRoar (the ACR question in PIZERO-32), and behaviour after a cold boot and after switching the sink's input away and back.\n\nCOMPLETION CONDITION: a compatibility table in docs/kit.md (or the README) listing every sink tried and its result. A sink that rejects the timing becomes its own bug naming the model; do not hold this issue open for it. Revisit trigger for PIZERO-32: any sink that honours ACR and plays at a different pitch. Raised by the 2026-09-14 cross-port comparison (xroar-adafruit-rp2350-fruit-jam/docs/rp2350-port-comparison.html).\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"60 Hz timing (8 px front porch, 56 px back porch) has only been verified on one monitor: test more sinks before kits ship\"]", "type": "task", "status": "open", "priority": "medium", "created": "2026-09-14", "updated": "2026-09-17", "tags": ["display", "hdmi", "kit"], "theme": "trust"}, {"id": "PIZERO-100", "summary": "Renderer draws $0400 when the SAM display base is legitimately $0000 (bug shared by all four RP2350 ports)", "description": "lib/coco_machine/src/coco_machine.cpp:522 and :1077 compute 'const uint16_t base = g_m.sam_f ? g_m.sam_f : 0x0400;'. Zero is treated as \"never set\", so a program that clears every SAM F bit to put the display at $0000 has $0400 drawn instead.\n\nThe identical line is in all four RP2350 XRoar ports: the AMOLED port (filed as AMOLED-70, open, high, inferred from source and not yet confirmed on hardware), the Fruit Jam (FRUITJAM-108) and the 4.3B (flagged by its uncommitted COCO-68 diagnostics). This glue descends from the AMOLED port.\n\nIMPACT: probably rare, since BASIC and most software never place the display at $0000. The fallback presumably exists because SAM F reads 0 before BASIC initialises it, so a fix must not show a frame of $0000 garbage at boot: track whether F has been written, or start sam_f at the reset state desktop XRoar uses.\n\nCOMPLETION CONDITION: confirmed on hardware (clear the F bits with POKEs to $FFC6-$FFD3 in a graphics mode) and fixed, or shown not to occur, with the result noted in AMOLED-70 so the other ports can take the same fix. Found during the 2026-09-14 cross-port comparison (xroar-adafruit-rp2350-fruit-jam/docs/rp2350-port-comparison.html).", "type": "bug", "status": "open", "priority": "low", "created": "2026-09-14", "updated": "2026-09-14", "tags": ["vdg", "video", "emulation"], "theme": "trust"}, {"id": "PIZERO-101", "summary": "Case style pass: base vents, 5 mm corners, rounded port openings, 2 mm groove loop on the lid", "description": "User feedback on the PIZERO-94 case, which works on hardware; changes are stylistic.\n\n1. BASE VENTS: same slots as the lid (3 mm wide, 3 mm rib, 6 mm pitch, rounded ends) cut through the floor, running front to back. Two banks of four, 6 mm gap between banks, centred on the board.\n2. CORNERS: outer vertical corner radius 4 -> 5 mm. Inner cavity radius stays 2 mm so board fit cannot change. Top edge stays a chamfer (a 5 mm fillet would break through the wall/roof).\n3. PORT CORNERS: round the visible corners of the front port openings and plug pockets (HDMI, both USB-C).\n4. GROOVES: widen from 0.5 to 2 mm (depth stays 0.6). Instead of running off the side walls, join front and back grooves with front-to-back legs near the left and right edges, just inside the top chamfer, with rounded corners: one closed loop outlining the top (user chose option (a)).\n\nDONE WHEN: rendered, printed, and user confirms on hardware.\n\n[2026-09-15 REV 2 after viewing rev 1 in the slicer: user happy with vents, port corners and vertical corners. Two changes. (a) Groove: legs move off the top onto the left and right side walls; front and back grooves wrap over the edge and down the sides, joined by a front-to-back leg with the rounded corners on the side face. (b) Top edge: the 1 mm chamfer becomes a 5 mm round matching the vertical corners; the cavity top is rounded 3 mm to keep the shell about 2 mm thick. Print note: roof-down, the bottom ~1.5 mm of the round is a shallow overhang at the bed.]\n\n[2026-09-15 REV 3: user confirmed rev 2 groove and edges are as asked. Battery connector opening (right wall, opposite microSD) tightened: right edge seen from outside pulled in 1 mm (bat_y1 23.6 -> 22.6), top lowered 0.5 mm (bat_oh 6.0 -> 5.5). Groove leg re-anchored to the top round so it does not move.]\n\n[2026-09-15 REV 4: top grooves must sit at least 5 mm from the front and back edges (off the rounds), and the roof grille must be centred front to back. Four rows plus two grooves do not fit the 24.8 mm of flat roof, so user chose three rows. Now 3.0 mm slots on a 5.0 mm pitch at y 10/15/20, grooves at y 6.5 and 23.5 (7.9 mm from the edges), slot length unchanged at 20.8. No pitch centres both buttons with a centred grille; 5 mm gives each 0.65 mm of plunger under open slot (was 1.25). Paperclip test needed on the print. Base floor vents unchanged.]\n\n[2026-09-15 REV 5: grooves back to 1 mm wide; roof slots 1 mm wide so more fit. User chose option A of three spacings: five rows on a 3.33 mm pitch (a third of the RUN to BOOT distance, 2.33 mm rib), centred, rows 2 and 5 within 0.07 mm of BOOT and RUN (1.18 mm of plunger open). Grooves at y 5.83 and 24.17. Base floor vents unchanged (own 3 mm slot width).]\n\n[2026-09-15 REV 6: base floor vents match the roof: 1 mm slots on the 3.33 mm pitch, seven per bank, same 21 mm footprint as before.]\n\n[2026-09-15 REV 7: rev 6 printed badly on the 5 mm 3D-rounded top edges. Top edge back to the crisp 1 mm chamfer (top_r = 0); vertical 5 mm corners kept. Groove no longer wraps down the sides: user now prefers it on the roof as a closed 1 mm loop 3 mm clear of the vent slots on all sides (groove_hug).]\n\n[2026-09-15 REV 8: 1 mm chamfer added to the base's bottom outer edge (bottom_chamfer), matching the lid's top chamfer.]\n\n[2026-09-16 DONE: printed at ff24eb7 (revs 1-8 plus the PIZERO-103 microSD channel) and confirmed by the user: \"that print turned out pretty ok. the closed one.\" Delivered: floor vents matching the roof, 5 mm vertical corners, rounded port openings, 1 mm crisp top chamfer (the 5 mm 3D-rounded top edge of rev 6 printed badly and was reverted), 1 mm groove loop hugging the grille 3 mm clear of the slots, 1 mm slots on a 3.33 mm pitch on roof and floor, 1 mm bottom chamfer. NOT verified and filed as PIZERO-104: paperclip access to RUN and BOOT through the narrower 1 mm slots. The PIZERO-102 header lid keeps its own open issue.]", "type": "feature", "status": "done", "priority": "low", "created": "2026-09-14", "updated": "2026-09-16", "tags": ["hardware", "case", "3d-print", "openscad", "style"], "theme": "kit"}, {"id": "PIZERO-102", "summary": "Alternate case lid with an opening over the 40-pin header, plugged by a printed cover when unused", "description": "An alternate top for the PIZERO-94/101 case that exposes the 40-pin GPIO header, so a 2x20 female connector can be pushed on without a struggle. The base and the standard lid stay as they are; this is a second lid variant rendered from the same pizero_case.scad (part=\"top_header\"). The user already has a small printed cover that will sit in the opening when nothing is connected, so the opening must also suit that cover.\n\nCONSTRAINTS FOUND: the header sits right against the back wall, so the opening lands between the back row of vent slots and the back wall, cuts through the back arm of the groove loop, and is boxed in left to right by the two back screw bosses (about 52 mm clear between them).\n\nDONE WHEN: opening size agreed (connector type and cover dimensions), grille/groove layout adjusted to suit, rendered, printed, a connector plugs on and the cover fits, confirmed by the user on hardware.", "type": "feature", "status": "open", "priority": "low", "created": "2026-09-15", "updated": "2026-09-15", "tags": ["hardware", "case", "3d-print", "openscad", "gpio"], "theme": "kit"}, {"id": "PIZERO-103", "summary": "A microSD card goes in easily, stays in, and can be pulled back out", "description": "User report on the printed case: inserting a microSD card is unreliable. Sometimes the card goes right inside the case and misses the reader entirely; other times it will not enter the reader because it catches on the sides. The thumb dish cut into the base (sd_scoop straddles the split line) is unnecessary. The lid's slot and dish need to line up better with the actual socket.\n\nDO: (1) re-derive the socket's card-entry position (y extent and height above the PCB) from the Waveshare dimension drawing, schematic/socket part, and board photos, replacing the sd_y0/sd_y1/sd_oh estimates; (2) remove the dish from the base; (3) resize and re-centre the lid slot on the socket mouth; (4) add internal guides between the wall and the socket, a funnel that narrows to the socket mouth in width and height, so the card cannot ride over the socket or catch its edges.\n\nDONE WHEN: rendered, printed, and a card inserts and ejects reliably, confirmed by the user on hardware. Applies to both the standard lid and the PIZERO-102 header lid.\n\n[2026-09-15 FINDINGS: socket is XunPu TF-110 (LCSC C266613): housing 11.95 W x 11.55 D x 1.32 H, latched card tail 3.90 mm out of the housing. Waveshare drawing puts the housing at y 10.9..22.9, front x 0.5; card y 11.4..22.4. Old slot y 9.8..21.5 was 1.2 mm forward (card caught on the back edge) and 2.5 mm tall (card could ride over the socket). FIX: channel 11.6 x 1.3 centred y 16.9, guide block on the inner wall face to 0.4 mm short of the housing, flared outer mouth, dish lid-only. Base no longer cut.]\n\n[2026-09-16 PRINTED: card now goes in easily and stays in; user credits the side/bottom guide block. Two things left: the card latches FLUSH with the outer wall, and the round dish is too shallow to grip it. REV 2: (a) sd_front_x corrected 0.5 -> 1.5 [M] (flush card + 3.90 mm tail means the housing sits 1 mm further in than the drawing), so the guide block grows from 0.5 to 1.5 mm long; (b) finger relief 18 x 5 x 1.2 deep cut into the outer wall around the mouth in BOTH halves, replacing the dish, leaving the card 1.2 mm proud with a recess to pinch. Considered and rejected: shortening that edge, which caps at 1.0 mm on a 2 mm wall and shortens the channel.]\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"microSD fit in the case: drop the base dish, re-align the lid slot to the socket, add card guides\"]", "type": "bug", "status": "open", "priority": "medium", "created": "2026-09-15", "updated": "2026-09-17", "tags": ["hardware", "case", "3d-print", "openscad", "microsd"], "theme": "kit"}, {"id": "PIZERO-104", "summary": "Verify paperclip access to RUN and BOOT through the 1 mm roof vent slots", "description": "Left over from PIZERO-101. The roof grille went from 3.0 mm slots to 1.0 mm slots on a 3.33 mm pitch (rev 5), which is what lets five rows fit between the grooves. Geometrically both buttons are well covered: rows 2 and 5 land within 0.07 mm of BOOT and RUN, with 1.18 mm of each 1.5 mm plunger under open slot (the model echoes this, _check_button in hardware/case/pizero_case.scad). But a 1 mm slot prints nearer 0.8 mm, and the 1.5 mm plunger diameter is itself inferred, not measured. Nobody has tried to press either button through a printed lid.\n\nDO: with the case assembled, press RUN and BOOT through the grille with a paperclip or similar. If they cannot be reached, options in order of preference: widen just the two rows over the buttons; raise vent_w for the whole grille; or re-enable buttons_open for two 3 mm holes.\n\nCOMPLETION CONDITION: user confirms both buttons can be pressed through the assembled case, or the grille is changed until they can.", "type": "task", "status": "open", "priority": "low", "created": "2026-09-16", "updated": "2026-09-16", "tags": ["hardware", "case", "3d-print", "openscad"], "theme": "kit"}, {"id": "PIZERO-105", "summary": "Engrave a per-part version inside each case STL so a printed part maps to a revision", "description": "Printed parts accumulate and become indistinguishable: several revisions of the lid look alike in the hand. Each part now carries its own version string, engraved on a face that is inside the assembled case, so it is readable before assembly and hidden after.\n\nWHERE: base, on the floor between the two banks of floor vents (x 32.5, y 15, the 6 mm gap). Lid, on the roof underside, centred on the two USB ports (x 46.35) at y 2.2, in front of the groove loop; mirrored in the model so it reads correctly when looking up at the inside.\n\nHOW: ver_base / ver_top / ver_top_header in hardware/case/pizero_case.scad, engraved ver_d (0.5 mm) deep at ver_size (3.0 mm), font Liberation Sans Bold. Bump the number when that part's geometry changes and note what changed in hardware/case/README.md. ver_show = false drops the text.\n\nSTARTING POINT: BASE v9 / TOP v9 (PIZERO-101 rev 8 plus the PIZERO-103 microSD rev 2), TOP-HDR v1 (the PIZERO-102 draft).\n\nDONE WHEN: printed and the version is legible on both parts, confirmed by the user.\n\n[2026-09-16 IMPLEMENTED, awaiting a print. Engraving verified in renders from unambiguous top views: base reads BASE v9 bottom-to-top in the vent gap; lid reads TOP v9 when held cavity-up. Note for anyone editing ver_lid_cut: the lid text needs mirror([0,1,0]), a VERTICAL pre-flip, because the roof-down print orientation is a 180 degree rotation about x. mirror([1,0,0]) was tried first and is wrong. Judge this only from a camera whose up-vector is unambiguous: a straight-down OpenSCAD gimbal view can render as a bottom view and reverses the apparent handedness.]", "type": "feature", "status": "open", "priority": "low", "created": "2026-09-16", "updated": "2026-09-16", "tags": ["hardware", "case", "3d-print", "openscad"], "theme": "kit"}, {"id": "PIZERO-106", "summary": "issues.html: 225 tag pills bury the results, so lead with the most-used tags", "description": "Reported by the user: \"there are way too many tags filtered that i can't see any results\". The tracker has 225 unique tags across 104 issues, 134 of them used exactly once, and the page rendered a pill for every one. The filtering itself was never broken (a headless render confirms all 104 cards are present, and tag filters are OR-ed, inactive when none is selected); the pill row was simply taller than the viewport, so the results sat below the fold.\n\nFIX in tools/issues_html.py: order tags by frequency, show the top TAG_PILL_LIMIT (20) with their counts, and keep the long tail behind a '+N more' toggle. Status and type rows are unaffected.\n\nDONE WHEN: the page opens with results visible without scrolling past the filters, confirmed by the user. The same fix is worth carrying back to the skill's own copy of the generator at ~/.claude/skills/issues/scripts/issues_html.py, which is outside this repo.\n\n[2026-09-16 FIXED in tools/issues_html.py: TAG_PILL_LIMIT = 20, tags ordered by frequency with counts, long tail behind a '+N more' toggle (.morebtn, its own click handler so the pill handler is unaffected). Awaiting the user's confirmation in a browser.]\n\n[2026-09-16 Carried back to the skill's own copy at ~/.claude/skills/issues/scripts/issues_html.py (backup alongside it as .bak-20260916), which was otherwise identical to this project's copy, so every project that uses the skill gets the fix. Verified it still builds from the skill copy.]", "type": "bug", "status": "open", "priority": "medium", "created": "2026-09-16", "updated": "2026-09-16", "tags": ["tooling", "issues", "docs"], "theme": "platform"}, {"id": "PIZERO-107", "summary": "Backlog triage: group every issue under one of seven themes and park the idea-stage work", "description": "The tracker had grown to 106 issues, 69 of them live, with no structure: 225 free-form tags, summaries written for the implementer rather than the owner, and no statement of what 'done enough' means. At a glance it was impossible to tell a two-hour fix from a multi-month programme, so verification work competed with new features and lost.\n\nMOVE 1 (this issue): every issue carries exactly one theme field from a fixed vocabulary, and issues.html filters and labels by it. Themes: trust (does it work, provably), kit (handing it to other people), input, experience (how the machine feels to use), storage (the VFS/hypercall replatform), devices (new video/audio hardware the CoCo never had), platform (the core port and its plumbing).\n\nMOVE 2 (this issue): idea-stage low-priority issues move to status deferred, each with an explicit revisit trigger, so the live list states intent honestly. Deferring is reversible and loses nothing: the ticket and its reasoning stay.\n\nSTILL TO DECIDE (moves 3 and 4, deliberately not done here): a vetting milestone with a declared finish line, a ranked roadmap.jsonl, and rewriting the summaries of the issues that stay visible in terms of what the user gets. Free-form tags are left alone for now; theme is the new axis.\n\n[2026-09-17 DONE. Moves 1 and 2 shipped in 2f946eb: all 107 issues themed, 17 idea-stage issues deferred with revisit triggers, issues.html filtering by theme. Move 4 done in part here: the eleven issues that stay visible on the roadmap were rewritten to say what they deliver, with the previous wording preserved in each description. Move 3 (a declared vetting milestone) is now expressed as the ranked roadmap.jsonl rather than a separate ticket.]", "type": "chore", "status": "done", "priority": "medium", "created": "2026-09-16", "updated": "2026-09-17", "tags": ["tooling", "issues", "process"], "theme": "platform"}, {"id": "PIZERO-108", "summary": "Soak harness and a permanent measurement archive, so runs can be compared build to build", "description": "The [run] telemetry line already carries everything the reliability goals need (fps, per-phase cpu/render/blit/audio times, USB line state and report counts, freeze count and the phase it froze in, audio ring fill/skips/underruns), but nothing captures it. Measurements live in issue comments and die there.\n\nDO: (1) scripts/soak.py reads the serial port, timestamps every [run] line, survives board reboots, and writes raw CSV plus a summary; kill any previous reader first, two readers on one port produce a fake fault. (2) It computes the rates the goals are stated in: fps windows outside 59.9-60.1, audio underruns and skips per hour, freeze count and last phase, USB disconnect events. (3) docs/measurements/*.jsonl keeps one record per run: date, git hash, PlatformIO env, metric, value, plus a README describing the schema. Benchmarks may be deleted later; their numbers must not be.\n\nWHY FIRST: PIZERO-98 cannot start without it, and every performance argument after this one wants a baseline to compare against.\n\nCOMPLETION CONDITION: a 30-minute trial run produces a record in docs/measurements and a readable summary.", "type": "task", "status": "open", "priority": "high", "created": "2026-09-17", "updated": "2026-09-17", "tags": ["testing", "measurement"], "theme": "trust"}, {"id": "PIZERO-109", "summary": "Unit tests on the laptop for the logic we wrote, so a bad edit fails in seconds", "description": "XRoar's own core is trusted as-is; what needs tests is the glue this port added. No tests exist today and there is no native build.\n\nDO: a PlatformIO [env:native] with Unity, running on the development machine, no board. First targets, chosen because they are pure functions with checkable outputs: (1) HDMI packet builders, ACR N/CTS pairs, AVI and audio InfoFrames, BCH parity and TERC4 encoding, against golden vectors from the spec; (2) the cross-core audio ring's fill/skip/underrun accounting, including wrap and overflow; (3) HID usage to CoCo matrix mapping, which PIZERO-49 is about to extend; (4) VDG address arithmetic, including the SAM display base case that is PIZERO-100 (that bug is four lines of test).\n\nCOST, STATED HONESTLY: this logic currently lives inside src/main.cpp (68 KB) and coco_machine.cpp. Testing it means extracting it. Extract only what a test touches, one module at a time; do not start with a refactor.\n\nCOMPLETION CONDITION: `pio test -e native` runs green in CI-less local use, with at least the four targets above covered.", "type": "task", "status": "open", "priority": "high", "created": "2026-09-17", "updated": "2026-09-17", "tags": ["testing", "measurement"], "theme": "trust"}, {"id": "PIZERO-110", "summary": "A self-test build the board runs on demand, printing PASS or FAIL for each check", "description": "Unit tests on the laptop cannot see timing, DMA, or hardware. The goals that matter most (60 Hz uptime, continuous audio, no sync drops, no crash) are properties of the running board.\n\nDO: [env:pizero_selftest], a firmware build that runs a fixed sequence and prints machine-readable results over CDC, driven by a host script so it can be repeated per build: ROM load from SD; SD read-back integrity; DVI lock and measured fps over a window; audio ring health after N frames (no underruns once primed); watchdog fires and recovers; USB enumerate, and replug if a device is present. Each check prints PASS or FAIL with the measured number, never just PASS.\n\nDEPENDS ON PIZERO-108 for the measurement record format, so self-test results land in the same archive.\n\nCOMPLETION CONDITION: one command flashes, runs and reports, and its output is archived like a soak run.", "type": "task", "status": "open", "priority": "medium", "created": "2026-09-17", "updated": "2026-09-17", "tags": ["testing", "measurement"], "theme": "trust"}, {"id": "PIZERO-111", "summary": "Decide which CoCo 3 graphics modes this chip can actually drive, before promising any", "description": "CoCo 3 support is a stated goal, but the honest answer to 'can it?' is mode by mode, and nobody has done the arithmetic. The 6809 and the MMU are not the question; RAM and scanout bandwidth are.\n\nDO: for each GIME mode, work out the framebuffer bytes at 512 KB guest RAM, the per-frame blit cost into the 320x240 RGB565 buffer this port scans out, and whether libdvi at 252 MHz can carry it at 60 Hz. Compare against the measured core-0 budget from PIZERO-88. Say plainly which modes are reachable, which are reachable only at reduced refresh or colour depth, and which are not reachable at all.\n\nEXPECTATION TO TEST, NOT ASSUME: the 320-wide 16-colour modes look reachable and 640-wide 16-colour looks like the wall. That is instinct, and instinct is what this ticket exists to replace.\n\nCOMPLETION CONDITION: a table in docs/ of GIME mode against verdict and the numbers behind it, and a decision on whether CoCo 3 becomes a programme or stays an aspiration. Depends on PIZERO-88.", "type": "decision", "status": "open", "priority": "medium", "created": "2026-09-17", "updated": "2026-09-17", "tags": ["coco3", "video"], "theme": "coco3"}, {"id": "PIZERO-113", "summary": "Prove a card survives power loss mid-write, before anything writes to it", "description": "Goal 5 is no data loss. Today nothing writes to the card, so the goal is vacuously met and completely untested. The moment PIZERO-64/65 land, it stops being vacuous.\n\nDO, alongside the write path rather than after it: a write-integrity corpus (write known files, checksum them back across remount and reboot) and a power-cut test (pull power during a write, repeatedly, and verify the filesystem and the untouched files survive). Record failures per hundred cuts in the PIZERO-108 archive.\n\nWHY IT IS FILED NOW: writing the test with the write path is cheap, and retrofitting it after a corruption report is not. This ticket is the acceptance gate for PIZERO-64 and PIZERO-65, not an afterthought.\n\nCOMPLETION CONDITION: the corpus passes, and a hundred power cuts during writes leave no corrupted filesystem.", "type": "task", "status": "open", "priority": "high", "created": "2026-09-17", "updated": "2026-09-17", "tags": ["sd", "write", "testing"], "theme": "storage"}], "roadmap": [{"rank": 1, "id": "PIZERO-108", "why": "The instrument, before the measurements. PIZERO-98 cannot start without it, and every later performance claim needs a baseline to compare against. Cheap: the telemetry already exists, nothing captures it.", "added": "2026-09-17"}, {"rank": 2, "id": "PIZERO-98", "why": "The headline number for goals 1-4: hours of continuous 60 Hz, dropouts and freezes per hour. Closes PIZERO-33 either way, with a clean run or with the root-cause evidence it was built to catch.", "added": "2026-09-17"}, {"rank": 3, "id": "PIZERO-51", "why": "The worst daily-use defect: a device pulled out is invisible, so nothing works until reboot. Also the leading freeze suspect, so it is on the critical path for goal 4, not just for USB comfort.", "added": "2026-09-17"}, {"rank": 4, "id": "PIZERO-109", "why": "Runs on the laptop in seconds and protects the audio and HDMI packet logic behind goals 2 and 3. PIZERO-100 is a four-line test we never had. Forces extraction from main.cpp, which is the point.", "added": "2026-09-17"}, {"rank": 5, "id": "PIZERO-92", "why": "The first-run experience for anyone handed a kit: a missing ROM currently shows a black screen with no explanation. Small, self-contained, and it is what makes the kit survivable without you on the phone.", "added": "2026-09-17"}, {"rank": 6, "id": "PIZERO-99", "why": "Goal 3 on other people's screens. The 60 Hz timing has narrowed porches and has only ever been proven on one lenient monitor. Gates the kit batch; a sink that refuses it is a bug we want now, not after shipping.", "added": "2026-09-17"}, {"rank": 7, "id": "PIZERO-103", "why": "The case is critical for the first edition and this is the last known defect in it: the card is flush and hard to grip. Batched with PIZERO-104 and PIZERO-105 into one print, which should close three tickets at once.", "added": "2026-09-17"}, {"rank": 8, "id": "PIZERO-88", "why": "How much frame time is actually left at 60 Hz, USB and keyboard included. Every design decision after this (CoCo 3 modes, overlay, hub support) is arithmetic against this number, and the current figure predates both audio and 60 Hz.", "added": "2026-09-17"}, {"rank": 9, "id": "PIZERO-110", "why": "Turns the vetting from a one-off event into something every build can repeat. Depends on PIZERO-108 for the record format, so it follows rather than leads.", "added": "2026-09-17"}, {"rank": 10, "id": "PIZERO-41", "why": "Goal 2 is continuous sound; this is sound that is also correct. Pitch and tone against desktop XRoar, with the ACR question in PIZERO-32 riding along.", "added": "2026-09-17"}, {"rank": 11, "id": "PIZERO-52", "why": "Deliberately ranked below reliability, per the stated priority. Reshaped from a compatibility checklist into diagnosing why a title fails, which is the only form that produces fixable bugs.", "added": "2026-09-17"}, {"rank": 12, "id": "PIZERO-111", "why": "Answers whether CoCo 3 is a programme or an aspiration, in numbers rather than instinct. Needs PIZERO-88 first, which is why it sits here and not earlier.", "added": "2026-09-17"}, {"rank": 13, "id": "PIZERO-81a", "why": "The experience bet, first slice. Starts only once the vetting above is done: this is the point where new features resume. The storage replatform (PIZERO-70 to 74) stays off this list entirely until then, and PIZERO-113 is its acceptance gate when it does start.", "added": "2026-09-17"}]}</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  var TAG_PILL_LIMIT = 20;   // the rest hide behind a "+N more" toggle
  // Themes are the coarse grouping: one per issue, from a fixed vocabulary,
  // unlike the free-form tags. Order is the order they are worked in.
  var THEME_ORDER = ['trust', 'kit', 'input', 'experience', 'platform', 'storage', 'devices'];
  var LIVE = ['open', 'in-progress'];
  var KEY = 'issues-view:' + location.pathname;
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|md|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|sh|toml|ya?ml|cfg|ini|txt|bas|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [], theme: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.dataset.theme = i.theme || '';
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
        (i.theme ? '<span class="chip th">' + esc(i.theme) + '</span>' : '') +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  // The roadmap stores only rank, id and why. Everything shown here is joined
  // from the tracker, so an entry pointing at a missing or finished issue is
  // visibly wrong rather than quietly stale.
  function drawRoadmap(plan, byId) {
    if (!plan.length) return;
    var host = document.getElementById('plan');
    plan.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (e) {
        var issue = byId[e.id];
        var li = document.createElement('li');
        li.className = 'step';
        var head, warn = '';
        if (!issue) {
          head = '#' + esc(e.id) + ' is not in the tracker';
          warn = 'no such issue';
          li.className += ' bad';
        } else {
          head = '<a href="#i' + esc(e.id) + '">#' + esc(e.id) + ' ' +
                 esc(summaryOf(issue)) + '</a> <span class="chip st-' +
                 esc(issue.status) + '">' + esc(issue.status) + '</span>';
          if (LIVE.indexOf(issue.status) === -1) {
            warn = 'already ' + issue.status + ', take it off the roadmap';
            li.className += ' bad';
          }
        }
        li.innerHTML = '<span class="rank">' + esc(e.rank || '?') + '.</span>' +
          '<span class="what">' + head +
          '<span class="why">' + esc(e.why || '') + '</span>' +
          (warn ? '<span class="warn">' + esc(warn) + '</span>' : '') + '</span>';
        var link = li.querySelector('a');
        if (link) {
          link.addEventListener('click', function () {
            var target = document.getElementById('i' + e.id);
            if (target) { target.hidden = false; setOpen(target, true); }
          });
        }
        host.appendChild(li);
      });
    document.getElementById('roadmap').hidden = false;
  }

  function pills(host, filter, values, counts, limit) {
    var hidden = (limit && values.length > limit) ? values.length - limit : 0;
    document.getElementById(host).innerHTML = values.map(function (v, idx) {
      var extra = hidden && idx >= limit;
      return '<button class="pill' + (extra ? ' extra' : '') + '"' +
        (extra ? ' hidden' : '') +
        ' data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('') + (hidden
      ? '<button class="morebtn" data-host="' + host + '">+' + hidden + ' more</button>'
      : '');
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.theme.length || active.theme.indexOf(el.dataset.theme) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, plan, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {}, byId = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) {
      counts[i.status] = (counts[i.status] || 0) + 1;
      byId[i.id] = i;
    });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });
    drawRoadmap(plan || [], byId);

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));

    var themeCounts = {};
    issues.forEach(function (i) {
      if (i.theme) themeCounts[i.theme] = (themeCounts[i.theme] || 0) + 1;
    });
    var themes = THEME_ORDER.filter(function (t) { return themeCounts[t]; })
      .concat(Object.keys(themeCounts).filter(function (t) {
        return THEME_ORDER.indexOf(t) === -1;
      }).sort());
    document.getElementById('f-theme').parentNode.hidden = !themes.length;
    pills('f-theme', 'theme', themes, themeCounts);
    // A project can accumulate hundreds of tags, most of them used once.
    // Showing every one buries the results, so lead with the most used and
    // keep the long tail behind a toggle.
    var tagCounts = {};
    issues.forEach(function (i) {
      tagsOf(i).forEach(function (t) { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    });
    var tagNames = Object.keys(tagCounts).sort(function (a, b) {
      return tagCounts[b] - tagCounts[a] || (a < b ? -1 : a > b ? 1 : 0);
    });
    pills('f-tag', 'tag', tagNames, tagCounts, TAG_PILL_LIMIT);

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    [].forEach.call(document.querySelectorAll('.morebtn'), function (b) {
      b.addEventListener('click', function () {
        var host = document.getElementById(b.dataset.host);
        var extras = host.querySelectorAll('.pill.extra');
        var show = extras.length && extras[0].hidden;
        [].forEach.call(extras, function (p) { p.hidden = !show; });
        b.textContent = show ? 'fewer' : '+' + extras.length + ' more';
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open' +
      ((plan && plan.length) ? ', ' + plan.length + ' on the roadmap' : '') +
      '. Read from <code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [], theme: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function lines(text) {
    return text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse);
  }

  function grab(name) {
    return fetch(name, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(lines);
  }

  // The live files first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen. A missing
  // roadmap.jsonl is not an error: the section just stays hidden.
  grab('issues.jsonl')
    .then(function (data) {
      grab('roadmap.jsonl')
        .catch(function () { return []; })
        .then(function (plan) { draw(data, plan); });
    })
    .catch(function () {
      var snap = JSON.parse(document.getElementById('snapshot').textContent);
      draw(snap.issues, snap.roadmap,
        'Showing the snapshot saved when this page was last built, because the browser would ' +
        'not read the .jsonl files from disk. To see them live, serve the directory ' +
        '(python3 -m http.server) and open it over http, or rebuild this page.');
    });
})();
</script>
</body>
</html>
