r in RAM, but a RAM-resident 1-packet encode still costs 4814 ns on HW, which is 89% of the 5420 ns back-porch window -> encoding in the back porch it ships in is STILL not viable even from RAM. So 'Option A' was never going to work as a same-line back-porch encode; flash latency made it worse but wasn't the whole story. THE viable design (4814ns = only 14% of the 33333ns full line): PIPELINE one line ahead -- while line N scans out, encode line N+1's island into a small rotating pool, in the core-1 line IRQ. ~480 enc/frame ~= 2.3ms (~12% of frame), affordable. This is now the hard constraint for PIZERO-38. PIZERO-37 HW-confirmed (audio build runs, fps=52). Stage 0/1 committed (65bb649).]\n\n[2026-06-08 DONE -- the warble is FIXED. Streaming per-active-line delivery (PIZERO-38) + SPSC/deepened ring (PIZERO-39) ship; user HW-confirmed a steady tone with no frame-rate warble and locked video. Stages: PIZERO-36 (measure) + PIZERO-37 (encoder->RAM) + PIZERO-38 + PIZERO-39 all done; PIZERO-40 (tune POOL/make default) still open. IMPORTANT REFRAME: the residual ~1-semitone-sharp + buzz vs desktop xroar is NOT HDMI delivery -- HDMI_STD_TIMING and ACR-CTS sweeps both had zero effect -> it is SOURCE-side (emulation/resampler), tracked separately as PIZERO-41. So PIZERO-35's delivery goal is complete; audio FIDELITY is a new, separate workstream.]", "type": "task", "status": "done", "priority": "medium", "created": "2026-06-07", "updated": "2026-06-08", "tags": ["audio", "hdmi", "delivery", "warble", "picodvi", "architecture"], "theme": "platform"}, {"id": "PIZERO-36", "summary": "Stage 0: measure per-line IRQ encode budget (go/no-go for in-IRQ audio encode)", "description": "First stage of PIZERO-35. Before any rearchitecture, get HARD DATA on whether a single audio-sample-packet encode fits the core-1 per-scanline DMA-IRQ window. Add a cycle counter (e.g. systick/CYCCNT) around (a) the existing per-line active_audio_cb pointer-store work and (b) ONE RAM-resident dvi_di_encode_header + dvi_di_encode_subpacket call building a single packet. Report each in us against the back-porch window (h_back_porch 130px / 24MHz ~= 5.4us) and the full line (~33us). Decide go/no-go for IRQ-side encode from measurement, NOT the old 'Option A blacked the screen' anecdote (that was flash-resident + 3-packet; PIZERO-37 removes the flash cost). No behavior change in this stage. Parent PIZERO-35.\n\n[2026-06-08 IN-PROGRESS: benchmark implemented + wired to a reproducible env. main.cpp (in the HDMI_DATA_ISLAND block after dvi_di_init) times 20000 iters of the full per-line encode (set_audio_samples + compute_parity + encode_header + encode_subpacket, 1 packet) via volatile fn-pointers (so it can't inline back into flash) and prints '[bench] ... ns/encode' + the budget (back-porch ~5420ns, full-line ~33333ns). Build/flash: `pio run -e pizero_bench -t upload && pio device monitor` (env added to platformio.ini, documented in docs/BUILD.md). AWAITING the user to flash + report the ns number -> go/no-go for in-IRQ encode.]\n\n[2026-06-08 DONE -- MEASURED ON HARDWARE (pizero_bench, RP2350 rev3): one RAM-resident 1-packet encode = 4814 ns (20000 iters / 96283 us). Budgets: back-porch ~5420 ns, full-line ~33333 ns. VERDICT: (a) encoding INSIDE the back porch it ships in is NOT viable -- 4814ns is 89% of the 5420ns bp window, zero margin == exactly why the original Option A blacked the screen. (b) encoding ONE LINE AHEAD on the full-line budget IS viable -- 4814ns = 14% of 33333ns. So PIZERO-38 must PIPELINE: while line N scans out, encode line N+1's island into a rotating pool (Takano's model). Cost at ~480 enc/frame = ~2.3ms/frame (~12% of 19.25ms) on core 1's between-IRQ idle CPU -- affordable. 4814ns is a PESSIMISTIC ceiling (bench calls via volatile fn-ptrs, un-inlined; inlined in the IRQ it'll be less). Side result: confirms PIZERO-37 healthy on HW (audio build boots, [hdmi] M2 active-line audio, fps=52). Bench code/env (pizero_bench, HDMI_ENCODE_BENCH) can be removed now or kept as an encode-cost regression check.]", "type": "task", "status": "done", "priority": "high", "created": "2026-06-07", "updated": "2026-06-08", "tags": ["audio", "hdmi", "delivery", "spike", "measurement"], "theme": "platform"}, {"id": "PIZERO-37", "summary": "Stage 1: relocate HDMI data-island encoder + TERC4 table to RAM (no logic change)", "description": "Second stage of PIZERO-35. The encoder is currently flash-resident, which is the suspected root cause of the original 'Option A' IRQ-encode screen blackout (XIP latency in the hard per-line window). Mark dvi_di_encode_header (dvi_data_island.c:155), dvi_di_encode_subpacket (:172), dvi_di_set_audio_samples, dvi_di_compute_parity (:39), and the dvi_terc4_syms table (:9) __not_in_flash_func / __scratch_x. bch_table (:19) is already a RAM static. Pure relocation: rebuild, confirm the existing 77-line bank build still works on hardware, and record the RAM delta. Prerequisite for IRQ-side encoding. Parent PIZERO-35.\n\n[2026-06-08 DONE (build-verified; awaiting HW confirm). dvi_di_encode_header/subpacket, set_audio_samples, compute_parity, bch + the dvi_terc4_syms table now in RAM (.time_critical), confirmed in the pizero_audio link map: dvi_di_encode_header @0x200098e8, dvi_terc4_syms @0x20009a78 (flash *_veneer trampoline is expected/fine). RAM delta ~+720B (pizero_audio 92.5%). GOTCHA found + documented (docs/BUILD.md 4a): the arduino-pico core defines PICO_NO_HARDWARE=0, so the SDK's __not_in_flash_func macro SILENTLY no-ops in a C TU -> stayed in flash. Fixed with an explicit __attribute__((section('.time_critical.dvi_di'))) instead. Default silent pizero env still links clean (94.4%). Keep in-progress until pizero_audio is flashed and audio still plays (pure relocation, expected no behavior change).\n\n[2026-06-08 DONE -- HW-confirmed via the pizero_bench flash: the audio build boots and runs cleanly with the relocated encoder ([hdmi] M2 active-line audio, fps=52, DVI up). Pure relocation, no behavior change. Audible-quality listen test folds into PIZERO-38 acceptance.]", "type": "task", "status": "done", "priority": "high", "created": "2026-06-07", "updated": "2026-06-08", "tags": ["audio", "hdmi", "encoder", "ram", "flash"], "theme": "platform"}, {"id": "PIZERO-38", "summary": "Stage 2: rotating bp-buffer pool + IRQ encode + 16.16 sample meter (synth source) behind -DHDMI_STREAM_AUDIO", "description": "Core of PIZERO-35: port Takano's even per-active-line delivery. Replace the 77 dedicated per-line buffers g_la0/1/2[2][77][72] (~130KB, RAM-capped at 94%) with a SMALL rotating pool g_pool0/1/2[POOL][72] (start POOL=4, ~3.5KB; frees ~126KB) pre-filled once with static framing (control fill, preamble, guards, video preamble/guard -- factor a helper out of dvi_setup_active_audio_line, dvi_timing.cpp:442). In active_audio_cb (main.cpp:472): advance slot s=(s+1)%POOL, run a 16.16 accumulator (g_samples_per_line16 = (924<<16)/480, reset at v==0) to pick n=0..4 samples, build ONE audio-sample packet, compute_parity, encode header->pool0[s][5..20] + subpacket->pool1/2[s][5..20], then repoint l0[2]/l1[1]/l2[1].read_addr at the slot. RP2350 SRAM is uncached -> no cache barrier, only ordering (pointer store after data writes). Keep ACR/AVI/AudioIF on the vblank active block unchanged (do NOT touch vblank back porch -- PIZERO-34). Gate everything behind -DHDMI_STREAM_AUDIO (platformio.ini:26); flag-off = today's proven 77-line path. Drive with the HDMI_AUDIO_SYNTH 440Hz sine to isolate transport. ACCEPTANCE: clean steady tone, NO ~52Hz warble, A/B vs flag-off; video rock-solid. Depends on PIZERO-36/37. Parent PIZERO-35.\n\n[2026-06-08 HARD CONSTRAINT from PIZERO-36 measurement: one encode = 4814 ns on HW. That does NOT fit the 5420 ns back-porch window (89%), so the IRQ must NOT encode into the same line's back porch it transmits. PIPELINE: in the active-line IRQ for line N, encode line N+1's island into the next rotating-pool slot (full-line ~33333 ns budget; 4814 ns = 14%). Pool needs >=2 slots in flight (line being scanned + line being encoded); size up from there. The 16.16 meter advances per line N+1. ACR stays on the vblank active block (unchanged). Watch core-1 IRQ duty: ~480 enc x 4.8us ~= 2.3ms/frame on core 1's between-IRQ idle CPU.]\n\n[2026-06-08 IMPLEMENTED + HW SMOKE-TEST GREEN (commit 72fc3bb). main.cpp: rotating pool APOOL=6 (~5KB, replaces ~130KB banks -> RAM 92.5%->68%), stream_audio_cb in the active-line IRQ encodes one island/line one-line-ahead, 16.16 meter (step=(924<<16)/480, reset at v==0). Encoder confirmed RAM-resident incl. stream_audio_cb; bank path #else-excluded. Envs pizero_stream (live) + pizero_stream_synth (440Hz wavetable, no sinf-in-IRQ). Flashed pizero_stream_synth: boots, '[hdmi] M2 STREAM', fps=52 LOCKED, aud=0us (encode fully off core 0 -> core 1 IRQ), cpu unchanged ~13.3ms. With step=1.925/line, n is always 1-2 -> every active line carries an island (max smoothness; no-island path unused at this rate). PENDING USER HW ACCEPTANCE: (1) video locked on monitor (serial can't see TMDS), (2) clean STEADY 440Hz tone with NO frame-rate warble (A/B vs pizero_audio). Live-source + cross-core SPSC ring-from-IRQ hardening = PIZERO-39.]\n\n[2026-06-08 DONE -- HW-VALIDATED by user: streaming plays a STEADY tone with NO frame-rate warble, video rock-solid, fps=52, aud=0us. The bursty 77-line warble is GONE (the core PIZERO-35 goal). A separate SOURCE-side fidelity gap vs desktop xroar (pitch/buzz) surfaced during testing -> split to PIZERO-41 (proven NOT a delivery issue).]", "type": "task", "status": "done", "priority": "high", "created": "2026-06-07", "updated": "2026-06-08", "tags": ["audio", "hdmi", "delivery", "warble", "pool", "architecture"], "theme": "platform"}, {"id": "PIZERO-39", "summary": "Stage 3: feed live CoCo audio via cross-core SPSC ring (IRQ consumer)", "description": "Fourth stage of PIZERO-35. Switch the IRQ-side encoder (PIZERO-38) from the synth sine to the live coco_machine_audio_read() ring. This moves the ring DRAIN from core 0 to the core-1 DMA IRQ -> core 0 producer, core 1 consumer. Verify coco_machine's ring is a clean single-producer/single-consumer ring callable from IRQ context; if not, add a minimal SPSC read entry point (head/tail indices with __dmb() on the producer side) in lib/coco_machine. Correctness item: no torn reads, no lost/duplicated samples, hold-last-sample on underrun as today. ACCEPTANCE: CoCo BASIC SOUND / PLAY plays smoothly with no frame-rate roughness; video stays locked. Depends on PIZERO-38. Parent PIZERO-35.\n\n[2026-06-08 DONE (commits 008486c + 9f495d4). Made the ring true SPSC: writer (audio_emit) owns g_audio_w only + __dmb publish; reader (coco_machine_audio_read) owns g_audio_r, does reader-side overflow catch-up, __dmb, and is RAM-resident (.time_critical) for the IRQ. Also DEEPENED the ring 2048->8192 + PRIME-to-half: the bursty producer (a whole frame dumped during coco_machine_run_cycles) was overflowing the small ring -> reader catch-up skipped chunks -> fast-forward distortion ('a few semitones' high). Idle HW telemetry: fill~RING/2, skips=0, under flat. Live CoCo audio now flows through streaming with a healthy ring. RESIDUAL ~1 semitone + buzz is SOURCE-side (NOT this ring, NOT HDMI) -> PIZERO-41.]", "type": "task", "status": "done", "priority": "high", "created": "2026-06-07", "updated": "2026-06-08", "tags": ["audio", "hdmi", "ring", "spsc", "cross-core"], "theme": "platform"}, {"id": "PIZERO-40", "summary": "Stage 4: tune POOL depth, validate budgets, make streaming the default", "description": "Final stage of PIZERO-35. Sweep the rotating-pool depth POOL (2 -> 4 -> 8) to find the minimum stable depth (too shallow = IRQ overwrites a slot the DMA is still reading -> tearing). Confirm video rock-solid >=60s (no black/red flashes, no sync loss), core-0 frame time well under ~19.25ms via the [run] fps/cpu/render/blit/aud telemetry (main.cpp:854), and core-1 IRQ headroom from the PIZERO-36 counter. If solid on hardware AND user-confirmed, make -DHDMI_STREAM_AUDIO the default and keep the old 77-line path behind the inverse flag as the escape hatch. Then re-validate real CoCo SOUND/PLAY end-to-end. Depends on PIZERO-39. Closes PIZERO-35 on user hardware confirmation. Parent PIZERO-35.", "type": "task", "status": "open", "priority": "medium", "created": "2026-06-07", "updated": "2026-06-07", "tags": ["audio", "hdmi", "tuning", "budget", "v1"], "theme": "platform"}, {"id": "PIZERO-41", "summary": "Sound matches desktop XRoar in pitch and tone", "description": "OPEN. A/B on hardware (SOUND 159,255): desktop xroar plays a clean, correctly-pitched square wave; the PiZero plays it ~1 SEMITONE SHARP and BUZZIER/more-distorted. Discovered after PIZERO-38/39 fixed the HDMI delivery warble + overflow fast-forward.\\n\\nPROVEN **NOT** an HDMI-delivery / clock issue:\\n* HDMI_STD_TIMING (standard 25.2MHz pixel / 252MHz sysclk) changed NEITHER the pitch NOR the buzz -> not the off-spec 24MHz pixel clock.\\n* This sink IGNORES HDMI ACR entirely: CTS 25176 -> 26674 -> 50000 (would be ~1 octave if honored) had ZERO audible effect on pitch. So PIZERO-32's ACR lever is inert on this monitor.\\n* AUDIO_OUTPUT_LPF (re-enable the 2-pole TV-bandwidth filter) did NOT change the buzz.\\n* Streaming ring telemetry is healthy under the residual (fill~RING/2, skips=0), so it is not a ring over/underrun artifact.\\nTherefore BOTH the pitch and the buzz are SOURCE-side (emulation / resampler), not delivery -- which is good news (software-fixable).\\n\\nINVESTIGATE (in order):\\n1. CONFIRM CONFIG FIRST (cheapest, likely cause of the semitone): what machine/ROMs is the user's DESKTOP xroar running? PiZero = NTSC Tandy CoCo, bas12.rom + extbas11.rom, 6809 @ 0.895MHz (EVENT_TICK_HZ 14318180/16). A Dragon, a different CoCo model, or PAL on desktop would by itself shift SOUND's pitch ~6% (SOUND is a CPU-timing-loop tone). If configs differ, that IS the semitone -> fix is config, not code.\\n2. MEASURE THE SOURCE NUMERICALLY via the pizero_wavmeas env (no HDMI; only the WAV-dump drains the ring; boots clean BASIC; autotypes SOUND159,255; streams base64 WAV over USB-CDC). Decode + analyse on host for EXACT fundamental freq + spectrum. CAVEAT: the dump arms only when Serial/DTR is asserted -> capture with a DTR-asserting reader (pyserial), and UPLOAD BEFORE attaching any reader (a reader holding the CDC port blocks the 1200bps BOOTSEL reset; also pass --upload-port /dev/cu.usbmodem2101 so pio doesn't grab the wrong cu.* port).\\n3. If the source is genuinely sharp: compare the resampler rate constants (COCO_AUDIO_RATE=48000, EVENT_TICK_HZ=14318180, COCO_AUDIO_CPUCLK_X4) and the 6809 cycle timing vs desktop xroar; for the buzz, inspect the integrate-and-dump square rendering (lib/coco_machine/src/coco_machine.cpp audio_emit/audio_integrate) vs xroar's filtered output.\\nV1.0 audio-quality item. Discovered during PIZERO-38/39. [2026-06-16 PARTIAL on HW via PIZERO-45's in-spec 60Hz/252MHz clock: user reports audio 'sounding better in general' but NOT clearly as clean as desktop xroar -> the in-spec sink clock helped some but did NOT fully close the residual. Confirms the gap is largely SOURCE-side (resampler/square rendering) as suspected; pursue the pizero_wavmeas numerical measurement + resampler/cycle-timing comparison next.]\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"Audio fidelity vs desktop xroar: live CoCo SOUND ~1 semitone sharp + buzzier (SOURCE-side, not HDMI)\"]\n\n[2026-09-17 RE-TEST FIRST, do not re-investigate. Two things changed since this was written: PIZERO-45 moved the machine to in-spec 60 Hz timing, and PIZERO-119 removed a sustained 0.9% audio delivery shortfall that had the stream repeating a sample 250-650 times a second. Either could account for the buzz. Also carry the PIZERO-118 leftover: confirm tone>0 appears in the telemetry while something audible plays, which has never been observed.]", "type": "bug", "status": "open", "priority": "high", "created": "2026-06-08", "updated": "2026-09-17", "tags": ["audio", "fidelity", "pitch", "emulation", "resampler", "v1"], "theme": "trust"}, {"id": "PIZERO-42", "summary": "Clean up diagnostic build cruft from the PIZERO-38/39/41 session", "description": "OPEN. The streaming-audio + fidelity debugging left temporary build scaffolding to curate before merge:\\n(1) REVERT the temporary autotype hack in src/main.cpp (~line 977, AUDIO_WAV_DUMP path): the ascending-tone test program 'FORI=1TO8:SOUNDI*28,4:NEXTI' was swapped to 'SOUND159,255' for frequency measurement -- restore it (or make it a flag).\\n(2) CURATE the diagnostic platformio.ini envs added this session: pizero_bench (PIZERO-36 encode benchmark -- can retire, measurement done), pizero_stream_synth (KEEP -- the warble acceptance test), pizero_stream_std (HDMI_STD_TIMING diag -- keep or remove), pizero_stream_lpf (AUDIO_OUTPUT_LPF diag), pizero_wavmeas (source measurement -- keep until PIZERO-41 closes). Decide keep-as-documented-diagnostic vs remove.\\n(3) KEEP the HDMI_ACR_CTS flag/parameterization in src/main.cpp -- it is harmless (default 25176) and useful for ACR-HONORING monitors (PIZERO-32), even though THIS sink ignores it.\\n(4) Update docs/BUILD.md's env table + flag matrix to match whatever is kept.\\nLow risk; do once PIZERO-41's diagnostics no longer need the envs.\\n(5) [2026-06-29] ALSO covers the PIZERO-11b USB hot-replug instrumentation added this session: src/usb_hotplug_diag.c (shim over pio_usb_ll.h), the extended [run] line + per-frame [usb-evt] edge log + g_hid_reports/g_hid_recv_fail counters in src/main.cpp, and the build_src_filter entry in platformio.ini. Flag-gate (e.g. -DUSB_HOTPLUG_DIAG) or remove once PIZERO-51's fix lands -- currently unconditional in the default product env's telemetry.\n\n[2026-10-01 STEP 1, user: 'yes retire those five'.] Retired five build envs whose investigations are finished: pizero_stream_synth (440 Hz test tone, warble work), pizero_stream_std (standard timing with USB off, pitch work), pizero_stream_lpf (output filter experiment), pizero_hotplug (hot-plug recovery, disproved on hardware, PIZERO-51), waveshare_demo (Waveshare's USB demo from the May bring-up; its source demo/device_info_demo.cpp removed and its THIRD_PARTY_LICENSES entry with it). KEPT: pizero_stream_60 (product), pizero_stream (52 Hz fallback for picky displays), pizero_wavmeas (audio measurement and the ~99% RAM canary), pizero_padprobe, pizero_usbdebug (PIZERO-159 open), pizero_wdtest (PIZERO-33 open), native. No kept env extended a retired one. PROOF: the six kept firmware envs built byte-identical to the PIZERO-174 baseline; 222 host tests pass. LEFT FOR AFTER THE SHOW: the code those envs switched on (AV_AUDIO_SYNTH, AV_STD_TIMING, AUDIO_OUTPUT_LPF, USB_HOTPLUG_RECOVER and its phantom-flood detector) is still in src/ and lib/; docs/BUILD.md's flag rows now say no build uses them. Remove that code with the same identical-binary check.", "type": "task", "status": "in-progress", "priority": "low", "created": "2026-06-08", "updated": "2026-10-01", "tags": ["cleanup", "build", "platformio", "docs"], "theme": "platform"}, {"id": "PIZERO-43", "summary": "Swap NTSC artifact-colour phase (reds<->blues) to match Space Warp", "description": "OPEN. PMODE 4 / RG6 NTSC artifact colours: on a REAL CoCo the red/blue phase is ARBITRARY (power-on dependent), so emulators pick a default. Ours is the OPPOSITE of what Space Warp (our showcase demo) assumes -> its reds/blues are inverted. Fix in lib/coco_machine/src/coco_machine.cpp render_rg6_frame (~962): swap the c01/c10 assignments (PAL_ORANGE<->PAL_BLUE) so bit-pair 01 vs 10 map the other way. Make the swapped orientation the new DEFAULT (matches Space Warp); keep the old one behind -DARTIFACT_PHASE_LEGACY for reversibility. NOTE: artifact phase is genuinely game-dependent (different titles assume different phases) -- a per-game/runtime toggle (autorun.txt setting or a key) would be the proper long-term fix; this issue just flips the default. Verify on HW: Space Warp's colours look correct. User-requested.\n\n[2026-06-15 DONE -- HW-confirmed by user: swapped c01/c10 in render_rg6_frame (new default; old phase behind -DARTIFACT_PHASE_LEGACY), Space Warp's artifact colours 'look better now'. A per-game/runtime artifact-phase toggle remains a possible future enhancement (titles disagree on phase), not filed unless it bites.]", "type": "task", "status": "done", "priority": "medium", "created": "2026-06-15", "updated": "2026-06-15", "tags": ["display", "vdg", "artifact", "color", "spacewarp"], "theme": "platform"}, {"id": "PIZERO-44", "summary": "Investigate full 60Hz HDMI output (monitor compat + correct game speed)", "description": "OPEN / discussion. Current refresh = 24MHz pixel / (880x525) = ~51.95Hz -- off-spec; some monitors may reject a non-60Hz signal (consumer-QA exposure). KEY CLARIFICATION: this is NOT a render-speed limit -- core 0 has ~4ms/frame slack (cpu ~13.5ms of 19.25ms) and rendering a whole line at a time is cheap; the refresh is set by the TMDS timing (pixel clock x total pixels), independent of how fast we render the framebuffer. The 24MHz pixel = sysclk/10 and sysclk=240MHz is forced by PIO-USB (needs 120/240MHz).\\n\\nPaths to 60Hz:\\n(a) PIO-USB at ~252MHz: sysclk 251.75MHz -> 25.175MHz pixel -> STANDARD 640x480p60 (800x525) AND keep USB. BEST outcome if PIO-USB tolerates ~252MHz (its bit-banging timing is calibrated for 120/240 -- UNCERTAIN; needs a HW experiment). FIRST EXPERIMENT: build 252MHz + true 800x525 60Hz timing + USB enabled; check DVI stable @60Hz and whether the USB keyboard enumerates.\\n(b) Reduced-blanking 60Hz at 24MHz: 800x500 = exactly 60.0Hz, keeps USB, but vblank=20 lines is non-standard (CVT-RB-ish) -> may HURT monitor compat (opposite of the goal) and squeezes the audio-island back porch. Lower confidence.\\n(c) USB-less standard timing: 252MHz + true 800x525 60Hz, universal monitor compat, but DISABLES USB keyboard/gamepad (PIO-USB) -> not shippable for a console. Diagnostic/fallback only.\\n\\n60Hz BONUSES beyond monitor compat: game speed becomes correct (CoCo NTSC = 59.92Hz; at 52Hz we run ~13% slow) and audio cadence simplifies (48000/60 = 800 samp/frame). NB: the off-spec 24MHz is also the root of PIZERO-41's source-side... no -- 41 is source-side, independent. Decide after the (a) PIO-USB-at-252MHz experiment, which is the highest-value test.\n\n[2026-06-16 IN-PROGRESS -- Path (a) experiment built (env pizero_60hz, flag HDMI_60HZ_TEST): 252MHz sysclk (vreg 1.25) + true 800x525 timing @ 25.2MHz pixel = 60.0Hz + USB host ENABLED, on the no-audio base (the audio build's wide h_bp=130 can't fit in 800-total, so this test drops audio). ENCOURAGING FINDING: Pico-PIO-USB computes its dividers from clock_get_hz(clk_sys) (no hard 120/240 assert), and 252MHz divides EXACTLY (252/48=5.25, /6=42, /12=21, /96=2.625 -- all representable in the PIO 16.8 divider), so 252 should give a CLEAN 48MHz USB bit clock, not jittery. Builds (RAM 96.8% -- double-buffered base, tight but fits). HW test BLOCKED: the upload failed mid-flash (recurring USB-drop flakiness during the 1200bps reset) and left the board USB-dead (no CDC, no BOOTSEL) -- needs manual BOOTSEL (hold BOOT + plug) to flash via picotool. PENDING: flash pizero_60hz via BOOTSEL; check (1) monitor locks 60Hz, (2) usb= after a COLD boot with keyboard attached (warm-reboot usb=0 would be ambiguous vs the known warm-reenum flakiness). If both pass -> 60Hz+USB achievable; then re-fit audio (likely needs ~277MHz to keep the wide audio back porch at 60Hz, or a different island placement).\n\n[2026-06-16 *** PATH (a) CONFIRMED ON HARDWARE *** pizero_60hz flashed: sys=252000kHz, fps=60, and usb=1 -- PIO-USB ENUMERATES at 252MHz (comes up usb=0 for ~1s then locks usb=1). USER CONFIRMED: monitor locks 60Hz and looks right, keyboard works. So 60Hz + USB host + correct game speed ALL coexist at 252MHz -- the central blocker is SOLVED. (No sound in this test build, as designed.)\n\nNEXT (audio re-fit at 60Hz) -- and a better plan than 277/288MHz: stay at 252MHz/800-total but reshape blanking to fit ONE streaming island (PIZERO-38 uses 1 packet/active line, not the old 3). At h_total=800: h_fp=8, h_sync=96, h_bp=56, h_active=640 -> h_bp=56 = 28 words, and one island needs ~27 words (preamble4+guard1+island16+guard1 + video-preamble4+guard1). FITS. So: 252MHz + 60Hz + streaming audio is geometrically possible without a higher overclock. Also set AUDIO_SAMPLES_PER_FRAME=800 (48000/60) and single-buffer fb. BONUS to check: at STANDARD 60Hz timing the sink clock is now in-spec, which may also change PIZERO-41's pitch/buzz. Plan: make a pizero_stream variant at 252MHz/60Hz/h_bp=56; if clean, promote 60Hz to the default and retire the 24MHz/52Hz timing.\n\n[2026-06-16 DONE as an INVESTIGATION -- the central question is answered YES and HW-confirmed: 60Hz + USB host + correct game speed coexist at 252MHz (env pizero_60hz; monitor locks, keyboard works). Findings written up in docs/hdmi-audio-notes.md. The implementation (promote 60Hz to default WITH streaming audio re-fit at h_bp=56) is split into PIZERO-45.]", "type": "task", "status": "done", "priority": "medium", "created": "2026-06-15", "updated": "2026-06-16", "tags": ["display", "hdmi", "timing", "refresh", "60hz", "usb", "v1"], "theme": "platform"}, {"id": "PIZERO-45", "summary": "Promote 60Hz to default: re-fit streaming audio at 252MHz/60Hz (h_bp=56)", "description": "OPEN / implementation (follows PIZERO-44, which CONFIRMED 60Hz+USB work at 252MHz). Goal: a single 60Hz product build with streaming HDMI audio, then make it the default and retire the off-spec 24MHz/52Hz timing. Strict upgrade: standard 640x480p60 (monitor-friendly) + correct game speed + keeps USB + audio.\\n\\nPLAN (all at 252MHz, vreg 1.25 -- proven by pizero_60hz):\\n1. TIMING: 800x525 @ 25.2MHz = 60.0Hz, but split blanking to fit ONE streaming island in the back porch: h_fp=8, h_sync=96, h_bp=56 (=28 words), h_active=640. (PIZERO-44 confirmed one island needs ~27 words; the no-audio test used h_bp=48 which is too narrow for an island.)\\n2. AUDIO: enable HDMI_DATA_ISLAND + HDMI_STREAM_AUDIO; set AUDIO_SAMPLES_PER_FRAME = 800 (48000/60, was 924 at 52Hz); single-buffer fb (audio build already does). The streaming pool/meter/IRQ-encode path is unchanged -- only the cadence constant + timing.\\n3. PACING: CYCLES_PER_FRAME/FRAME_PERIOD_US for exactly 60fps (16667us; ~14915 cyc @ 0.894886MHz).\\n4. Likely a new flag (e.g. HDMI_60HZ that implies the timing) composed with the streaming build; or fold 60Hz into the default pizero_stream and drop HDMI_60HZ_TEST/the 52Hz path once validated.\\n5. VERIFY ON HW: monitor locks 60Hz, keyboard enumerates (usb=1, check after a COLD boot), audio plays, fps=60, no warble, watchdog/freeze-log intact. BONUS to listen for: standard in-spec sink clock may reduce PIZERO-41's residual pitch/buzz.\\n6. On success: make 60Hz the default build, retire the 24MHz/52Hz timing + the now-redundant diagnostic envs (coordinate with PIZERO-42 cleanup), and update docs/BUILD.md + docs/hdmi-audio-notes.md + README/product-plan.\\nRISK: h_bp=56 is tight for the island (28 words vs ~27 needed) and h_fp=8 is a short front porch -- if a monitor balks, fall back to ~277/288MHz to keep the wider h_bp (288/48=6.0 exact, also clean for PIO-USB) at the cost of a higher overclock. Refs: docs/hdmi-audio-notes.md (60Hz section), PIZERO-44. [2026-06-16 IMPLEMENTED, build-verified (RAM 70.4%), awaiting HW listen/look-test. New flag HDMI_60HZ + env pizero_stream_60 (extends pizero_stream). main.cpp: timing 8/96/56/640 @ 252MHz (h_total=800 -> 60.0Hz); vreg 1.25; ACR CTS=25200 (in-spec pixel); AUDIO_SAMPLES_PER_FRAME=800; pacing CYCLES_PER_FRAME=14915/FRAME_PERIOD_US=16667. USB stays enabled (only HDMI_STD_TIMING skips it). NO libdvi change: the 28-word back porch holds one island + video preamble/guard, ALINE_BP_W=72 already >= h_bp/2=28. Docs updated (BUILD.md env+flag tables, hdmi-audio-notes.md 60Hz section). NEXT: flash pizero_stream_60 on HW and confirm monitor locks 60Hz, keyboard enumerates after COLD boot (usb=1), audio plays w/ no warble, fps=60; listen whether in-spec clock also softens PIZERO-41. On pass: make default + retire 52Hz envs (PIZERO-40/42).] [2026-06-16 DONE on HW: user confirms 60Hz locks, correct game speed, USB keyboard, and streaming audio all work on pizero_stream_60. fps=60 locked, cpu~11.2ms/16.67ms, ring primed (fill~RING/2, skips/under flat). NEXT (separate): promote to default + retire off-spec 52Hz envs (PIZERO-40/42).]", "type": "task", "status": "done", "priority": "high", "created": "2026-06-16", "updated": "2026-06-16", "tags": ["display", "hdmi", "audio", "60hz", "timing", "v1"], "theme": "platform"}, {"id": "PIZERO-46", "summary": "Pre-public-release docs pass: refresh README for PIZERO-45, add setup/usage, fix AUTORUN.md", "description": "Before the initial public release, bring the user-facing docs up to date and make setup adequate for a first-time visitor (docs/BUILD.md is already current). Work: (1) README — refresh for PIZERO-45: default env is now pizero_stream_60 (true 640x480p60 + streaming HDMI audio + USB), update the System-clock section (252MHz/25.2MHz pixel/60Hz, not 240MHz/24MHz/57Hz), and rewrite Roadmap/Status so audio reads as DONE/clean (not warbly-52fps-future-work). (2) README — add a 'What you need' hardware list (board + mini-HDMI->HDMI cable/adapter + USB keyboard & adapter for the PIO-USB port + microSD + USB-C power) and a 'Quick start: first boot' usage section; add a PlatformIO-install pointer. (3) AUTORUN.md — it IS implemented (src/coco_boot.cpp parser) but is mislabeled 'proposed spec / AMOLED-58'; fix the framing and strip wrong-project AMOLED-NN references. (4) Fix README's dead relative link to the private AMOLED repo (intro line). Hardware list written generically (no canonical adapter/keyboard provided). [2026-06-17 DONE: README refreshed for PIZERO-45 (default env, 60Hz/252MHz, audio-done roadmap/status), added 'What you need' + 'Quick start' + PlatformIO pointer, added two photos (docs/images/board-wired.jpg hero + connections.jpg). AUTORUN.md de-AMOLED'd + reframed as implemented. Committed 519472a + 9ca4b87, pushed.]", "type": "task", "status": "done", "priority": "high", "created": "2026-06-16", "updated": "2026-06-17", "tags": ["docs", "readme", "release"], "theme": "kit"}, {"id": "PIZERO-47", "summary": "Document end-to-end CoCo->HDMI signal pipeline (docs/pipeline.md)", "description": "The full signal path (emulated CoCo screen + audio -> HDMI out) is only answerable today by stitching together README.md (high-level video + pinout), docs/hdmi-audio-notes.md (deep audio), docs/BUILD.md (flags), and source comments. No single doc traces the whole pipeline as one narrative. Audio half is well covered; video half lives mostly in code comments; nothing ties the two halves together. Create docs/pipeline.md: (1) Overview + two-core split + one ASCII dataflow diagram; (2) Video path: VDG 256x192 indexed -> RGB565 blit (coco_boot_blit_vdg_pizero_src) -> volatile g_front double-buffer handoff -> dvi_static_framebuf_main_16bpp TMDS encode -> DVI_VERTICAL_REPEAT=2 doubling to 640x480 -> pico_sock_cfg pins/PIO; (3) Audio path summary linking hdmi-audio-notes.md: 6-bit DAC integrate-and-dump 48kHz SPSC ring -> data islands (TERC4/BCH, ACR+InfoFrames on vblank) -> 16.16 per-line meter streaming in core-1 IRQ; (4) How video+audio timing interlock (island must fit h back-porch ~27 words; couples audio capacity to 60Hz vs 52Hz geometry; 800/924 samples per frame); (5) build-env table linking BUILD.md; (6) stage->file:function source map; (7) See-also. Keep it a navigation map, not a re-explanation; cross-link existing deep docs. Re-confirm every cited path/function against current source. Wire in: add cross-link from README 'How the HDMI output works' and from CLAUDE.md pointer list.", "type": "task", "status": "done", "priority": "medium", "created": "2026-06-20", "updated": "2026-06-20", "tags": ["docs", "architecture", "hdmi", "pipeline"], "theme": "platform"}, {"id": "PIZERO-48", "summary": "Document emulation pacing & CoCo high-speed (SAM double-speed) behavior", "description": "Write up how guest CPU speed-up holds up end-to-end, since the pacing model is non-obvious and the headroom limit is real. Key findings (verified in code): (1) No host fast-forward toggle; the only double-speed is the CoCo's own SAM high-speed POKE (POKE 65495/65497, address-dependent vs full), implemented in vendored XRoar mc6883.c (8 ticks/fast cycle vs 16). (2) coco_machine_run_cycles paces by FIXED EMULATED TIME per frame, not fixed instruction count: run_cpu_with_audio sets cycles_remaining = cycles*16 TICKS (coco_machine.cpp:793) and each mem access subtracts ncycles ticks (:486). So a frame always advances CYCLES_PER_FRAME*16 = 238640 ticks ~= 16.667ms emulated time regardless of SAM speed. (3) Therefore audio pitch and video are correct BY DESIGN (samples are tick-keyed -> still 800/frame in fast mode; no resampler distortion; the hdmi-audio-notes 'fast-forward distortion' was a separate startup ring-overflow bug). (4) The real limiter is core-0 host headroom: fast mode executes ~2x as many 6809 cycles within the same per-frame budget, so emulation host cost ~doubles (README perf ~9.4ms -> ~18.8ms est) and exceeds the 16.67ms frame budget (only ~31% slack at 1x). Pacing then resyncs/drops the deficit -> guest runs slower than 2x AND the audio ring under-produces vs the real-time core-1 consumer -> underruns after ~1s. Threshold ~1.6-1.7x: address-dependent (~1.3-1.5x) likely squeaks by; full ~2x overruns. Video stays 60Hz (decoupled core 1) but shows the lag. (5) Not yet characterized on-device -- next step is to measure via the per-second [run] fps/cpu/blit serial telemetry (PIZERO-15) under a tight high-speed-POKE loop, and decide whether to cap/ignore the full-speed bit. New doc docs/cpu-speed.md; cross-link from docs/pipeline.md and README Performance.\n\n[2026-09-29 CORRECTION from the PIZERO-172 documentation sweep] The findings above describe the SAM double-speed POKE as working but costly. It has no effect at all: coco_mem_cycle (lib/coco_machine/src/coco_machine.cpp) charges a flat 16 ticks for every RAM, ROM and I/O access, so the guest always runs at 1×. That is PIZERO-132. docs/cpu-speed.md now says so and frames the headroom analysis as what honoring fast mode would cost.", "type": "task", "status": "done", "priority": "medium", "created": "2026-06-20", "updated": "2026-09-29", "tags": ["docs", "emulation", "timing", "performance"], "theme": "platform"}, {"id": "PIZERO-49", "summary": "Map USB numeric-keypad HID usages (0x53-0x63) to CoCo keys", "description": "src/main.cpp hid_table_init() only maps the main keyboard HID-usage block (0x04-0x52); keypad usages 0x53-0x63 all hit the 0xFF no-mapping sentinel and are silently dropped, so a numeric keypad produces nothing. Fix: extend g_hid_to_dscan -- KP1-9 (0x59-0x61)->K_1..K_9, KP0 (0x62)->K_0, KP Enter (0x58)->K_ENTER, KP . (0x63)->K_DOT, KP - (0x56)->K_MINUS, KP / (0x54)->K_SLASH; leave Num Lock (0x53) and the shifted KP * / + (0x55/0x57) unmapped initially. Works if the keypad enumerates and speaks boot protocol (default already HID_PROTOCOL_BOOT). To use keypad AND main keyboard together via a hub, also enable -DCFG_TUH_HUB=1 (keep CFG_TUH_HID=4). Conditional fallback only if hw test shows it sends no mappable 8-byte report: tuh_hid_parse_report_descriptor in mount_cb. Verify on hw: keypad digits echo in BASIC, KP Enter runs a line.\n\n[2026-09-28] Built as part of PIZERO-163: kt_translate maps keypad usages 0x54-0x63 (/ * - + Enter 1-9 0 .) to their characters whatever Num Lock says. Close with 163's hardware check.\n\nCLOSED 2026-09-28 with PIZERO-163: the numeric keypad types its characters (key_translate.h, usages 0x54-0x63), confirmed with it.", "type": "feature", "status": "done", "priority": "high", "created": "2026-06-28", "updated": "2026-09-28", "tags": ["usb", "hid", "keyboard", "input"], "theme": "input"}, {"id": "PIZERO-50", "summary": "Quick header joystick -> CoCo port 0 (ADC axes + new coco_machine joystick API)", "description": "No joystick path exists in the port (coco_machine exposes only press/release_key). Add a quick joystick wired to the free header pins, independent of USB. Recommended hw: analog thumbstick module -- X->GPIO26 (ADC0), Y->GPIO27 (ADC1) (only free ADC pins; ADC2/3 are USB D+/D-), fire->GPIO3 (digital, internal pull-up, active-low), mapped to port 0 (right CoCo game port). Alt: digital switch/D-pad (full-throw). Firmware: new coco_machine_set_joystick_axis(port,axis,0..65535)/set_joystick_fire(port,bool) in coco_machine.h; add js_axis[2][2] (default 0x8000) + js_fire[2] to g_m; extend coco_pia0_preread_a (coco_machine.cpp:131) to overlay the DAC comparator onto PIA0 PA7 using CB2/CA2 selectors per upstream coco3.c:joystick_update; fire button into PA0/PA1 row line (verify wiring vs ~/github/xroar). Sample adc_read GPIO26/27 (12->16bit <<4) + fire GPIO each frame in loop(); init adc/gpio in setup(). Gate behind -DJOYSTICK_HEADER so default product env is unaffected. Verify: PRINT JOYSTK(0) sweeps 0..63, fire registers. [2026-06-28 DEMOTED to low / FALLBACK: user prefers the USB-gamepad route (PIZERO-13) with a controller they already have. Keep this as the hardware-independent backup if PIO-USB won't enumerate the controller. Build this issue's coco_machine joystick-injection API FIRST regardless -- PIZERO-13 reuses it; only the GPIO/ADC read-path is specific to this fallback.] [2026-07-19 BUMPED back to high / PREFERRED player-1 route: user now favors wiring a REAL CoCo joystick (2x 500k pots + 1-2 buttons) directly to the RP2350 header as a 'hat'. Authentic feel, sidesteps the USB CPU budget entirely (no hub needed), and lands in the same DAC-comparator injection API. Note the pots wire as dividers to 3.3V; only ADC0/ADC1 (GPIO26/27) are free, so one stick (X+Y) is clean but a second analog stick needs an external mux (74HC4051 or I2C ADC on I2C0 6/7). Calibrate observed ADC span in firmware. Build the coco_machine injection API first as before.] [2026-07-19 REAL-JOYSTICK WIRING DETAIL: The stick is passive -- 2 pots + a switch, no active parts; all the cleverness (DAC ramp + comparator) is emulated in firmware, so the hw job is just read 2 pots + 1-2 buttons. Connector exposes 5 signals: X wiper, Y wiper, +V (pot top rail), GND (pot bottom + button common), Fire (switch->GND). DIN-5 pin NUMBERING VARIES across CoCo1/2/3, left vs right port, 1- vs 2-button -- BUZZ OUT the actual connector with a multimeter, do not trust a pinout table (find wipers by watching R-to-rail change as the stick moves; button by continuity when pressed). KEY RULE: power the pot top rail from the board 3V3, NOT 5V -- each pot is just a divider, so 3V3 makes the wiper sweep 0-3.3V (exactly ADC range) and keeps 5V off the not-5V-tolerant GPIO; DO NOT connect the stick's original +5V wire. Wiring (one stick -> right/port 0): pot top->3V3; pot bottom/GND->GND; X wiper->GPIO26/ADC0; Y wiper->GPIO27/ADC1; Fire->GPIO3 (input, internal pull-up, active-low = LOW when pressed); optional 2nd button->any free GPIO (same pull-up+to-GND pattern). GOTCHAS: (1) 500k is a HIGH source impedance for the SAR ADC (~125k at mid-throw, far over spec) -> slow-settling/noisy reads; fix cheapest-first: ~10nF cap from each ADC pin to GND (charge reservoir + noise filter), then lengthen ADC sample time, then (overkill) op-amp follower per axis. Only 6-bit needed (JOYSTK 0-63) so cap+slow-sample suffices. (2) never route the stick's +5V pin to an ADC pin; keep every signal <=3.3V (the 3V3-rail move handles this). (3) CALIBRATION: real pots don't sweep full-scale (~0.3-3.0V typical) -> firmware learns/observes per-axis min/max, applies center+deadzone, maps to 0-63. PLAYER 2: no ADC left after 1 stick (2 axes = both free channels); options: 74HC4051 8:1 analog mux (3 select GPIOs funnel all 4 axes through 1 ADC channel, sampled sequentially/frame) OR external I2C ADC e.g. ADS1115 4ch on I2C0 (SDA6/SCL7). Either fine at 60Hz; defer until player-1 proven.]", "type": "feature", "status": "open", "priority": "high", "created": "2026-06-28", "updated": "2026-07-19", "tags": ["input", "joystick", "hardware", "coco_machine", "preferred"], "theme": "input"}, {"id": "PIZERO-51", "summary": "Unplug and replug USB without rebooting the machine", "description": "Implementation of the fix diagnosed in PIZERO-11b (child of it). On this rev3 board the disconnect is invisible to line_state/connected/ep_error/ints (the PIO SM pins the bus at J/FS); instead, an unplugged device makes PIO-USB flood ~180 byte-identical phantom HID reports/sec (HW-confirmed 2026-06-29). DESIGN: (1) DETECT -- in tuh_hid_report_received_cb (src/main.cpp), per (daddr,idx) track the previous report bytes + a consecutive-identical counter; when >=N identical reports arrive in a row (phantom flood; N~50-100, i.e. <~0.5s at 180/s), declare the device gone. A real boot keyboard sends reports only on key transitions, so it never trips; tune N against a real device held-key case (held key = repeated identical reports too -> may need 'identical AND rate>threshold', or exclude the held-key case by requiring the report to be the IDLE/all-zero report, since the phantom is the SM-held idle line). (2) RECOVER -- on detection, call pio_usb_host_stop() then pio_usb_host_restart() (both in pio_usb.h) to tear down + re-enumerate the root port so a freshly-attached or replugged device mounts cleanly; reset g_usb_devices / per-interface phantom counters. (3) SAFETY -- gate behind a flag (e.g. -DUSB_HOTPLUG_RECOVER); keep OFF the freeze-prone hot path (PIZERO-33); the stop/restart touches the shared PIO1 while libdvi runs on PIO0/core1 -- validate it does NOT wedge video/audio or trip the watchdog. PRE-WORK: add report-PAYLOAD logging to confirm phantom reports are byte-identical/idle (current diag build only COUNTS them). VERIFY ON HW: cold-boot keyboard works; unplug -> within ~1s a '[usb] re-enumerating' log + pio restart; replug (or attach a different device) -> [usb] device attached + usb=1 + rpts resumes on keypress; video stays 60fps, no freeze. ALTERNATIVES already RULED OUT by PIZERO-11b: E9-drain re-enable (line is driven, not leaking) and transfer-error detection (no errors fire). Parent PIZERO-11b. Roadmap: docs/ROADMAP.md. [2026-07-22 IMPLEMENTED (flag-gated, awaiting HW confirm). src/main.cpp: per-(daddr,idx) consecutive-byte-identical-report counter (hotplug_note_report); >=USB_PHANTOM_FLOOD_N (default 100, ~0.55s @180/s) identical reports on an interface sets g_usb_recover_pending. loop() handles recovery AFTER USBHost.task() returns (not nested in the tuh callback): logs the flood, usb_release_all_keys() to drop stuck keys, pio_usb_host_stop()+pio_usb_host_restart(), zeroes g_usb_devices + resets the tracking runs. All gated behind -DUSB_HOTPLUG_RECOVER; new env pizero_hotplug (extends pizero_stream_60). Detection lives outside hid_keyboard_apply so real keystrokes (report changes) reset the run and never trip it. Builds clean (pizero_hotplug RAM 70.6%); default pizero_stream_60 unchanged (all code #ifdef'd out). docs/BUILD.md env table + flag matrix updated. TODO on HW: cold-boot kbd works; unplug -> '[usb] phantom flood ... re-enumerating' within ~1s; replug/new device -> [usb] device attached + rpts resumes; video stays 60fps, watchdog doesn't trip. RISK to watch: whether the tuh layer above pio-usb needs extra reset after stop/restart, and the held-key false-positive (mitigate by requiring the idle/all-zero report or raising N if a real device ever floods identical). Payload logging still to add if the phantom turns out non-idle. Then curate diag per PIZERO-42.] [2026-07-22 HW TEST #1 -> ROOT-CAUSE REFINED. Boot+kbd OK; unplug stopped input (flood detected); replug re-lit the keyboard LEDs but NO keystrokes. Diagnosis: pio_usb_host_stop()/restart() only cancel/resume the PIO SOF timer -- they never touch the TinyUSB tuh layer, so the stale device stayed mounted and our receive_report stayed armed on a dead address; the replug re-enumerated only electrically. CONFIRMED in the vendored libs: TinyUSB's pio-usb HCD (hcd_pio_usb.c pio_usb_host_irq_handler, a strong override of the lib's weak symbol, called from the SOF service pio_usb_host.c:349) only umounts on PIO_USB_INTS_DISCONNECT, and pio-usb only raises that from connection_check() when the line reads SE0 -- which never happens here (SM pins J/FS). FIX v2 (flashed): drop stop/restart; add usbdiag_force_disconnect() in src/usb_hotplug_diag.c that replicates connection_check()'s disconnect branch (connected=false, suspended=true, raise DISCONNECT int, retire in-flight transfers). Effect: next SOF service -> HCD umount frees the address; and because clearing connected RELEASES the SM, the connect-check (pio_usb_host.c:335) then reads the line's TRUE state -- SE0 while empty (no phantom re-attach), FS/LS idle once a real device is replugged -> clean CONNECT + fresh enumeration -> tuh_hid_mount_cb re-arms reports. This is grounded in the PIZERO-11b observation that a RELEASED SM reads SE0 on an empty bus (only pinned J/FS while polling). Also added phantom-payload logging to the recovery line (pre-work) and let tuh_umount_cb/mount_cb own g_usb_devices. Builds clean (RAM 70.6%), flashed to /dev/cu.usbmodem101. AWAITING HW TEST #2: unplug -> '[usb] phantom flood ... forcing disconnect' + '[usb] HID unmount'/'device removed'; replug -> '[usb] device attached'/'HID mount'/'receive_report armed' + rpts resumes on keypress; video stays 60fps, watchdog freezes= unchanged.] [2026-07-22 HW TEST #2 -> force-disconnect WEDGES the port; PIVOT to reboot-recovery. With fix v2 (usbdiag_force_disconnect), a 30s serial capture across unplug+replug was DEAD FLAT: usb=0 conn=1 ls=J/FS rpts=0 ints=0, ZERO [usb] events, no re-enum. Mechanism: force-disconnect clears connected, but the SAME SOF connect-check (pio_usb_host.c:335, needs !connected) immediately RE-LATCHES connected=true off the phantom J line (on this rev3 board the released SM still reads J/FS when EMPTY -- E9 leak -- NOT the SE0 I'd hoped, contradicting the transient-SE0-during-reset observation for the steady state); tuh then tries to enumerate a non-existent device, fails, and the port is WEDGED (connected=1, usb=0, no endpoint polling) -- unrecoverable, because connection_check needs SE0 to clear connected (never comes) and the flood detector needs polling to re-fire (gone). CONFIRMED IMPOSSIBLE: a clean full re-init -- the pio-usb TinyUSB HCD implements NO hcd_deinit and pio-usb exposes no host_deinit (pio_usb_host_init re-claims PIO SMs on a 2nd call). CONCLUSION: on this board the USB line is unusable as a presence signal (reads J whether present or absent), the only proven enumeration path is a COLD BOOT, and there is no in-place re-enumeration primitive. FIX v3 (flashed): RECOVERY = REBOOT. On phantom-flood detection, tag scratch[4]=USB_REPLUG_MAGIC and watchdog_reboot(0,0,30) -> cold-boot enumerates whatever is attached at reset (~2s, automatic). setup() recognizes the sentinel and reports '[usb] re-enumeration reboot' WITHOUT counting it as a PIZERO-33 freeze (carries the freeze tally across). Strictly better than status quo (today an unplug wedges USB and needs a MANUAL power-cycle). TRADEOFF: the running emulator state is lost on a device swap. Builds clean (RAM 70.6%), flashed. AWAITING USER DECISION on the reboot tradeoff + HW test: cold-boot kbd works; unplug -> '[usb] phantom flood ... rebooting'; board auto-reboots ~2s; whatever's plugged at reboot enumerates (usb=1, keys work); '[usb] re-enumeration reboot' banner; freezes tally NOT bumped. NOTE: header-joystick (PIZERO-50) sidesteps USB entirely for player-1 and avoids this whole class of problem.] [2026-07-22 RESULTS-TO-DATE SUMMARY + confidence review (do NOT treat this ticket as closed; fluid USB still being pursued). Reassessing after the user flagged that test attention/sequencing was loose -- separating mechanism-proven facts from possibly-artifactual observations.\nSOLID (source- or schematic-confirmed, not just a single HW observation):\n  * Phantom-flood DETECTION works and is the only reliable presence signal (a gone device floods ~180 identical idle HID reports/s; a real one reports on change). Keep this regardless of recovery method.\n  * pio_usb_host_stop()/restart() cannot recover: they only cancel/resume the PIO SOF timer and never notify the TinyUSB tuh layer (verified in pio_usb_host.c + hcd_pio_usb.c). [was fix v1]\n  * No clean in-place USB host re-init: the pio-usb TinyUSB HCD implements NO hcd_deinit and pio-usb exposes no host_deinit (a 2nd pio_usb_host_init re-claims the PIO SMs). tuh_deinit/tuh_init exist but the pio-usb backend doesn't support deinit. (source-confirmed)\n  * NO software VBUS switch on the PIO-USB host port: board header has no USB-power pin, vendor demo never toggles one, and docs/RP2350-PiZero-schematic.pdf shows the PIO-USB connector VBUS hardwired (no load-switch/enable-GPIO). So the device cannot be power-cycled under firmware control. (schematic-confirmed)\nSHAKY (single observations, possibly test-sequence/human-error artifacts -- NEED clean re-test):\n  * 'force_disconnect (fix v2) WEDGES the port' (usb=0 conn=1 flat for 30s). The capture may have started already-wedged, or the physical unplug/replug may not have landed in the window; the flood->force-disconnect was never watched fire LIVE. Re-test needed before calling force-disconnect dead.\n  * 'A warm/watchdog reboot does NOT re-enumerate' -- CONTRADICTED by HW test #1, where the very first warm picotool flash DID come up with the keyboard working. The later usb=0 warm-reboots all happened AFTER the port was (maybe) wedged, so warm-reboot-fails may be a symptom of the wedge, not a general rule. If a CLEAN watchdog reboot re-enumerates an attached device, fix v3 (reboot-recovery) is viable -- possibly with a good swap UX (reboot, then a deliberate few-second window to insert the new device before USB init).\nCONFIRMED HW FACT: cold power-cycle WITH keyboard attached always enumerates + types (user, multiple times).\nCODE STATE: all experiments are flag-gated behind -DUSB_HOTPLUG_RECOVER / env pizero_hotplug; default product build pizero_stream_60 is untouched and re-flashed to the board. main.cpp currently carries fix v3 (flood-detect -> watchdog_reboot with scratch[4]=USB_REPLUG_MAGIC sentinel so setup() reports a replug-reboot, not a freeze) plus the usbdiag_force_disconnect() shim (fix v2, now unused by loop()). NOT reverted -- kept for the re-test.\nNEXT / RE-TEST PLAN:\n  (T1 ISOLATION -- does a warm/watchdog reboot re-enumerate an ATTACHED device? zero unplug variables): flash pizero_wdtest, COLD-boot with keyboard (confirm usb=1 + keys), let the ~10s self-test hang -> watchdog warm-reboots with the keyboard STILL attached -> check usb= after. usb=1 => warm reboot enumerates => fix v3 path is alive. usb=0 => reboot-recovery is dead, focus shifts.\n  (T2 confirm/deny the force-disconnect wedge, watched LIVE): flash pizero_hotplug@v2 (force_disconnect), cold-boot (usb=1), then unplug while monitoring serial in real time -- watch the flood line + force-disconnect fire, and whether a replug ~5s later mounts (rpts resumes) or wedges.\n  (T3 if T1 passes): refine v3 with a deliberate post-reboot insertion window + retest the real swap flow.\nHeader-joystick (PIZERO-50) remains the USB-free player-1 path in parallel, but USB fluidity is NOT abandoned.] [2026-07-22 T1 RESULT (clean isolation test) -> reboot-recovery CONFIRMED DEAD; VBUS is the crux. Flashed pizero_wdtest, user COLD-booted with keyboard (keys work, so device fine + attached). Captured 3 consecutive watchdog WARM-reboots (freeze #3/#4/#5) with the keyboard NEVER unplugged. EVERY post-reboot boot came up usb=0 rpts=0 conn=1 -- the attached keyboard did NOT re-enumerate after a warm/watchdog reboot, 3x in a row. This is a controlled test (no unplug/replug timing variables), so it SETTLES the earlier shaky finding: a warm reboot does NOT re-enumerate. Fix v3 (watchdog_reboot on flood) is therefore non-viable. (Reconciles with HW test #1's 'warm flash worked' only if the board had been cold-booted at some point that session; the controlled test overrides it.) KEY MECHANISTIC OBSERVATION from the capture: each post-boot [usb-evt] shows the line transiently reading SE0 (line=J/FS -> SE0 -> J/FS) during the port-reset window EVEN WITH THE KEYBOARD ATTACHED -- proving the stack's SE0/disconnect detection is NOT broken; it simply never sees SE0 on a physical unplug because unplug leaves D+/D- FLOATING (E9 leak -> reads phantom J), not low. ROOT TRUTH (now solid): only a real VBUS power-cycle enumerates this device; every host-side software path (re-init, reset, warm reboot) fails because the DEVICE is never power-cycled, and there is no software VBUS switch (schematic-confirmed). FORWARD PATH for fluid USB (needs a small HW mod, matches user's willingness to solder): add a GPIO-controlled load-switch/P-FET on the HOST-PORT VBUS (keeping D+/D- wired). Mechanism hypothesis: cutting VBUS while data stays connected leaves the unpowered device's 1.5k pull-up inactive, so the host's D+/D- pulldowns win -> the line reads a GENUINE SE0 -> pio-usb connection_check fires DISCONNECT -> tuh umounts cleanly; restoring VBUS -> device cold-starts, asserts pull-up -> line J -> CONNECT -> fresh enumeration -> mount, WITH EMULATOR STATE PRESERVED (no reboot). Because VBUS control yields honest line states, a pulse-until-mounted retry loop is safe (no phantom wedge). Firmware: on flood-detect, pulse VBUS off ~200ms then on; retry until a device mounts or timeout. RISKS/UNKNOWNS to validate: (a) does the host port actually have 15k D+/D- pulldowns so VBUS-cut reads SE0 despite E9 (check schematic detail / measure)? (b) inrush on VBUS restore; (c) which spare GPIO + switch part. ALTERNATIVE zero-solder probe of the same idea: a powered hub with per-port power switching (PPPS) could cut a downstream port's VBUS in software -- but needs CFG_TUH_HUB (PIZERO-54) + hub PPPS support. CODE: fix v3 still in tree (flag-gated); to be reworked toward the VBUS-pulse design or reverted once HW path chosen. Board re-flashed to default pizero_stream_60 after the test.] [2026-08-16 HW TEST of fix v3 (pizero_hotplug) -> reconfirms reboot-recovery is dead; adds one NEW source-confirmed bug. Board cold-booted OK (usb=1, spacewarp running, 60fps). User did one unplug/replug. THREE results, all solid:\\n  (1) NEW BUG -- the scratch[4] sentinel CANNOT work: scratch[4] is RESERVED by the pico-SDK. watchdog_reboot(pc=0,...) sets scratch[4]=0 in its else branch (hardware_watchdog/watchdog.c:108), wiping USB_REPLUG_MAGIC written immediately before it; watchdog_enable() also claims it (WATCHDOG_NON_REBOOT_MAGIC, watchdog.c:84). So every deliberate replug-reboot logged as '*** FREEZE RECOVERED ***' and INFLATED the PIZERO-33 freeze tally (reached 4 in one session). FIX if any reboot path is ever kept: move the sentinel to scratch[2] (unused; 0=WD_MAGIC, 1=phase, 3=freeze count). Source-confirmed, not an observation.\\n  (2) DETECTOR FALSE-POSITIVES on an idle ATTACHED device. Flood tripped at T+21s after a CLEAN mount with the keyboard plugged in and untouched, payload [00 00 00 00 00 00 00 00]. The device is a 3-interface composite (idx0 kbd proto=1 desc64, idx1 desc34, idx2 desc182) and one interface streams identical all-zero reports while idle -- so the ticket's premise 'a real boot keyboard reports only on key transitions, so it never trips' is FALSE for this keyboard. Any future use of flood-detection must restrict it to the boot-keyboard interface (proto=1) and/or require a rate test, not just byte-identity.\\n  (3) REBOOT-RECOVERY DEAD -- reconfirmed independently of T1. After the flood reboot the still-attached keyboard NEVER re-enumerated: usb=0 rpts=0 continuously for the remaining 200s of a 300s capture (emulator itself stayed healthy at fps=60 throughout). Matches the T1 finding; no VBUS cycle, no enumeration.\\nNET: detection is real but not yet trustworthy (2); the reboot recovery it feeds is a dead end (3); (1) is a latent bug in any reboot-based variant. VBUS-switch HW mod remains the forward path from T1. Board re-flashed to default pizero_stream_60 (usb=1, 60fps, verified). Working tree still carries fix v3 + the unused v2 shim, flag-gated, uncommitted.]\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"Implement USB hot-replug recovery: phantom-flood disconnect detection + PIO-USB re-enumeration\"]\n\n[2026-09-28 note from PIZERO-54] Through a USB hub, a keyboard plugged in while the board was running DID mount: the hub's interrupt endpoint reports the port change and TinyUSB enumerates it, so the root-port detection problem does not apply behind a hub. Replug through a hub not yet tried; if it works, 'use a hub' is a practical answer to this issue.", "type": "feature", "status": "in-progress", "priority": "high", "created": "2026-06-29", "updated": "2026-09-28", "tags": ["input", "usb", "hotplug", "bug", "pio-usb"], "theme": "input"}, {"id": "PIZERO-52", "summary": "Explain why a title fails, rather than listing whether it works", "description": "The default env pizero_stream_60 is now stable across multiple third-party games on hardware (user-confirmed 2026-07-19), but nothing records WHICH titles were tested or how well each runs. Create docs/compatibility.md: a table of title -> media type (cassette/disk/cartridge/ROM) -> status (works / minor glitches / broken) -> notes (graphics/audio/input/timing quirks, SAM high-speed use, load method). Seed it with the games already exercised. Keep it a living doc updated as titles are tried; cross-link from README and docs/ROADMAP.md. Also capture the open input gap: most games assume a joystick, which the port does not yet provide (see PIZERO-13/50 USB + header-joystick routes) -- note per-title whether it is keyboard-playable so the compat list doubles as a driver for input priorities. See-also: docs/pipeline.md, docs/cpu-speed.md.\n\n[2026-09-17 Summary rewritten in the PIZERO-107 triage, move 4, to say what this delivers rather than how. Previous summary: \"Track third-party software compatibility (docs/compatibility.md)\"]\n\n[2026-09-17 RESHAPED: compatibility is explicitly lower priority than reliability, so this stops being a matrix to fill in. Each title that fails gets a diagnosed cause instead: timer behaviour, GIME feature, undocumented opcode, disk write, timing assumption. A list of ticks tells us nothing we can act on; a cause is a bug report.]", "type": "task", "status": "open", "priority": "medium", "created": "2026-07-19", "updated": "2026-09-17", "tags": ["docs", "compatibility", "testing", "games"], "theme": "trust"}, {"id": "PIZERO-53", "summary": "Firmware config/launcher overlay UI (\"BIOS\" menu over HDMI, function-key toggle)", "description": "No way to choose what to load without a rebuild/flash; media is fixed at build time (AUTORUN). Add a firmware-drawn overlay menu -- NOT emulated 6809 code -- that the port renders directly into the HDMI framebuffer, toggled by a function key (or a key held at boot). Scope: (1) input hook -- reserve a hotkey (e.g. F12 / Menu) in the HID path (src/main.cpp) that raises an overlay flag without reaching the guest; (2) render -- REUSE the real MC6847 alphanumeric renderer so the menu IS a native CoCo text screen (not a lookalike): render_alpha_frame() in coco_machine.cpp:924 already walks a 32x16 grid, pulls each glyph from the authentic font_6847t1[] char ROM into g_m.vdg_buffer, green-on-black, and flows through the existing coco_boot_blit_vdg_pizero() -> DVI path. Approach: REFACTOR render_alpha_frame(base) to accept a source pointer (const uint8_t *screen) instead of reading g_m.ram+base (~5-line change to the one chrow= line + expose it in the header) so the overlay owns a PRIVATE 512-byte screen-code buffer and never clobbers guest video RAM (the paused game's screen is preserved behind the menu). Alt (simpler, rejected): write into emulated text RAM 0x0400 and save/restore 512 bytes. SELECTION HIGHLIGHT is free: bit 6 of a screen code = inverse video (black-on-green, the iconic BASIC look) -- set it on the selected row's bytes, zero extra render code. Optional fancy border: bit 7 set -> SG4 2x2 semigraphics colour blocks. CONSTRAINTS (both authentic, lean in): uppercase-only 64-glyph set (ch&0x3F|0x40 -> @,A-Z,punct,0-9; no lowercase) needs a tiny ASCII->screen-code map; 32 cols x 16 rows grid (header + ~13-14 file entries + footer hint; long filenames truncate/scroll). Flow: fill menubuf (uppercase codes, bit6 on selected row) -> render_alpha_frame(menubuf) -> vdg_buffer -> existing pizero blit. COST is ~free: render ONCE per cursor change (not per frame) while emulation is paused, so the PIZERO-48 headroom concern does not apply -- a single alpha-frame render on each keypress. pause/freeze emulation while open; (3) SD browse -- list images on the microSD (SPI pins SCK30/MOSI31/MISO40/CS43, hw_config) filtered by type (cas/dsk/rom/cart); (4) actions -- load+mount selected image and (re)boot the machine; expose a few firmware-only settings the guest can't reach: SAM high-speed cap (see PIZERO-48), joystick source (USB gamepad vs header hat vs off, see PIZERO-50), audio env; (5) persist last selection/settings to SD or flash. Design the SD-listing + image-loader layer as a clean reusable module so a future in-emulator 'same-feel' CoCo-ROM launcher (v2, much larger lift) can reuse it. Gate the whole feature behind a build flag initially; validate it does not disturb 60Hz video / audio while open (emulation is paused, but the overlay composite runs on the same core-0 budget -- see PIZERO-48 headroom). Cross-link docs/ROADMAP.md. Depends on nothing hard; pairs naturally with SD work. [RE-SCOPED 2026-08-05: the disk-image SWITCHING half is now PIZERO-81 (F12 launcher, keyboard-driven, sub-sliced 81a-81d) and last-launched persistence is PIZERO-82. PIZERO-53 remains the SUPERSET -- the firmware-only settings menu (SAM-speed cap, joystick source, audio env) -- built on PIZERO-81's overlay renderer and state machine. ALSO: this ticket's planned 'small source-pointer refactor' of render_alpha_frame is UNNECESSARY -- coco_boot_blit_vdg_pizero_src(const uint8_t*, uint16_t*) already exists at coco_boot.h:76, and PIZERO-81b's card renderer draws font_6847t1 glyphs directly rather than reusing render_alpha_frame at all. Settings persistence still needs PIZERO-67.]", "type": "feature", "status": "open", "priority": "medium", "created": "2026-07-19", "updated": "2026-08-05", "tags": ["ui", "launcher", "config", "sd", "usability"], "theme": "experience"}, {"id": "PIZERO-54", "summary": "USB hub support: simultaneous keyboard + gamepad via external hub (CFG_TUH_HUB)", "description": "Board has no internal USB hub and one root port (PIO-USB D+=28/D-=29). To use more than one USB device at once (e.g. keyboard AND a USB gamepad, or keyboard+keypad per PIZERO-49) an EXTERNAL hub is required. Enable TinyUSB hub support: -DCFG_TUH_HUB=1 and raise device/interface counts (keep CFG_TUH_HID>=4); ensure g_usb_devices tracking + the mount/unmount and report-received paths handle multiple daddr/idx pairs (they are already keyed per (daddr,idx)). RISK: PIO-USB is CPU-heavy and shares the fabric with libdvi; core-0 has only ~31% slack at 1x (PIZERO-48), and more endpoints = more polling cost. Must validate under load that video stays 60fps and audio does not underrun, and that it composes with hot-replug recovery (PIZERO-51 stop/restart must re-enumerate through the hub). Gate behind the existing USB build flags. NOTE: for player-1 joystick the header-hat route (PIZERO-50) sidesteps USB entirely and is preferred -- this hub work is mainly for keyboard+keypad and for USB gamepads (PIZERO-13). Verify on hw: hub enumerates, keyboard + a second device both report; 60fps held; unplug/replug through hub recovers.\n\n[2026-09-28 FIRST HARDWARE ATTEMPT, user's multi-port USB-C hub, pad and Keychron K2 behind it.] Nothing enumerated, even with only the pad on the hub. New diagnostic env pizero_usbdebug (TinyUSB host log on the serial console; docs/BUILD.md) showed why, in two layers:\n(1) FIXED: the USB-C hub is TWO hub chips chained: a Terminus FE1.1s (1A40:0101) with a Genesys Logic hub (05E3:0610) on its port 3. The build allowed one hub, so the second was refused ('All addresses are occupied, try to increase CFG_TUH_HUB'). The Adafruit TinyUSB RP2040 config (tusb_config_rp2040.h) hard-codes CFG_TUH_HUB 1, CFG_TUH_DEVICE_MAX and CFG_TUH_HID with no #ifndef, so -D flags could not change them; our -DCFG_TUH_HID=4 had in fact always been overridden to 12. New scripts/patch_tinyusb.py (a pre: extra_script in [pizero_base]) guards those three defines in the downloaded library, idempotently; platformio.ini now sets CFG_TUH_HUB=2 and CFG_TUH_HID=8. RAM +140 bytes. Both hubs now mount (addresses 8 and 9).\n(2) OPEN: the pad (a full-speed USB 1.1 device behind the second hub) gets its address, then during the 2 ms post-SET_ADDRESS delay the FIRST hub reports a connection change on its port 4 (something built into the USB-C hub, likely a card reader), TinyUSB issues a hub GET_PORT_STATUS on the shared control pipe, and the pad's next request (Get Device Descriptor) fails 'enum_delay_async 1627: ASSERT FAILED' in host/usbh.c. The enumeration is abandoned and never retried, so the pad never mounts. A TinyUSB race between hub status handling and an in-progress enumeration; present in Adafruit TinyUSB 3.7.7, the latest release. Options: a simpler hub with no built-in devices (quick test), a retry in TinyUSB via the patch script, or upstream TinyUSB master if it has fixed it.\n\n[2026-09-28 CONFIRMED ON HARDWARE (user): keyboard and gamepad at once through a simple 4-port hub.] Hub: Realtek 0BDA:5401. Pad (GameSir 3537:1094) and a Keychron (3434:0430) both mounted and worked together; 60 fps for all 150 s logged, audio clean (under=0, skips=0). The keyboard was plugged into the hub while the board ran and still mounted: the hub reports the new device, which the bare root port cannot (PIZERO-51), so a hub may be the practical hot-plug path; replug not yet tried, noted on PIZERO-51. A Keychron K2 on the same hub was never seen by the hub at all (no port connection change); a K3 on the same hub worked. Suspected power: the K2 charges its battery over the cable and the hub is bus-powered from the board. Not investigated further. Closed at ~80%; the multi-chip USB-C hub failure (TinyUSB enumeration race) is filed as PIZERO-159.", "type": "feature", "status": "done", "priority": "medium", "created": "2026-07-19", "updated": "2026-09-28", "tags": ["usb", "hub", "input", "pio-usb", "multi-device"], "theme": "input"}, {"id": "PIZERO-55", "summary": "GIME-style programmable palette for classic 6847 modes + BIOS editor + per-title .pal profiles", "description": "Non-traditional extension: give the classic MC6847 modes a CoCo3/GIME-style PROGRAMMABLE palette (real CoCo1/2 VDG colors were fixed -- this is impossible on original hw). The architecture is already 90% there: every renderer (render_alpha_frame/render_rg6_frame/render_graphics_frame in coco_machine.cpp) emits a 4-bit SEMANTIC palette index (PAL_GREEN..PAL_BRIGHT_ORANGE) into vdg_buffer, and the pizero blit does exactly one index->RGB lookup per pixel via g_vdg_rgb565_native[16] (coco_boot.cpp:488). That 16-entry LUT between VDG-index and output RGB IS the GIME palette-register architecture; it is just const today. PART 1 -- WRITABLE LUT + API: drop const on g_vdg_rgb565_native (already RAM-resident), add coco_set_palette_entry(idx,rgb) / get; keep a separate const MASTER copy for factory reset. Blit reads the LUT every frame so edits PREVIEW LIVE with zero repaint plumbing. No locking: LUT written by BIOS, read in blit; a torn read of one 16-bit entry mid-frame is cosmetically invisible for one frame. Only g_vdg_rgb565_native matters on this board (the byte-swapped g_vdg_rgb565 twin is dead AMOLED-path code). Current 12 named entries: 0 GREEN,1 YELLOW,2 BLUE(also RG6 artifact blue),3 RED,4 WHITE,5 CYAN,6 MAGENTA,7 ORANGE(also RG6 artifact orange),8 BLACK,9 DARK_GREEN,10 DARK_ORANGE,11 BRIGHT_ORANGE; 12-15 unused. NOTE indices are SEMANTIC so editing entry 0 recolors VDG green EVERYWHERE it appears (text ink, CG green, semigraphics, border) -- natural GIME behavior, intended; per-mode-independent palettes would need separate index spaces per mode = OUT OF SCOPE. Bonus: entries 2/7 double as RG6 NTSC-artifact colors so the same editor tunes the artifact red/blue tint (ties to PIZERO-43 phase work). PART 2 -- BIOS EDITOR (depends on PIZERO-53 overlay): pick an entry, adjust color, live-preview on whatever is on screen. Color depth: DEFAULT to CoCo3-authentic RGB222 (6-bit, 64-color GIME gamut) picker with an 'advanced/full-RGB565' toggle for 65k-color freedom. Render swatches as VDG semigraphics cells, inverse-video the selected one (reuse render_alpha_frame machinery from PIZERO-53). Actions: edit / reset-to-factory (copy master back) / save. PART 3 -- PER-TITLE .pal PROFILES: bind a saved 16-entry palette to a specific DSK/BIN/CAS/ROM so each game remembers its colors. Storage = SIDECAR file next to the image (SPACEWAR.DSK -> SPACEWAR.PAL), ~34 bytes: magic + version + 1-byte depth-mode flag + 16 entries stored as RGB222 (6-bit, output-depth-independent, survives future packing changes). Chose sidecar over a central manifest: matches the launcher's by-filename model, travels with the image on copy, no central corruption/dangling-entry risk. LOAD flow (hooks PIZERO-53 action step 4 load+mount): resolve palette in FALLBACK ORDER per-title <name>.pal -> user-global custom palette -> factory default; so untuned games look normal and tuned ones always come up right. SAVE flow: 'Save for this title' writes the sidecar keyed to the CURRENTLY-LOADED image path (launcher already tracks it for mount). EDGE CASES: built-in AUTORUN media has no path -> falls back to user-global (or reserve AUTORUN.PAL); image loaded outside the launcher -> no path -> global only. Persist the user-global custom palette too (PIZERO-53 persistence). PART 4 -- GUEST-SIDE GIME PALETTE (subsumes PIZERO-26, closed as superseded): beyond the BIOS editor, optionally let a RUNNING PROGRAM recolor live by intercepting guest writes to the real GIME palette addresses $FFB0-$FFBF on the CoCo bus (6-bit R-G-B, 2 bits/channel = 16 colors from 64) and routing them into the same writable LUT. This mirrors real CoCo3 VDG-compatible behavior -- a $FFB0+ recolor POKE program behaves the same here as on real hardware -- and stays fully TRANSPARENT: default LUT = stock CoCo colors, so unmodified games look normal until they poke the registers. Mirror the GIME addresses so CoCo-3-aware code just works; also optionally expose an extended RGB565 palette at our own addresses for beyond-hw color. WRINKLE (from PIZERO-26): PIZERO-15 precomputes glyph->packed-word LUTs with colors baked in (e.g. g_alpha_lut), so a palette write must REBUILD those small LUTs -- cheap, since palette writes are rare (once per screen, not per frame). TODO before coding Part 4: verify the exact GIME VDG-compatible default slot->color mapping against GIME docs rather than guessing. BOUNDARY: VDG+palette only, NOT full GIME/CoCo3 (no hi-res GIME bitmap modes, extra RAM/MMU, hw scroll, or GIME interrupts -- those remain PIZERO-16). Product context: docs/product-plan.md ('open platform you can extend' story). Gate behind a build flag. Depends on PIZERO-53 (overlay + SD + persistence); cross-link docs/ROADMAP.md. Verify on hw: edit green live in a running game; save; reboot/reload -> colors restored; a second game keeps its own; reset-to-factory works.\n\n[2026-08-17 TWO SOURCE-CONFIRMED CONSTRAINTS ON THIS TICKET (verified against ~/github/xroar and lib/libdvi, not from memory).\n\n(1) DESKTOP-XROAR CROSS-TEST COMPATIBILITY -- $FFB0-$FFBF CONFLICTS WITH NOTHING, AND `xroar -m coco3` IS AN EQUIVALENT TEST TARGET.\nOn CoCo 1/2 -- and on this port today -- $FFB0-$FFBF is unmapped and writes are silently ignored (coco_machine.cpp:450, 'ROM and other I/O writes ignored'), so no existing software or test setup breaks. Better than merely harmless: the GIME applies its palette in VDG-COMPATIBLE mode as well as its own modes. tcc1014.c:1400-1421 sits inside `if (gime->COCO)` and indexes palette_reg[]. The CG (2bpp) path there reads\n    c0 = c1 = gime->palette_reg[cg_colours + ((gdata >> 6) & 3)];    (tcc1014.c:1408)\nwhich is the SAME arithmetic as our render_graphics_frame\n    uint8_t c = cg_base + ((b >> 6) & 3);                            (coco_machine.cpp:1041)\nwith cg_colours = !CSS ? TCC1014_GREEN : TCC1014_WHITE (= 0 or 4, tcc1014.c:1317) matching our cg_base = css ? PAL_WHITE : PAL_GREEN. The two implementations converged independently, so a palette-poking test program can be developed on desktop xroar -m coco3 and run unchanged here.\n  * INDEX MAP -- entries 0-7 MATCH EXACTLY: GREEN, YELLOW, BLUE, RED, WHITE, CYAN, MAGENTA, ORANGE (tcc1014.h:35-36 vs our PAL_* defines at coco_machine.cpp:882). Entries 8-15 DIVERGE: GIME uses 8-11 for the RG colour-set fg/bg pairs (RGCSS0_0, RGCSS0_1, RGCSS1_0, RGCSS1_1) and 12-15 for the alpha/semigraphics pairs (DARK_GREEN, BRIGHT_GREEN, DARK_ORANGE, BRIGHT_ORANGE); we use 8=BLACK, 9=DARK_GREEN and leave 10-15 at 0x0000. So $FFB0-$FFB7 pokes behave identically on both, $FFB8-$FFBF do not. ADOPTING GIME'S 8-15 ASSIGNMENT COSTS NOTHING TODAY because those slots are currently unused -- do it if cross-testing matters at all.\n  * REGISTER FORMAT -- GIME palette registers are 6-BIT: palette_reg[A & 15] = *CPUD & 0x3f (tcc1014.c:792), i.e. RGB222, 64 colours. They are also READABLE, returning the stored 6 bits with the upper 2 from open bus (tcc1014.c:795). Many sources assume write-only; xroar implements them readable, so match that.\n  * TRAP -- if the 'advanced full-RGB' path is implemented by WIDENING $FFB0-$FFBF to accept 16-bit values, desktop xroar stops being an equivalent test target. Keep $FFB0-$FFBF strictly 6-bit GIME-compatible and put any wider format at DIFFERENT addresses or behind an explicit mode bit.\n\n(2) THE OUTPUT PRECISION CEILING IS RGB565, AND IT IS NOT SYMMETRIC ACROSS CHANNELS.\nFull chain: 4-bit palette index (vdg_buffer, coco_machine.cpp:92) -> RGB565 via g_vdg_rgb565_native[16] (coco_boot.cpp:488) -> framebuffer -> dvi_static_framebuf_main_16bpp on core 1 (main.cpp:204) -> per-channel bit extract (configure_interp_for_addrgen, tmds_encode.cpp) -> 6-bit TMDS LUT -> 10-bit TMDS symbols -> wire. BOTH libdvi tables are 6 BITS PER CHANNEL: tmds_table.h's own header says it 'converts a 6 bit data input into a pair of TMDS data symbols with data content almost equal (1 LSB off) to input value left shifted by two', and tmds_table_fullres.h indexes on 'the sign bit of current running disparity, with 6 bits of colour channel data'. So the wire is nominally 8-bit/channel per the DVI standard, but only 64 levels per channel ever reach it. Against RGB565 (R5 G6 B5): GREEN is an exact 6/6 match; RED and BLUE are limited by the FRAMEBUFFER at 5 bits and each give up one bit the encoder could have carried.\n  * CONSEQUENCE FOR GIME COMPATIBILITY: none. RGB222's 64 colours expand into RGB565 by bit-replication with enormous room to spare.\n  * CONSEQUENCE FOR THE 'FULL RGB' AMBITION: it means 5/6/5, NOT 8/8/8. Do not promise 24-bit colour in the BIOS editor UI or in docs/. RGB666 would exactly match the encoder with no waste on any channel, but it is not a 16-bit pixel format, so it would cost a larger framebuffer and a different libdvi encode path -- out of scope unless the framebuffer format decision is deliberately re-opened.]\n\n[2026-09-17 PRIORITISED by the user (medium -> high) as one of the two affordable CoCo 3 features, alongside the timer PIZERO-62. Split the work by what it depends on: PART 1, the writable LUT and its register interface, needs nothing new and should land first; the BIOS editor and per-title .pal profiles need the overlay (PIZERO-81/53) and follow it. Keep PIZERO-85 as the register-file shape so the two agree rather than inventing two palettes.]\n\n[2026-09-17 REGISTER FILE BUILT ONCE, shared, as both tickets asked. It lives in lib/coco_machine/src/coco_palette.h (header-only, machine-free, host-testable) with the storage owned by coco_machine, which is what sees the bus writes; src/coco_boot.cpp's blit now reads it through coco_machine_palette(), hoisting the pointer once per frame instead of reloading a global per pixel.\nFORMAT TAKEN FROM XROAR, NOT FROM MEMORY, because desktop `xroar -m coco3` is the cross-test target: the GIME byte is six bits interleaved bit5 R1, bit4 G1, bit3 B1, bit2 R0, bit1 G0, bit0 B0 (~/github/xroar src/coco3.c:611-613), and the four intensity levels are NON-LINEAR, 0.000/0.460/0.736/0.920 (coco3.c:69). A linear 0/85/170/255 ramp would look plausible and be wrong in every mid-tone; a test pins this.\nTRANSPARENCY: the table powers on holding the stock VDG colours and reports whether a guest has touched it, so an unmodified game looks exactly as before. Guest writes to $FFB0-$FFBF land behind -DGIME_PALETTE (env pizero_gime, alongside the timer); reads return the register with the top two bits undriven, as the GIME does.\nTHE PIZERO-26 WRINKLE DOES NOT APPLY HERE: our render LUTs (alpha, SG4, RG6) store palette INDICES, not colours, so a palette write needs no LUT rebuild. Worth recording because the ticket warned about it.\nCOST: the default build grew 56 bytes (the table moved from .rodata to .data, plus the factory copy); the GIME build adds 548 over the default. Per-pixel cost is unchanged, and the blit may be marginally cheaper for hoisting the pointer, though that cannot be measured until the soak ends.\nTESTED: 14 host tests, 58 in the suite. They cover the bit layout per channel, the non-linear ramp, all 64 GIME colours staying distinct through the RGB565 squeeze, per-entry isolation, six-bit masking, read-back, reset-to-factory, direct RGB565 access for the future editor, and that the decode claims no CoCo 2 address and does not overlap the PIZERO-62 timer block.\nNOT DONE, and deliberately so: parts 2 and 3 of PIZERO-55, the BIOS editor and per-title .pal sidecars, both of which need the overlay. Hardware validation waits for the soak to finish.]\n\n[2026-09-18 PART 1 IS CONFIRMED ON HARDWARE: a guest POKEing $FFB0-$FFBF recolours the machine live (see PIZERO-85, now closed). What remains here is purely the UI half: the BIOS editor and per-title .pal profiles, both waiting on the overlay. The register file they will drive is done and proven.]\n\n[2026-09-18 NOW IN THE DEFAULT BUILD, and the separate pizero_gime env is gone. Keeping a second build was the wrong call: it meant a board could silently lose the feature on an ordinary reflash, which is exactly what happened today mid-test. The justification for gating was that these were unproven on hardware; the palette is now proven, both blocks are unused on a CoCo 2, the decode claims no CoCo 2 address (asserted by host tests), and both are transparent until a guest writes to them: the palette holds the stock VDG colours, the timer stays stopped. Frame budget measured identical at 76.2%, RAM +484 bytes.]\n\n[2026-09-27 The user-global default palette layer and the .pal text format are being defined in PIZERO-145 ('palette = NAME' in /coco/settings.txt, /coco/pal/NAME.pal as 'N = #RRGGBB' lines). Per-title .pal files here should r
